# SPDX-License-Identifier: Apache-2.0
#
# Go gRPC clients for the vendored Agent Substrate APIs (third_party/substrate; epic 1082, ADR 0119):
# the control API `substrate.ateapi.v1.Control` and the in-guest `ateenv.v1alpha` ProcessService and
# FileSystemService. Kept apart from buf.gen.yaml for the reason buf.gen.openshell.yaml is: Koinon's
# protos stay the only buf workspace module, and no TypeScript or connect code is generated. The
# upstream go_package options point into Substrate's own module (go.ate.dev/substrate), which Koinon
# does not import (it would pull Substrate's whole dependency tree), so the M options replace them.
version: v2
clean: true
inputs:
  - directory: third_party/substrate/proto
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen/substrate
    opt: &opts
      - module=github.com/stateracloud/koinon/internal/gen/substrate
      - Mateapi.proto=github.com/stateracloud/koinon/internal/gen/substrate/ateapi/v1;ateapiv1
      - Mguest.proto=github.com/stateracloud/koinon/internal/gen/substrate/ateenv/v1alpha;ateenvv1alpha
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: internal/gen/substrate
    opt: *opts
