# Rendered by Koinon (internal/gateway/standalone). Do not edit: changes are overwritten.
# Keys appear only as hashes; key material lives in Kubernetes Secrets.
config:
  adminAddr: localhost:15000
  statsAddr: '[::]:15020'
  readinessAddr: '[::]:15021'
  database:
    url: sqlite:///data/agentgateway.db?mode=rwc
  logging:
    format: json
  modelCatalog:
    - inline:
        providers:
          openrouter:
            models:
              deepseek/deepseek-v4.1-flash:
                rates:
                  input: "0.30"
                  output: "1.20"
                  cacheRead: "0.006"
frontendPolicies:
  accessLog:
    add:
      koinon.agent: default(apiKey.agent, "")
      koinon.config: '"833d85f77b2b594c"'
      koinon.key: default(apiKey.name, "")
      koinon.request: uuid()
    otlp:
      host: koinon-api.koinon.svc:4318
      protocol: http
gateways:
  default:
    port: 4000
llm:
  policies:
    apiKey:
      mode: strict
      location:
        header:
          name: authorization
          prefix: 'Bearer '
      keys:
        - keyHash: sha256:d7ef9a39720870db13b85251d2f81938233b8417e9ef596c773638c5d38fd60c
          metadata:
            name: k-aaaaaaaaaaaa
            agent: acme/repo-helper
          budgets:
            - name: koinon-agent-limit-1792627200-750000000
              limit:
                unit: USD
                amount: 4.25
              window:
                rolling: 24h
              onBudgetExceeded: Block
        - keyHash: sha256:afba2a391fafa9cdf6ca56f8efe1d251dcc3829546026c10f2694c0b2c759a32
          metadata:
            name: k-bbbbbbbbbbbb
            agent: acme/triage
          budgets:
            - name: koinon-agent-limit
              limit:
                unit: Tokens
                amount: 200000
              window:
                rolling: 30d
              onBudgetExceeded: Block
        - keyHash: sha256:be6a2a297de483eec06bbffd0f7500217d15cd39b9569c74d5be5383dde44aa1
          metadata:
            name: koinon-reload-probe
            agent: ""
          budgets:
            - name: koinon-reload-probe
              limit:
                unit: Tokens
                amount: 0
              window:
                rolling: 24h
              onBudgetExceeded: Block
    authorization:
      rules:
        - apiKey.name != "koinon-reload-probe"
  models:
    - name: deepseek/deepseek-v4.1-flash
      provider:
        custom:
          providerOverride: openrouter
          formats:
            - type: completions
      params:
        baseUrl: https://openrouter.ai/api/v1
        apiKey:
          file: /secrets/upstream/api_key
      overrides:
        provider:
          allow_fallbacks: false
          data_collection: deny
          only:
            - fireworks
            - deepinfra
          zdr: true
mcp:
  policies:
    apiKey:
      mode: strict
      location:
        header:
          name: authorization
          prefix: 'Bearer '
      keys:
        - keyHash: sha256:d7ef9a39720870db13b85251d2f81938233b8417e9ef596c773638c5d38fd60c
          metadata:
            name: k-aaaaaaaaaaaa
            agent: acme/repo-helper
        - keyHash: sha256:afba2a391fafa9cdf6ca56f8efe1d251dcc3829546026c10f2694c0b2c759a32
          metadata:
            name: k-bbbbbbbbbbbb
            agent: acme/triage
    mcpAuthorization:
      rules:
        - apiKey.agent == "acme/repo-helper" && ((mcp.tool.target == "github" && mcp.tool.name in ["create_pull_request", "get_approval_status"]) || (mcp.tool.target == "docs" && mcp.tool.name in ["search"]))
    transformations:
      request:
        set:
          x-koinon-agent: apiKey.agent
  targets:
    - name: github
      mcp:
        host: http://koinon-github-tools.koinon.svc:8080/mcp
    - name: docs
      mcp:
        host: http://docs.koinon.svc:8080/mcp
