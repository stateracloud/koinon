# Rendered by Koinon (internal/gateway/standalone). Do not edit: changes are overwritten.
# Keys appear only as hashes; key material lives in Kubernetes Secrets.
config:
  adminAddr: localhost:15000
  statsAddr: '[::]:15020'
  readinessAddr: '[::]:15021'
  database:
    url: sqlite:///data/agentgateway.db?mode=rwc
  logging:
    format: json
  modelCatalog:
    - inline:
        providers:
          acme.openrouter:
            models:
              deepseek/deepseek-v4.1-flash:
                rates:
                  input: "0.30"
                  output: "1.20"
                  cacheRead: "0.006"
              open/model:
                rates:
                  input: "1"
                  output: "2"
          globex.ollama:
            models:
              deepseek/deepseek-v4.1-flash:
                rates:
                  input: "0"
                  output: "0"
frontendPolicies:
  accessLog:
    add:
      koinon.agent: default(apiKey.agent, "")
      koinon.cache_read: llm.cachedInputTokens
      koinon.cache_write: llm.cacheCreationInputTokens
      koinon.config: '"dc0535e74f5a525c"'
      koinon.error: proxy.error.reason
      koinon.format: 'request.path == "/v1/messages" ? "anthropic" : request.path == "/v1/chat/completions" ? "openai" : ""'
      koinon.in: llm.inputTokens
      koinon.key: default(apiKey.name, "")
      koinon.max_tokens: llm.params.max_tokens
      koinon.out: llm.outputTokens
      koinon.reasoning: llm.reasoningTokens
      koinon.req_bytes: int(request.headers["content-length"])
      koinon.request: uuid()
      koinon.response_id: coalesce(response.headers["x-generation-id"])
      koinon.status: response.code
      koinon.stream: llm.streaming
      koinon.upstream: default(proxy.upstreamDuration, "") != ""
    otlp:
      host: koinon-api.koinon.svc:4318
      protocol: http
gateways:
  default:
    port: 4000
llm:
  policies:
    apiKey:
      mode: strict
      location:
        header:
          name: authorization
          prefix: 'Bearer '
      keys:
        - keyHash: sha256:d7ef9a39720870db13b85251d2f81938233b8417e9ef596c773638c5d38fd60c
          metadata:
            name: k-aaaaaaaaaaaa
            agent: acme/repo-helper
            org: acme
          allowedModels:
            - deepseek/deepseek-v4.1-flash
            - open/model
          budgets:
            - name: koinon-agent-limit-1792627200-750000000
              limit:
                unit: USD
                amount: 4.25
              onBudgetExceeded: Block
        - keyHash: sha256:afba2a391fafa9cdf6ca56f8efe1d251dcc3829546026c10f2694c0b2c759a32
          metadata:
            name: k-bbbbbbbbbbbb
            agent: acme/triage
            org: acme
          allowedModels:
            - deepseek/deepseek-v4.1-flash
            - open/model
          budgets:
            - name: koinon-agent-limit
              limit:
                unit: USD
                amount: 200.0
              window:
                rolling: 30d
              onBudgetExceeded: Block
        - keyHash: sha256:b0b03f2ad19f1dc9e87777f6432dd6ca96548f078a07c9bc473a278c2e1b85c6
          metadata:
            name: k-gggggggggggg
            agent: globex/analyst
            org: globex
          allowedModels:
            - deepseek/deepseek-v4.1-flash
        - keyHash: sha256:d80c414bb9c4b91a6ccb66e7dcc8a69756d734ba7e0580dccb25b9d402ae1f87
          metadata:
            name: koinon-reload-probe
            agent: ""
          budgets:
            - name: koinon-reload-probe
              limit:
                unit: Tokens
                amount: 0
              window:
                rolling: 24h
              onBudgetExceeded: Block
    authorization:
      rules:
        - apiKey.name != "koinon-reload-probe" && !url.decode(request.pathAndQuery).contains("kgw_") && !toJson(request.headers.filterKeys(k, k != "authorization")).contains("kgw_") && !has(llmRequest.mcp_servers)
    transformations:
      request:
        replace: request.headers.filterKeys(k, k in ["accept", "content-length", "content-type", "user-agent"])
        set:
          x-koinon-org: default(apiKey.org, "")
  models:
    - id: acme/deepseek/deepseek-v4.1-flash
      name: deepseek/deepseek-v4.1-flash
      matches:
        - headers:
            - name: x-koinon-org
              value:
                exact: acme
      provider:
        custom:
          providerOverride: acme.openrouter
          formats:
            - type: completions
      params:
        baseUrl: https://openrouter.ai/api/v1
        apiKey:
          file: /secrets/upstream/api_key
      overrides:
        provider:
          data_collection: deny
          zdr: true
      transformation:
        stream_options: 'has(llmRequest.stream) && llmRequest.stream == true ? {"include_usage": true} : null'
    - id: acme/open/model
      name: open/model
      matches:
        - headers:
            - name: x-koinon-org
              value:
                exact: acme
      provider:
        custom:
          providerOverride: acme.openrouter
          formats:
            - type: completions
      params:
        baseUrl: https://openrouter.ai/api/v1
        apiKey:
          file: /secrets/upstream/api_key
      transformation:
        stream_options: 'has(llmRequest.stream) && llmRequest.stream == true ? {"include_usage": true} : null'
    - id: globex/deepseek/deepseek-v4.1-flash
      name: deepseek/deepseek-v4.1-flash
      matches:
        - headers:
            - name: x-koinon-org
              value:
                exact: globex
      provider:
        custom:
          providerOverride: globex.ollama
          formats:
            - type: completions
      params:
        baseUrl: http://ollama.globex.internal:11434/v1
      transformation:
        stream_options: 'has(llmRequest.stream) && llmRequest.stream == true ? {"include_usage": true} : null'
mcp:
  failureMode: failOpen
  prefixMode: always
  policies:
    apiKey:
      mode: strict
      location:
        header:
          name: authorization
          prefix: 'Bearer '
      keys:
        - keyHash: sha256:d7ef9a39720870db13b85251d2f81938233b8417e9ef596c773638c5d38fd60c
          metadata:
            name: k-aaaaaaaaaaaa
            agent: acme/repo-helper
            org: acme
        - keyHash: sha256:afba2a391fafa9cdf6ca56f8efe1d251dcc3829546026c10f2694c0b2c759a32
          metadata:
            name: k-bbbbbbbbbbbb
            agent: acme/triage
            org: acme
        - keyHash: sha256:b0b03f2ad19f1dc9e87777f6432dd6ca96548f078a07c9bc473a278c2e1b85c6
          metadata:
            name: k-gggggggggggg
            agent: globex/analyst
            org: globex
    authorization:
      rules:
        - '!toJson(request.headers.filterKeys(k, k != "authorization")).contains("kgw_")'
    mcpAuthorization:
      rules:
        - apiKey.agent == "acme/repo-helper" && ((mcp.tool.target == "github" && mcp.tool.name in ["create_pull_request", "get_approval_status"]) || (mcp.tool.target == "docs" && mcp.tool.name in ["search"]))
        - mcp.prompt.name == "koinon-ready"
    transformations:
      request:
        replace: request.headers.filterKeys(k, k in ["accept", "content-length", "content-type", "last-event-id", "mcp-protocol-version", "mcp-session-id", "user-agent"])
        set:
          x-koinon-agent: apiKey.agent
  targets:
    - name: docs
      mcp:
        host: http://docs.koinon.svc:8080/mcp
    - name: github
      mcp:
        host: http://koinon-github-tools.koinon.svc:8080/mcp
