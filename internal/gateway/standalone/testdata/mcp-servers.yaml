# Rendered by Koinon (internal/gateway/standalone). Do not edit: changes are overwritten.
# Keys appear only as hashes; key material lives in Kubernetes Secrets.
config:
  adminAddr: localhost:15000
  statsAddr: '[::]:15020'
  readinessAddr: '[::]:15021'
  logging:
    format: json
frontendPolicies:
  accessLog:
    add:
      koinon.agent: default(apiKey.agent, "")
      koinon.cache_read: llm.cachedInputTokens
      koinon.cache_write: llm.cacheCreationInputTokens
      koinon.config: '"8206257c20f67fd8"'
      koinon.error: proxy.error.reason
      koinon.error_body: 'response.code >= 400 ? coalesce(json(response.bodyPrefix).error.with(e, toJson({"error": {"type": coalesce(e.type + "", ""), "code": coalesce(e.code, ""), "message": (e.message + "").with(m, size(m) > 400 ? m.substring(0, 400) : m), "metadata": {"reasons": coalesce(e.metadata.reasons, []), "provider_name": coalesce(e.metadata.provider_name + "", "")}}})), toJson({"error": {"message": (json(response.bodyPrefix).error + "").with(m, size(m) > 400 ? m.substring(0, 400) : m)}}), toJson({"error": {"message": (json(response.bodyPrefix).message + "").with(m, size(m) > 400 ? m.substring(0, 400) : m)}}), json(response.bodyPrefix).with(j, "[error body of an unrecognised shape]"), string(response.bodyPrefix).with(b, b.trim().startsWith("{") || b.trim().startsWith("[") ? "[error body that is not complete JSON]" : (b).with(m, size(m) > 2048 ? m.substring(0, 2048) : m))).regexReplaceAll("(?i)bearer\\s+[A-Za-z0-9._~+/=-]{8,}", "[redacted]").regexReplaceAll("kgw[_][A-Za-z0-9_-]{8,}", "[redacted]").regexReplaceAll("\\b(?:sk|pk|rk|gsk|xai)-[A-Za-z0-9_-]{8,}", "[redacted]").regexReplaceAll("(?i)\"?(?:api[_-]?key|authorization|access[_-]?token|secret|password)\"?\\s*[:=]\\s*\"?[^\",\\s}]+\"?", "[redacted]").regexReplaceAll("\\b[A-Za-z0-9_-]{40,}\\b", "[redacted]") : fail("not an error response")'
      koinon.format: 'request.path == "/v1/messages" ? "anthropic" : request.path == "/v1/chat/completions" ? "openai" : ""'
      koinon.in: llm.inputTokens
      koinon.key: default(apiKey.name, "")
      koinon.max_tokens: llm.params.max_tokens
      koinon.out: llm.outputTokens
      koinon.reasoning: llm.reasoningTokens
      koinon.req_bytes: int(request.headers["content-length"])
      koinon.request: uuid()
      koinon.response_id: coalesce(response.headers["x-generation-id"])
      koinon.status: response.code
      koinon.stream: llm.streaming
      koinon.upstream: default(proxy.upstreamDuration, "") != ""
gateways:
  default:
    port: 4000
llm:
  policies:
    apiKey:
      mode: strict
      location:
        header:
          name: authorization
          prefix: 'Bearer '
      keys:
        - keyHash: sha256:d7ef9a39720870db13b85251d2f81938233b8417e9ef596c773638c5d38fd60c
          metadata:
            name: k-aaaaaaaaaaaa
            agent: acme/repo-helper
            org: acme
          allowedModels: []
        - keyHash: sha256:b0b03f2ad19f1dc9e87777f6432dd6ca96548f078a07c9bc473a278c2e1b85c6
          metadata:
            name: k-gggggggggggg
            agent: globex/analyst
            org: globex
          allowedModels: []
        - keyHash: sha256:7549f40f1c00b421e6ee02ffa614700af5408330bbf54fc90df8be1688a68f97
          metadata:
            name: koinon-reload-probe
            agent: ""
    authorization:
      rules:
        - apiKey.name != "koinon-reload-probe" && !has(llmRequest.mcp_servers)
    transformations:
      request:
        set:
          x-koinon-org: default(apiKey.org, "")
  models: []
mcp:
  failureMode: failOpen
  prefixMode: always
  policies:
    apiKey:
      mode: strict
      location:
        header:
          name: authorization
          prefix: 'Bearer '
      keys:
        - keyHash: sha256:d7ef9a39720870db13b85251d2f81938233b8417e9ef596c773638c5d38fd60c
          metadata:
            name: k-aaaaaaaaaaaa
            agent: acme/repo-helper
            org: acme
        - keyHash: sha256:b0b03f2ad19f1dc9e87777f6432dd6ca96548f078a07c9bc473a278c2e1b85c6
          metadata:
            name: k-gggggggggggg
            agent: globex/analyst
            org: globex
    mcpAuthorization:
      rules:
        - apiKey.agent == "acme/repo-helper" && ((mcp.tool.target == "acme-wiki" && mcp.tool.name in ["read_page", "search"]) || (mcp.tool.target == "acme-legacy" && mcp.tool.name in ["ping"]))
        - apiKey.agent == "globex/analyst" && ((mcp.tool.target == "globex-search" && mcp.tool.name in ["query"]))
        - mcp.prompt.name == "koinon-ready"
    transformations:
      request:
        set:
          x-koinon-agent: apiKey.agent
        remove:
          - authorization
          - x-api-key
  targets:
    - name: acme-legacy
      condition: apiKey.org == "acme"
      sse:
        host: https://legacy.example.com/sse
    - name: acme-wiki
      condition: apiKey.org == "acme"
      mcp:
        host: https://mcp.wiki.example.com/mcp
      policies:
        backendAuth:
          credentials:
            - key:
                file: /secrets/upstream/mcp_wiki
              location:
                header:
                  name: Authorization
                  prefix: 'Bearer '
    - name: github
      mcp:
        host: http://koinon-github-tools.koinon.svc:8080/mcp
    - name: globex-search
      condition: apiKey.org == "globex"
      mcp:
        host: https://search.example.org/mcp
      policies:
        backendAuth:
          credentials:
            - key:
                file: /secrets/upstream/mcp_search
              location:
                header:
                  name: X-Api-Key
                  prefix: ""
