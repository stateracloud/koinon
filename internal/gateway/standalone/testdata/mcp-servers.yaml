# Rendered by Koinon (internal/gateway/standalone). Do not edit: changes are overwritten.
# Keys appear only as hashes; key material lives in Kubernetes Secrets.
config:
  adminAddr: localhost:15000
  statsAddr: '[::]:15020'
  readinessAddr: '[::]:15021'
  logging:
    format: json
frontendPolicies:
  accessLog:
    add:
      koinon.agent: default(apiKey.agent, "")
      koinon.cache_read: llm.cachedInputTokens
      koinon.cache_write: llm.cacheCreationInputTokens
      koinon.config: '"87cb40e639e18582"'
      koinon.error: proxy.error.reason
      koinon.format: 'request.path == "/v1/messages" ? "anthropic" : request.path == "/v1/chat/completions" ? "openai" : ""'
      koinon.in: llm.inputTokens
      koinon.key: default(apiKey.name, "")
      koinon.max_tokens: llm.params.max_tokens
      koinon.out: llm.outputTokens
      koinon.reasoning: llm.reasoningTokens
      koinon.req_bytes: int(request.headers["content-length"])
      koinon.request: uuid()
      koinon.response_id: coalesce(response.headers["x-generation-id"])
      koinon.status: response.code
      koinon.stream: llm.streaming
      koinon.upstream: default(proxy.upstreamDuration, "") != ""
gateways:
  default:
    port: 4000
llm:
  policies:
    apiKey:
      mode: strict
      location:
        header:
          name: authorization
          prefix: 'Bearer '
      keys:
        - keyHash: sha256:d7ef9a39720870db13b85251d2f81938233b8417e9ef596c773638c5d38fd60c
          metadata:
            name: k-aaaaaaaaaaaa
            agent: acme/repo-helper
            org: acme
          allowedModels: []
        - keyHash: sha256:b0b03f2ad19f1dc9e87777f6432dd6ca96548f078a07c9bc473a278c2e1b85c6
          metadata:
            name: k-gggggggggggg
            agent: globex/analyst
            org: globex
          allowedModels: []
        - keyHash: sha256:52e738559a2bcd72d3d2df2bebcc92db2d4c66387904ea13016475802c621d9d
          metadata:
            name: koinon-reload-probe
            agent: ""
    authorization:
      rules:
        - apiKey.name != "koinon-reload-probe" && !url.decode(request.pathAndQuery).contains("kgw_") && !toJson(request.headers.filterKeys(k, k != "authorization")).contains("kgw_") && !has(llmRequest.mcp_servers)
    transformations:
      request:
        replace: request.headers.filterKeys(k, k in ["accept", "content-length", "content-type", "user-agent"])
        set:
          x-koinon-org: default(apiKey.org, "")
      response:
        set:
          x-should-retry: '(response.code == 403 || (response.code >= 400 && response.code < 500 && default(proxy.upstreamDuration, "") == "")) ? "false" : response.headers["x-should-retry"]'
  models: []
mcp:
  failureMode: failOpen
  prefixMode: always
  policies:
    apiKey:
      mode: strict
      location:
        header:
          name: authorization
          prefix: 'Bearer '
      keys:
        - keyHash: sha256:d7ef9a39720870db13b85251d2f81938233b8417e9ef596c773638c5d38fd60c
          metadata:
            name: k-aaaaaaaaaaaa
            agent: acme/repo-helper
            org: acme
        - keyHash: sha256:b0b03f2ad19f1dc9e87777f6432dd6ca96548f078a07c9bc473a278c2e1b85c6
          metadata:
            name: k-gggggggggggg
            agent: globex/analyst
            org: globex
    authorization:
      rules:
        - '!toJson(request.headers.filterKeys(k, k != "authorization")).contains("kgw_")'
    mcpAuthorization:
      rules:
        - apiKey.agent == "acme/repo-helper" && ((mcp.tool.target == "acme-wiki" && mcp.tool.name in ["read_page", "search"]) || (mcp.tool.target == "acme-legacy" && mcp.tool.name in ["ping"]))
        - apiKey.agent == "globex/analyst" && ((mcp.tool.target == "globex-search" && mcp.tool.name in ["query"]))
        - mcp.prompt.name == "koinon-ready"
    mcpGuardrails:
      processors:
        - kind: expression
          methods:
            tools/call: full
          condition: mcp.tool.target in ["acme-legacy", "acme-wiki", "globex-search"]
          reject: 'refused: the MCP leak guard is not configured on this installation'
    transformations:
      request:
        replace: request.headers.filterKeys(k, k in ["accept", "content-length", "content-type", "last-event-id", "mcp-protocol-version", "mcp-session-id", "user-agent"])
        set:
          x-koinon-agent: apiKey.agent
        remove:
          - authorization
          - x-api-key
      response:
        set:
          x-should-retry: '(response.code == 403 || (response.code >= 400 && response.code < 500 && default(proxy.upstreamDuration, "") == "")) ? "false" : response.headers["x-should-retry"]'
  targets:
    - name: acme-legacy
      condition: apiKey.org == "acme"
      sse:
        host: https://legacy.example.com/sse
    - name: acme-wiki
      condition: apiKey.org == "acme"
      mcp:
        host: https://mcp.wiki.example.com/mcp
      policies:
        backendAuth:
          credentials:
            - key:
                file: /secrets/upstream/mcp_wiki
              location:
                header:
                  name: Authorization
                  prefix: 'Bearer '
    - name: github
      mcp:
        host: http://koinon-github-tools.koinon.svc:8080/mcp
    - name: globex-search
      condition: apiKey.org == "globex"
      mcp:
        host: https://search.example.org/mcp
      policies:
        backendAuth:
          credentials:
            - key:
                file: /secrets/upstream/mcp_search
              location:
                header:
                  name: X-Api-Key
                  prefix: ""
