apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  labels:
    app.kubernetes.io/managed-by: koinon-reconciler
    koinon.dev/gateway: koinon-gateway
    koinon.dev/org: acme
  name: m-c4c22bc4431f382eb2d4
  namespace: koinon
spec:
  baseURL: https://api.anthropic.com/v1
  custom:
    formats:
      - type: Messages
    providerOverride: acme.anthropic
  match:
    model: claude-haiku-4-5
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: koinon-gateway
  policies:
    auth:
      credentials:
        - location:
            header:
              name: Authorization
              prefix: 'Bearer '
          secretRef:
            key: acme-claude
            name: koinon-gateway-providers
    authorization:
      action: Require
      policy:
        matchExpressions:
          - apiKey.org == "acme" && !apiKey.internal && (!default(apiKey.restricted, false) || "claude-haiku-4-5" in default(apiKey.models, [])) && !has(llmRequest.mcp_servers)
    headers:
      request:
        remove:
          - anthropic-beta
        set:
          - name: anthropic-version
            value: "2023-06-01"
          - name: anthropic-workspace-id
            value: wrkspc_01ExampleExample
    transformations:
      - expression: 'has(llmRequest.tools) ? (request.path == "/v1/messages" ? llmRequest.tools.filter(t, !has(t.type) || t.type == "custom") : llmRequest.tools) : null'
        field: tools
  provider: Custom
