apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  labels:
    app.kubernetes.io/managed-by: koinon-reconciler
    koinon.dev/gateway: koinon-gateway
    koinon.dev/org: acme
  name: m-a4a1774c13b71865fbae
  namespace: koinon
spec:
  baseURL: https://openrouter.ai/api/v1
  custom:
    formats:
      - type: Completions
    providerOverride: acme.openrouter
  match:
    model: open/model
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: koinon-gateway
  policies:
    auth:
      credentials:
        - location:
            header:
              name: Authorization
              prefix: 'Bearer '
          secretRef:
            key: acme-openrouter
            name: koinon-gateway-providers
    authorization:
      action: Require
      policy:
        matchExpressions:
          - apiKey.org == "acme" && !apiKey.internal && (!default(apiKey.restricted, false) || "open/model" in default(apiKey.models, []))
    transformations:
      - expression: 'has(llmRequest.stream) && llmRequest.stream == true ? {"include_usage": true} : null'
        field: stream_options
  provider: Custom
