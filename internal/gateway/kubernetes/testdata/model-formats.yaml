apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: koinon-reconciler
    koinon.dev/gateway: koinon-gateway
  name: koinon-gateway-edge
  namespace: koinon
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: koinon-gateway
  traffic:
    apiKeyAuthentication:
      configMapSelector:
        matchLabels:
          koinon.dev/gateway-keys: koinon-gateway
      mode: Strict
    phase: PreRouting
    transformation:
      request:
        set:
          - name: x-koinon-org
            value: default(apiKey.org, "")
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: koinon-reconciler
    koinon.dev/gateway: koinon-gateway
  name: koinon-gateway-frontend
  namespace: koinon
spec:
  frontend:
    accessLog:
      attributes:
        add:
          - expression: default(apiKey.name, "")
            name: koinon.key
          - expression: default(apiKey.agent, "")
            name: koinon.agent
          - expression: uuid()
            name: koinon.request
          - expression: llm.inputTokens
            name: koinon.in
          - expression: llm.outputTokens
            name: koinon.out
          - expression: llm.cachedInputTokens
            name: koinon.cache_read
          - expression: llm.cacheCreationInputTokens
            name: koinon.cache_write
          - expression: llm.reasoningTokens
            name: koinon.reasoning
          - expression: 'request.path == "/v1/messages" ? "anthropic" : request.path == "/v1/chat/completions" ? "openai" : ""'
            name: koinon.format
          - expression: llm.streaming
            name: koinon.stream
          - expression: proxy.error.reason
            name: koinon.error
          - expression: response.code
            name: koinon.status
          - expression: llm.params.max_tokens
            name: koinon.max_tokens
          - expression: int(request.headers["content-length"])
            name: koinon.req_bytes
          - expression: coalesce(response.headers["x-generation-id"])
            name: koinon.response_id
          - expression: default(proxy.upstreamDuration, "") != ""
            name: koinon.upstream
      otlp:
        protocol: HTTP
        url: http://koinon-api.koinon.svc:4318
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: koinon-gateway
