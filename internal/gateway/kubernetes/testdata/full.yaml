apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  labels:
    app.kubernetes.io/managed-by: koinon-reconciler
    koinon.dev/gateway: koinon-gateway
  name: koinon-gateway-mcp
  namespace: koinon
spec:
  mcp:
    failureMode: FailOpen
    prefixMode: Always
    targets:
      - condition: apiKey.org == "acme"
        name: acme-wiki
        static:
          host: mcp.wiki.example.com
          path: /mcp
          policies:
            auth:
              credentials:
                - location:
                    header:
                      name: Authorization
                      prefix: 'Bearer '
                  secretRef:
                    key: acme-wiki
                    name: koinon-gateway-providers
            tls:
              sni: mcp.wiki.example.com
          port: 443
          protocol: StreamableHTTP
      - name: github
        static:
          host: koinon-github-tools.koinon.svc
          path: /mcp
          port: 8080
          protocol: StreamableHTTP
      - condition: apiKey.org == "globex"
        name: globex-search
        static:
          host: search.example.org
          path: /sse
          policies:
            auth:
              credentials:
                - location:
                    header:
                      name: X-Api-Key
                  secretRef:
                    key: globex-search
                    name: koinon-gateway-providers
            tls:
              sni: search.example.org
          port: 8443
          protocol: SSE
  policies:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - apiKey.agent == "acme/repo-helper" && ((mcp.tool.target == "github" && mcp.tool.name in ["create_pull_request"]) || (mcp.tool.target == "acme-wiki" && mcp.tool.name in ["read_page"]))
            - mcp.prompt.name == "koinon-ready"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  labels:
    app.kubernetes.io/managed-by: koinon-reconciler
    koinon.dev/gateway: koinon-gateway
    koinon.dev/org: globex
  name: m-75884d3f653fa4f24f41
  namespace: koinon
spec:
  baseURL: http://ollama.globex.internal:11434/v1
  custom:
    formats:
      - type: Completions
    providerOverride: globex.ollama
  match:
    model: deepseek/deepseek-v4.1-flash
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: koinon-gateway
  policies:
    authorization:
      action: Require
      policy:
        matchExpressions:
          - apiKey.org == "globex" && !apiKey.internal
    transformations:
      - expression: 'has(llmRequest.stream) && llmRequest.stream == true ? {"include_usage": true} : null'
        field: stream_options
  provider: Custom
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  labels:
    app.kubernetes.io/managed-by: koinon-reconciler
    koinon.dev/gateway: koinon-gateway
    koinon.dev/org: acme
  name: m-7830b8533a392c1a6cf7
  namespace: koinon
spec:
  baseURL: https://openrouter.ai/api/v1
  custom:
    formats:
      - type: Completions
    providerOverride: acme.openrouter
  match:
    model: deepseek/deepseek-v4.1-flash
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: koinon-gateway
  policies:
    auth:
      credentials:
        - location:
            header:
              name: Authorization
              prefix: 'Bearer '
          secretRef:
            key: acme-openrouter
            name: koinon-gateway-providers
    authorization:
      action: Require
      policy:
        matchExpressions:
          - apiKey.org == "acme" && !apiKey.internal
    transformations:
      - expression: 'has(llmRequest.stream) && llmRequest.stream == true ? {"include_usage": true} : null'
        field: stream_options
      - expression: '{"data_collection": "deny", "zdr": true}'
        field: provider
  provider: Custom
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: koinon-reconciler
    koinon.dev/gateway: koinon-gateway
  name: koinon-gateway-edge
  namespace: koinon
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: koinon-gateway
  traffic:
    apiKeyAuthentication:
      configMapSelector:
        matchLabels:
          koinon.dev/gateway-keys: koinon-gateway
      mode: Strict
    phase: PreRouting
    transformation:
      request:
        set:
          - name: x-koinon-org
            value: default(apiKey.org, "")
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: koinon-reconciler
    koinon.dev/gateway: koinon-gateway
  name: koinon-gateway-frontend
  namespace: koinon
spec:
  frontend:
    accessLog:
      attributes:
        add:
          - expression: default(apiKey.name, "")
            name: koinon.key
          - expression: default(apiKey.agent, "")
            name: koinon.agent
          - expression: uuid()
            name: koinon.request
          - expression: llm.inputTokens
            name: koinon.in
          - expression: llm.outputTokens
            name: koinon.out
          - expression: llm.cachedInputTokens
            name: koinon.cache_read
          - expression: llm.cacheCreationInputTokens
            name: koinon.cache_write
          - expression: llm.reasoningTokens
            name: koinon.reasoning
          - expression: response.code
            name: koinon.status
          - expression: llm.params.max_tokens
            name: koinon.max_tokens
          - expression: int(request.headers["content-length"])
            name: koinon.req_bytes
      otlp:
        protocol: HTTP
        url: http://koinon-api.koinon.svc:4318
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: koinon-gateway
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: koinon-reconciler
    koinon.dev/gateway: koinon-gateway
  name: koinon-gateway-mcp
  namespace: koinon
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: koinon-gateway-mcp
  traffic:
    transformation:
      request:
        remove:
          - authorization
          - x-api-key
        set:
          - name: x-koinon-agent
            value: apiKey.agent
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/managed-by: koinon-reconciler
    koinon.dev/gateway: koinon-gateway
  name: koinon-gateway-mcp
  namespace: koinon
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: koinon-gateway
  rules:
    - backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: koinon-gateway-mcp
      matches:
        - path:
            type: PathPrefix
            value: /mcp
