# SPDX-License-Identifier: Apache-2.0
# A valid template that holds all three legs (ADR 0084): a read grant on a repository (private
# data), a web read tool (untrusted input) and an auto-tier tool of an unclassified server, which
# defaults to external-high (ADR 0091 decision 4). The
# templates test must report it; it is not shipped.
apiVersion: templates.koinon.dev/v1alpha1
kind: Template
metadata:
  id: all-three
  version: 0.1.0
  displayName: All three legs
  description: Reads a repository and the web.
spec:
  harness:
    allowed: [opencode]
    default: opencode
  model:
    name: default
  tools: [web_url_read, post_webhook]
  grants:
    - connector: gitea
      scopes: [repo.read]
      preset: read-only
      targets: {min: 1, max: 1}
  limits:
    run:
      maxDuration: 30m
      maxModelRequests: 150
      maxSpendUSD: "5.00"
    spendUSD: "10.00"
  instructions: |
    Read the repository, then call `web_url_read` on the pages it links to,
    then send what you found with `post_webhook`.
