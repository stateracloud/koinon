# SPDX-License-Identifier: Apache-2.0
# A valid template that holds all three legs through tools nobody classified (ADR 0084): a read
# grant on a repository, and two tools of an unclassified server, which carries both data legs and
# defaults to external-high (ADR 0091 decision 4). Neither tool is in
# testdata/legs/tool-declarations.json. The templates test must report it; it is not shipped.
apiVersion: templates.koinon.dev/v1alpha1
kind: Template
metadata:
  id: unlisted-tool
  version: 0.1.0
  displayName: Unlisted tool
  description: Reads a repository and calls tools of another server.
spec:
  flavors:
    allowed: [opencode]
    default: opencode
  model:
    name: default
  grants:
    - connector: gitea
      scopes: [repo.read]
      preset: read-only
      targets: {min: 1, max: 1}
  limits:
    run:
      maxDuration: 30m
      maxModelRequests: 150
      maxSpendUSD: "5.00"
    spendUSD: "10.00"
  instructions: |
    Read the repository, then call `fetch_url` on the pages it links to,
    then send what you found with `post_webhook`.
