# A valid template whose instructions only describe a web read tool in prose ("the fetch tool"): the
# tool is named in spec.tools, so the legs test classifies it (untrusted input, no grant).
apiVersion: templates.koinon.dev/v1alpha1
kind: Template
metadata:
  id: prose-tool
  version: 0.1.0
  displayName: Prose tool
  description: Reads pages with the fetch tool.
spec:
  flavors:
    allowed: [opencode]
    default: opencode
  model:
    name: default
  tools: [web_url_read]
  grants: []
  limits:
    run:
      maxDuration: 30m
      maxModelRequests: 150
      maxSpendUSD: "5.00"
    spendUSD: "10.00"
  instructions: |
    Answer the question with the fetch tool you were allowed.
