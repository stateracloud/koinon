# want: /spec/triggers/0/id
apiVersion: templates.koinon.dev/v1alpha1
kind: Template
metadata:
  id: fixture
  version: 0.1.0
  displayName: Fixture
  description: A near-valid template with one mistake.
spec:
  harness:
    allowed: [opencode]
    default: opencode
  model:
    name: default
  grants:
    - connector: github
      scopes: [repo.read, pull_request.create]
      preset: standard
      targets: {min: 1, max: 1}
  triggers:
    - id: Weekly
      type: schedule
      filter:
        cron: "0 7 * * 1"
        timezone: UTC
      instruction: Go.
  limits:
    run:
      maxDuration: 30m
      maxModelRequests: 150
      maxSpendUSD: "5.00"
      maxTokens: 2000000 # deprecated, still accepted (ADR 0081)
    spendUSD: "10.00"
  instructions: |
    Do the thing.
