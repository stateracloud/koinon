# want: /spec/triggers
apiVersion: templates.koinon.dev/v1alpha1
kind: Template
metadata:
  id: fixture
  version: 0.1.0
  displayName: Fixture
  description: A near-valid template with one mistake.
spec:
  harness:
    allowed: [opencode]
    default: opencode
  model:
    name: default
  grants:
    - connector: github
      scopes: [repo.read, pull_request.create]
      preset: standard
      targets: {min: 1, max: 1}
  triggers:
    - id: t0
      type: direct_message
      instruction: Reply.
    - id: t1
      type: direct_message
      instruction: Reply.
    - id: t2
      type: direct_message
      instruction: Reply.
    - id: t3
      type: direct_message
      instruction: Reply.
    - id: t4
      type: direct_message
      instruction: Reply.
    - id: t5
      type: direct_message
      instruction: Reply.
    - id: t6
      type: direct_message
      instruction: Reply.
    - id: t7
      type: direct_message
      instruction: Reply.
    - id: t8
      type: direct_message
      instruction: Reply.
    - id: t9
      type: direct_message
      instruction: Reply.
    - id: t10
      type: direct_message
      instruction: Reply.
    - id: t11
      type: direct_message
      instruction: Reply.
    - id: t12
      type: direct_message
      instruction: Reply.
    - id: t13
      type: direct_message
      instruction: Reply.
    - id: t14
      type: direct_message
      instruction: Reply.
    - id: t15
      type: direct_message
      instruction: Reply.
    - id: t16
      type: direct_message
      instruction: Reply.
  limits:
    run:
      maxDuration: 30m
      maxModelRequests: 150
      maxSpendUSD: "5.00"
      maxTokens: 2000000 # deprecated, still accepted (ADR 0081)
    spendUSD: "10.00"
  instructions: |
    Do the thing.
