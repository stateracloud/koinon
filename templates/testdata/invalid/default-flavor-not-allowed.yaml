# SPDX-License-Identifier: Apache-2.0
# want: default flavor "hermes" is not in the allowed flavors
apiVersion: templates.koinon.dev/v1alpha1
kind: Template
metadata:
  id: fixture
  version: 0.1.0
  displayName: Fixture
  description: A near-valid template with one mistake.
spec:
  flavors:
    allowed: [opencode, pi]
    default: hermes
  model:
    name: default
  grants:
    - connector: github
      scopes: [repo.read, pull_request.create]
      preset: standard
      targets: {min: 1, max: 1}
  limits:
    run:
      maxDuration: 30m
      maxTokens: 2000000
    spendUSD: "10.00"
  instructions: |
    Do the thing.
