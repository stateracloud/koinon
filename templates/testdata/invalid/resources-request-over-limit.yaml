# want: memory.request 2Gi is greater than memory.limit 1Gi
apiVersion: templates.koinon.dev/v1alpha1
kind: Template
metadata:
  id: repo-helper
  version: 0.1.0
  displayName: Fixture
  description: A near-valid template with one mistake.
spec:
  harness:
    allowed: [opencode]
    default: opencode
  resources:
    memory: {request: 2Gi, limit: 1Gi}
  model:
    name: default
  grants:
    - connector: github
      scopes: [repo.read, pull_request.create]
      preset: standard
      targets: {min: 1, max: 1}
  limits:
    run:
      maxDuration: 30m
      maxModelRequests: 150
      maxSpendUSD: "5.00"
    spendUSD: "10.00"
  instructions: |
    Do the thing.
