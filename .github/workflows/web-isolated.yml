# SPDX-License-Identifier: Apache-2.0
#
# Nightly Vitest run with per-file isolation (issue 41). Pull request and local runs use
# `isolate: false` (web/vite.config.ts), which is faster but lets one test file leak module or
# jsdom state into the next. This run sets VITEST_ISOLATE=true so a leak shows up here. It is not a
# required check and not part of ci.yml; a red run notifies the maintainer.
name: web-isolated

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:isolated
