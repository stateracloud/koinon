# SPDX-License-Identifier: Apache-2.0
#
# Branch updater (ADR 0082, item 8): bring the oldest auto-merge pull request that is behind main up
# to date (strict required checks, no merge queue). The logic is
# hack/claim.sh update-oldest. Split from claims.yml (old issue 596) so that auto_merge_enabled starts only
# this job and not the `claim` check.
#
# Triggers, each for a reason the others cannot cover:
#   push to main            main moved: pull requests fall behind
#   workflow_run (ci, e2e-kind)  a pull request's checks finished: the next one may go. Not for a ci run
#                           of a push to main (the push trigger already ran) and not for a cancelled
#                           run (a new run of the same pull request follows)
#   auto_merge_enabled      a pull request joined the queue
#   schedule                a missed event or an UNKNOWN merge state self-heals
# One at a time. The App ID and key are secrets of the `claims-bot` Environment (see docs/dev/work-claims-setup.md);
# without them the job skips with a notice.
name: updater

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  pull_request_target:
    types: [auto_merge_enabled]
  push:
    branches: [main]
  workflow_run:
    workflows: [ci, e2e-kind]
    types: [completed]

permissions:
  contents: read

jobs:
  updater:
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion != 'cancelled')
    name: updater
    runs-on: ubuntu-latest
    environment: claims-bot
    concurrency:
      group: updater
      cancel-in-progress: false
    env:
      APP_ID: ${{ secrets.KOINON_BOT_APP_ID }}
      APP_KEY: ${{ secrets.KOINON_BOT_PRIVATE_KEY }}
    steps:
      - id: gate
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::notice::KOINON_BOT_APP_ID / KOINON_BOT_PRIVATE_KEY are not set; the branch updater is skipped"
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.KOINON_BOT_APP_ID }}
          private-key: ${{ secrets.KOINON_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          # The updater reads each PR's statusCheckRollup to skip PRs still running checks.
          permission-checks: read
          permission-statuses: read
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          KOINON_CLAIM_REPO: ${{ github.repository }}
        run: hack/claim.sh update-oldest
