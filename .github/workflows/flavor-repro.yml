# SPDX-License-Identifier: Apache-2.0
#
# Flavor reproducibility (#176, docs/dev/releasing.md): two builds of the opencode flavor at one commit, on
# fresh builders with no cache, must give one image digest (hack/flavor-repro-check.sh). Advisory: it runs on a
# push to main, nightly and on dispatch only, never on a pull request or in the merge queue. Two uncached builds
# add a timeout and disk risk that the required `flavors` job in ci.yml must not carry (#572). It is a separate
# workflow because ci.yml has no schedule trigger, and one there would start the whole suite every night.
# It is listed as advisory in hack/ci-required.txt.
name: flavor-repro

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flavor-repro-${{ github.sha }}
  cancel-in-progress: false

jobs:
  flavor-repro:
    name: flavor-repro
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Two uncached builds and their OCI layouts outgrow the runner's disk; drop what the job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The runner's platform only. The script deletes build1.tar and build2.tar once the digests are equal.
      - name: flavor reproducibility (two builds, one digest)
        run: hack/flavor-repro-check.sh opencode
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prune the buildx cache
        if: always()
        run: docker buildx prune --all --force
