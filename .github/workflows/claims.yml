# SPDX-License-Identifier: Apache-2.0
#
# Work claims (ADR 0082). The logic lives in hack/claim.sh so it can be tested and linted; this file
# only schedules it.
#   sweeper   every 30 minutes (the lease is 2 h, stale at lease + 15 min): mark stale claims, release
#             dead ones (draft PRs are kept)
#   release   when a pull request closes: release the claims that point at it
#   claim     required check on every pull request: it names an issue whose claim its author holds
#   (the branch updater lives in updater.yml: its triggers differ from the claim's, see there)
#
# pull_request_target: the `claim` and `release` jobs use the workflow file and the hack/claim.sh of
# the base branch and never run the pull request's code, so a pull request cannot weaken its own
# check. They check out the base commit only, with minimal permissions.
#
# Billed minutes (#596): every job here costs at least one rounded-up minute. The `claim` job runs
# only for events that can change its answer (title, body, files, labels, state). A job skipped by
# an `if:` reports "skipped", which a required check counts as passing and which replaces an earlier
# failure of the same name, so the claim is never filtered at job level: unwanted events are left out
# of `types:` below instead (no run, the earlier result stays).
#
# The Project board writes need a GitHub App token (GITHUB_TOKEN cannot write an
# organization project, and a push made with it does not start CI). The App ID and key are secrets of
# the `claims-bot` Environment, which is limited to the main branch. While they are absent those jobs
# skip with a notice, so CI stays green before the App exists. The `claim` check needs no App.
name: claims

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  pull_request_target:
    # Not auto_merge_enabled: the claim does not depend on auto-merge (it starts updater.yml).
    # ready_for_review stays: a draft whose claim was swept or taken over must re-check when marked
    # ready. labeled/unlabeled stay: unclaimed-ok
    # decides the check and `types:` cannot filter by label name.
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, closed]

permissions:
  contents: read

jobs:
  sweeper:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: sweeper
    runs-on: ubuntu-latest
    environment: claims-bot
    concurrency:
      group: claims-sweeper
      cancel-in-progress: false
    env:
      APP_ID: ${{ secrets.KOINON_BOT_APP_ID }}
      APP_KEY: ${{ secrets.KOINON_BOT_PRIVATE_KEY }}
    steps:
      - id: gate
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::notice::KOINON_BOT_APP_ID / KOINON_BOT_PRIVATE_KEY are not set; the claim sweeper is skipped"
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.KOINON_BOT_APP_ID }}
          private-key: ${{ secrets.KOINON_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: read
          permission-organization-projects: write
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          KOINON_CLAIM_REPO: ${{ github.repository }}
        run: hack/claim.sh sweep

  # One group per pull request: a release must not be cancelled or replaced by another one.
  release:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    name: release claims
    runs-on: ubuntu-latest
    environment: claims-bot
    concurrency:
      group: claims-release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      APP_ID: ${{ secrets.KOINON_BOT_APP_ID }}
      APP_KEY: ${{ secrets.KOINON_BOT_PRIVATE_KEY }}
    steps:
      - id: gate
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::notice::KOINON_BOT_APP_ID / KOINON_BOT_PRIVATE_KEY are not set; claims are not released on close"
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.KOINON_BOT_APP_ID }}
          private-key: ${{ secrets.KOINON_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: read
          permission-organization-projects: write
      # The base branch's script (the commit the pull request targets), never the pull request's own.
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          KOINON_CLAIM_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: hack/claim.sh release-pr "$PR"

  # Required check (name: claim). Read-only token and no secrets; runs the base branch's script and
  # never checks out or runs the pull request's code.
  claim:
    # Every subscribed event re-evaluates the check: a required check's latest run wins, and a skipped
    # run counts as passing, so skipping here would turn a failed claim green.
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    name: claim
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - env:
          GH_TOKEN: ${{ github.token }}
          KOINON_CLAIM_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: hack/claim.sh check-pr "$PR"
