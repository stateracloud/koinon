# SPDX-License-Identifier: Apache-2.0
#
# E1 quickstart e2e on kind (plan item E1): test/e2e/run.sh on a GitHub-hosted runner (ubuntu-24.04: its kernel has
# Landlock, which the OpenShell sandbox supervisor requires, old issue 159). It calls no external service besides image and manifest
# downloads: the model is the fake model server and GitHub is the fake GitHub, both in the cluster.
#
# When it runs (the `decide` job, hack/e2e-decide.sh):
#   - merge queue (#444, ADR 0102, ADR 0105): the quickstart runs on the queue commit (main plus the pull request) when
#     the entry's own diff against merge_group.base_sha is e2e-relevant, or the pull request carries the `e2e` label
#     (read when the queue builds the entry; a failed read counts as needed). A red run drops the entry from the
#     queue. This is the ONE e2e proof for a merge: no PR-head run, dispatched run or `e2e-lab` status counts.
#   - pull requests (#572, ADR 0105 amended): advisory, and only with the `e2e` label (a fork PR too). No path rule runs
#     the quickstart on a pull request: the merge queue applies the full rule to every entry and is the only proof,
#     so an automatic run on the pull request repeated that work. Put the label on when a red before a review and a
#     queue slot is worth the runner time. `e2e result` is green on a pull request whatever the quickstart did.
#   - pushes to main: batched (one running, the newest pending) when anything e2e-relevant changed
#     since the last green run. Nightly: always, once a day, to catch drift nothing in the tree
#     explains (upstream images, the runner image, downloads). The nightly run also backs up and restores the
#     install (test/e2e/backup-restore.sh, which runs
#     test/e2e/commands/backup-restore.e1) and checks it came back. A red run after a green one opens
#     an issue naming the culprit merge (hack/e2e-bisect.sh): fix forward within 2 hours, else revert.
#   - manual dispatch, optionally on one commit (the bisect uses it).
#   - the advisory `drill` job (ADR 0109, #514): nightly, on rc tags and on a dispatch with suite=drill. On a tag push
#     and on that dispatch `decide`, `quickstart` and `result` are skipped; `continue-on-error` keeps the run's
#     conclusion (which hack/e2e-bisect.sh reads) as the quickstart's. The `drill issue` job (#572) opens the issue
#     for a red drill and is `continue-on-error` for the same reason.
# The `e2e result` job is the one to require: on a queue build, a push, the nightly or a dispatch it passes when
# the quickstart passed, or was skipped because `decide` said nothing needed it; it fails when the quickstart
# failed or was cancelled. Trust limit: `result` runs from this very file, so a PR can edit it to drop the
# check; the guard is the ruleset's required review on `.github/**` (ADR 0105).
name: e2e-kind
run-name: e2e-kind${{ inputs.commit && format(' ({0}) bisect {1}', inputs.commit, inputs.bisect_id) || '' }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    # `labeled` is for the `e2e` label only (#971): `pr-merge --admin` and ship.sh --e2e add it to a PR that is
    # already open, and without this trigger the label started nothing until a push or a rerun. Any other label
    # skips `decide` (see its `if:`) and does not share the PR's concurrency group (a label must never cancel a run).
  # The merge queue (#225, #444, ADR 0102, ADR 0105): `e2e result` is required, so it reports on the queue's commit.
  # When the entry's own diff (against merge_group.base_sha) is e2e-relevant, or the pull request has the `e2e`
  # label, decide starts the quickstart on the queue commit (main plus the pull request): that run is the one
  # merge evidence.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    tags: ['v*-rc.*'] # only the `drill` job runs on a tag (ADR 0109)
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'go: API-driven quickstart (test/e2e). web: the browser, Playwright against the real API (web/e2e-real, old issue 50). Each needs its own install, so one per run. drill: only the advisory restore drill (ADR 0109), not the quickstart.'
        type: choice
        options: [go, web, drill]
        default: go
      backup_restore:
        description: 'Also run the backup-and-restore step (test/e2e/backup-restore.sh, go suite only). The nightly run always does.'
        type: boolean
        default: false
      commit:
        description: 'Run on this full commit sha instead of the ref (used by hack/e2e-bisect.sh).'
        type: string
        default: ''
      bisect_id:
        description: 'The bisect run that dispatched this one; it is in the run name so the bisect finds exactly its runs.'
        type: string
        default: ''

permissions:
  contents: read

# Pull requests: a new push cancels the old run. Main: one running, one pending, the newest pending
# replaces the older (batching). Everything else (dispatch, nightly, a merge queue build) runs alone:
# a queue build is never cancelled (its group is its run id, cancel-in-progress is off for it).
concurrency:
  group: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && format('e2e-kind-tag-{0}', github.ref) || github.event_name == 'push' && 'e2e-main' || github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'e2e') && format('e2e-kind-pr-{0}', github.ref) || format('e2e-kind-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'e2e') }}

jobs:
  # Cheap: a checkout, a git diff, one `go list`.
  decide:
    # Not for drafts, not for an rc tag push or a drill dispatch (those run only the `drill` job).
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'labeled' || github.event.label.name == 'e2e'))) && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && inputs.suite != 'drill'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the last green run on main
      pull-requests: read # the PR's current labels (also on merge_group: the queued PR's `e2e` label)
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge bases, and the last green commit on main
          persist-credentials: false

      # The rule asks `go list` which packages the binaries build. A pull request reads only its labels (#572).
      - if: github.event_name != 'pull_request'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      # zizmor: ignore[cache-poisoning] tag trigger; job publishes nothing
        with:
          go-version-file: go.mod

      - name: Does this run need the e2e?
        id: decide
        shell: bash # -eo pipefail
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR: ${{ github.event.pull_request.number }}
          # The queue ref (gh-readonly-queue/main/pr-<N>-<sha>) names the queued pull request: decide reads its labels.
          QUEUE_REF: ${{ github.event_name == 'merge_group' && github.ref || '' }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          PUSH_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Run the base branch's copy of the rule and the decision: a pull request must not be
          # able to change what decides whether it is tested. This PR's own copy only when the
          # base has none (the commit that introduces them). A merge queue build uses main as it was when
          # the entry was built (merge_group.base_sha), for the same reason.
          ref=""
          if [[ $EVENT == pull_request ]]; then ref="origin/$BASE"; elif [[ $EVENT == merge_group ]]; then ref="$MG_BASE"; fi
          # The whole set comes from ONE ref, never a mix of base and PR files. paths-lib.sh and
          # paths.rules are sourced by needs-e2e.sh from its own directory. A base that predates
          # them (the commit that introduces them) has neither, and then needs-e2e.sh is the
          # standalone one: a missing file at the base is legal, so copy those two only if the ref has them.
          for f in needs-e2e.sh e2e-decide.sh paths-lib.sh paths.rules; do
            if [[ -n $ref ]] && git cat-file -e "$ref:hack/$f" 2>/dev/null; then
              git show "$ref:hack/$f" > "$RUNNER_TEMP/$f"
              echo "using hack/$f from $ref"
              chmod +x "$RUNNER_TEMP/$f"
            elif [[ -z $ref || $f == needs-e2e.sh || $f == e2e-decide.sh ]]; then
              cp "hack/$f" "$RUNNER_TEMP/$f"
              chmod +x "$RUNNER_TEMP/$f"
            fi
            # No chmod after the if: a file the base legally lacks was not copied. Any other failure
            # here stays an error on purpose (set -e): a broken step must turn the job red, not skip the e2e.
          done
          NEEDS_E2E="$RUNNER_TEMP/needs-e2e.sh" "$RUNNER_TEMP/e2e-decide.sh"

  quickstart:
    # A dispatch with inputs.commit (hack/e2e-bisect.sh) tests another commit than the one the check run attaches
    # to, so it must not be named `quickstart`: hack/release-gate.sh reads that name on the main head (#453).
    name: ${{ inputs.commit != '' && 'quickstart (commit)' || 'quickstart' }}
    needs: decide
    if: needs.decide.outputs.needed == 'true'
    permissions:
      contents: read
      packages: read # the harness image CI's harnesses job pushed to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 35 # the job takes about 14 minutes (#572); the nightly adds 20 seconds
    defaults:
      run:
        # Explicit bash adds -o pipefail, so `| tee` keeps the script's exit code.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }} # empty: the event's own ref
          persist-credentials: false

      - name: Tool versions (hack/versions.env)
        run: hack/versions-env.sh >> "$GITHUB_ENV"

      # cache: false, and an explicit cache with a fallback prefix: a new go.sum still starts from
      # the last build cache (main saves one per go.sum), which is most of the ko and driver builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Restored everywhere, saved only by a push to main or the nightly schedule on main (below): a pull request, or a
      # dispatch on an arbitrary commit, can never write the cache that main's runs read.
      - id: e2ego
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: e2e-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            e2e-go-${{ runner.os }}-

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      # The web suite only: Node and pnpm for Playwright (same pins as the web job in ci.yml).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.suite == 'web'
        with:
          package_json_file: web/package.json

      - name: Node and pnpm (web suite)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      # zizmor: ignore[cache-poisoning] tag trigger; job publishes nothing
        if: inputs.suite == 'web'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Runner facts
        run: |
          set -x
          nproc; free -m; df -h /; uname -a
          cat /sys/kernel/security/lsm || true
          docker info --format '{{.ServerVersion}} {{.CgroupVersion}} {{.SecurityOptions}}'

      # The OpenShell sandbox supervisor refuses to start without Landlock ABI v3 (Linux 6.2+).
      # Fail here, in seconds, rather than as "sandbox not ready" minutes into the quickstart.
      - name: Kernel has Landlock
        run: |
          if ! grep -qw landlock /sys/kernel/security/lsm; then
            echo "::error::this runner's kernel ($(uname -r)) has no Landlock; OpenShell's sandbox supervisor needs it (old issue 159)"
            exit 1
          fi

      # No cache and no local action here: this job checks out inputs.commit (an arbitrary commit),
      # so a local action would be that commit's code, and a cache entry it saved would sit in the
      # default branch's cache scope (CodeQL: cache poisoning). The helper retries and checks the sha256.
      - name: Download kind and ko (hack/fetch-pinned.sh)
        run: |
          hack/fetch-pinned.sh "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" "$KIND_SHA256_AMD64" "$RUNNER_TEMP/bin/kind"
          hack/fetch-pinned.sh "https://github.com/ko-build/ko/releases/download/v${KO_VERSION}/ko_${KO_VERSION}_Linux_x86_64.tar.gz" "$KO_SHA256_AMD64" "$RUNNER_TEMP/ko.tgz"
      - name: Install kind and ko
        run: |
          chmod +x "$RUNNER_TEMP/bin/kind"
          tar xzf "$RUNNER_TEMP/ko.tgz" -C "$RUNNER_TEMP/bin" ko
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR (reads the harness image; a miss falls back to building it)
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || true

      # Pull the harness image first (#572): when the harnesses job pushed this harnesses/ tree to GHCR (the usual
      # case), the layer cache and buildx below are not needed and are skipped. test/e2e/kind/images.sh finds
      # the pulled image in the daemon and does not pull it again.
      - name: Pull the harness image
        id: harnesspull
        env:
          HARNESS_PULL_REPO: ghcr.io/${{ github.repository }}/harnesses/opencode
        run: |
          tag=$(hack/harness-tag.sh opencode) || tag=""
          if [[ -n $tag ]] && docker pull -q "$HARNESS_PULL_REPO:$tag" >/dev/null; then
            echo "pulled $HARNESS_PULL_REPO:$tag"
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "no pullable harness image for tag '$tag'; the run builds it"
            echo "pulled=false" >> "$GITHUB_OUTPUT"
          fi

      # The harness image is built here only when the pull above missed. The docker-container driver is
      # needed to import the layer cache the harnesses job saved on main; this job only restores it
      # (a pull request never writes it, #145).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.harnesspull.outputs.pulled != 'true'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.harnesspull.outputs.pulled != 'true'
        with:
          path: ${{ runner.temp }}/harness-cache
          key: harnesses-${{ hashFiles('harnesses/**') }}
          restore-keys: harnesses-

      # The pull-through caches (test/e2e/kind/registry.sh, #45) keep the third-party images the install pulls
      # (CloudNativePG, OpenShell, Agent Sandbox, kube-network-policies, agentgateway) in this directory. Restore
      # only: main's quickstart job saves it, as for the harness cache above, so a pull request or a dispatch on an
      # arbitrary commit never writes what main reads. A miss still works, the caches pull through from upstream.
      # No restore-keys: the caches never expire blobs (TTL 0), so a new key starts empty and holds only what the
      # current pins pull, instead of growing by every old pin set.
      - id: kindproxy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kind-proxy-cache
          key: kind-proxy-${{ runner.os }}-${{ hashFiles('test/e2e/kind/up.sh', 'test/e2e/kind/registry.sh', 'charts/koinon/values.yaml', 'hack/versions.env') }}

      - name: Quickstart e2e (kind, images, helm install, driver or browser)
        env:
          OUT: ${{ runner.temp }}/e2e
          SUITE: ${{ inputs.suite || 'go' }}
          # The nightly run (and a dispatch that asks) backs up, restores and verifies the install after the
          # driver (ADR 0085 decision 18, #90); pull requests and pushes skip it to keep their run short.
          BACKUP_RESTORE: ${{ (github.event_name == 'schedule' || inputs.backup_restore) && (inputs.suite || 'go') == 'go' && '1' || '0' }}
          # Also run the escape suite's leak guard case from a sandbox against this install (#348).
          ESCAPE_MCP: ${{ (inputs.suite || 'go') == 'go' && '1' || '0' }}
          # The workflow deletes the cluster in its own step, after collecting resource use.
          KEEP: "1"
          # The harness image the step above pulled (the harnesses job pushed it for this harnesses/ tree). Empty after
          # a miss, so images.sh goes straight to the build and does not try the pull again.
          HARNESS_PULL_REPO: ${{ steps.harnesspull.outputs.pulled == 'true' && format('ghcr.io/{0}/harnesses/opencode', github.repository) || '' }}
          # The escape suite's probe image: pulled when harness-publish pushed this hack/spike/probe tree
          # (hack/probe-tag.sh), so the run needs no apt mirror (#482). A miss builds it.
          PROBE_PULL_REPO: ghcr.io/${{ github.repository }}/spike-probe
          # A harness build (the pull missed) imports the restored layer cache and authenticates the
          # Dockerfile's GitHub release downloads with the workflow token as a BuildKit secret.
          HARNESS_CACHE: ${{ runner.temp }}/harness-cache
          KIND_PROXY_CACHE: ${{ runner.temp }}/kind-proxy-cache
          GITHUB_TOKEN: ${{ github.token }}
        run: test/e2e/run.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Timings
        if: always()
        run: |
          {
            echo '## Quickstart e2e on kind'
            echo
            cat "$RUNNER_TEMP/e2e/quickstart-timings.md" 2>/dev/null || echo 'No timings: the driver did not finish.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resource use
        if: always()
        run: |
          kubectl --context kind-koinon-e1 get pods -A -o wide || true
          docker stats --no-stream || true
          free -m
          # Old issue 159: what the runner's kernel offers the OpenShell sandbox supervisor.
          uname -a
          cat /sys/kernel/security/lsm 2>/dev/null; echo
          sysctl kernel.unprivileged_userns_clone user.max_user_namespaces kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          sudo dmesg | tail -n 200 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-kind-logs
          path: |
            ${{ runner.temp }}/e2e.log
            ${{ runner.temp }}/e2e/
          retention-days: 7

      - name: Delete cluster
        if: always()
        run: test/e2e/kind/down.sh

      # Stop the caches (they run as root and still write) and make their storage readable before it is saved.
      - name: Stop the pull-through caches
        if: success() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && steps.kindproxy.outputs.cache-hit != 'true'
        env:
          KIND_PROXY_CACHE: ${{ runner.temp }}/kind-proxy-cache
        run: |
          test/e2e/kind/registry.sh stop
          sudo chmod -R a+rX "$KIND_PROXY_CACHE"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && steps.kindproxy.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/kind-proxy-cache
          key: kind-proxy-${{ runner.os }}-${{ hashFiles('test/e2e/kind/up.sh', 'test/e2e/kind/registry.sh', 'charts/koinon/values.yaml', 'hack/versions.env') }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && steps.e2ego.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: e2e-go-${{ runner.os }}-${{ hashFiles('go.sum') }}

  # The one check to require (ADR 0105). On a pull request it is always green: the quickstart there is advisory
  # and the queue is the proof, but the context must exist for the pull request to be enqueued. On a queue build,
  # a push, the nightly and a dispatch it is green when the quickstart passed or when it was skipped because
  # `decide` answered needed=false (nothing needed it); red when it failed or was cancelled, and when `decide`
  # itself failed (the composite-check pattern).
  result:
    name: e2e result
    needs: [decide, quickstart]
    if: always() && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && inputs.suite != 'drill'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless the e2e passed or was not needed
        shell: bash # -eo pipefail
        env:
          EVENT: ${{ github.event_name }}
          DECIDE: ${{ needs.decide.result }}
          QUICKSTART: ${{ needs.quickstart.result }}
          NEEDED: ${{ needs.decide.outputs.needed }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            echo "pull request: the quickstart is advisory (decide: $DECIDE, quickstart: $QUICKSTART); the merge queue decides."
            exit 0
          fi
          case $QUICKSTART in
          success) echo "quickstart passed" ;;
          skipped)
            if [[ $DECIDE == success && $NEEDED == false ]]; then
              echo "quickstart skipped: nothing needs the e2e"
            else
              echo "::error::quickstart was skipped but decide said needed=$NEEDED (decide: $DECIDE)"
              exit 1
            fi
            ;;
          *) echo "::error::quickstart $QUICKSTART (decide: $DECIDE)"; exit 1 ;;
          esac

  # A red run on main: find the merge that did it and open one issue (hack/e2e-bisect.sh).
  bisect:
    needs: quickstart
    if: >-
      always() && needs.quickstart.result == 'failure'
      && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write # the issue naming the culprit
      actions: write # dispatches the e2e on each candidate
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      # zizmor: ignore[cache-poisoning] tag trigger; job publishes nothing
        with:
          go-version-file: go.mod
      - run: hack/e2e-bisect.sh

  # The automated restore drill (ADR 0109, #514), advisory. It lives in this file because GitHub starts a
  # dispatch or a schedule only from a workflow file on the default branch, and this one already has them.
  # `continue-on-error` keeps a red drill from turning the run red: hack/e2e-bisect.sh reads the conclusion of
  # this workflow's push and schedule runs to find the last green main. Runs on the nightly schedule, on rc tags
  # (v*-rc.*) and on a dispatch with suite=drill (the only job that dispatch runs). Never a pull request or queue
  # check, so it can never be required (hack/ci-required.txt). A red check that is not a declared known gap
  # (label known-gap, message "known gap: #N") turns the job's steps red; read drill-result.json and the summary.
  drill:
    name: drill
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'workflow_dispatch' && inputs.suite == 'drill')
    continue-on-error: true
    permissions:
      contents: read
      packages: read # the harness image
    outputs:
      red: ${{ steps.verdict.outputs.red }} # `needs.drill.result` is "success" under continue-on-error, so the job says it itself
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Tool versions (hack/versions.env)
        run: hack/versions-env.sh >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: e2e-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            e2e-go-${{ runner.os }}-

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - name: Kernel has Landlock
        run: |
          if ! grep -qw landlock /sys/kernel/security/lsm; then
            echo "::error::this runner's kernel ($(uname -r)) has no Landlock; OpenShell's sandbox supervisor needs it (old issue 159)"
            exit 1
          fi

      - name: Download kind and ko (hack/fetch-pinned.sh)
        run: |
          hack/fetch-pinned.sh "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" "$KIND_SHA256_AMD64" "$RUNNER_TEMP/bin/kind"
          hack/fetch-pinned.sh "https://github.com/ko-build/ko/releases/download/v${KO_VERSION}/ko_${KO_VERSION}_Linux_x86_64.tar.gz" "$KO_SHA256_AMD64" "$RUNNER_TEMP/ko.tgz"
      - name: Install kind and ko
        run: |
          chmod +x "$RUNNER_TEMP/bin/kind"
          tar xzf "$RUNNER_TEMP/ko.tgz" -C "$RUNNER_TEMP/bin" ko
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/harness-cache
          key: harnesses-${{ hashFiles('harnesses/**') }}
          restore-keys: harnesses-

      - name: Log in to GHCR (reads the harness image; a miss falls back to building it)
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || true

      # The pull-through caches (test/e2e/kind/registry.sh, #45) keep the third-party images the install pulls
      # (CloudNativePG, OpenShell, Agent Sandbox, kube-network-policies, agentgateway) in this directory. Restore
      # only: main's quickstart job saves it, as for the harness cache above, so a pull request or a dispatch on an
      # arbitrary commit never writes what main reads. A miss still works, the caches pull through from upstream.
      # No restore-keys: the caches never expire blobs (TTL 0), so a new key starts empty and holds only what the
      # current pins pull, instead of growing by every old pin set.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kind-proxy-cache
          key: kind-proxy-${{ runner.os }}-${{ hashFiles('test/e2e/kind/up.sh', 'test/e2e/kind/registry.sh', 'charts/koinon/values.yaml', 'hack/versions.env') }}

      - name: Restore drill (test/drill/run.sh)
        # A little below the job's 120: a hung drill is then a failed step, so the verdict step below sees it. A job
        # timeout would end as `cancelled`, which `red` must not count: a person or the concurrency group cancels too.
        timeout-minutes: 110
        env:
          OUT: ${{ runner.temp }}/drill
          KEEP: "0"
          DRILL_KEEP_CLUSTER: "1" # the workflow deletes the cluster in its own step, after collecting resource use
          HARNESS_PULL_REPO: ghcr.io/${{ github.repository }}/harnesses/opencode
          HARNESS_CACHE: ${{ runner.temp }}/harness-cache
          KIND_PROXY_CACHE: ${{ runner.temp }}/kind-proxy-cache
          GITHUB_TOKEN: ${{ github.token }}
        run: test/drill/run.sh 2>&1 | tee "$RUNNER_TEMP/drill.log"

      - name: Summary
        if: always()
        run: |
          {
            echo '## Restore drill on kind'
            echo
            if [ -s "$RUNNER_TEMP/drill/drill-result.json" ]; then
              jq -r '"RTO \(.timings.rtoSeconds) s, RPO \(.timings.rpoSeconds) s (recorded, no targets)", "", "| check | verdict | issue |", "|---|---|---|", (.checks[] | "| \(.name) | \(.verdict) | \(.issue // "") |")' "$RUNNER_TEMP/drill/drill-result.json"
            else
              echo 'No drill-result.json: the suite did not finish.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resource use
        if: always()
        run: |
          kubectl --context kind-koinon-e1 get pods -A -o wide || true
          docker stats --no-stream || true
          free -m

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: drill-logs
          path: |
            ${{ runner.temp }}/drill.log
            ${{ runner.temp }}/drill/
          retention-days: 14

      - name: Delete cluster
        if: always()
        run: test/e2e/kind/down.sh

      # Last step, after the cleanup: `job.status` is failure when any step above failed, the drill step's own
      # timeout included. A cancel of the whole run (a person, the concurrency group) is `cancelled`, not red.
      - name: Record the verdict
        id: verdict
        if: always()
        run: echo "red=${{ job.status == 'failure' }}" >> "$GITHUB_OUTPUT"

  # A red drill opens one issue (or comments on the open one), hack/drill-issue.sh (#572). A job of its own so that
  # only this one holds `issues: write`: the drill job runs the checked-out commit's code and never gets it.
  drill-issue:
    name: drill issue
    needs: drill
    # Only a red drill of the nightly schedule or of an rc tag push; never a dispatch on a branch (the commit may be
    # a work in progress, and the issue would be noise).
    if: >-
      always() && needs.drill.outputs.red == 'true'
      && (github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
    # Like `drill`, it must never change the run conclusion that hack/e2e-bisect.sh reads: a gh API error here
    # would otherwise turn a green quickstart's run red and start a false bisect.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # the drill-red issue
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DRILL_COMMIT: ${{ inputs.commit || github.sha }} # the commit the drill tested
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: hack/drill-issue.sh
