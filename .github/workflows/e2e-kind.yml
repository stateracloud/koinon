# SPDX-License-Identifier: Apache-2.0
#
# E1 quickstart e2e on kind (plan item E1): test/e2e/run.sh on a GitHub-hosted runner. Not on
# Blacksmith like the other workflows (ADR 0047): its kernel has no Landlock, which the OpenShell
# sandbox supervisor requires (issue #159). While the repository is private, where it spends the
# plan's included Actions minutes, it runs on manual dispatch and on pull requests that touch the
# paths the quickstart depends on most (ADR 0047 amendment); once it is public, it runs on every
# pull request to main and nightly. Calls no external service besides
# image and manifest downloads: the model is the fake model server and GitHub is the fake
# GitHub, both in the cluster.
name: e2e-kind

on:
  # The go suite on ready pull requests that change what runs in the installed system: startup
  # and flags, the chart, the control-plane services, migrations, the gateway and ledger, the
  # harness flavor, tracing, and the e2e itself. Regressions there only the full install catches
  # (#281 changed branch naming in githubtools; #284 a startup flag the chart's migrate Job lacked).
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - cmd/**
      - charts/**
      - internal/agentd/**
      - internal/api/**
      - internal/db/migrations/**
      - internal/execution/**
      - internal/gateway/**
      - internal/githubtools/**
      - internal/ledger/**
      - internal/reconciler/**
      - internal/services/**
      - internal/tracing/**
      - flavors/**
      - test/e2e/**
      - test/fakemodel/**
      - .github/workflows/e2e-kind.yml
  workflow_dispatch:
    inputs:
      suite:
        description: 'go: API-driven quickstart (test/e2e). web: the browser, Playwright against the real API (web/e2e-real, issue #50). Each needs its own install, so one per run.'
        type: choice
        options: [go, web]
        default: go

permissions:
  contents: read

concurrency:
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickstart:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        # Explicit bash adds -o pipefail, so `| tee` keeps the script's exit code.
        shell: bash
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KO_VERSION: 0.19.1
      KO_SHA256: 635ac6ea3fd376c935fee597fbb29ab2c2449f49ef1655085fe3aa9c25fed7a5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      # The web suite only: Node and pnpm for Playwright (same pins as the web job in ci.yml).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.suite == 'web'
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.suite == 'web'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Runner facts
        run: |
          set -x
          nproc; free -m; df -h /; uname -a
          cat /sys/kernel/security/lsm || true
          docker info --format '{{.ServerVersion}} {{.CgroupVersion}} {{.SecurityOptions}}'

      # The OpenShell sandbox supervisor refuses to start without Landlock ABI v3 (Linux 6.2+).
      # Fail here, in seconds, rather than as "sandbox not ready" minutes into the quickstart.
      - name: Kernel has Landlock
        run: |
          if ! grep -qw landlock /sys/kernel/security/lsm; then
            echo "::error::this runner's kernel ($(uname -r)) has no Landlock; OpenShell's sandbox supervisor needs it (issue #159)"
            exit 1
          fi

      - name: Install kind and ko
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $RUNNER_TEMP/bin/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kind"
          curl -fsSL -o "$RUNNER_TEMP/ko.tgz" \
            "https://github.com/ko-build/ko/releases/download/v${KO_VERSION}/ko_${KO_VERSION}_Linux_x86_64.tar.gz"
          echo "${KO_SHA256}  $RUNNER_TEMP/ko.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/ko.tgz" -C "$RUNNER_TEMP/bin" ko
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Quickstart e2e (kind, images, helm install, driver or browser)
        env:
          OUT: ${{ runner.temp }}/e2e
          SUITE: ${{ inputs.suite || 'go' }}
          # The workflow deletes the cluster in its own step, after collecting resource use.
          KEEP: "1"
        run: test/e2e/run.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Timings
        if: always()
        run: |
          {
            echo '## Quickstart e2e on kind'
            echo
            cat "$RUNNER_TEMP/e2e/quickstart-timings.md" 2>/dev/null || echo 'No timings: the driver did not finish.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resource use
        if: always()
        run: |
          kubectl --context kind-koinon-e1 get pods -A -o wide || true
          docker stats --no-stream || true
          free -m
          # Issue #159: what the runner's kernel offers the OpenShell sandbox supervisor.
          uname -a
          cat /sys/kernel/security/lsm 2>/dev/null; echo
          sysctl kernel.unprivileged_userns_clone user.max_user_namespaces kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          sudo dmesg | tail -n 200 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-kind-logs
          path: |
            ${{ runner.temp }}/e2e.log
            ${{ runner.temp }}/e2e/
          retention-days: 7

      - name: Delete cluster
        if: always()
        run: test/e2e/kind/down.sh
