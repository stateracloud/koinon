# SPDX-License-Identifier: Apache-2.0
#
# E1 quickstart e2e on kind (plan item E1): test/e2e/run.sh on a GitHub-hosted runner (ubuntu-24.04: its kernel has
# Landlock, which the OpenShell sandbox supervisor requires, old issue 159). It calls no external service besides image and manifest
# downloads: the model is the fake model server and GitHub is the fake GitHub, both in the cluster.
#
# When it runs (the `decide` job, hack/e2e-decide.sh):
#   - pull requests: when the full rule (hack/needs-e2e.sh) says the change is e2e-relevant, the PR
#     changes the e2e's own files or it carries the `e2e` label (read live, so `gh pr create --label e2e`
#     counts on `opened`). Relevance alone runs it, so a fork PR (which cannot label, dispatch or post
#     `e2e-lab`) can go green (issue #148). The label and an external run are
#     accelerators: the label forces a run for a change the rule thinks irrelevant, a green `e2e-lab`
#     satisfies `e2e result` once this run's quickstart has finished; if that quickstart
#     fails or is cancelled, hack/e2e-gate.sh still passes on the `e2e-lab` status or another run's quickstart.
#     Label events do not start this workflow (old issue 468): adding `e2e` later dispatches it
#     once on the head (e2e-label.yml, hack/e2e-label.sh), unless a run there is live or passed the
#     e2e. To retry a red e2e: "Re-run failed jobs", remove and add the label, or
#     `gh workflow run e2e-kind.yml --ref <branch>`.
#   - pushes to main: batched (one running, the newest pending) when anything e2e-relevant changed
#     since the last green run. Nightly: always, once a day, to catch drift nothing in the tree
#     explains (upstream images, the runner image, downloads). The nightly run also backs up and restores the
#     install (test/e2e/backup-restore.sh, the guide's own commands) and checks it came back. A red run after a green one opens
#     an issue naming the culprit merge (hack/e2e-bisect.sh): fix forward within 2 hours, else revert.
#   - manual dispatch, optionally on one commit (the bisect uses it).
# The `e2e result` job is the one to require: it passes when the e2e was skipped because nothing needed
# it, and for a pull request that needs one (hack/needs-e2e.sh) it fails until the head has a passing
# e2e: a quickstart job here or in a dispatched run on the head, or the `e2e-lab` commit status (an external e2e run that passed on this commit)
# (hack/e2e-gate.sh, old issue 562). Trust limit: `result` runs from this very file, so a PR can edit it to drop the
# gate; the guard is the ruleset's required review on `.github/**` (not CODEOWNERS), `e2e result` is not
# pinned to an app and anyone with write access can post `e2e-lab`: a guardrail against mistakes, not a
# malicious member (pinned integration_id: old issue 568).
name: e2e-kind
run-name: e2e-kind${{ inputs.commit && format(' ({0}) bisect {1}', inputs.commit, inputs.bisect_id) || '' }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue (#225): `e2e result` is required, so it reports on the queue's commit.
  # ADR 0094 decision 4: decide never starts the quickstart on a queue commit; `e2e result` checks the
  # queued pull request's head (number parsed from the queue ref) for evidence when the entry's own
  # diff (against merge_group.base_sha) is e2e-relevant.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'go: API-driven quickstart (test/e2e). web: the browser, Playwright against the real API (web/e2e-real, old issue 50). Each needs its own install, so one per run.'
        type: choice
        options: [go, web]
        default: go
      backup_restore:
        description: 'Also run the backup-and-restore step (test/e2e/backup-restore.sh, go suite only). The nightly run always does.'
        type: boolean
        default: false
      commit:
        description: 'Run on this full commit sha instead of the ref (used by hack/e2e-bisect.sh).'
        type: string
        default: ''
      bisect_id:
        description: 'The bisect run that dispatched this one; it is in the run name so the bisect finds exactly its runs.'
        type: string
        default: ''

permissions:
  contents: read

# Pull requests: a new push cancels the old run. Main: one running, one pending, the newest pending
# replaces the older (batching). Everything else (dispatch, nightly, a merge queue build) runs alone:
# a queue build is never cancelled (its group is its run id, cancel-in-progress is off for it).
concurrency:
  group: ${{ github.event_name == 'push' && 'e2e-main' || github.event_name == 'pull_request' && format('e2e-kind-pr-{0}', github.ref) || format('e2e-kind-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap: a checkout, a git diff, one `go list`.
  decide:
    # Not for drafts.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the last green run on main
      pull-requests: read # the PR's current labels
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
      required: ${{ steps.decide.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge bases, and the last green commit on main

      # The rule asks `go list` which packages the binaries build.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Does this run need the e2e?
        id: decide
        shell: bash # -eo pipefail
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Run the base branch's copy of the rule and the decision: a pull request must not be
          # able to change what decides whether it is tested. This PR's own copy only when the
          # base has none (the commit that introduces them). A merge queue build uses main as it was when
          # the entry was built (merge_group.base_sha), for the same reason.
          ref=""
          if [[ $EVENT == pull_request ]]; then ref="origin/$BASE"; elif [[ $EVENT == merge_group ]]; then ref="$MG_BASE"; fi
          for f in needs-e2e e2e-decide; do
            if [[ -n $ref ]] && git show "$ref:hack/$f.sh" > "$RUNNER_TEMP/$f.sh" 2>/dev/null; then
              echo "using hack/$f.sh from $ref"
            else
              cp "hack/$f.sh" "$RUNNER_TEMP/$f.sh"
            fi
            chmod +x "$RUNNER_TEMP/$f.sh"
          done
          NEEDS_E2E="$RUNNER_TEMP/needs-e2e.sh" "$RUNNER_TEMP/e2e-decide.sh"

  quickstart:
    needs: decide
    if: needs.decide.outputs.needed == 'true'
    permissions:
      contents: read
      packages: read # the flavor image CI's flavors job pushed to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        # Explicit bash adds -o pipefail, so `| tee` keeps the script's exit code.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }} # empty: the event's own ref

      - name: Tool versions (hack/versions.env)
        run: hack/versions-env.sh >> "$GITHUB_ENV"

      # cache: false, and an explicit cache with a fallback prefix: a new go.sum still starts from
      # the last build cache (main saves one per go.sum), which is most of the ko and driver builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Restored everywhere, saved only by pushes to main (below): a pull request, or a dispatch on
      # an arbitrary commit, can never write the cache that main's runs read.
      - id: e2ego
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: e2e-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            e2e-go-${{ runner.os }}-

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      # The web suite only: Node and pnpm for Playwright (same pins as the web job in ci.yml).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.suite == 'web'
        with:
          package_json_file: web/package.json

      - name: Node and pnpm (web suite)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.suite == 'web'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Runner facts
        run: |
          set -x
          nproc; free -m; df -h /; uname -a
          cat /sys/kernel/security/lsm || true
          docker info --format '{{.ServerVersion}} {{.CgroupVersion}} {{.SecurityOptions}}'

      # The OpenShell sandbox supervisor refuses to start without Landlock ABI v3 (Linux 6.2+).
      # Fail here, in seconds, rather than as "sandbox not ready" minutes into the quickstart.
      - name: Kernel has Landlock
        run: |
          if ! grep -qw landlock /sys/kernel/security/lsm; then
            echo "::error::this runner's kernel ($(uname -r)) has no Landlock; OpenShell's sandbox supervisor needs it (old issue 159)"
            exit 1
          fi

      - name: Install kind and ko
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256_AMD64}  $RUNNER_TEMP/bin/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kind"
          curl -fsSL -o "$RUNNER_TEMP/ko.tgz" \
            "https://github.com/ko-build/ko/releases/download/v${KO_VERSION}/ko_${KO_VERSION}_Linux_x86_64.tar.gz"
          echo "${KO_SHA256_AMD64}  $RUNNER_TEMP/ko.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/ko.tgz" -C "$RUNNER_TEMP/bin" ko
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The flavor image is built here when the pull below misses. The docker-container driver is
      # needed to import the layer cache the flavors job saved on main; this job only restores it
      # (a pull request never writes it, #145).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/flavor-cache
          key: flavors-${{ hashFiles('flavors/**') }}
          restore-keys: flavors-

      - name: Log in to GHCR (reads the flavor image; a miss falls back to building it)
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || true

      # A positive marker, read by hack/e2e-gate.sh (hack/e2e-gate-test.sh pins its name and `if`): only
      # the go suite (the default, also on pull_request, which has no inputs) counts as the e2e's evidence.
      - name: Go suite (marker for the e2e gate)
        if: (inputs.suite || 'go') == 'go'
        run: echo "suite=go"

      - name: Quickstart e2e (kind, images, helm install, driver or browser)
        env:
          OUT: ${{ runner.temp }}/e2e
          SUITE: ${{ inputs.suite || 'go' }}
          # The nightly run (and a dispatch that asks) backs up, restores and verifies the install after the
          # driver (ADR 0085 decision 18, #90); pull requests and pushes skip it to keep their run short.
          BACKUP_RESTORE: ${{ (github.event_name == 'schedule' || inputs.backup_restore) && (inputs.suite || 'go') == 'go' && '1' || '0' }}
          # The workflow deletes the cluster in its own step, after collecting resource use.
          KEEP: "1"
          # Pull the flavor image the flavors job pushed for this flavors/ tree, if there is one.
          FLAVOR_PULL_REPO: ghcr.io/${{ github.repository }}/flavors/opencode
          # A flavor build (the pull missed) imports the restored layer cache and authenticates the
          # Dockerfile's GitHub release downloads with the workflow token as a BuildKit secret.
          FLAVOR_CACHE: ${{ runner.temp }}/flavor-cache
          GITHUB_TOKEN: ${{ github.token }}
        run: test/e2e/run.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Timings
        if: always()
        run: |
          {
            echo '## Quickstart e2e on kind'
            echo
            cat "$RUNNER_TEMP/e2e/quickstart-timings.md" 2>/dev/null || echo 'No timings: the driver did not finish.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resource use
        if: always()
        run: |
          kubectl --context kind-koinon-e1 get pods -A -o wide || true
          docker stats --no-stream || true
          free -m
          # Old issue 159: what the runner's kernel offers the OpenShell sandbox supervisor.
          uname -a
          cat /sys/kernel/security/lsm 2>/dev/null; echo
          sysctl kernel.unprivileged_userns_clone user.max_user_namespaces kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          sudo dmesg | tail -n 200 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-kind-logs
          path: |
            ${{ runner.temp }}/e2e.log
            ${{ runner.temp }}/e2e/
          retention-days: 7

      - name: Delete cluster
        if: always()
        run: test/e2e/kind/down.sh

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.e2ego.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: e2e-go-${{ runner.os }}-${{ hashFiles('go.sum') }}

  # The one check to require. Passes when the e2e was skipped because nothing needed it (or a draft),
  # fails when it failed or was cancelled (the composite-check pattern). Fails too when a pull request
  # needs an e2e (decide's `required`) and its head has no passing one: neither a quickstart job in this
  # or another e2e-kind run nor the `e2e-lab` status (hack/e2e-gate.sh, old issue 562). A status event
  # starts no workflow, so a later e2e-lab or a dispatched run re-runs this job through
  # hack/e2e-rerun-result.sh (only that job, and only once the PR run has finished); by hand: "Re-run
  # failed jobs" on the pull request's e2e-kind run.
  result:
    name: e2e result
    needs: [decide, quickstart]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # re-run the pull request run's failed `e2e result` after a passing dispatched run
      pull-requests: read # the queued pull request's head sha (merge_group)
      statuses: read # hack/e2e-gate.sh reads the e2e-lab commit status; without it the API answers 403 (old issue 588)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail unless the e2e passed, was skipped, or is not needed
        shell: bash # -eo pipefail
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          DECIDE: ${{ needs.decide.result }}
          QUICKSTART: ${{ needs.quickstart.result }}
          REQUIRED: ${{ needs.decide.outputs.required }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # Merge queue (ADR 0094 decision 4): the queue commit has no e2e of its own. The evidence must be on
          # the head of the queued pull request, <N> from gh-readonly-queue/<base>/pr-<N>-<sha>. Fail closed.
          if [[ $EVENT == merge_group ]]; then
            n=${GITHUB_REF#refs/heads/gh-readonly-queue/*/pr-}
            n=${n%%-*}
            if [[ ! $n =~ ^[0-9]+$ ]]; then echo "::error::cannot read the pull request number from $GITHUB_REF"; exit 1; fi
            SHA=$(gh pr view "$n" --json headRefOid --jq .headRefOid)
            if [[ -z $SHA ]]; then echo "::error::cannot read the head of pull request $n"; exit 1; fi
            BRANCH=$(gh pr view "$n" --json headRefName --jq .headRefName)
            export SHA BRANCH
            echo "merge queue entry for pull request $n, head $SHA"
          fi
          # The base branch's copy of the gate, like decide: a pull request must not be able to
          # change what decides whether its e2e is enough. This PR's own copy only when the base has none.
          if [[ $EVENT == pull_request ]]; then git fetch --no-tags --depth=1 origin "$BASE"; fi
          if [[ $EVENT == merge_group ]]; then git fetch --no-tags --depth=1 origin "$MG_BASE"; fi
          if [[ $EVENT == pull_request ]] && git show "origin/$BASE:hack/e2e-gate.sh" > "$RUNNER_TEMP/e2e-gate.sh" 2>/dev/null; then
            echo "using hack/e2e-gate.sh from origin/$BASE"
          elif [[ $EVENT == merge_group ]] && git show "$MG_BASE:hack/e2e-gate.sh" > "$RUNNER_TEMP/e2e-gate.sh" 2>/dev/null; then
            echo "using hack/e2e-gate.sh from $MG_BASE"
          else
            cp hack/e2e-gate.sh "$RUNNER_TEMP/e2e-gate.sh"
          fi
          chmod +x "$RUNNER_TEMP/e2e-gate.sh"
          "$RUNNER_TEMP/e2e-gate.sh"

      # A dispatched run on a branch that passed: the pull request's red `e2e result` looks again.
      - name: Re-run the pull request's e2e result
        if: github.event_name == 'workflow_dispatch' && inputs.commit == '' && needs.quickstart.result == 'success'
        run: hack/e2e-rerun-result.sh "$GITHUB_SHA"

  # A red run on main: find the merge that did it and open one issue (hack/e2e-bisect.sh).
  bisect:
    needs: quickstart
    if: >-
      always() && needs.quickstart.result == 'failure'
      && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write # the issue naming the culprit
      actions: write # dispatches the e2e on each candidate
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: hack/e2e-bisect.sh
