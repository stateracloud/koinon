# SPDX-License-Identifier: Apache-2.0
#
# The `e2e` label added to a pull request starts e2e-kind once on its head, by dispatch (old issue 468).
# e2e-kind itself does not run on label events: `gh pr create --label e2e` fires `opened` and then
# `labeled`, and two runs on one head cancelled each other. Its `opened` run reads the labels live;
# this workflow covers the label added later. hack/e2e-label.sh decides: nothing when a run on the
# head runs or passed the e2e, a dispatch otherwise. A dispatch run reports its checks (`e2e
# result` among them) on the head commit, so the required check sees it.
name: e2e-label

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  dispatch:
    # Drafts get the e2e when they are marked ready (e2e-kind reads the label then). A fork's token
    # cannot dispatch.
    if: >-
      github.event.label.name == 'e2e' && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    # On the job, not the workflow: every label is its own `labeled` event, and a workflow-level
    # group would let another label (added with `e2e`, or during the wait) cancel the dispatcher.
    # A skipped job never joins the group. No cancelling: a second `e2e` event queues behind the
    # first and then finds the run that one dispatched.
    concurrency:
      group: e2e-label-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write # dispatch e2e-kind; read its runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: hack/e2e-label.sh
          sparse-checkout-cone-mode: false
      - name: Dispatch e2e-kind unless a run on the head covers it
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The base branch's copy, as e2e-kind's decide does; this PR's own only when the base has
          # none (the commit that introduces it).
          if git fetch -q --depth=1 origin "$BASE" && git show "FETCH_HEAD:hack/e2e-label.sh" > "$RUNNER_TEMP/e2e-label.sh" 2>/dev/null; then
            echo "using hack/e2e-label.sh from origin/$BASE"
          else
            cp hack/e2e-label.sh "$RUNNER_TEMP/e2e-label.sh"
          fi
          chmod +x "$RUNNER_TEMP/e2e-label.sh"
          "$RUNNER_TEMP/e2e-label.sh"
