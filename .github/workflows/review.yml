# SPDX-License-Identifier: Apache-2.0
#
# The `review` check (ADR 0103): a pull request that touches the sensitive paths (the `# Sensitive
# paths` section of .github/CODEOWNERS, `hack/claim.sh sensitive-paths`) needs the commit status
# `review-verdict` = success on its head, posted by a listed poster with hack/review-verdict.sh after an
# independent review of exactly that commit. Any other pull request passes. The logic is
# hack/review-gate.sh.
#
# No pull_request_target (#463, as claims.yml): GitHub blocks it by default for public repositories.
# The job runs on `pull_request` with a read-only token and no secret, and checks out main's tip at
# run time (`pull_request.base.ref`, the branch name; `branches: [main]` keeps it main) to run
# hack/review-gate.sh, hack/claim.sh and CODEOWNERS (the paths and the listed posters). Not
# `pull_request.base.sha`: that is the base recorded when the PR was opened or last pushed, so an old
# PR would run an old gate and an old poster list, or none. The pull request's code is never checked
# out or run. Those files are sensitive paths themselves, so a
# change to them needs a verdict too.
#
# Trade-off (ADR 0103 decision 3): on `pull_request` and `merge_group` this workflow file is the pull
# request's own, so a pull request could edit it to make `review` pass. The guard is the ruleset's
# CODEOWNERS approval, kept for `.github/**` only; the ruleset "required workflows" rule would run
# main's file instead. hack/pr-merge.sh --admin runs the base's gate itself.
#
# When it runs:
#   - pull requests: drafts are skipped (a skipped job counts as passed for a required check; a draft
#     cannot merge, and `ready_for_review` starts a new run).
#   - the merge queue: the queued pull request's head and files are judged; its number comes from the
#     queue ref, and its head must be a parent of the queue commit. The gate is the base's.
#   - pushes to main: passes (a required job reports on every pull request, push and merge_group build;
#     no workflow-level `paths:`).
# A status event starts no workflow, so hack/review-verdict.sh re-runs this job after it posts.
name: review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: review
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the pull request's files, and the queued pull request's head
      statuses: read # the review-verdict commit status; without it the API answers 403 (old issue 588)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Main's tip at run time (pull requests), the queue entry's base (merge_group: the previous queue
      # commit or main), main itself (push); never the pull request's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_sha || github.sha }}

      - name: Fail when sensitive paths changed and the head has no ready review verdict
        shell: bash # -eo pipefail
        env:
          EVENT: ${{ github.event_name }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # No gate in the checkout: pass only while main's tip has none either (the pull request that
          # adds the gate). Once main has it, a checkout without it is wrong: fail.
          if [[ ! -f hack/review-gate.sh ]]; then
            tip=$(git ls-remote origin refs/heads/main | cut -f1)
            if [[ ! $tip =~ ^[0-9a-f]{40}$ ]] || ! git fetch -q --no-tags --depth=1 origin "$tip"; then
              echo "::error::the checkout has no hack/review-gate.sh and main's tip cannot be read ('$tip')"
              exit 1
            fi
            if git cat-file -e "$tip:hack/review-gate.sh" 2>/dev/null; then
              echo "::error::the checkout has no hack/review-gate.sh but main (${tip:0:12}) has it; the gate did not run"
              exit 1
            fi
            echo "review: main (${tip:0:12}) has no hack/review-gate.sh yet (the pull request that adds it); nothing to check"
            exit 0
          fi
          hack/review-gate.sh
