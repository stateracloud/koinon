# SPDX-License-Identifier: Apache-2.0
#
# Spike S1 (docs/spikes/kind.md): OpenShell 0.1.5 on Agent Sandbox v1.0.7 in a
# single-node kind cluster on a GitHub-hosted runner. Draft: manual trigger
# only, never on push or pull request. Not yet run on GitHub.
name: spike-kind

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-kind
  cancel-in-progress: true

jobs:
  kind:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        # Explicit bash adds -o pipefail, so `| tee` keeps the script's exit code.
        shell: bash
    env:
      OPENSHELL_VERSION: v0.1.5
      OPENSHELL_CLI_SHA256: ca1ad6e6fbb4a6cd407e95763391b8ecff02912e7d9c467e7ca22696fe80af69
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tool versions (hack/versions.env)
        run: grep -E '^[A-Z]' hack/versions.env >> "$GITHUB_ENV"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Runner facts
        run: |
          set -x
          nproc; free -m; df -h /; uname -a
          cat /sys/kernel/security/lsm || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          docker info --format '{{.ServerVersion}} {{.CgroupVersion}} {{.SecurityOptions}}'

      - name: Install kind and OpenShell CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256_AMD64}$RUNNER_TEMP/bin/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kind"
          curl -fsSL -o "$RUNNER_TEMP/openshell.tgz" \
            "https://github.com/NVIDIA/OpenShell/releases/download/${OPENSHELL_VERSION}/openshell-x86_64-unknown-linux-musl.tar.gz"
          echo "${OPENSHELL_CLI_SHA256}  $RUNNER_TEMP/openshell.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/openshell.tgz" -C "$RUNNER_TEMP/bin" openshell
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Cluster, Agent Sandbox, OpenShell
        run: hack/spike/kind/up.sh 2>&1 | tee "$RUNNER_TEMP/up.log"

      - name: Sandbox smoke (exec echo ok, stdin round-trip)
        run: hack/spike/kind/smoke.sh 2>&1 | tee "$RUNNER_TEMP/smoke.log"

      - name: Resource use
        if: always()
        run: |
          kubectl --context kind-koinon-s1 top node || true
          kubectl --context kind-koinon-s1 top pod -A --sort-by=memory || true
          docker stats --no-stream || true
          free -m
          kubectl --context kind-koinon-s1 get pods -A -o wide || true

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-koinon-s1 get events -A --sort-by=.lastTimestamp | tail -50 || true
          kubectl --context kind-koinon-s1 -n openshell logs statefulset/openshell --tail=200 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-kind-logs
          path: |
            ${{ runner.temp }}/up.log
            ${{ runner.temp }}/smoke.log
          retention-days: 7

      - name: Delete cluster
        if: always()
        run: hack/spike/kind/down.sh
