# SPDX-License-Identifier: Apache-2.0
#
# Every commit in a pull request must carry a Signed-off-by trailer matching
# its author (Developer Certificate of Origin, ADR 0026). Use `git commit -s`.
# Dependabot is exempt: commits authored by `dependabot[bot]` with a
# `@users.noreply.github.com` email are skipped.
name: dco

on:
  pull_request:
  # The merge queue (#225): the required `dco` check must report on the queue's commit too.
  # The range is the entry's own commits (base_sha is the commit the entry was built on).
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          persist-credentials: false
      - name: check sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$c")"
            name="$(git show -s --format='%an' "$c")"
            email="$(git show -s --format='%ae' "$c")"
            if [ "$name" = "dependabot[bot]" ] && [[ "$email" == *@users.noreply.github.com ]]; then
              continue
            fi
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::commit $(git show -s --format='%h %s' "$c") lacks 'Signed-off-by: $author'"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Fix with: git commit --amend -s for an unpushed last commit; a pushed commit needs a force-push or a history rewrite: ask your human. Merge commits are exempt."
          fi
          exit $fail
