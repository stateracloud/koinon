# SPDX-License-Identifier: Apache-2.0
name: ci

# A draft pull request runs nothing heavy (hack/ci-skip-heavy.sh, from PR_DRAFT below): its `go` and
# `web` report success with "draft: not run". That green is vacuous, so the run says it is a draft, from
# the event payload (old issue 676): hack/lib/pr-verdict.sh drops runs whose `display_title` (`displayTitle`
# in `gh run list --json`) is `ci (draft)` (the run `name` stays `ci`), so between `gh pr ready` and the
# ready_for_review run the gates see no ci run and wait. A re-run replays the event, so keeps its label.
# A draft cannot be enqueued or merged, and the merge queue re-runs every required check.
run-name: ${{ github.event.pull_request.draft && 'ci (draft)' || 'ci' }}

on:
  # ready_for_review is not a default type: it runs the full suite on the same head when a draft is
  # marked ready (old issue 593).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The merge queue (#225): GitHub builds main plus the queued pull requests on a
  # gh-readonly-queue/* branch and waits for every required check on that commit. A required job must
  # report there too, so this workflow listens; hack/ci-skip-heavy.sh runs everything for it.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# One run per head (old issue 675). Runs never cancel each other through the group: the group is the PR head
# SHA (a push to main: its own SHA), cancel-in-progress is off. So a push followed by ready_for_review,
# or a re-run, on one head queue behind each other instead of killing a live run (a cancelled run reads
# as FAILED to hack/pr-wait.sh). GitHub keeps one running and one pending run per group; a third run
# on the same head replaces the pending one, which is fine: it is the same head and the same suite.
# A merge group build (the queue) has its own group per queue commit: queue builds never cancel one
# another (a cancelled required check would eject the entry and every entry behind it).
# Runs on an OLDER head of the pull request are cancelled by hack/ci-supersede.sh (first step of
# `changes`); a push to main never cancels or is cancelled. docs/dev/ci.md#one-run-per-head
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.event_name == 'merge_group' && format('ci-mq-{0}', github.sha) || format('ci-push-{0}', github.sha) }}
  cancel-in-progress: false

jobs:
  # Which parts of the tree a pull request touches, so the slow jobs run only when they can be
  # affected (Actions minutes are capped). Pushes to main run everything, except when the merge
  # commit's tree passed in the merge queue. A job skipped by its `if:` reports success,
  # so required checks still pass when it does not apply.
  #
  # hack/ci-skip-heavy.sh also switches every heavy output below to false (the go, web, generate,
  # chart, chartsmoke, escape and flavors jobs) in two cases, so the others are skipped: a draft pull request (`go` and `web` then report success with
  # "draft: not run"; marking it ready runs everything on the same head), and a push to main whose
  # tree a successful merge_group `ci` run already tested (the queue build). `changes`, `quick checks` (old issue 594) and flavor-publish always run; `scripts` and
  # `lint-shell` run except on that push to main (old issue 594). Read the script's header before changing this.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read rights: the pull request's head (hack/ci-supersede.sh), the check runs of its head and, for
    # go-test-lab (old issue 610), its commit statuses. Write on actions only to cancel older heads' runs (old issue 675).
    permissions:
      contents: read
      pull-requests: read # hack/ci-supersede.sh reads pulls/<n> for the current head
      checks: read
      statuses: read
      actions: write # hack/ci-supersede.sh cancels the runs of older heads (old issue 675)
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
      reason: ${{ steps.skip.outputs.reason }}
      go_test_lab: ${{ steps.lab.outputs.go_test_lab }}
      go_test_lab_reason: ${{ steps.lab.outputs.go_test_lab_reason }}
      flavors_publish: ${{ steps.paths.outputs.flavors_publish }}
      go: ${{ steps.paths.outputs.go }}
      web: ${{ steps.paths.outputs.web }}
      generate: ${{ steps.paths.outputs.generate }}
      chart: ${{ steps.paths.outputs.chart }}
      chartsmoke: ${{ steps.paths.outputs.chartsmoke }}
      escape: ${{ steps.paths.outputs.escape }}
      flavors: ${{ steps.paths.outputs.flavors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # hack/ci-changes.sh asks `go list` for the packages the flavors suite builds.
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Cancel runs of older heads of this pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_ID: ${{ github.run_id }}
        run: hack/ci-supersede.sh
      - id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          hack/ci-skip-heavy.sh decide >"$RUNNER_TEMP/skip.txt"
          tee -a "$GITHUB_OUTPUT" <"$RUNNER_TEMP/skip.txt"
      - id: paths
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          SKIP: ${{ steps.skip.outputs.skip }}
        run: |
          hack/ci-changes.sh "$BASE" >"$RUNNER_TEMP/changes.txt"
          # No pipe: a failing step must fail the job, not leave outputs empty (empty reads as "nothing to gate").
          hack/ci-skip-heavy.sh apply <"$RUNNER_TEMP/changes.txt" >"$RUNNER_TEMP/outputs.txt"
          tee -a "$GITHUB_OUTPUT" <"$RUNNER_TEMP/outputs.txt"
      # go-test satisfied by an external run (old issue 610): a ready pull request whose head has the commit status
      # go-test-lab = success (an external go-test run that passed on exactly this head) does not run go-test on the runner; the
      # `go` gate accepts that skip. No status, a draft, a push or an API error: go-test runs as before.
      # Trust limit as for e2e-lab (old issue 568): anyone with write access can post the status, and this job
      # runs from the pull request's own ci.yml; the guard is the required review on .github/**.
      - id: lab
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP: ${{ steps.skip.outputs.skip }}
        run: |
          hack/ci-skip-heavy.sh lab >"$RUNNER_TEMP/lab.txt"
          tee -a "$GITHUB_OUTPUT" <"$RUNNER_TEMP/lab.txt"

  # The Go checks run as parallel jobs (old issue 217). They share one module and build cache
  # (`go-ci-...`), keyed on the Go version and go.sum. No Go job saves it: `warm-caches` does, on every
  # push to main, so a pull request starts from main's entry (docs/dev/ci.md#cache-ownership). A job that
  # builds little can therefore never fill the entry first and leave go-test and go-race with nothing
  # compiled. go-race adds -race objects the cache does not hold. `go vet` is not a job of its own:
  # golangci-lint's `standard` set runs govet. Each job is its own check. `go` below aggregates them
  # and keeps the required check name stable: branch protection names `go`, not the parts.
  go-tidy:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: go-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  go-lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: go-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          skip-save-cache: true # warm-caches on main saves it

  # Skipped (and accepted by `go`) when the pull request head has a green go-test-lab status (old issue 610).
  go-test:
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.go_test_lab != 'true'
    name: go-test
    runs-on: ubuntu-latest
    # packages: read pulls the private GHCR copy of the agentgateway test image (#238, docs/dev/ci.md).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The chart contract test (test/chartsmoke) renders the chart; same pin as the chart jobs.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      # The agentgateway suites start the chart's digest from this repository owner's GHCR copy
      # (internal/testing/agentgatewayimage, #238). Pulled once here; the tests then find it locally.
      # A fork's own CI, which cannot read the copy, warns and leaves the tests on the chart's repository.
      - name: agentgateway test image
        uses: ./.github/actions/agentgateway-test-image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # Postgres tests use testcontainers; Docker is available on ubuntu runners.
      # test/flavors needs the flavor images, which the flavors job builds and tests.
      - run: hack/go-test.sh
        env:
          KOINON_REQUIRE: docker,git,helm # a missing prerequisite must fail, not skip (old issue 507): Postgres suites need Docker, agentd and codehost git, gateway/standalone helm (installed by this job)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-reports
          path: reports/go/*.xml
          if-no-files-found: warn
          retention-days: 30

  go-race:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: go-race
    runs-on: ubuntu-latest
    # packages: read pulls the agentgateway test image the ledger suite starts (as in go-test).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: agentgateway test image
        uses: ./.github/actions/agentgateway-test-image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # The concurrent packages run under the race detector (docs/dev/ci.md#the-race-detector): the
      # reconciler runs per-sandbox jobs concurrently (LT1), agentd, ledger and durable hold shared
      # state behind locks and channels. Each is a Ginkgo suite, so ginkgo writes one testcase per
      # spec to the report. The reconciler and the ledger share fixed state and run one process; agentd and durable
      # are parallel suites (see hack/go-test.sh) and run with -p, as in go-test. hack/go-test-test.sh keeps the lists whole.
      - run: mkdir -p reports/go && go tool ginkgo -race --keep-going --procs=1 --junit-report=go-race-serial.xml --output-dir=reports/go ./internal/reconciler/ ./internal/ledger/
        env:
          KOINON_REQUIRE: docker
      - if: ${{ !cancelled() }}
        run: go tool ginkgo -race -p --keep-going --junit-report=go-race-parallel.xml --output-dir=reports/go ./internal/agentd/ ./internal/durable/
        env:
          KOINON_REQUIRE: docker
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-race-reports
          path: reports/go/*.xml
          if-no-files-found: warn
          retention-days: 30

  # The required check `go`: green when every Go job above is green, or when the change touches no
  # Go (then the parts are skipped and `changes` says so). A skipped part of a Go change is a
  # failure, so a skipped job cannot pass the gate. hack/ci-go-gate-test.sh keeps this list whole.
  go:
    name: go
    needs: [changes, go-tidy, go-lint, go-test, go-race]
    # Not on a push to main whose heavy jobs were switched off (old issue 595): the check then reports skipped
    # and hack/release-gate.sh reads the merged pull request's head instead.
    if: ${{ !cancelled() && !(github.event_name == 'push' && needs.changes.outputs.skip == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          GO: ${{ needs.changes.outputs.go }}
          SKIP: ${{ needs.changes.outputs.skip }}
          REASON: ${{ needs.changes.outputs.reason }}
          EVENT: ${{ github.event_name }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          GO_TEST: ${{ needs.go-test.result }}
          LAB: ${{ needs.changes.outputs.go_test_lab }}
          LAB_REASON: ${{ needs.changes.outputs.go_test_lab_reason }}
        run: |
          [[ $CHANGES == success ]] || { echo "::error::changes job: $CHANGES"; exit 1; }
          # A draft runs nothing: report success with a visible note. A skipped required check is green
          # anyway; no gate reads a draft's green (the queue re-runs every required check).
          if [[ $SKIP == true && $EVENT == pull_request ]]; then
            echo "draft: not run ($REASON); mark it ready for review to run the Go checks"
            echo "### go: draft: not run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ $GO == true ]] || { echo "no Go changes, or the heavy jobs are off (skip=$SKIP: $REASON): nothing to gate"; exit 0; }
          # go-test skipped because an external run proved it (old issue 610): that one skip counts as success. Any other
          # skipped part stays a failure, and so does a go-test skip with no green lab status.
          if [[ $GO_TEST == skipped && $LAB == true ]]; then
            echo "go-test passed in an external run: $LAB_REASON"
            RESULTS=${RESULTS/skipped/success}
          fi
          for r in $RESULTS; do
            [[ $r == success ]] || { echo "::error::a Go job finished $r (results: $RESULTS)"; exit 1; }
          done

  # The short checks in one job (old issue 594). Every job pays a fixed start-up cost (runner, checkout,
  # toolchain) and each of these did about 10 s of work, so five jobs (proto, migrations, adr-lint,
  # claim-tests, dependency age) paid it five times for under one minute of work. The steps run one after another and each
  # runs even when an earlier one failed (!cancelled()), so one run still shows every failure, as
  # five jobs did. Needs nothing, so it starts at once; always runs, also on drafts and on a push to
  # main with skip=true (a few seconds of work).
  #
  # Required check `quick checks` replaces `proto`, `migrations`, `adr-lint`, `claim-tests` and
  # `dependency age` (hack/ci-required.txt). The dependency age steps run on pull requests only
  # (rulesets only check pull request heads). Dependency cooldown (ADR 0079): versions this pull
  # request adds must be at least 3 days old. Public endpoints only. The waiver is the label
  # `dependency-age-waiver`, honoured only when the maintainer put it on; the step reads the label
  # when it runs, so re-run the job after labelling. Timestamps guard against accidents, they are
  # not proof.
  quick-checks:
    name: quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: load tool versions
        run: hack/versions-env.sh >> "$GITHUB_ENV"
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}
          checksum: ${{ env.BUF_SHA256_AMD64 }}
      - name: proto (buf lint)
        run: buf lint
      - name: proto (buf breaking)
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          # merge_group: the base tip this entry lands on (ADR 0094 decision 4). pull_request: the
          # merge base of the head and origin/<base> (#542), so a PR behind a proto change on main
          # is not told it "deleted" fields it never had.
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ $EVENT_NAME == merge_group ]]; then
            against=$(hack/buf-breaking-against.sh "$BASE" --merge-group)
          else
            against=$(hack/buf-breaking-against.sh "$BASE")
          fi
          echo "buf breaking against $against"
          if git cat-file -e "$against:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#ref=$against"
          else
            echo "no buf.yaml on $against yet; nothing to compare"
          fi
      - name: migrations (tests)
        if: ${{ !cancelled() }}
        run: hack/migrate-lint-test.sh
      - name: migrations (lint)
        if: ${{ !cancelled() }}
        env:
          # Through env, not spliced into the script: the base branch name is user-chosen text (#58 review).
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: hack/migrate-lint.sh ${BASE:+"$BASE"}
      # ADR numbers unique and contiguous, README index in sync (hack/adr-lint.sh, ADR 0082).
      - name: adr-lint (tests)
        if: ${{ !cancelled() }}
        run: hack/adr-lint-test.sh
      - name: adr-lint
        if: ${{ !cancelled() }}
        run: hack/adr-lint.sh
      # Offline unit tests of hack/claim.sh. The live tests need a scratch repository and never run
      # here: CI must not mutate GitHub.
      - name: claim-tests
        if: ${{ !cancelled() }}
        run: hack/claim_test.sh
      - name: claim-tests (migrate-renumber)
        if: ${{ !cancelled() }}
        run: hack/migrate-renumber-test.sh
      # Conventional Commits subjects of the pull request's non-merge commits (AGENTS.md
      # "Conventions"); Dependabot and merge commits are exempt.
      - name: commit subjects (tests)
        if: ${{ !cancelled() }}
        run: hack/commit-subject-check-test.sh
      - name: commit subjects
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: hack/commit-subject-check.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      # Author and committer of every commit, merge commits included, must be in
      # hack/git-identities.allowed (koinon#320).
      - name: commit identities (tests)
        if: ${{ !cancelled() }}
        run: hack/git-identity-check-test.sh
      - name: commit identities
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: hack/git-identity-check.sh range "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - id: waiver
        name: dependency age (waiver)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
        # Waivers outside the security fast path are the maintainers' (ADR 0079). The approvers are
        # the GitHub handles in the table of MAINTAINERS.md, read from the base branch so that a
        # pull request cannot add itself.
        run: |
          label=dependency-age-waiver
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' | grep -qx "$label"; then
            # Both the file and the parser come from the base branch.
            approvers=$(bash <(git show "origin/$BASE:hack/waiver-approvers.sh") <(git show "origin/$BASE:MAINTAINERS.md"))
            [[ -n $approvers ]] || { echo "::error::no maintainer handles found in the table of MAINTAINERS.md on $BASE"; exit 1; }
            actor=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/events" \
              --jq "[.[] | select(.event == \"labeled\" and .label.name == \"$label\")] | last | .actor.login // empty" | tail -n1)
            if [[ -n $actor ]] && grep -qixF "$actor" <<<"$approvers"; then
              echo "label $label was added by $actor: age failures are waived and listed below"
              echo "by=$actor" >>"$GITHUB_OUTPUT"
            else
              echo "::error::label $label was added by '${actor:-unknown}', not by a maintainer listed in MAINTAINERS.md ($(tr '\n' ' ' <<<"$approvers")); it does not waive anything"
            fi
          fi
      - name: dependency age (versions are at least 3 days old)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEP_AGE_WAIVER: ${{ steps.waiver.outputs.by }}
          BASE: origin/${{ github.base_ref }}
        run: hack/dep-age-check.sh "$BASE"

  # The web checks run as parallel jobs (old issue 218), each its own check; `web` below aggregates them and
  # keeps the required check name stable.
  web-lint:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: web-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  web-test:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: web-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Playwright builds the app once and serves the build with `vite preview` (KOINON_PW_PREVIEW, see
  # web/playwright.config.ts), on 2 workers. The API is faked in the browser; E1 covers the real path.
  # The browser download is cached by @playwright/test version; system libraries are installed on
  # every run (cheap), the browser binary only on a cache miss.
  # ubuntu-24.04: ubuntu-latest is migrating to 26.04 (actions/runner-images#14748); install-deps
  # was failing on the new image. Pin until warm-caches-web and the cache key also name the image.
  web-e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: web-e2e
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"
      - id: pwcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      # apt through Playwright needs the same retries as Dockerfiles (docs/dev/ci.md, #149 / #141).
      # Always --with-deps: install-deps alone was exiting 1 on cache hits (ubuntu-latest→26 and
      # ubuntu-24.04). With a warm browser cache the download is a no-op; apt still runs.
      - name: playwright chromium
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAPT::Update::Error-Mode "any";\n' | sudo tee /etc/apt/apt.conf.d/80-koinon-retries >/dev/null
          pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vite build
      - run: pnpm test:e2e
        env:
          KOINON_PW_PREVIEW: "1"

  # The required check `web`: green when every web job above is green, or when the change touches no
  # web code (then the parts are skipped and `changes` says so). A skipped part of a web change is a
  # failure. hack/ci-web-gate-test.sh keeps this list whole.
  web:
    name: web
    needs: [changes, web-lint, web-test, web-e2e]
    # Not on a push to main whose heavy jobs were switched off (old issue 595): the check then reports skipped
    # and hack/release-gate.sh reads the merged pull request's head instead.
    if: ${{ !cancelled() && !(github.event_name == 'push' && needs.changes.outputs.skip == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          WEB: ${{ needs.changes.outputs.web }}
          SKIP: ${{ needs.changes.outputs.skip }}
          REASON: ${{ needs.changes.outputs.reason }}
          EVENT: ${{ github.event_name }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          [[ $CHANGES == success ]] || { echo "::error::changes job: $CHANGES"; exit 1; }
          # A draft runs nothing: report success with a visible note. A skipped required check is green
          # anyway; no gate reads a draft's green (the queue re-runs every required check).
          if [[ $SKIP == true && $EVENT == pull_request ]]; then
            echo "draft: not run ($REASON); mark it ready for review to run the web checks"
            echo "### web: draft: not run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ $WEB == true ]] || { echo "no web changes, or the heavy jobs are off (skip=$SKIP: $REASON): nothing to gate"; exit 0; }
          for r in $RESULTS; do
            [[ $r == success ]] || { echo "::error::a web job finished $r (results: $RESULTS)"; exit 1; }
          done

  generate:
    needs: changes
    if: needs.changes.outputs.generate == 'true'
    name: generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The one Go cache (go-ci), saved by warm-caches on main; restore only here.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: load tool versions
        run: hack/versions-env.sh >> "$GITHUB_ENV"
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}
          checksum: ${{ env.BUF_SHA256_AMD64 }}
      - run: make web-deps generate
      - name: no diff after make generate
        run: |
          git add -N .
          git diff --exit-code || { echo "run 'make generate' and commit the result"; exit 1; }

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    name: chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The one Go cache (go-ci), saved by warm-caches on main; restore only here.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      # helm lint, helm template for each mode and kubeconform; render only, no cluster.
      - run: make chart-check

  # Rendered startup smoke test (old issue 284): the chart's Jobs and Deployments run as containers, with
  # the rendered args, env and mounts, against Postgres and envtest. See test/chartsmoke. Required:
  # a run skipped because no chart file changed reports success.
  chart-smoke:
    needs: changes
    if: needs.changes.outputs.chartsmoke == 'true'
    name: chart smoke
    runs-on: ubuntu-latest
    # Above the test's own timeouts (go test 20m, ginkgo 15m), so a hang fails the test and cleans up.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The one Go cache (go-ci), saved by warm-caches on main; restore only here.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      # setup-envtest downloads the API server binaries into this directory; Go's own caches come
      # from setup-go.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-1.37.0
      - run: make test-chart-smoke

  # Escape suite, admission part (plan item E2): the chart's ValidatingAdmissionPolicies against
  # envtest's API server. The OpenShell cases need a gateway and run on kind (make test-escape-kind, and in the kind e2e).
  escape-admission:
    needs: changes
    if: needs.changes.outputs.escape == 'true'
    name: escape (admission)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The one Go cache (go-ci), saved by warm-caches on main; restore only here.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: make test-admission

  # shellcheck over every tracked shell script (the set hack/preflight.sh's shell gate uses)
  # and actionlint over the workflows (actionlint also runs shellcheck on the
  # `run:` blocks). Its own job, not a step of `scripts`: it needs no Go toolchain and is cheap, and it
  # keeps the lint result separate from the script tests. Both tools are release binaries checked
  # against a pinned SHA-256, versions at least 3 days old when pinned (ADR 0079; shellcheck 0.11.0 is
  # from 2025-08-04, actionlint 1.7.12 from 2026-03-30). Bump them together with hack/preflight.sh's use.
  # Skipped like `go` on a push to main whose heavy jobs are off (old issue 594): the pull request head passed it.
  lint-shell:
    name: lint-shell
    needs: changes
    # !cancelled() and no outputs-based gate on the way in: when `changes` itself fails, this still
    # runs (empty output is not 'true'), so a red `changes` cannot turn this check into a skip.
    if: ${{ !cancelled() && !(github.event_name == 'push' && needs.changes.outputs.skip == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tool versions (hack/versions.env)
        run: hack/versions-env.sh >> "$GITHUB_ENV"
      - uses: ./.github/actions/fetch-pinned
        with:
          name: shellcheck
          url: https://github.com/koalaman/shellcheck/releases/download/v${{ env.SHELLCHECK_VERSION }}/shellcheck-v${{ env.SHELLCHECK_VERSION }}.linux.x86_64.tar.xz
          sha256: ${{ env.SHELLCHECK_SHA256_AMD64 }}
          dest: ${{ runner.temp }}/pinned/shellcheck.tar.xz
      - uses: ./.github/actions/fetch-pinned
        with:
          name: actionlint
          url: https://github.com/rhysd/actionlint/releases/download/v${{ env.ACTIONLINT_VERSION }}/actionlint_${{ env.ACTIONLINT_VERSION }}_linux_amd64.tar.gz
          sha256: ${{ env.ACTIONLINT_SHA256_AMD64 }}
          dest: ${{ runner.temp }}/pinned/actionlint.tar.gz
      - name: install shellcheck and actionlint
        run: |
          bin="$RUNNER_TEMP/lintbin"
          mkdir -p "$bin"
          tar xJf "$RUNNER_TEMP/pinned/shellcheck.tar.xz" --strip-components=1 -C "$bin" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          tar xzf "$RUNNER_TEMP/pinned/actionlint.tar.gz" -C "$bin" actionlint
          echo "$bin" >>"$GITHUB_PATH"
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: actionlint
        run: actionlint

  # Tests of the e2e tooling scripts: the decision rule (needs the Go toolchain for `go list`) and
  # the remote runner (needs flock, so Linux).
  # Skipped like `go` on a push to main whose heavy jobs are off (old issue 594); see lint-shell.
  scripts:
    name: scripts
    needs: changes
    if: ${{ !cancelled() && !(github.event_name == 'push' && needs.changes.outputs.skip == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The one Go cache (go-ci), saved by warm-caches on main; restore only here.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - run: hack/needs-e2e-test.sh
      - run: hack/e2e-commands-check.sh
      - name: flavor-tag-test (needs a UTF-8 locale with its own collation)
        run: |
          sudo locale-gen en_US.UTF-8
          hack/flavor-tag-test.sh
      - run: hack/koinon-fetch-test.sh
      - run: hack/fetch-pinned-test.sh
      - run: hack/pinned-download-lint.sh
      - run: hack/apt-retries-test.sh --self-test
      - run: hack/apt-retries-test.sh
      - run: hack/e2e-remote-test.sh
      - run: hack/versions-check-test.sh
      - run: hack/versions-check.sh
      - run: hack/pr-wait-test.sh
      - run: hack/pr-merge-test.sh
      - run: hack/ci-fail-test.sh
      - run: hack/ci-go-gate-test.sh
      - run: hack/ci-web-gate-test.sh
      - run: hack/ci-required-test.sh
      - run: hack/go-test-test.sh
      - run: hack/go-test-host-test.sh
      - run: hack/repo-contract-test.sh
      - run: hack/wt-test.sh
      - run: hack/tmp-safety-test.sh
      - run: hack/wt-install-test.sh
      - run: hack/notes-expiry-test.sh
      - run: hack/mktemp-lint-test.sh
      - run: hack/mktemp-lint.sh
      - run: hack/runner-lint-test.sh
      - run: hack/runner-lint.sh
      - run: hack/old-issue-refs-lint-test.sh
      - run: hack/old-issue-refs-lint.sh
      - run: hack/audit-batch-lint-test.sh
      - run: hack/audit-batch-lint.sh
      - run: hack/bash5-lint-test.sh
      - run: hack/bash5-lint.sh
      - run: hack/ship-test.sh
      - run: hack/preflight-test.sh
      - run: hack/agentgateway-pin-test.sh
      - run: hack/agentgateway-pin.sh --check
      - run: hack/golangci-lint-test.sh
      - run: hack/preflight-stop-test.sh
      - run: hack/e2e-decide-test.sh
      - run: hack/e2e-bisect-test.sh
      - run: hack/hooks/agent-spawn-check_test.sh
      - run: hack/hooks/read-hooks_test.sh
      - run: hack/agent-state-test.sh
      - run: hack/release-gate-test.sh
      - run: hack/route-guard-test.sh
      - run: hack/dep-age-check-test.sh
      - run: hack/buf-breaking-against-test.sh
      - run: hack/ci-changes-test.sh
      - run: hack/paths-test.sh
      - run: hack/lane-gates-test.sh
      - run: hack/ci-skip-heavy-test.sh
      - run: hack/ci-supersede-test.sh
      - run: hack/ci-concurrency-test.sh
      - run: hack/ci-merge-group-test.sh
      - run: hack/ci-cache-test.sh
      - run: hack/chart-check-test.sh

  # Main owns every CI cache (docs/dev/ci.md#cache-ownership, old issue 147). A pull request can read
  # its own and main's caches only, and `go-test` and the other jobs now restore without saving, so
  # this job fills them on every push to main. It is never skipped by `changes`: hack/ci-skip-heavy.sh
  # skips the heavy jobs on a push whose tree the merge queue already tested, which used to
  # leave main without fresh entries. Per cache: `lookup-only` restore (no download), work and save
  # only on a miss. Advisory: it reports on pushes only, so it cannot gate a pull request.
  # hack/ci-cache-test.sh keeps the keys here and in the restoring jobs identical.
  warm-caches:
    name: warm-caches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          lookup-only: true
      # Modules, then every package and every test binary (the objects go-test, go-race, go-lint and
      # the chart jobs compile), without running a test.
      - if: steps.gocache.outputs.cache-hit != 'true'
        run: |
          go mod download
          go build ./...
          go test -count=1 -run '^$' ./...
      - if: steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      # The golangci-lint cache is keyed on a time interval (cache-invalidation-interval, 7 days) as well as
      # go.mod, so it must be refreshed on every push to main, not only when go-ci missed. The action
      # skips the save on an exact hit and downloads modules itself when go-ci was only looked up.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # The envtest API server binaries; the key is the Makefile's ENVTEST_K8S_VERSION.
      - id: envtestcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-1.37.0
          lookup-only: true
      - if: steps.envtestcache.outputs.cache-hit != 'true'
        run: make envtest-assets
      - if: steps.envtestcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-1.37.0

  # pnpm stores, one job per lockfile (no matrix: hack/ci-required-test.sh cannot name matrix checks), each
  # with the cache-dependency-path the consuming jobs use: setup-node hashes the listed files into its
  # key, so a combined list would never match a consumer. setup-node saves the store after a job that
  # missed it, so installing is all a job does. `warm-caches-web` also warms the Playwright browser, by
  # @playwright/test version (the key web-e2e restores). Never skipped by `changes`.
  warm-caches-web:
    name: warm-caches-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # The Playwright browser, by @playwright/test version (the key web-e2e restores).
      - id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"
        working-directory: web
      - id: pwcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
          lookup-only: true
      - if: steps.pwcache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
        working-directory: web
      - if: steps.pwcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

  # Flavor contract suite (plan item E3, old issue 76): the flavor image is built from this
  # tree (tags are per source tree, hack/flavor-tag.sh) and driven over ACP in Docker as
  # OpenShell would. The suite talks to an in-process fake model server and a fake MCP server with
  # a fake key; it never reaches a real or paid model. The only advisory job on pull requests (hack/ci-required.txt); flavor-publish below is push-only.
  flavors:
    needs: changes
    if: needs.changes.outputs.flavors == 'true'
    name: flavors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The flavor image, the builder's own store and the layer cache outgrow the runner's disk
      # (the first run died with "no space left on device"); drop what the job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The one Go cache (go-ci), saved by warm-caches on main; restore only here.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      # The docker-container driver is needed for the local layer cache below; --load still puts
      # the images in the runner's Docker store, where the suite looks for them.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Restored everywhere, saved only by pushes to main (the save step below), so a pull request
      # never writes the cache main reads (#145). The key is the build inputs' hash; a changed input
      # starts from the newest older entry through the restore prefix.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: flavorcache
        with:
          path: ${{ runner.temp }}/flavor-cache
          key: flavors-${{ hashFiles('flavors/**') }}
          restore-keys: flavors-
      # GITHUB_TOKEN authenticates the Dockerfile's GitHub release downloads as a BuildKit secret
      # (make flavors passes it); anonymous downloads intermittently fail from shared runner IPs.
      - run: make flavors FLAVOR_CACHE=${{ runner.temp }}/flavor-cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: go test -count=1 ./test/flavors/...
        env:
          KOINON_REQUIRE: docker
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.flavorcache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/flavor-cache
          key: flavors-${{ hashFiles('flavors/**') }}

  # On main only: publish the flavor image under its content tag (hack/flavor-tag.sh) so the kind
  # e2e pulls it instead of building it. A separate job, so only it holds packages: write and
  # pull requests never do. The layer cache the flavors job just saved makes the build a cache hit.
  flavor-publish:
    name: flavor-publish
    needs: [changes, flavors]
    # Always runs on main when the flavors changed, also when the flavors job was switched off because
    # the merge queue already ran this tree (ADR 0094 amendment): publishing is not a test. A failed or
    # cancelled flavors job still stops it. flavors_publish is the value before the switch.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.flavors_publish == 'true' && (needs.flavors.result == 'success' || needs.flavors.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: flavorcache
        with:
          path: ${{ runner.temp }}/flavor-cache
          key: flavors-${{ hashFiles('flavors/**') }}
          restore-keys: flavors-
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Push ghcr.io/<repo>/flavors/opencode:<content tag>
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag=$(hack/flavor-tag.sh opencode)
          image="ghcr.io/$REPO/flavors/opencode:$tag"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "$image already exists"
            exit 0
          fi
          secret=()
          [[ -z ${GITHUB_TOKEN:-} ]] || secret=(--secret "id=github_token,env=GITHUB_TOKEN")
          # The new cache goes to its own directory (buildx must not read and write one), then
          # replaces the restored one for the save step below.
          docker buildx build --push --build-context common=flavors/common "${secret[@]}" \
            --cache-from "type=local,src=$RUNNER_TEMP/flavor-cache/opencode" \
            --cache-to "type=local,dest=$RUNNER_TEMP/flavor-cache-new/opencode,mode=max" \
            --tag "$image" flavors/opencode
          rm -rf "$RUNNER_TEMP/flavor-cache"
          mv "$RUNNER_TEMP/flavor-cache-new" "$RUNNER_TEMP/flavor-cache"
          echo "cache_written=true" >>"$GITHUB_OUTPUT"
      # Main saves what its builds wrote: this job builds on every main push that changes the
      # flavors, also the ones where the flavors job was skipped (#595).
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.build.outputs.cache_written == 'true' && steps.flavorcache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/flavor-cache
          key: flavors-${{ hashFiles('flavors/**') }}
      # The escape suite's probe image (#482), pushed under its content tag (hack/probe-tag.sh) so the
      # kind e2e pulls it and runs no apt step. Its base is the OpenCode flavor's pinned BASE.
      - name: Push ghcr.io/<repo>/spike-probe:<content tag>
        continue-on-error: true # a miss only means the e2e builds the probe itself
        env:
          REPO: ${{ github.repository }}
        run: |
          tag=$(hack/probe-tag.sh)
          image="ghcr.io/$REPO/spike-probe:$tag"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "$image already exists"
            exit 0
          fi
          base=$(sed -n 's/^ARG BASE=//p' flavors/opencode/Dockerfile | head -n 1)
          docker buildx build --push --build-arg "BASE=$base" --tag "$image" hack/spike/probe
