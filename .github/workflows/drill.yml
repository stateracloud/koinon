# SPDX-License-Identifier: Apache-2.0
#
# The automated restore drill (ADR 0109, #514), advisory. Its own workflow, not a job of e2e-kind.yml: a red
# nightly drill must not turn the e2e-kind.yml run red, because hack/e2e-bisect.sh judges the run conclusion of
# that workflow to find the last green main. It runs on the nightly schedule, on rc tags (v*-rc.*) and on dispatch.
# It is never a pull request or merge queue check, so it can never be required (hack/ci-required.txt).
name: drill

on:
  push:
    tags: ['v*-rc.*']
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Run the drill on this commit (default: the branch tip).'
        required: false
permissions:
  contents: read

concurrency:
  group: drill-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # Advisory: nightly, on rc tags and on dispatch. A red
  # check that is not a declared known gap (label known-gap, message "known gap: #N") turns this job red; the
  # known gaps stay red in the report and do not. Never required, never a queue check.
  drill:
    name: drill
    permissions:
      contents: read
      packages: read # the flavor image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}

      - name: Tool versions (hack/versions.env)
        run: hack/versions-env.sh >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: e2e-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            e2e-go-${{ runner.os }}-

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Kernel has Landlock
        run: |
          if ! grep -qw landlock /sys/kernel/security/lsm; then
            echo "::error::this runner's kernel ($(uname -r)) has no Landlock; OpenShell's sandbox supervisor needs it (old issue 159)"
            exit 1
          fi

      - name: Download kind and ko (hack/fetch-pinned.sh)
        run: |
          hack/fetch-pinned.sh "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" "$KIND_SHA256_AMD64" "$RUNNER_TEMP/bin/kind"
          hack/fetch-pinned.sh "https://github.com/ko-build/ko/releases/download/v${KO_VERSION}/ko_${KO_VERSION}_Linux_x86_64.tar.gz" "$KO_SHA256_AMD64" "$RUNNER_TEMP/ko.tgz"
      - name: Install kind and ko
        run: |
          chmod +x "$RUNNER_TEMP/bin/kind"
          tar xzf "$RUNNER_TEMP/ko.tgz" -C "$RUNNER_TEMP/bin" ko
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/flavor-cache
          key: flavors-${{ hashFiles('flavors/**') }}
          restore-keys: flavors-

      - name: Log in to GHCR (reads the flavor image; a miss falls back to building it)
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || true

      - name: Restore drill (test/drill/run.sh)
        env:
          OUT: ${{ runner.temp }}/drill
          KEEP: "0"
          DRILL_KEEP_CLUSTER: "1" # the workflow deletes the cluster in its own step, after collecting resource use
          FLAVOR_PULL_REPO: ghcr.io/${{ github.repository }}/flavors/opencode
          FLAVOR_CACHE: ${{ runner.temp }}/flavor-cache
          GITHUB_TOKEN: ${{ github.token }}
        run: test/drill/run.sh 2>&1 | tee "$RUNNER_TEMP/drill.log"

      - name: Summary
        if: always()
        run: |
          {
            echo '## Restore drill on kind'
            echo
            if [ -s "$RUNNER_TEMP/drill/drill-result.json" ]; then
              jq -r '"RTO \(.timings.rtoSeconds) s, RPO \(.timings.rpoSeconds) s (recorded, no targets)", "", "| check | verdict | issue |", "|---|---|---|", (.checks[] | "| \(.name) | \(.verdict) | \(.issue // "") |")' "$RUNNER_TEMP/drill/drill-result.json"
            else
              echo 'No drill-result.json: the suite did not finish.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resource use
        if: always()
        run: |
          kubectl --context kind-koinon-e1 get pods -A -o wide || true
          docker stats --no-stream || true
          free -m

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: drill-logs
          path: |
            ${{ runner.temp }}/drill.log
            ${{ runner.temp }}/drill/
          retention-days: 14

      - name: Delete cluster
        if: always()
        run: test/e2e/kind/down.sh
