# SPDX-License-Identifier: Apache-2.0
#
# OpenSSF Scorecard: weekly (and on dispatch), not on every push to main (#572: the score changes with
# the repository's settings, not with each commit). Publishes the result (publish_results) so the
# badge and api.securityscorecards.dev have one, and uploads the SARIF to code scanning. Advisory:
# it is not a required check and never gates a pull request. Action pins follow ADR 0079 (releases at
# least 3 days old); the shape follows fluxcd/flux2's ossf.yaml.
name: scorecard

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # publish_results (OIDC to the Scorecard webapp)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
