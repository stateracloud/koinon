# SPDX-License-Identifier: Apache-2.0
#
# OpenSSF Scorecard: weekly (and on dispatch), not on every push to main (#572: the score changes with
# the repository's settings, not with each commit). Publishes the result (publish_results) so the
# badge and api.securityscorecards.dev have one, and uploads the SARIF to code scanning. Advisory:
# it is not a required check and never gates a pull request. Action pins follow ADR 0079 (releases at
# least 3 days old); the shape follows fluxcd/flux2's ossf.yaml.
name: scorecard

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # publish_results (OIDC to the Scorecard webapp)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true # a failed log upload must not fail a job whose tests passed (#662)
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
