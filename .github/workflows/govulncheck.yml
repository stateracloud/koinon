# SPDX-License-Identifier: Apache-2.0
#
# Nightly govulncheck on main (ADR 0079). The ci.yml job only runs when a pull request changes Go
# code, but a new advisory needs no code change to apply. A reachable finding fails the run, which
# notifies the maintainer and is what starts the security fast path.
name: govulncheck

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
