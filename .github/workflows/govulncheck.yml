# SPDX-License-Identifier: Apache-2.0
#
# Nightly govulncheck on main (ADR 0079). It is the only govulncheck run: a new advisory needs no
# code change to apply, so a per-pull-request job (removed in old issue 561) added nothing. A reachable finding fails the run, which
# notifies the maintainer and is what starts the security fast path.
name: govulncheck

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: load tool versions
        run: hack/versions-env.sh >> "$GITHUB_ENV"
      - run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
