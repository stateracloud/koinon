# SPDX-License-Identifier: Apache-2.0
#
# Scans new commits for committed secrets with gitleaks (MIT, the release binary checked against
# its published SHA-256). GitHub secret scanning is not available for this private repository,
# so this is the guard until it is. Pull requests scan their own commits; pushes to main scan the
# pushed range.
name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "${GITLEAKS_SHA256}  $tgz" | sha256sum -c -
          tar xzf "$tgz" gitleaks
      - name: scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ $BEFORE =~ ^0+$ ]]; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          ./gitleaks git --redact --no-banner --verbose --log-opts="$range" .
