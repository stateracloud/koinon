# SPDX-License-Identifier: Apache-2.0
#
# Scans new commits for committed secrets with gitleaks (MIT, the release binary checked against
# its published SHA-256). Pull requests scan every commit of their range, so a leak fixed in a later
# commit still fails; pushes to main scan the pushed range. GitHub secret scanning and push
# protection cover pushes on top of this check. A push to main that the merge queue made is not scanned
# again: the queue run of this workflow scanned that exact commit (hack/secrets-skip.sh, #572). The job
# still runs and reports success, so the required check reports on every build.
name: secrets

on:
  pull_request:
  # The merge queue (#225): the required `gitleaks` check reports on the queue's commit.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # hack/secrets-skip.sh lists the merge_group runs of this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The skip decision is possible only on a push, and the workflow file itself says so: the script is
      # outside .github/, so a later pull request could change it to print skip=true. On every other event
      # this step does not run, its output is empty and every scan step below runs. So each commit that
      # reaches main through a pull request was scanned by a step that the script cannot switch off.
      # Residual risk: a script that always says skip only skips the scan of a push to main. That is meant
      # for queue-made commits (the queue scanned them). An admin or direct push has no queue run, so the
      # unchanged script scans it; a changed script on main, or one changed in the push itself, could
      # skip it. An expression cannot tell a queue push from an admin push (both have the same committer),
      # so the limit stays with review of changes to hack/secrets-skip.sh. GitHub push protection still applies.
      - id: skip
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          hack/secrets-skip.sh decide >"$RUNNER_TEMP/skip.txt"
          tee -a "$GITHUB_OUTPUT" <"$RUNNER_TEMP/skip.txt"
      - name: tool versions (hack/versions.env)
        if: steps.skip.outputs.skip != 'true'
        run: hack/versions-env.sh >> "$GITHUB_ENV"
      - if: steps.skip.outputs.skip != 'true'
        uses: ./.github/actions/fetch-pinned
        with:
          name: gitleaks
          url: https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          sha256: ${{ env.GITLEAKS_SHA256_AMD64 }}
          dest: ${{ runner.temp }}/pinned/gitleaks.tar.gz
      - name: install gitleaks
        if: steps.skip.outputs.skip != 'true'
        run: tar xzf "$RUNNER_TEMP/pinned/gitleaks.tar.gz" gitleaks
      - name: scan
        if: steps.skip.outputs.skip != 'true'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ $EVENT == merge_group ]]; then
            range="$MG_BASE..$MG_HEAD"
          elif [[ $BEFORE =~ ^0+$ ]]; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          ./gitleaks git --redact --no-banner --verbose --log-opts="$range" .
