# SPDX-License-Identifier: Apache-2.0
#
# Scans new commits for committed secrets with gitleaks (MIT, the release binary checked against
# its published SHA-256). Pull requests scan every commit of their range, so a leak fixed in a later
# commit still fails; pushes to main scan the pushed range. GitHub secret scanning and push
# protection cover pushes on top of this check.
name: secrets

on:
  pull_request:
  # The merge queue (#225): the required `gitleaks` check reports on the queue's commit.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tool versions (hack/versions.env)
        run: hack/versions-env.sh >> "$GITHUB_ENV"
      - name: install gitleaks
        run: |
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "${GITLEAKS_SHA256_AMD64}  $tgz" | sha256sum -c -
          tar xzf "$tgz" gitleaks
      - name: scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ $EVENT == merge_group ]]; then
            range="$MG_BASE..$MG_HEAD"
          elif [[ $BEFORE =~ ^0+$ ]]; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          ./gitleaks git --redact --no-banner --verbose --log-opts="$range" .
