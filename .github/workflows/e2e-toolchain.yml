# SPDX-License-Identifier: Apache-2.0
#
# Publishes the e2e toolchain images, pulled by digest:
#   ghcr.io/<owner>/<repo>/e2e-toolchain      hack/e2e-toolchain/Dockerfile, tag
#       go<GO_VERSION>-<first 12 hex of the Dockerfile's sha256> (hack/e2e-remote.sh builds the
#       same Dockerfile locally under the same tag, so a tag names exactly one Dockerfile)
#   ghcr.io/<owner>/<repo>/e2e-toolchain-web  hack/e2e-toolchain/web.Dockerfile on top of that
#       image (koinon-private#358), tag <toolchain tag>-web-<first 12 hex of web.Dockerfile's sha256>
# The names derive from github.repository (ghcr.io/stateracloud/koinon/...), so the repository that
# builds them owns the packages (#167). The spike probe image is no longer built: no test pulls it
# (test/escape/kind.sh builds or takes KOINON_OPENSHELL_IMAGE).
# A tag that already exists is not rebuilt, so its digest stays what the lab pinned. The digests
# are in the job summary.
#
# Runs when one of them changes on main, and by hand. amd64 only: the e2e node is amd64.
name: e2e-toolchain

on:
  push:
    branches: [main]
    paths:
      - hack/e2e-toolchain/**
      - .github/workflows/e2e-toolchain.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-toolchain
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # pushes the toolchain image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the job never uses git auth
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: build and push
        env:
          OWNER: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }} # BuildKit secret for the Dockerfile's GitHub release downloads (#145)
        run: |
          # publish <repo> <tag> <context> [build args...]: build and push unless the tag exists;
          # prints the digest either way.
          publish() {
            local repo=$1 tag=$2 ctx=$3; shift 3
            if docker buildx imagetools inspect "${repo}:${tag}" >/dev/null 2>&1; then
              docker buildx imagetools inspect "${repo}:${tag}" --format '{{json .Manifest}}' | jq -r .digest
              return
            fi
            docker buildx build --platform linux/amd64 --provenance=mode=max --sbom=true \
              --secret id=github_token,env=GITHUB_TOKEN \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${SHA}" \
              --metadata-file /tmp/meta.json -t "${repo}:${tag}" --push "$@" "$ctx" >&2
            jq -r '."containerimage.digest"' /tmp/meta.json
          }
          gov=$(sed -n 's/^ARG GO_VERSION=//p' hack/e2e-toolchain/Dockerfile)
          tag="go${gov}-$(sha256sum hack/e2e-toolchain/Dockerfile | cut -c1-12)"
          base=$(publish "$OWNER/e2e-toolchain" "$tag" hack/e2e-toolchain)
          webtag="${tag}-web-$(sha256sum hack/e2e-toolchain/web.Dockerfile | cut -c1-12)"
          web=$(publish "$OWNER/e2e-toolchain-web" "$webtag" hack/e2e-toolchain \
            -f hack/e2e-toolchain/web.Dockerfile --build-arg "BASE=$OWNER/e2e-toolchain:${tag}@${base}")
          {
            echo "Images (commit ${SHA}):"
            echo "- **$OWNER/e2e-toolchain:${tag}@${base}**"
            echo "- **$OWNER/e2e-toolchain-web:${webtag}@${web}**"
          } | tee -a "$GITHUB_STEP_SUMMARY"
