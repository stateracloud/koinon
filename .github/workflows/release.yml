# SPDX-License-Identifier: Apache-2.0
#
# Release (plan item REL1, ADR 0027, docs/dev/releasing.md). A pushed tag vX.Y.Z or vX.Y.Z-rc.N
# publishes the three Go images, the OpenCode flavor image (ADR 0059) and the OCI Helm chart to
# ghcr.io/<owner>/<repo> (ghcr.io/stateracloud/koinon) and drafts the GitHub release (-rc.N is a prerelease). Nothing is rebuilt or
# retested for the gate: it only checks that the tagged commit is on main and that the required CI
# checks succeeded on it.
#
# Signing and SBOM attestations (cosign, keyless) are a separate `sign` job, the only one with
# id-token: write. It runs only when the repository variable RELEASE_SIGNING is 'true' (ADR 0049:
# they write to the public Rekor log, so they stay opt-in behind the variable).
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Every package lives under the repository that builds it (#167): ghcr.io/<owner>/<repo>/api,
  # /reconciler, /agentd, /flavors/opencode and /charts/koinon.
  KOINON_IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
  CHART_REPOSITORY: oci://ghcr.io/${{ github.repository }}/charts

jobs:
  # The release gate. Replace this job (and keep its name in `needs`) to gate on something else.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      actions: read # the merge queue's ci runs (the queue build is the evidence for what main's push skipped)
      pull-requests: read # the merged pull request's head commit, for the pull-request-only dco check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # hack/release-gate.sh fetches main anonymously (public repository)
      - name: tagged commit is on main and its required checks succeeded
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: hack/release-gate.sh

  release:
    name: release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # creates the draft release
      packages: write # pushes the images and the chart
    outputs:
      chart_ref: ${{ steps.chart.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # GoReleaser's changelog reads the tags
          persist-credentials: false # GoReleaser talks to the API with GITHUB_TOKEN; nothing is pushed with git
      - name: tool versions (hack/versions.env)
        run: hack/versions-env.sh >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release never restores a cache that a pull request or branch build could have written
      # The before hooks of .goreleaser.yaml build the web UI that koinon-api embeds.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no cache, as with setup-go above; turns automatic caching off explicitly
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      - name: images and draft release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The chart takes its version and appVersion from the tag; nothing is committed for it.
      - name: package and push the chart
        id: chart
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          helm package charts/koinon --version "$version" --app-version "$version" --destination dist/chart
          helm push "dist/chart/koinon-$version.tgz" "$CHART_REPOSITORY" 2>&1 | tee dist/chart/push.log
          digest=$(awk '/^Digest:/ { print $2 }' dist/chart/push.log)
          [[ $digest == sha256:* ]] || { echo "no chart digest in the helm push output" >&2; exit 1; }
          echo "ref=${CHART_REPOSITORY#oci://}/koinon@$digest" >>"$GITHUB_OUTPUT" # package <repo>/charts/koinon

      # What the sign job needs: the image digests and SBOMs from GoReleaser.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-digests
          path: |
            dist/digests.txt
            dist/sbom/*-index.spdx.json
          if-no-files-found: error

  # The OpenCode flavor image (ADR 0059), which the chart defaults to as
  # <image.registry>/flavors/opencode:<appVersion>. GoReleaser builds only Go images, so this is
  # buildx. Each platform builds natively on its own runner (the Dockerfile runs apt-get, which is
  # far too slow under QEMU) and is pushed by digest with a per-platform registry build cache; the
  # `flavor` job joins the two digests into one tagged manifest list. BuildKit's SBOM and provenance
  # attestations are stored next to each platform's image.
  # Pattern: docker/build-push-action "multi-platform image with distributed build on multiple runners".
  flavor-build:
    name: flavor-build (${{ matrix.arch }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write # pushes the platform image and its build cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false # the job never uses git auth
      - name: tool versions (hack/versions.env)
        run: hack/versions-env.sh >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          cache-binary: false # a release job publishes artifacts: nothing to restore (zizmor cache-poisoning)
      - name: log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: build and push flavors/opencode by digest
        id: build
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: hack/release-flavor.sh --platform "linux/$ARCH" "${TAG#v}" "$KOINON_IMAGE_REGISTRY" "$SHA" >>"$GITHUB_OUTPUT"
      - name: keep the digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p flavor-digests
          printf '%s\n' "$DIGEST" >"flavor-digests/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flavor-digest-${{ matrix.arch }}
          path: flavor-digests/${{ matrix.arch }}
          if-no-files-found: error

  flavor:
    name: flavor
    needs: flavor-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # tags the joined manifest list
    outputs:
      ref: ${{ steps.merge.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false # the job never uses git auth
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flavor-digest-*
          path: flavor-digests
          merge-multiple: true
      - name: tool versions (hack/versions.env)
        run: hack/versions-env.sh >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          cache-binary: false # a release job publishes artifacts: nothing to restore (zizmor cache-poisoning)
      - name: log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: join the platforms into flavors/opencode:<version>
        id: merge
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -s flavor-digests/amd64 && -s flavor-digests/arm64 ]] || { echo "want a digest for amd64 and arm64" >&2; exit 1; }
          hack/release-flavor.sh --merge "${TAG#v}" "$KOINON_IMAGE_REGISTRY" "$SHA" \
            "$(<flavor-digests/amd64)" "$(<flavor-digests/arm64)" >>"$GITHUB_OUTPUT"

  # Keyless cosign signing and SBOM attestations. Off unless RELEASE_SIGNING is 'true'.
  sign:
    name: sign
    needs: [release, flavor]
    if: vars.RELEASE_SIGNING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # cosign pushes signatures and attestations next to the images
      id-token: write # keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false # the job never uses git auth
      - name: tool versions (hack/versions.env)
        run: hack/versions-env.sh >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-digests
          path: dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: sign and attest
        env:
          CHART_REF: ${{ needs.release.outputs.chart_ref }}
          FLAVOR_REF: ${{ needs.flavor.outputs.ref }}
        run: |
          cosign sign --yes "$CHART_REF"
          # The flavor's SBOM is BuildKit's attestation in the registry, so it is only signed here.
          cosign sign --yes "$FLAVOR_REF"
          # dist/digests.txt holds one line per image; hack/release-refs.sh turns it into digest refs.
          # dist/sbom/<name>-index.spdx.json is the SPDX SBOM of the image index.
          # <name> is the last path element of the repository (api, reconciler, agentd); ko may
          # prefix the SBOM file with the registry path, so match on the suffix and demand one file.
          while read -r name ref; do
            cosign sign --yes "$ref"
            sboms=(dist/sbom/*"$name"-index.spdx.json)
            [[ ${#sboms[@]} -eq 1 && -f ${sboms[0]} ]] || { echo "want one SBOM for $name, got: ${sboms[*]}" >&2; exit 1; }
            cosign attest --yes --type spdxjson --predicate "${sboms[0]}" "$ref"
          done < <(hack/release-refs.sh <dist/digests.txt)
