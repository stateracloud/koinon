# SPDX-License-Identifier: Apache-2.0
#
# Release (plan item REL1, ADR 0027, docs/dev/releasing.md). A pushed tag vX.Y.Z or vX.Y.Z-rc.N
# publishes the three Go images and the OCI Helm chart to ghcr.io/stateracloud and drafts the GitHub
# release (-rc.N is a prerelease). Nothing is rebuilt or retested for the gate: it only checks that
# the tagged commit is on main and that the required CI checks succeeded on it.
#
# Signing and SBOM attestations (cosign, keyless) are wired in but run only when the repository
# variable RELEASE_SIGNING is 'true' (ADR 0049: they write to the public Rekor log, so they stay off
# while the repository is private).
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.18.3
  HELM_VERSION: v4.3.1
  COSIGN_VERSION: v3.1.4
  CHART_REPOSITORY: oci://ghcr.io/stateracloud/charts

jobs:
  # The release gate. Replace this job (and keep its name in `needs`) to gate on something else.
  gate:
    name: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tagged commit is on main and its required checks succeeded
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: hack/release-gate.sh

  release:
    name: release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release
      packages: write # pushes the images and the chart
      id-token: write # keyless cosign; used only when RELEASE_SIGNING is 'true'
    env:
      SIGNING: ${{ vars.RELEASE_SIGNING == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The before hooks of .goreleaser.yaml build the web UI that koinon-api embeds.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.SIGNING == 'true'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      - name: images and draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean ${{ env.SIGNING != 'true' && '--skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The chart takes its version and appVersion from the tag; nothing is committed for it.
      - name: package and push the chart
        id: chart
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          helm package charts/koinon --version "$version" --app-version "$version" --destination dist/chart
          helm push "dist/chart/koinon-$version.tgz" "$CHART_REPOSITORY" 2>&1 | tee dist/chart/push.log
          digest=$(awk '/^Digest:/ { print $2 }' dist/chart/push.log)
          [[ $digest == sha256:* ]] || { echo "no chart digest in the helm push output" >&2; exit 1; }
          echo "ref=${CHART_REPOSITORY#oci://}/koinon@$digest" >>"$GITHUB_OUTPUT"

      - name: sign the chart and attest the image SBOMs
        if: env.SIGNING == 'true'
        env:
          CHART_REF: ${{ steps.chart.outputs.ref }}
        run: |
          cosign sign --yes "$CHART_REF"
          # dist/digests.txt: "<sha256 hex>  <repository>" per image; dist/sbom/<name>-index.spdx.json.
          while read -r hex repo; do
            name=${repo##*/}
            cosign attest --yes --type spdxjson --predicate "dist/sbom/$name-index.spdx.json" "$repo@sha256:$hex"
          done <dist/digests.txt
