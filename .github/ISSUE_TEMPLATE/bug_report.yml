# SPDX-License-Identifier: Apache-2.0
name: Bug report
description: Something in Koinon does not work as documented.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste secrets: API keys, tokens or kubeconfigs.
        A security vulnerability goes through a private report instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Install with ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Koinon version or commit
      placeholder: v0.1.0-rc.9 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How Koinon runs
      options:
        - Helm chart on Kubernetes
        - kind (local development)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines with secrets removed. They are shown as code.
      render: text
