#
# The v0.1 repo-helper flow (ADR 0049): the agent calls create_pull_request, sees the tool result
# (the approval request), then answers. Selection is stateless: the first turn whose `when` holds
# answers the request; an empty `when.toolResult` means "the last message is not a tool result".
model: repo-helper
turns:
  - toolCalls:
      - name: create_pull_request
        arguments:
          repository: koinon-demo/hello
          branch: agent/repo-helper-hello
          title: Add hello.md
          body: Adds hello.md as requested in the ticket.
          files:
            - path: hello.md
              content: "hello from koinon\n"
    usage:
      inputTokens: 1200
      outputTokens: 60
  - when:
      toolResult: create_pull_request
    text: I asked for approval to open the pull request "Add hello.md". It will be opened once approved.
    usage:
      inputTokens: 1350
      cachedInputTokens: 1200
      outputTokens: 24
