#
# The v0.1 repo-helper flow (ADR 0049): the agent calls create_pull_request, sees the tool result
# (the approval request), then answers; once a human approved and Koinon opened the pull request,
# the run resumes with the outcome and the agent posts the URL. Selection is stateless: the first
# turn whose `when` holds answers the request; an empty `when.toolResult` means "the last message
# is not a tool result". Tool names match behind a harness's MCP prefix (koinon_create_pull_request
# in OpenCode), and behind the gateway's target
# prefix (koinon_github_create_pull_request: agentgateway runs with prefixMode always).
#
# The fake GitHub (internal/connectors/github/githubtest) numbers pull requests from 1 and links
# them under https://github.test/, which is the URL the resumed run reports.
#
# Every turn needs the repo-helper template's instructions in the system prompt ("# Repo helper",
# templates/repo-helper.yaml), which koinon-agentd writes into the sandbox for each run (ADR 0052).
# A request without them, such as a harness's title request or a run whose instructions did not
# arrive, matches no turn and gets HTTP 400, so the quickstart fails instead of passing on a
# harness that never saw its instructions.
model: repo-helper
turns:
  # agentd's end-of-turn summary prompt (ADR 0051 amendment): a short note, no tool call. It comes
  # first because selection takes the first turn whose `when` holds, and the prompt is the latest
  # user text of a conversation that also holds the task's earlier messages.
  - when:
      systemContains: "# Repo helper"
      userContains: "Your turn is over"
    text: "Notes: the task asks for a hello.md; the pull request flow is under way."
    usage:
      inputTokens: 1600
      cachedInputTokens: 1400
      outputTokens: 18
  # A task that asks for the remote MCP server's approval-gated tool (the e2e step for MC1): the agent
  # calls it through the gateway's "-ask" target, parks, and the resumed run reports the outcome.
  - when:
      systemContains: "# Repo helper"
      userContains: "mcp:tracker"
    text: "The tracker call was approved and made."
    usage:
      inputTokens: 1500
      cachedInputTokens: 1350
      outputTokens: 20
  # The leak guard inside a task (ADR 0091): the agent reads from the tracker (read_item is declared
  # internal; its result, an MCP tool's, sets both legs), then calls its write tool, which is
  # auto-tier and undeclared (external-high); the guard turns that call into an approval of the exact
  # call and the run parks. The resumed run matches "approved and executed by Koinon".
  - when:
      systemContains: "# Repo helper"
      userContains: "tracker exfil"
      toolResult: default-tracker_write_item
    text: The leak guard asked for approval of the tracker write. It will be made once approved.
    usage:
      inputTokens: 1350
      cachedInputTokens: 1200
      outputTokens: 24
  - when:
      systemContains: "# Repo helper"
      userContains: "tracker exfil"
      toolResult: default-tracker_read_item
    toolCalls:
      - name: default-tracker_write_item
        arguments:
          title: from the e2e guard
    usage:
      inputTokens: 1300
      cachedInputTokens: 1200
      outputTokens: 40
  - when:
      systemContains: "# Repo helper"
      userContains: "tracker exfil"
    toolCalls:
      - name: default-tracker_read_item
        arguments:
          title: from the e2e guard read
    usage:
      inputTokens: 1200
      outputTokens: 40
  - when:
      systemContains: "# Repo helper"
      userContains: "tracker write"
      toolResult: default-tracker-ask_write_item
    text: I asked for approval to call the tracker's write tool. It will be called once approved.
    usage:
      inputTokens: 1350
      cachedInputTokens: 1200
      outputTokens: 24
  - when:
      systemContains: "# Repo helper"
      userContains: "tracker write"
    toolCalls:
      - name: default-tracker-ask_write_item
        arguments:
          title: from the e2e ask
    usage:
      inputTokens: 1200
      outputTokens: 40
  # The resumed run: agentd's prompt carries the approval's outcome (internal/agentd/park.go).
  - when:
      systemContains: "# Repo helper"
      userContains: "approved and executed by Koinon"
    text: "The pull request is open: https://github.test/koinon-demo/hello/pull/1"
    usage:
      inputTokens: 1500
      cachedInputTokens: 1350
      outputTokens: 20
  - when:
      systemContains: "# Repo helper"
    toolCalls:
      - name: create_pull_request
        arguments:
          branch: koinon/add-hello-md
          title: Add hello.md
          body: Adds hello.md as requested in the task.
          files:
            - path: hello.md
              content: "hello from koinon\n"
    usage:
      inputTokens: 1200
      outputTokens: 60
  - when:
      systemContains: "# Repo helper"
      toolResult: create_pull_request
    text: I asked for approval to open the pull request "Add hello.md". It will be opened once approved.
    usage:
      inputTokens: 1350
      cachedInputTokens: 1200
      outputTokens: 24
