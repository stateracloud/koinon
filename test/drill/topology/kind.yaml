#
# The drill's topology on kind (ADR 0109): the cluster test/e2e/kind/up.sh makes, the images
# test/e2e/kind/images.sh loads, a second OpenShell gateway for each install. {run} is the run ID.
# Namespaces must start with koinon-drill-. Releases contain "koinon" so the chart names its objects
# <release>-api and so on. Checkpoints are off in phase 1, so there is no object store yet.
name: kind
context: kind-koinon-e1
source:
  namespace: koinon-drill-src-{run}
  release: koinon-drill-src-{run}
  gatewayNamespace: koinon-drill-os-src-{run}
  gatewayRelease: openshell-src-{run}
target:
  namespace: koinon-drill-dst-{run}
  release: koinon-drill-dst-{run}
  gatewayNamespace: koinon-drill-os-dst-{run}
  gatewayRelease: openshell-dst-{run}
fakesNamespace: koinon-drill-fakes-{run}
chartPath: charts/koinon
valuesFile: test/e2e/kind/koinon-values.yaml
gatewayChart: oci://ghcr.io/nvidia/openshell/helm-chart@sha256:3e5998c749390a6be3a4f553e52e488b6f692e19be7b8bf681a26285d1e18901
gatewayVersion: 0.1.7
gatewayValues: test/e2e/kind/openshell-values.yaml
fakeModelImage: kind.local/koinon-fakemodel:e2e
runNowCalls: 3
heldObserve: 100s
releasedWait: 8m
