# SPDX-License-Identifier: Apache-2.0
# Configuration for the unmodified SearXNG image (AGPL-3.0; this file is only config). Mounted at
# /etc/searxng/settings.yml. The secret key comes from the environment (SEARXNG_SECRET), never from here.
use_default_settings:
  engines:
    keep_only:
      # DuckDuckGo is out: it answers a CAPTCHA to a server-side client (home lab, 2026-10-29).
      # mojeek and bing are not listed: SearXNG's defaults ship mojeek `inactive: true` and bing
      # `disabled: true`, so keep_only alone never ran them. brave, wikipedia, github and stackoverflow
      # returned good results in the rc.8 window.
      - brave
      - wikipedia
      - github
      - stackoverflow
general:
  instance_name: rt1-searxng
  enable_metrics: false
search:
  formats: [html, json]
  safe_search: 0
server:
  # Overridden by $SEARXNG_SECRET; this value is not used and is not a secret.
  secret_key: "not-a-real-secret-set-by-env"
  # Only the MCP server (in this namespace) can reach SearXNG, so there is nothing to rate limit.
  limiter: false
  image_proxy: false
  public_instance: false
