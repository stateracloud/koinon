    digest: sha256:d14b0e6e71ac5227dd415f0d06bcc52bd43abc0e5a5e954cee3c9a6afe6f2c02
  - name: zot.apps.lab.example.invalid/koinon/rt1-prometheus-mcp
    newTag: "rt1-bfaab19"
    digest: sha256:fb2355b39fcecaeb38a03e2d0e73a45f8c13a1a4e11c7e862d232b50ad48e939
  - name: zot.apps.lab.example.invalid/koinon/rt1-prometheus
