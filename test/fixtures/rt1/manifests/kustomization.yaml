# RT1 fixtures: three remote MCP servers in namespace koinon-fixtures. See ../README.md.
#   kubectl apply -k test/fixtures/rt1/manifests
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: koinon-fixtures
resources:
  - namespace.yaml
  - networkpolicies.yaml
  - motherduck.yaml
  - fakecicost.yaml
  - prometheus.yaml
  - searxng.yaml
# Images are pinned by digest. The three mirrored upstream images (prometheus, searxng, mcp-searxng) keep
# their upstream digests. The four built images carry a TODO placeholder until the build is pushed:
# hack/rt1-fixtures-build.sh REGISTRY prints a ready-to-paste block with the real digests. The tag is
# informational once a digest is set.
