#
# RT1 fixtures: three remote MCP servers in namespace koinon-fixtures. See ../README.md.
#   kubectl apply -k test/fixtures/rt1/manifests
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: koinon-fixtures
resources:
  - namespace.yaml
  - networkpolicies.yaml
  - motherduck.yaml
  - fakecicost.yaml
  - prometheus.yaml
  - searxng.yaml
# SearXNG's settings file, mounted by the searxng Deployment.
configMapGenerator:
  - name: rt1-searxng-settings
    files:
      - settings.yml=searxng-settings.yml
# Images are pinned by digest. The three mirrored upstream images (prometheus, searxng, mcp-searxng) keep
# their upstream digests. The four built images were built from bfaab19 for linux/amd64 and pushed with
# hack/rt1-fixtures-build.sh, which prints this block after a rebuild. The tag is informational.
images:
  - name: zot.apps.lab.example.invalid/koinon/rt1-motherduck
    newTag: "rt1-bfaab19"
    digest: sha256:ae71e987442c42e9d90281e489d563f737a8aed14f0ad8416e1b337018b50d38
  - name: zot.apps.lab.example.invalid/koinon/rt1-fakecicost
    newTag: "rt1-bfaab19"
    digest: sha256:015d90c0ad5cf3e337c4a6654b41a88758857a5e64b2d4928e060858c14a3d79
  - name: zot.apps.lab.example.invalid/koinon/rt1-promgen
