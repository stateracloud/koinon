# SPDX-License-Identifier: Apache-2.0
#
# NOT part of the kustomization (an Argo CD self-heal would revert Secrets that are not in Git, and real
# values must never be). On the home lab the operator delivers these Secrets from OpenBao with
# ExternalSecrets. For a local or kind cluster, edit the values and apply this file by hand:
#   kubectl apply -n koinon-fixtures -f test/fixtures/rt1/manifests/secrets.example.yaml
# All values are obviously fake placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: rt1-fakecicost-token
type: Opaque
stringData:
  token: koinon_test_not-a-real-token
---
apiVersion: v1
kind: Secret
metadata:
  name: rt1-searxng-secrets
type: Opaque
stringData:
  secret_key: koinon_test_not-a-real-secret
  mcp_token: koinon_test_not-a-real-token
