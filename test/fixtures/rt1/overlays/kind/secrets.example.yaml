# SPDX-License-Identifier: Apache-2.0
#
# Fake Secrets for a local kind cluster, applied by overlays/kind. They are not in the base: real
# values must never be committed, and on a real cluster the operator delivers these Secrets (for
# example with ExternalSecrets or kubectl create secret) before the pods start.
# All values are obviously fake placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: rt1-fakecicost-token
type: Opaque
stringData:
  token: koinon_test_not-a-real-token
---
apiVersion: v1
kind: Secret
metadata:
  name: rt1-searxng-secrets
type: Opaque
stringData:
  secret_key: koinon_test_not-a-real-secret
  mcp_token: koinon_test_not-a-real-token
