#
# The maintainer's home lab: images from Zot, pinned by digest (docs/dev/maintainer-homelab.md). The
# operator delivers the Secrets (ExternalSecrets); this overlay has none.
#   kubectl --context <home lab> apply -k test/fixtures/rt1/overlays/homelab
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../manifests
# Images are pinned by digest. The three mirrored upstream images (prometheus, searxng, mcp-searxng) keep
# their upstream digests. The four built images were built from bfaab19 for linux/amd64 and pushed with
# hack/rt1-fixtures-build.sh, which prints this block after a rebuild. The tag is informational.
