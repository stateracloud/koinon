#
# OpenShell gateway chart values (oci://ghcr.io/nvidia/openshell/helm-chart 0.1.7) for the E1
# quickstart e2e on a single-node kind cluster. Same as spike S1 (docs/spikes/kind.md).
server:
  telemetryEnabled: false
  # RuntimeClass `runc` (handler runc) is created by up.sh with the
  # openshell.ai/sandbox-attachable label that resource admission requires.
  defaultRuntimeClassName: runc
  drivers:
    kubernetes:
      workspaceMode: managed
  # Pull secrets for sandbox pods from a private registry or mirror (old issue 130). OpenShell copies these
  # Secrets, which must exist in its own namespace, into each sandbox's namespace and attaches them
  # to the workload and supervisor pods; Koinon's chart cannot do this. See the guide "Private
  # registries and mirrors".
  # sandboxImagePullSecrets:
  #   - name: regcred
  # No credentialDrivers: the gateway's default store (provider credentials and
  # sandbox SSH identities encrypted in its SQLite database with AES-256-GCM,
  # key-encryption key in a chart-generated Secret). No external secret store.
networkPolicy:
  enabled: true
