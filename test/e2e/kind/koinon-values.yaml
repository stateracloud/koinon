#
# charts/koinon values for the E1 quickstart e2e on kind: runc instead of Kata (kind has no VM
# runtime), CNPG and the fake GitHub as the GitHub API. The fake model server is declared by
# model-provider.yaml next to this file. Images come from ko/buildx and are pushed to the local registry (test/e2e/kind/registry.sh, localhost:5001).
# test/e2e/run.sh installs this file as the quickstart's values.yaml.
image:
  registry: localhost:5001
  tag: e2e
  # Always: a reused cluster (KEEP=1, SKIP_UP=1) must not run an older image under the same tag.
  pullPolicy: Always

postgres:
  mode: cnpg
  cnpg:
    storage:
      size: 1Gi

gateway:
  mode: standalone

# The fake model server and the fake MCP server are Services in another namespace (a ClusterIP, which
# the default URL policy and the gateway's egress policy deny).
egress:
  allowedInternalHosts: ["fakemodel.koinon-e2e-fakes.svc:8080", "fakemcp.koinon-e2e-fakes.svc:8080"]

networkPolicy:
  gatewayEgressTo:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: koinon-e2e-fakes
      ports:
        - port: 8080

github:
  apiUrl: http://fakegithub.koinon-e2e-fakes.svc:8080

openshell:
  address: openshell.openshell.svc:8080
  # Copied from the openshell namespace by test/e2e/run.sh.
  clientTLSSecret: openshell-client-tls
  runtimeClassName: runc

sandboxPolicy:
  runtimeClasses: [runc]

# kind has no Kata, so the guest seccomp probe does not apply on runc.
preflight:
  seccompProbe:
    enabled: false
