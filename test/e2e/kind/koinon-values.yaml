#
# charts/koinon values for the E1 quickstart e2e on kind: runc instead of Kata (kind has no VM
# runtime), CNPG and the fake GitHub as the GitHub API. The fake model server is declared by
# model-provider.yaml next to this file. Images come from ko/buildx and are pushed to the local registry (test/e2e/kind/registry.sh, localhost:5001).
# test/e2e/run.sh installs this file as the quickstart's values.yaml.
image:
  registry: localhost:5001
  tag: e2e
  # Always: a reused cluster (KEEP=1, SKIP_UP=1) must not run an older image under the same tag.
  pullPolicy: Always

postgres:
  mode: cnpg
  cnpg:
    storage:
      size: 1Gi

gateway:
  mode: standalone
  # koinon-gateway (the default gateway.mcp.driver, #1239) also serves its egress listener (ADR 0097, #1086 part
  # C2): an agent with a code-host connection sends git to <gateway>/egress/<host>/, and the gateway attaches the
  # forge credential.
  mcp:
    koinon:
      egress:
        enabled: true
        # The run CA of the fake Gitea: test/e2e/kindvalues (from run.sh, upgrade.sh and the restore drill) replaces
        # this line with a block that holds the run's CA. Unfilled, the chart refuses to render it (#1487).
        caBundle: "@E2E_EGRESS_CA@"

# The fake model server, the fake MCP server and the fake Gitea are Services in another namespace (a ClusterIP,
# which the default URL policy and the gateway's egress policy deny).
egress:
  allowedInternalHosts: ["fakemodel.koinon-e2e-fakes.svc:8080", "fakemcp.koinon-e2e-fakes.svc:8080", "fakemcp.koinon-e2e-fakes.svc:8081",
    "fakegitea.koinon-e2e-fakes.svc.cluster.local:443"]

networkPolicy:
  gatewayEgressTo:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: koinon-e2e-fakes
      ports:
        - port: 8080

github:
  apiUrl: http://fakegithub.koinon-e2e-fakes.svc:8080

openshell:
  address: openshell.openshell.svc:8080
  # Copied from the openshell namespace by test/e2e/run.sh.
  clientTLSSecret: openshell-client-tls
  runtimeClassName: runc

sandboxPolicy:
  runtimeClasses: [runc]

# kind has no Kata, so the guest seccomp probe does not apply on runc.
preflight:
  seccompProbe:
    enabled: false

# The chart's default driver is substrate (#1093). This kind run still uses OpenShell until the
# substrate kind leg (#1091) and #1094 replace it.
execution:
  driver: openshell
sandboxObserver:
  enabled: true
sandboxNetworkPolicy:
  enabled: true
sandboxLimitRange:
  enabled: true
