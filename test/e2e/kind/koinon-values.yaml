#
# charts/koinon values for the E1 quickstart e2e on kind: runc instead of Kata (kind has no VM
# runtime), CNPG and the fake GitHub as the GitHub API. The fake model server is declared by
# model-provider.yaml next to this file. Images come from ko/buildx and are loaded into the node (kind.local).
# test/e2e/run.sh installs this file as the quickstart's values.yaml.
image:
  registry: kind.local
  tag: e2e
  pullPolicy: IfNotPresent

postgres:
  mode: cnpg
  cnpg:
    storage:
      size: 1Gi

gateway:
  mode: standalone

# The default 256Mi limit can OOM koinon-api when the first password change (two argon2id runs of
# 64 MiB) lands while it starts; the pod restarted in two of four browser e2e runs and the page showed
# HTTP 502. Give the test install room; the chart default is untouched.
api:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 768Mi}

# The fake model server is a Service in another namespace (a ClusterIP, which the default provider
# URL policy and the gateway's egress policy deny).
providers:
  allowedInternalHosts: ["fakemodel.koinon-e2e-fakes.svc:8080"]

networkPolicy:
  gatewayEgressTo:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: koinon-e2e-fakes
      ports:
        - port: 8080

github:
  apiUrl: http://fakegithub.koinon-e2e-fakes.svc:8080

openshell:
  address: openshell.openshell.svc:8080
  # Copied from the openshell namespace by test/e2e/run.sh.
  clientTLSSecret: openshell-client-tls
  runtimeClassName: runc

sandboxPolicy:
  runtimeClasses: [runc]

# kind has no Kata, so the guest seccomp probe does not apply on runc.
preflight:
  seccompProbe:
    enabled: false
