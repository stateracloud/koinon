# SPDX-License-Identifier: Apache-2.0
#
# Test doubles for the E1 quickstart e2e, in their own namespace: the fake model server (the
# OpenAI-compatible upstream, scripts from test/fakemodel/scripts) and the fake GitHub App API
# (internal/connectors/github/githubtest). Images are built with ko and pushed to the local registry (KO_DOCKER_REPO=localhost:5001).
apiVersion: v1
kind: Namespace
metadata:
  name: koinon-e2e-fakes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakemodel
  namespace: koinon-e2e-fakes
  labels: {app: fakemodel}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakemodel}
  template:
    metadata:
      labels: {app: fakemodel}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fakemodel
          image: localhost:5001/koinon-fakemodel:e2e
          imagePullPolicy: Always
          # Strict Messages mode: the fake refuses what api.anthropic.com refuses (unknown fields, beta-only
          # fields without their beta), so a body the gateway cannot vouch for fails the run (rc.7, old issue 240).
          args: ["-addr", ":8080", "-strict-messages"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: fakemodel
  namespace: koinon-e2e-fakes
spec:
  selector: {app: fakemodel}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakegithub
  namespace: koinon-e2e-fakes
  labels: {app: fakegithub}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakegithub}
  template:
    metadata:
      labels: {app: fakegithub}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fakegithub
          image: localhost:5001/koinon-fakegithub:e2e
          imagePullPolicy: Always
          # The repository the repo-helper fake-model script targets (koinon-demo/hello).
          args: ["-addr", ":8080", "-account", "koinon-demo", "-repos", "hello"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /_fake/app, port: http}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: fakegithub
  namespace: koinon-e2e-fakes
spec:
  selector: {app: fakegithub}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# A remote MCP server (plan item MC1): three tools over Streamable HTTP at /mcp, refusing requests
# without the X-Api-Key credential, and a record of what it received at /_fake/requests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakemcp
  namespace: koinon-e2e-fakes
  labels: {app: fakemcp}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakemcp}
  template:
    metadata:
      labels: {app: fakemcp}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fakemcp
          image: localhost:5001/koinon-fakemcp:e2e
          imagePullPolicy: Always
          # HTTPS (ADR 0120: Koinon sends a credential only over HTTPS). run.sh makes one CA and certificate per
          # run (cmd/koinon-faketls) and gives them as the Secret fakemcp-tls, so a restart of this pod keeps the
          # same CA. The CA is the server record's caBundle. No key is in the tree.
          args: ["-addr", ":8080", "-header", "X-Api-Key", "-value", "not-a-real-token", "-http-addr", ":8081",
                 "-tls-cert-file", "/tls/tls.crt", "-tls-key-file", "/tls/tls.key"]
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
          ports:
            - {name: http, containerPort: 8080}
            - {name: plain, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /healthz, port: http, scheme: HTTPS}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: tls
          secret: {secretName: fakemcp-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: fakemcp
  namespace: koinon-e2e-fakes
spec:
  selector: {app: fakemcp}
  ports:
    - {name: http, port: 8080, targetPort: http}
    # Plain HTTP, for the server that asks for OAuth (it has no credential, so ADR 0120 allows http).
    - {name: plain, port: 8081, targetPort: plain}
---
# A Gitea over HTTPS with git smart HTTP (internal/testing/fakegitea), for the clone through koinon-gateway's
# egress listener (#1086 part C2). It accepts the write token (the default) and a read-only token; the agent's
# sandbox holds neither, the gateway attaches the read token. run.sh gives it the certificate of the fakemcp run
# CA as the Secret fakegitea-tls. GET /_fake/git lists the git requests it served (never their headers).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakegitea
  namespace: koinon-e2e-fakes
  labels: {app: fakegitea}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakegitea}
  template:
    metadata:
      labels: {app: fakegitea}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fakegitea
          image: localhost:5001/koinon-fakegitea:e2e
          imagePullPolicy: Always
          args: ["-addr", ":8080", "-owner", "koinon-demo", "-repos", "hello",
                 "-read-token", "koinon_test_not-a-real-gitea-read-token",
                 "-tls-cert-file", "/tls/tls.crt", "-tls-key-file", "/tls/tls.key"]
          # The fake keeps its repositories as bare git repositories under TMPDIR.
          env:
            - {name: TMPDIR, value: /tmp}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          ports:
            - {name: https, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /api/v1/version, port: https, scheme: HTTPS}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: tls
          secret: {secretName: fakegitea-tls}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fakegitea
  namespace: koinon-e2e-fakes
spec:
  selector: {app: fakegitea}
  # Port 443, so the clone URL names no port, as for a real forge.
  ports:
    - {name: https, port: 443, targetPort: https}
