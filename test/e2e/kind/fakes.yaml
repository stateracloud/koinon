# SPDX-License-Identifier: Apache-2.0
#
# Test doubles for the E1 quickstart e2e, in their own namespace: the fake model server (the
# OpenAI-compatible upstream, scripts from test/fakemodel/scripts) and the fake GitHub App API
# (internal/connectors/github/githubtest). Images are built with ko into kind (KO_DOCKER_REPO=kind.local).
apiVersion: v1
kind: Namespace
metadata:
  name: koinon-e2e-fakes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakemodel
  namespace: koinon-e2e-fakes
  labels: {app: fakemodel}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakemodel}
  template:
    metadata:
      labels: {app: fakemodel}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fakemodel
          image: kind.local/koinon-fakemodel:e2e
          imagePullPolicy: IfNotPresent
          # Strict Messages mode: the fake refuses what api.anthropic.com refuses (unknown fields, beta-only
          # fields without their beta), so a body the gateway cannot vouch for fails the run (rc.7, old issue 240).
          args: ["-addr", ":8080", "-strict-messages"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: fakemodel
  namespace: koinon-e2e-fakes
spec:
  selector: {app: fakemodel}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakegithub
  namespace: koinon-e2e-fakes
  labels: {app: fakegithub}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakegithub}
  template:
    metadata:
      labels: {app: fakegithub}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fakegithub
          image: kind.local/koinon-fakegithub:e2e
          imagePullPolicy: IfNotPresent
          # The repository the repo-helper fake-model script targets (koinon-demo/hello).
          args: ["-addr", ":8080", "-account", "koinon-demo", "-repos", "hello"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /_fake/app, port: http}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: fakegithub
  namespace: koinon-e2e-fakes
spec:
  selector: {app: fakegithub}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# A remote MCP server (plan item MC1): three tools over Streamable HTTP at /mcp, refusing requests
# without the X-Api-Key credential, and a record of what it received at /_fake/requests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakemcp
  namespace: koinon-e2e-fakes
  labels: {app: fakemcp}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakemcp}
  template:
    metadata:
      labels: {app: fakemcp}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fakemcp
          image: kind.local/koinon-fakemcp:e2e
          imagePullPolicy: IfNotPresent
          args: ["-addr", ":8080", "-header", "X-Api-Key", "-value", "not-a-real-token"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: fakemcp
  namespace: koinon-e2e-fakes
spec:
  selector: {app: fakemcp}
  ports:
    - {name: http, port: 8080, targetPort: http}
