#
# Hermes Agent's managed scope for the Koinon Hermes flavor: every setting that decides which
# tools the agent has, what it may remember or learn, and what may run on its behalf. Read-only
# in the image at /etc/hermes/config.yaml, outside the agent's home. Hermes overlays it on every
# config load, after the user config ($HERMES_HOME/config.yaml, which the agent can change):
# each value here wins at its leaf, and a list replaces the user's list rather than merging
# (hermes_cli/managed_scope.py, hermes_cli/config.py _merge_managed_overlay, _deep_merge).
# Hermes ignores this file silently when it does not parse, so koinon-hermes refuses to start
# unless Hermes's own loader reads it. No ${VAR} here: managed values expand against the
# process environment only, and nothing in this file needs it. See flavors/hermes/README.md.

# The tools an ACP session gets: files, terminal, todo list and the Koinon MCP server. Naming
# the MCP server makes the list an allowlist; memory, skills, session search, web, browser,
# delegation, code execution and any other MCP server are not in it.
platform_toolsets:
  acp: [file, terminal, todo, koinon]
agent:
  disabled_toolsets: [memory, skills, session_search, web, browser, delegation, code_execution, cronjob]

# Self-improvement off (plan item F2): no memory or user profile, no nudges to save memories or
# create skills, no skills from elsewhere, no curator, no background review of finished turns.
memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0
  provider: ""
skills:
  creation_nudge_interval: 0
  external_dirs: []
  auto_load: []
  project_discovery: false
  trusted_project_dirs: []
curator:
  enabled: false
auxiliary:
  background_review:
    enabled: false

# Every dangerous terminal command asks over ACP, where koinon-agentd answers; no guardian model
# approves on its own, and nothing is allowed permanently.
approvals:
  mode: manual
  deny: []
command_allowlist: []

# Commands run in the sandbox, not on a remote backend.
terminal:
  backend: local

# No Python plugins from the home, and no shell hooks: each hook event is pinned to an empty list
# (the image build checks that this covers every event Hermes knows), and new hooks are never
# accepted without consent.
plugins:
  enabled: []
hooks_auto_accept: false
hooks:
  agent_loop_stopped: []
  api_request_error: []
  gateway_platform_event: []
  kanban_task_blocked: []
  kanban_task_claimed: []
  kanban_task_completed: []
  on_human_input_request: []
  on_human_input_resolved: []
  on_interim_message: []
  on_kanban_dispatch_tick: []
  on_kanban_task_updated: []
  on_kanban_worker_exited: []
  on_kanban_worker_spawned: []
  on_kanban_worker_stale_claim: []
  on_room_member_activity: []
  on_session_delete: []
  on_session_end: []
  on_session_finalize: []
  on_session_reset: []
  on_session_start: []
  on_skill_lifecycle: []
  on_stream_delta: []
  on_stream_end: []
  on_stream_start: []
  post_api_request: []
  post_approval_response: []
  post_auxiliary_call: []
  post_compaction: []
  post_gateway_admission: []
  post_llm_call: []
  post_tool_call: []
  pre_api_request: []
  pre_approval_request: []
  pre_auxiliary_call: []
  pre_command: []
  pre_gateway_dispatch: []
  pre_llm_call: []
  pre_tool_call: []
  pre_transcription: []
  pre_verify: []
  subagent_start: []
  subagent_stop: []
  transform_llm_output: []
  transform_terminal_output: []
  transform_tool_result: []

# No packages installed at run time.
security:
  allow_lazy_installs: false
