#
# Hermes Agent configuration for the Koinon Hermes flavor. Read-only in the image at
# /etc/koinon/hermes/config.yaml; koinon-hermes links it as $HERMES_HOME/config.yaml, the only
# place Hermes reads its config from. Hermes expands ${VAR} in every string value after parsing
# (hermes_cli/config.py, _expand_env_vars); the KOINON_* values come from koinon-hermes's
# arguments, OPENAI_API_KEY is the agent's agentgateway key, an OpenShell placeholder inside a
# sandbox. See flavors/hermes/README.md for the source of each switch.

# Hermes 0.22.3's config schema version (hermes_cli/config_defaults.py). Without it Hermes
# takes the file for a pre-v12 config and tries to migrate it.
_config_version: 51

model:
  provider: custom
  base_url: "${KOINON_MODEL_BASE_URL}"
  default: "${KOINON_MODEL}"
  key_env: OPENAI_API_KEY

mcp_servers:
  koinon:
    url: "${KOINON_MCP_URL}"
    headers:
      Authorization: "Bearer ${OPENAI_API_KEY}"
    # Only the server's tools, not Hermes's resource and prompt helpers.
    tools:
      resources: false
      prompts: false

# The tools an ACP session gets: files, terminal, todo list and the Koinon MCP server. Naming
# the MCP server makes the list an allowlist; memory, skills, session search, web, browser,
# delegation and code execution are not in it.
platform_toolsets:
  acp: [file, terminal, todo, koinon]
agent:
  disabled_toolsets: [memory, skills, session_search, web, browser, delegation, code_execution, cronjob]

# Self-improvement off: no memory or user profile, no nudges to save memories or create
# skills, no curator, no background review of finished turns.
memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0
  provider: ""
skills:
  creation_nudge_interval: 0
curator:
  enabled: false
auxiliary:
  background_review:
    enabled: false

# Phone-home off: update and plugin update checks, shared metrics, lazy package installs.
updates:
  check: false
plugins:
  auto_update_check_hours: 0
telemetry:
  shared_metrics:
    enabled: false
    send: false
security:
  allow_lazy_installs: false
