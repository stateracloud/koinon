version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: store
        out: internal/db/store
        sql_package: pgx/v5
        emit_json_tags: false
        emit_interface: true
