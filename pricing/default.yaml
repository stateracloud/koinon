        prices: {input: "20", output: "75", cache_read: "2", cache_write: "25"}
    tokenizer: tiktoken:o200k_base
    ratio: "3.0"
    max_output: 128000
    hidden_thinking: true
    source: {url: "https://developers.openai.com/api/docs/pricing", accessed: 2026-11-12}
    note: "OpenAI pricing page 2026-10-24; cache_write is the 30-minute write price; above 272K input tokens the whole request is billed at the tier. The page does not name the tokenizer for gpt-6; o200k_base (the encoding of gpt-4o and gpt-5) is assumed and calibration can only raise estimates. max_output taken from OpenRouter models API top_provider.max_completion_tokens (2026-10-24), not from the provider page. Prices re-read 2026-11-12 from the source page: unchanged."
