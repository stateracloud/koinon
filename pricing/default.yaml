# Koinon default price list (plan item PV2, ADR 0056 amendment 2026-10-24).
#
# Prices are USD per 1,000,000 tokens, taken only from the provider's own pricing page (or, for
# OpenRouter routes, OpenRouter's models API, which is its price list). Each entry cites the page
# and the date it was read. A model whose price could not be verified from a primary source is
# left out: add it to the list in a pull request that cites the page. Org admins override any
# entry; they never edit this file. See docs/dev/prices.md for the update process.
#
# valid_from is the earliest date Koinon applies the entry (the day the price was verified).
# Change a price by adding an entry with the same id, the new price and a later valid_from, so
# ledger entries keep citing the price they used. Bump `version` with every change.
# hidden_thinking: the model bills reasoning the response may not show. max_output: the largest
# output in tokens; an aborted response without usage settles output at the request's max_tokens
# (or max_output when the request's limit was not logged).
# tokenizer/ratio estimate usage a provider did not report: ratio is UTF-8 bytes per token
# (Claude before Opus 4.7: 3.0; Opus 4.7 and later: 2.3; others 3.0; see
# docs/research/claude-token-estimation.md).
version: "2026-11-12.1"
entries:
  - id: ollama-local
    provider: ollama
    not_hosts: [ollama.com]
    match: {glob: "*"}
    valid_from: 2026-10-24
    prices: {input: "0", output: "0"}
    tokenizer: bytes
    ratio: "3.0"
    source: {url: "https://ollama.com/", accessed: 2026-10-24}
    note: "Runs on the org's own hardware; no provider bills tokens, so the price is zero. Not for ollama.com or its subdomains: Ollama cloud bills per token (ollama.com/pricing, read 2026-11-07), so a model there is unpriced until an admin sets an org price."
  - id: openrouter-deepseek-v4-1-flash
    provider: openrouter
    match: {glob: "deepseek/deepseek-v4.1-flash"}
    valid_from: 2026-10-24
    prices: {input: "0.02", output: "1", cache_read: "0.015"}
    tokenizer: bytes
    ratio: "3.0"
    max_output: 943718
    source: {url: "https://openrouter.ai/api/v1/models", accessed: 2026-10-24}
    note: "OpenRouter models API 2026-10-24: prompt 0.00000002, completion 0.000001, input_cache_read 0.000000015 USD per token; same on openrouter.ai/deepseek/deepseek-v4.1-flash. max_output from OpenRouter models API top_provider.max_completion_tokens (2026-10-24)."
  - id: openrouter-deepseek-v4-1-flash
    provider: openrouter
    match: {glob: "deepseek/deepseek-v4.1-flash"}
    valid_from: 2026-10-28
    prices: {input: "0.14", output: "0.42", cache_read: "0.0042"}
    tokenizer: bytes
    ratio: "3.0"
    max_output: 131072
    source: {url: "https://openrouter.ai/api/v1/models", accessed: 2026-10-28}
    note: "OpenRouter models API 2026-10-28: prompt 0.00000014, completion 0.00000042, input_cache_read 0.0000000042 USD per token; max_output from top_provider.max_completion_tokens. models.dev agrees. The 2026-10-24 entry above stays for ledger history."
  - id: openrouter-deepseek-v4-1-flash
    provider: openrouter
    match: {glob: "deepseek/deepseek-v4.1-flash"}
    valid_from: 2026-11-12
    prices: {input: "0.3", output: "1.2", cache_read: "0.006"}
    tokenizer: bytes
    ratio: "3.0"
    max_output: 943718
    source: {url: "https://openrouter.ai/api/v1/models", accessed: 2026-11-12}
    note: "OpenRouter models API 2026-11-12: prompt 0.0000003, completion 0.0000012, input_cache_read 0.000000006 USD per token (the list price; OpenRouter routes to endpoints priced differently, see #47). max_output from top_provider.max_completion_tokens (943718; the 131072 of the 2026-10-28 entry is the value of the :batch variant). Replaces the 2026-10-28 entry for new requests, which stays for ledger history. The issue text quoted 0.045/0.5 read on 2026-10-31; the live value on 2026-11-12 is the one stored."
  - id: openai-gpt-6-astra
