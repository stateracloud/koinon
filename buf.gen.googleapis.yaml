# SPDX-License-Identifier: Apache-2.0
#
# TypeScript for google.rpc.ErrorInfo, so the web client reads the reason of a trace error with
# err.findDetails(ErrorInfoSchema) instead of decoding the wire by hand (web/src/lib/trace-errors.ts). Kept
# apart from buf.gen.yaml so that Koinon's protos stay the only buf workspace module and no Go is generated
# for googleapis (the Go side uses google.golang.org/genproto, and a second copy would register twice). It
# runs after buf.gen.yaml, whose clean step empties web/src/gen. The commit pins the googleapis module.
version: v2
inputs:
  - module: buf.build/googleapis/googleapis:8ac61b9e502343289c8c42b17aa5b245 # gitleaks:allow (a buf module commit, not a secret)
    paths:
      - google/rpc/error_details.proto
plugins:
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: [target=ts, ts_nocheck=true]
