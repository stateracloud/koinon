# SPDX-License-Identifier: Apache-2.0
#
# Koinon admin API (ADR 0056, plan item PV1). REST under /admin/v1, apart from the UI's
# connect-rpc API. Bearer tokens only: an org-scoped token with the role admin or owner,
# created in the UI or with this API. Every call is audited with the token's ID.
#
# The file declares OpenAPI 3.1 but uses only constructs that also exist in 3.0 (no type
# arrays, no `null` types): the code generator pinned in go.mod (oapi-codegen) reads 3.0 and
# warns on 3.1 documents.
openapi: 3.1.0
info:
  title: Koinon admin API
  version: 1.0.0
  description: |
    Manage an org's model providers, models, remote MCP servers, prices, budgets and API tokens, and read its audit log. The org is the token's org.
    Providers and models declared by a labelled Kubernetes Secret (`koinon.dev/secret-type:
    model-provider`) are read-only here: changing or deleting them answers 409 and names the
    Secret. When the Secret is deleted they stay, disabled and `removed`, and may then be deleted.
    Remote MCP servers (`koinon.dev/secret-type: mcp-server`) follow the same rules. Secret values are never
    returned. A token can create tokens only with the same or a lower
    role and an expiry no later than its own; revoking a token revokes the tokens it created.
    Repeated bad tokens from one client are answered 429 with Retry-After.
  license:
    name: Apache-2.0
servers:
  - url: /admin/v1
security:
  - bearerAuth: []
tags:
  - name: providers
  - name: agents
  - name: models
  - name: mcp
  - name: leak-guard
  - name: outward
  - name: org-settings
  - name: tokens
  - name: prices
  - name: budgets
  - name: audit
paths:
  /providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: List the org's providers, entered and declared.
      responses:
        "200":
          description: The providers, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [providers]
      operationId: createProvider
      summary: Add a provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCreate"
      responses:
        "201":
          description: The provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Error"
  /providers/{providerId}:
    parameters:
      - $ref: "#/components/parameters/providerId"
    get:
      tags: [providers]
      operationId: getProvider
      summary: Get a provider.
      responses:
        "200":
          description: The provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [providers]
      operationId: updateProvider
      summary: Change a provider's type, URL or key. Declared providers answer 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: The provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [providers]
      operationId: deleteProvider
      summary: Delete a provider and its models. Declared providers answer 409.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /providers/{providerId}/echo-check:
    parameters:
      - $ref: "#/components/parameters/providerId"
    post:
      tags: [providers]
      operationId: checkProviderEcho
      summary: Check whether the provider changes the text it is sent.
      description: |
        Sends one tiny chat request through the gateway to the given model of the provider, asking
        it to repeat a fixed line (a name, an address-like string and a Kubernetes namespace)
        exactly, and compares the reply with the line. A provider-side setting that masks personal
        data, such as OpenRouter's, changes the line, and masking corrupts agent work: names, paths
        and namespaces in prompts and tool calls are no longer the ones the agent meant. The request
        is metered like any request. It runs only when called; nothing schedules it. The latest
        result is kept on the provider (`echoCheck`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EchoCheckRequest"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EchoCheck"
        default:
          $ref: "#/components/responses/Error"
  /mcp-servers:
    get:
      tags: [mcp]
      operationId: listMcpServers
      summary: List the org's remote MCP servers, entered and declared, with their health.
      responses:
        "200":
          description: The servers, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerList"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [mcp]
      operationId: createMcpServer
      summary: |
        Add a remote MCP server. A server that asks each user to sign in with OAuth is refused (planned
        for v0.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpServerCreate"
      responses:
        "201":
          description: The server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServer"
        default:
          $ref: "#/components/responses/Error"
  /mcp-servers/{serverId}:
    parameters:
      - $ref: "#/components/parameters/serverId"
    get:
      tags: [mcp]
      operationId: getMcpServer
      summary: Get a server.
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServer"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [mcp]
      operationId: updateMcpServer
      summary: Change a server's URL, transport or credential. Declared servers answer 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpServerUpdate"
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServer"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [mcp]
      operationId: deleteMcpServer
      summary: Delete a server, its tools and the agents' allowances of it. Declared servers answer 409.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /mcp-servers/{serverId}/data-class:
    parameters:
      - $ref: "#/components/parameters/serverId"
    put:
      tags: [mcp]
      operationId: setMcpServerDataClass
      summary: "Set what a server exposes, its kind and the legs of the leak guard it carries. Audited."
      description: |
        Works for declared servers too: the declaring Secret does not carry it. A server nobody
        classified is kind `other` with both legs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpServerDataClass"
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServer"
        default:
          $ref: "#/components/responses/Error"
  /mcp-servers/{serverId}/tools:
    parameters:
      - $ref: "#/components/parameters/serverId"
    get:
      tags: [mcp]
      operationId: listMcpTools
      summary: The server's tools with their tiers and review flags.
      responses:
        "200":
          description: The tools, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpToolList"
        default:
          $ref: "#/components/responses/Error"
  /mcp-servers/{serverId}/tools/{toolName}/tier:
    parameters:
      - $ref: "#/components/parameters/serverId"
      - $ref: "#/components/parameters/toolName"
    put:
      tags: [mcp]
      operationId: setMcpToolTier
      summary: |
        Move a tool to a tier: `ask` (a human approves each call), `auto` (the agent calls it) or
        `never`. Works on declared servers too. Clears the tool's review flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpToolTierUpdate"
      responses:
        "200":
          description: The tool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTool"
        default:
          $ref: "#/components/responses/Error"
  /mcp-servers/{serverId}/tools/{toolName}/sink:
    parameters:
      - $ref: "#/components/parameters/serverId"
      - $ref: "#/components/parameters/toolName"
    put:
      tags: [mcp]
      operationId: setMcpToolSink
      summary: "Declare a tool's sink class, its address arguments and what its results carry. Audited."
      description: |
        ADR 0091. The class is `fixed` (one of `none`, `internal`, `external-low`, `external-high`) or
        derived per call from the address arguments: `code_host` takes the owner and repo arguments, in
        that order, and is internal only for a non-public repository in the org's code-host scope;
        `fetch` takes the url argument and is internal for a fetch-trusted host, otherwise
        external-low. The other arguments are payload. A tool nobody declared is `external-high` with
        the server's legs, which is also what a changed server URL or tool content hash puts it back to.
        Works on declared servers too. `contentHash` is the hash of the tool the caller reviewed: if the
        server republished the tool since, the call fails with 409 and nothing changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpToolSinkUpdate"
      responses:
        "200":
          description: The tool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTool"
        default:
          $ref: "#/components/responses/Error"
  /mcp-servers/{serverId}/tools/{toolName}/two-approvers:
    parameters:
      - $ref: "#/components/parameters/serverId"
      - $ref: "#/components/parameters/toolName"
    put:
      tags: [mcp]
      operationId: setMcpToolTwoApprovers
      summary: |
        Require two approvers for calls to a tool in the ask tier: distinct admins or owners, neither the
        ticket's creator. Off by default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpToolTwoApprovers"
      responses:
        "200":
          description: The tool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTool"
        default:
          $ref: "#/components/responses/Error"
  /mcp-servers/{serverId}/tools/{toolName}/review:
    parameters:
      - $ref: "#/components/parameters/serverId"
      - $ref: "#/components/parameters/toolName"
    post:
      tags: [mcp]
      operationId: acknowledgeMcpToolReview
      summary: Mark a changed tool as reviewed without changing its tier.
      responses:
        "200":
          description: The tool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTool"
        default:
          $ref: "#/components/responses/Error"
  /agents/{agentId}/mcp-servers:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [mcp]
      operationId: getAgentMcpServers
      summary: The servers an agent may use.
      responses:
        "200":
          description: The allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMcpServers"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [mcp]
      operationId: setAgentMcpServers
      summary: |
        Replace the servers an agent may use, each optionally narrowed to some tools. Tools are
        offered by tier; a tool the server adds later enters the ask tier for an agent that allows the
        whole server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentMcpServers"
      responses:
        "200":
          description: The allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMcpServers"
        default:
          $ref: "#/components/responses/Error"
  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: List the org's models, entered and declared.
      responses:
        "200":
          description: The models, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [models]
      operationId: createModel
      summary: Add a model to a provider. Its price is an org price or a default one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCreate"
      responses:
        "201":
          description: The model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCreated"
        default:
          $ref: "#/components/responses/Error"
  /models/{modelId}:
    parameters:
      - $ref: "#/components/parameters/modelId"
    get:
      tags: [models]
      operationId: getModel
      summary: Get a model.
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [models]
      operationId: updateModel
      summary: Change a model's routing guard. Declared models answer 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpdate"
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [models]
      operationId: deleteModel
      summary: Delete a model. Declared models answer 409.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /default-model:
    get:
      tags: [models]
      operationId: getDefaultModel
      summary: The org's default model, which agents without a model setting run on.
      responses:
        "200":
          description: The default model; `model` is absent when the org has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultModel"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [models]
      operationId: setDefaultModel
      summary: Set the org's default model, or clear it by leaving `model` out. Audited.
      description: |
        The model must be one the org serves and has a price for. The org's first model becomes its
        default on its own; nothing else changes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefaultModel"
      responses:
        "200":
          description: The default model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultModel"
        default:
          $ref: "#/components/responses/Error"
  /run-content-retention:
    get:
      tags: [org-settings]
      operationId: getRunContentRetention
      summary: How long a finished run's stored content is kept (issue #69), with the default and bounds.
      responses:
        "200":
          description: The retention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunContentRetention"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [org-settings]
      operationId: setRunContentRetention
      summary: Set the retention in days, or return it to the default (30) by leaving `days` out. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunContentRetentionSettings"
      responses:
        "200":
          description: The retention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunContentRetention"
        default:
          $ref: "#/components/responses/Error"
  /home-backup-retention:
    get:
      tags: [org-settings]
      operationId: getHomeBackupRetention
      summary: How long an old home backup repository is kept after a key change (issue #219), with the default and bounds.
      responses:
        "200":
          description: The retention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeBackupRetention"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [org-settings]
      operationId: setHomeBackupRetention
      summary: Set the retention in days, or return it to the default (7) by leaving `days` out. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeBackupRetentionSettings"
      responses:
        "200":
          description: The retention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeBackupRetention"
        default:
          $ref: "#/components/responses/Error"
  /leak-guard:
    get:
      tags: [leak-guard]
      operationId: getLeakGuard
      summary: The org's leak-guard settings, with defaults filled in, and its fetch-trusted host list.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeakGuard"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [leak-guard]
      operationId: setLeakGuard
      summary: Set the match threshold, or return it to the default by leaving `matchThreshold` out. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeakGuardSettings"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeakGuard"
        default:
          $ref: "#/components/responses/Error"
  /leak-guard/trusted-hosts:
    post:
      tags: [leak-guard]
      operationId: addFetchTrustedHost
      summary: Put a host on the fetch-trusted list, which the automatic URL rule exempts. Audited.
      description: |
        The list starts empty. An entry is a bare DNS name, which trusts exactly that host, or `*.` and a DNS name (`*.example.com`), which trusts every subdomain at any depth but not `example.com` itself. A wildcard over a public suffix (`*.com`, `*.co.uk`) is refused. Adding an entry already on the list changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchTrustedHost"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeakGuard"
        default:
          $ref: "#/components/responses/Error"
  /leak-guard/trusted-hosts/{host}:
    delete:
      tags: [leak-guard]
      operationId: removeFetchTrustedHost
      summary: Take a host off the fetch-trusted list. Audited.
      parameters:
        - name: host
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeakGuard"
        default:
          $ref: "#/components/responses/Error"
  /outward-targets/{kind}/{targetId}/disabled:
    parameters:
      - name: kind
        in: path
        required: true
        schema: {$ref: "#/components/schemas/OutwardTargetKind"}
      - name: targetId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      tags: [outward]
      operationId: setOutwardTargetDisabled
      summary: "Switch one outward target off or on. Audited as outward.disable or outward.enable."
      description: |
        The one switch for MCP servers, model providers, code-host connections and trace destinations (ADR
        0110 decision 5). A disabled target is not called, not probed and not offered to runs; it keeps its
        bindings and its credential. It works for declared targets too, and it is separate from their
        system states. Setting the state a target already has changes and audits nothing.
        Disabling is allowed while the install is held for a restore. Enabling then answers 409. A target whose declaring Secret says `disabled: true`
        cannot be enabled here (409); remove the field from the Secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutwardTargetDisabled"
      responses:
        "200":
          description: The target's switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutwardTargetState"
        default:
          $ref: "#/components/responses/Error"
  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: List the org's API tokens, newest first.
      responses:
        "200":
          description: The tokens, without their secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create an API token. The secret is shown once.
      description: |
        The token carries the role you ask for, at most the calling token's role. It expires
        after `expiresIn` seconds: 30 days by default, between 1 hour and 90 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
      responses:
        "201":
          description: The token and its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
        default:
          $ref: "#/components/responses/Error"
  /tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/tokenId"
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke a token. Revoking twice is fine.
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"
  /prices:
    get:
      tags: [prices]
      operationId: listPrices
      summary: List the org's own prices, every version, newest first per name.
      description: |
        An org price wins over the default price list. (Rates set on a model were folded into
        org prices; see ADR 0056.) Each version applies from its `validFrom`; requests before it keep the price
        they were charged at.
      responses:
        "200":
          description: The org's price versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceList"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [prices]
      operationId: setPrice
      summary: Add a version of a named price. Earlier versions never change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceInput"
      responses:
        "201":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceSaved"
        default:
          $ref: "#/components/responses/Error"
  /prices/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    delete:
      tags: [prices]
      operationId: retirePrice
      summary: End a named price now. Its versions stay for the ledger entries that cite them.
      responses:
        "204":
          description: Retired.
        default:
          $ref: "#/components/responses/Error"
  /prices/defaults:
    get:
      tags: [prices]
      operationId: getDefaultPrices
      summary: The default price list this installation runs and the versions before it.
      responses:
        "200":
          description: The default list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultPrices"
        default:
          $ref: "#/components/responses/Error"
  /prices/defaults/changes:
    get:
      tags: [prices]
      operationId: getDefaultPriceChanges
      summary: What changed in the default price list between two versions (after an upgrade).
      description: |
        Without `from`, the version before `to`; without `to`, the current version.
      parameters:
        - {name: from, in: query, required: false, schema: {type: string}}
        - {name: to, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultPriceChanges"
        default:
          $ref: "#/components/responses/Error"
  /prices/flagged:
    get:
      tags: [prices]
      operationId: listFlaggedPrices
      summary: Price entries whose recomputed cost differs from the gateway's by more than 1%.
      parameters:
        - name: since
          in: query
          required: false
          description: RFC 3339 time; default 7 days ago.
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: The flagged entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlaggedPriceList"
        default:
          $ref: "#/components/responses/Error"
  /spend:
    get:
      tags: [budgets]
      operationId: getSpendReport
      summary: Spend per model, with estimated usage shown apart from reported usage.
      parameters:
        - name: since
          in: query
          required: false
          description: RFC 3339 time; default the start of the current month (UTC).
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendReport"
        default:
          $ref: "#/components/responses/Error"
  /budget:
    get:
      tags: [budgets]
      operationId: getBudget
      summary: The org's monthly cap (calendar month, UTC), its platform ceiling and this month's spend.
      responses:
        "200":
          description: The budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgBudget"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [budgets]
      operationId: setBudget
      summary: Set the org's monthly cap, or clear it by leaving `monthlyCapUsd` out.
      description: |
        The cap cannot exceed the platform ceiling, which only a platform admin sets (in the UI).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgBudgetUpdate"
      responses:
        "200":
          description: The budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgBudget"
        default:
          $ref: "#/components/responses/Error"
  /agents/{agentId}/budget:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [budgets]
      operationId: getAgentBudget
      summary: An agent's daily limit (UTC day) and today's spend.
      responses:
        "200":
          description: The agent's budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBudget"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [budgets]
      operationId: setAgentBudget
      summary: Set an agent's daily limit. A template's spendUSD is only the default for a new agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentBudgetUpdate"
      responses:
        "200":
          description: The agent's budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBudget"
        default:
          $ref: "#/components/responses/Error"
  /agents/{agentId}/model:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [agents]
      operationId: getAgentModel
      summary: The model an agent's next run uses, and where that choice comes from.
      responses:
        "200":
          description: The agent's model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentModel"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [agents]
      operationId: setAgentModel
      summary: Set an agent's model, or clear it with `default`.
      description: |
        A setting of the agent, not a new version: it applies to the next run. The model must be
        one the org serves and has a price for. The change is audited with the old and new value.
        Precedence: this setting, then the active version's model, then the org default. If the
        model later stops being served or priced, the agent's runs fail with a reason that says so,
        until the setting is changed; they never fall back to another model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentModelUpdate"
      responses:
        "200":
          description: The agent's model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentModel"
        default:
          $ref: "#/components/responses/Error"
  /agents/{agentId}/thinking:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      tags: [agents]
      operationId: setAgentThinking
      summary: Turn an agent's thinking on or off, or clear the setting.
      description: |
        Thinking is on unless somebody turns it off (ADR 0069 amendment 2026-10-29). A setting of
        the agent, not a new version: it applies to the next run. Precedence: this setting, then
        the active version's value (a template's `spec.model.thinking`), then the default, on. A
        model that cannot think ignores the setting; the response says so (`thinking.supported`).
        `off` is refused with "this model always thinks" when the model the next run would use
        always thinks (`thinking.alwaysThinks`); an `off` stored earlier, or a version's `off`, then
        runs with thinking on and the response says so (`thinking.offOverridden`).
        The change is audited with the old and new value. Reasoning tokens are billed as output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentThinkingUpdate"
      responses:
        "200":
          description: The agent's model, with its thinking state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentModel"
        default:
          $ref: "#/components/responses/Error"
  /agents/{agentId}/triggers/{triggerId}/run:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: triggerId
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$'}
    post:
      tags: [agents]
      operationId: runAgentTrigger
      summary: Fire a schedule trigger now ("run now").
      description: |
        Fires one schedule trigger of the agent's active version immediately, through the same path
        the scheduler uses: a task created by the trigger, with the trigger's instruction and a
        queued run. The agent's status, health, concurrency limit and budgets apply as they do to
        a scheduled fire. The task's events record `fire: manual`, so reports can tell the two
        apart. Answers 409 when the agent cannot take a run (not active, or unhealthy) and 404 when
        the active version has no such schedule trigger.
      responses:
        "202":
          description: The task that was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerRun"
        default:
          $ref: "#/components/responses/Error"
  /audit:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: Read the org's audit log, newest first.
      description: |
        The org is the token's org: a token never reads another org's events. Filters combine with
        AND. Page with `pageToken` from the previous page's `nextPageToken`; the last page has none.
        Each event carries its place in the org's hash chain (ADR 0023).

        `scope=install` reads the install-level chain instead (platform prices and other actions that
        belong to no org, ADR 0100). It needs a token whose root user is a platform admin, checked on
        every request; any other token gets 403.
      parameters:
        - name: scope
          in: query
          required: false
          description: "`org` (the default) or `install`."
          schema: {type: string, enum: [org, install]}
        - name: since
          in: query
          required: false
          description: RFC 3339 time; keeps events created at or after it.
          schema: {type: string, format: date-time}
        - name: until
          in: query
          required: false
          description: RFC 3339 time; keeps events created before it.
          schema: {type: string, format: date-time}
        - name: actionPrefix
          in: query
          required: false
          description: Keeps events whose action starts with it, for example `approval.` or `agent.create`.
          schema: {type: string}
        - name: actorKind
          in: query
          required: false
          schema: {type: string, enum: [user, token, agent, secret, system, cli]}
        - name: actorId
          in: query
          required: false
          description: Keeps the events of one actor; needs `actorKind`.
          schema: {type: string}
        - name: pageSize
          in: query
          required: false
          description: 50 by default, at most 200.
          schema: {type: integer, minimum: 1, maximum: 200}
        - name: pageToken
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        default:
          $ref: "#/components/responses/Error"
  /audit/export:
    get:
      tags: [audit]
      operationId: exportAudit
      summary: Export an audit chain as JSON lines, verifiable off the cluster.
      description: |
        Streams the chain as `application/x-ndjson`, format `koinon.audit.export.v1` (ADR 0100): a
        header line, then one line per event in `chain_seq` order with every hashed field. Check a
        copy with `koinon-api audit verify --file`; the format and the hash encoding are in the
        audit guide on the docs site.

        The scope rules are those of the read (`GET /audit`). `scope=org` (the default) exports the
        token's org; `org` may name it but never another org (403). `scope=install` needs a token whose
        root user is a platform admin, checked on every request; any other token gets 403.
      parameters:
        - name: scope
          in: query
          required: false
          description: "`org` (the default) or `install`."
          schema: {type: string, enum: [org, install]}
        - name: org
          in: query
          required: false
          description: With `scope=org`, the token's own org; any other org is 403.
          schema: {type: string, format: uuid}
        - name: fromSeq
          in: query
          required: false
          description: Start at this `chain_seq` (a partial export); 1 by default.
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: The chain as JSON lines.
          content:
            application/x-ndjson:
              schema: {type: string, format: binary}
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An admin API token, `koinon_<prefix>_<secret>`.
  parameters:
    providerId:
      name: providerId
      in: path
      required: true
      schema: {type: string, format: uuid}
    modelId:
      name: modelId
      in: path
      required: true
      schema: {type: string, format: uuid}
    tokenId:
      name: tokenId
      in: path
      required: true
      schema: {type: string, format: uuid}
    serverId:
      name: serverId
      in: path
      required: true
      schema: {type: string, format: uuid}
    toolName:
      name: toolName
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
  responses:
    Error:
      description: |
        An error. 400 invalid request, 401 missing, wrong, expired or revoked token, 403 the
        token's role is too low, 404 not found, 409 the entry is declared by a Secret or
        the name is taken, 503 the service is temporarily unavailable (Retry-After may be set).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {$ref: "#/components/schemas/ErrorCode"}
            message: {type: string}
    ErrorCode:
      type: string
      enum: [invalid_request, unauthenticated, permission_denied, not_found, conflict, unavailable, internal]
    Source:
      type: string
      enum: [ui, secret]
      description: '`secret` entries are declared by a Kubernetes Secret and read-only here.'
    Provider:
      type: object
      required: [id, name, type, url, hasKey, hasCostKey, formats, source, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, example: openrouter}
        type:
          type: string
          description: The upstream's provider type (agentgateway providerOverride).
          example: openrouter
        url: {type: string, example: "https://openrouter.ai/api/v1"}
        hasKey:
          type: boolean
          description: Whether an API key is stored. The key itself is never returned.
        credentialLostAt:
          type: string
          format: date-time
          description: >-
            Set when the API key was lost with the key that encrypted it (`koinon-api keys forget`):
            the provider is not served until the key is entered again.
        adminDisabled:
          $ref: "#/components/schemas/OutwardAdminDisabled"
        anthropicWorkspaceId:
          type: string
          example: wrkspc_01AbCdEf
          description: The Anthropic workspace the gateway names for this provider's models. Only for type `anthropic`; unset when not given.
        hasCostKey:
          type: boolean
          description: Whether a cost API key is stored. The key itself is never returned.
        costScope:
          type: string
          description: The workspace, project or API key whose cost the daily reconciliation compares with the ledger. Unset without a cost API key.
        costKeyLostAt:
          type: string
          format: date-time
          description: Set when the cost API key was lost with the key that encrypted it; enter it again.
        formats:
          type: array
          items: {$ref: "#/components/schemas/ModelFormat"}
          description: The model formats the provider's type offers, preferred first (ADR 0069).
        servingState:
          type: string
          enum: [saved, serving, failed]
          description: >-
            Whether the gateway serves the provider, from what the reconciler recorded (it never reads the
            gateway). `saved`: not served yet, the reconciler applies it on its next pass. `serving`: every
            enabled model is served. `failed`: the gateway does not serve it and `servingReason` says why.
            Unset when the provider is disabled, removed or has no enabled model.
        servingReason:
          type: string
          description: Set with `servingState` `failed`; one of `no key`, `gateway rejected config`, `upstream unreachable`, `unknown`.
        servingDetail:
          type: string
          description: What the gateway or the reconciler said about the failure, for an admin; never a key.
        source: {$ref: "#/components/schemas/Source"}
        managedBySecret:
          type: string
          description: The declaring Secret, for source `secret`.
        disabledReason:
          type: string
          description: Set while a declared provider of the same name shadows this one; it is not served.
        echoCheck: {$ref: "#/components/schemas/EchoCheck"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    EchoCheckRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: A model of the provider that the org serves and has a price for.
    EchoCheck:
      type: object
      required: [model, unchanged, sent, received, diff, checkedAt]
      description: The latest echo check of a provider.
      properties:
        model: {type: string}
        unchanged:
          type: boolean
          description: True when the reply was the line, character for character.
        sent: {type: string, description: The line the model was asked to repeat.}
        received: {type: string, description: The model's reply.}
        diff:
          type: array
          description: The difference between the line and the reply, in order.
          items:
            type: object
            required: [op, text]
            properties:
              op:
                type: string
                enum: [equal, deleted, inserted]
                description: "`deleted` is in the line but not in the reply, `inserted` the other way."
              text: {type: string}
        checkedAt: {type: string, format: date-time}
    AgentModel:
      type: object
      required: [setting, effective, source, available]
      properties:
        setting:
          type: string
          description: The agent's own setting; `default` when it has none.
        versionModel:
          type: string
          description: The active version's model; unset when it names none.
        effective:
          type: string
          description: The model the next run uses; empty when `source` is `none`.
        source:
          type: string
          enum: [agent, version, org_default, none]
          description: Where `effective` comes from, in order of precedence.
        problem:
          type: string
          description: Set when the agent's setting is no longer served or priced; runs fail until it is changed.
        available:
          type: array
          description: The models the org serves and has a price for.
          items:
            type: object
            required: [name, provider]
            properties:
              name: {type: string}
              provider: {type: string}
        thinking:
          $ref: "#/components/schemas/ThinkingState"
    ThinkingState:
      type: object
      description: The agent's thinking setting and what it resolves to (ADR 0069 amendment 2026-10-29).
      required: [setting, effective, supported, mode, alwaysThinks, offOverridden]
      properties:
        setting:
          type: string
          enum: [default, "on", "off"]
          description: The agent's own setting; `default` when it has none.
        versionSetting:
          type: string
          enum: ["on", "off"]
          description: The active version's value (a template's `spec.model.thinking`); unset when it names none.
        effective:
          type: string
          enum: ["on", "off"]
          description: What the layers resolve to, whether or not the model can think.
        supported:
          type: boolean
          description: Whether the effective model can think. When false the setting has no effect and a UI says "not supported by this model".
        mode:
          type: string
          enum: [none, default, adaptive-summarized, disabled, effort-none]
          description: >-
            The form the next run sends: `none` when the model does not think, `adaptive-summarized`
            or `default` for thinking on, `disabled` or `effort-none` for thinking off (ADR 0069
            amendment 2026-10-31).
        alwaysThinks:
          type: boolean
          description: >-
            Whether the effective model thinks whatever the setting. A UI then offers no off choice
            and says "this model always thinks"; setting `off` is refused with that message.
        offOverridden:
          type: boolean
          description: >-
            Whether the setting resolves to off and the model thinks anyway (it always thinks). The
            setting is kept for a model that can stop; runs think.
        notice:
          type: string
          description: >-
            What a UI shows about the setting: "this model always thinks; your off setting doesn't
            apply" when `offOverridden`, unset otherwise.
    AgentThinkingUpdate:
      type: object
      required: [thinking]
      properties:
        thinking:
          type: string
          enum: [default, "on", "off"]
          description: "`default` clears the setting."
    AgentModelUpdate:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: "`default`, or a model the org serves and has a price for."
    TriggerRun:
      type: object
      required: [taskId]
      properties:
        taskId: {type: string, format: uuid}
    ModelFormat:
      type: string
      example: anthropic
      description: |
        A model's wire format (ADR 0069). The set is open and grows with the formats Koinon supports;
        today `openai` is chat completions and `anthropic` is the Messages API. A provider's `formats`
        lists the values it accepts.
    ProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: {$ref: "#/components/schemas/Provider"}
    ProviderCreate:
      type: object
      required: [name, type, url]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$'
        type:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
        url: {type: string}
        apiKey:
          type: string
          description: Omit for keyless upstreams such as Ollama.
        anthropicWorkspaceId:
          type: string
          pattern: '^wrkspc_[A-Za-z0-9]+$'
          description: Only for type `anthropic`.
        costApiKey:
          type: string
          description: >-
            An admin key with which the daily reconciliation reads the provider's cost API. Write-only,
            never returned. Only for `anthropic` and `openai` providers at their own API URL; needs
            `costScope`.
        costScope:
          type: string
          example: wrkspc_01AbCdEf
          description: >-
            The part of the account whose cost is this provider's: the Anthropic workspace ID
            (`wrkspc_...`) or API key ID (`apikey_...`), or the OpenAI project ID (`proj_...`) or API key ID (`key_...`).
    ProviderUpdate:
      type: object
      properties:
        type: {type: string}
        url: {type: string}
        apiKey:
          type: string
          description: Replaces the key; an empty string removes it.
        anthropicWorkspaceId:
          type: string
          description: Replaces the workspace ID; an empty string removes it. Only for type `anthropic`.
        costApiKey:
          type: string
          description: >-
            Replaces the cost API key; an empty string removes it and its scope. Write-only, never
            returned. Only for `anthropic` and `openai` providers at their own API URL.
        costScope:
          type: string
          description: Replaces the cost scope. A cost API key needs one.
    McpServer:
      type: object
      required: [id, name, url, transport, hasCredential, source, health, kind, dataClass, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, example: tracker}
        url: {type: string, example: "https://mcp.example.com/mcp"}
        transport: {type: string, enum: [streamable-http, sse]}
        hasCredential:
          type: boolean
          description: Whether a credential is stored. The credential itself is never returned.
        credentialLostAt:
          type: string
          format: date-time
          description: >-
            Set when the credential was lost with the key that encrypted it (`koinon-api keys forget`):
            the server is not served until the credential is entered again.
        adminDisabled:
          $ref: "#/components/schemas/OutwardAdminDisabled"
        credentialHeader: {type: string, example: Authorization}
        credentialPrefix: {type: string, example: "Bearer "}
        source: {$ref: "#/components/schemas/Source"}
        managedBySecret: {type: string}
        disabledReason: {type: string}
        removed:
          type: boolean
          description: The declaring Secret was deleted; the server is disabled.
        health: {type: string, enum: [unknown, healthy, unhealthy]}
        healthReason:
          type: string
          description: Why the server is unhealthy.
        healthCheckedAt: {type: string, format: date-time}
        healthSince: {type: string, format: date-time}
        toolsSyncedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        kind: {$ref: "#/components/schemas/McpServerKind"}
        dataClass: {$ref: "#/components/schemas/McpDataClass"}
        codeHostConnectionId:
          type: string
          format: uuid
          description: The org's code-host connection the server acts through. Absent for none, which makes a code-host tool of the server external-high.
    McpServerKind:
      type: string
      enum: [fetch, search, other]
      description: What the server is for. `other` is the default.
    McpDataClass:
      type: array
      uniqueItems: true
      description: |
        The session legs (ADR 0091) the server's results can set: `untrusted_input` (returns text an
        outsider controls) and `private_data` (returns data the org does not want to leave). A server
        may carry both; empty carries none. A server nobody classified carries both. Where a call
        goes is not a server leg: it is the sink class of each tool.
      items:
        type: string
        enum: [untrusted_input, private_data]
    OutwardTargetKind:
      type: string
      enum: [mcp-server, model-provider, connection, trace-destination]
    OutwardAdminDisabled:
      type: object
      description: Present while an admin holds the target off (the outward switch). Absent means enabled.
      required: [at, by, declared]
      properties:
        at: {type: string, format: date-time}
        by:
          type: string
          description: The actor as the audit log reads it, for example `token <id>` or `secret <name>`.
        note: {type: string}
        declared:
          type: boolean
          description: "True when the declaring Secret says `disabled: true`; the API cannot enable it."
    OutwardTargetDisabled:
      type: object
      required: [disabled]
      properties:
        disabled: {type: boolean}
        note:
          type: string
          maxLength: 500
          description: Why. Kept while the target is disabled.
    OutwardTargetState:
      type: object
      required: [kind, targetId, name, disabled]
      properties:
        kind: {$ref: "#/components/schemas/OutwardTargetKind"}
        targetId: {type: string, format: uuid}
        name: {type: string}
        disabled: {type: boolean}
        disabledAt: {type: string, format: date-time}
        disabledBy:
          type: string
          description: The actor as the audit log reads it, for example `token <id>` or `secret <name>`.
        note: {type: string}
    McpServerDataClass:
      type: object
      required: [kind, dataClass]
      properties:
        kind: {$ref: "#/components/schemas/McpServerKind"}
        dataClass: {$ref: "#/components/schemas/McpDataClass"}
        codeHostConnectionId:
          type: string
          format: uuid
          description: |
            Link the server to one of the org's code-host connections (ADR 0091 decision 3). A code-host
            tool looks the repository up in that connection's list only. Leave out to unlink. A changed
            server URL clears the link.
    LeakGuard:
      type: object
      required: [matchThreshold, defaultMatchThreshold, minMatchThreshold, maxMatchThreshold, trustedHosts, codeHostScope]
      properties:
        matchThreshold:
          type: integer
          description: The shortest tainted text, in characters after normalisation, that blocks a call. Default 24.
        defaultMatchThreshold: {type: integer}
        minMatchThreshold: {type: integer}
        maxMatchThreshold: {type: integer}
        trustedHosts:
          type: array
          description: The fetch-trusted host list, sorted. Empty for a new org.
          items: {type: string}
        codeHostScope: {$ref: "#/components/schemas/CodeHostScope"}
    CodeHostScope:
      type: object
      description: |
        The org's code-host scope (ADR 0091): the repositories of its code-host connections with the
        visibility the connector last read. The code-host derivation calls a write internal only for a
        listed repository that is not public and whose reading is fresh.
      required: [repositories, private, internal, public, unknown, visibilityMaxAgeSeconds]
      properties:
        repositories: {type: integer}
        private: {type: integer}
        internal: {type: integer}
        public: {type: integer}
        unknown: {type: integer, description: Repositories whose visibility the connector could not read. They count as external-high.}
        stale:
          type: integer
          description: Repositories whose reading is older than the freshness window. They count as unknown.
        oldestCheckedAt: {type: string, format: date-time}
        visibilityMaxAgeSeconds: {type: integer}
    McpToolSinkUpdate:
      type: object
      required: [contentHash, sink]
      properties:
        contentHash:
          type: string
          description: The `contentHash` of the tool as the caller read it.
        sink: {$ref: "#/components/schemas/McpToolSink"}
    McpToolSink:
      type: object
      required: [sinkClass, derivation, addressArgs]
      properties:
        # Not an OpenAPI enum: the generator would name the constants Internal and Fetch, which collide
        # with the error codes and the server kinds. The service validates the values.
        sinkClass:
          type: string
          description: |
            `none`, `internal`, `external-low` or `external-high`. The fixed class of a tool; for a
            derived tool, the class of a call whose address arguments do not parse (`external-high`).
        derivation:
          type: string
          description: "`fixed` (use sinkClass), `code_host` (owner and repo arguments) or `fetch` (the url argument)."

        addressArgs:
          type: array
          items: {type: string}
          description: "The arguments that say where a call goes, in the order the derivation reads them: code_host [owner, repo], fetch [url]. Every other argument is payload."
        resultUntrustedInput:
          type: boolean
          description: The tool's results carry text an outsider controls. Leave out for the server's own leg.
        resultPrivateData:
          type: boolean
          description: The tool's results carry data the org does not want to leave. Leave out for the server's own leg.
    RunContentRetention:
      type: object
      required: [days, defaultDays, minDays, maxDays]
      description: >-
        Once a finished run is older than `days`, the purge job blanks the payload of its content events
        (messages, thoughts and tool calls) and strips the text from prompt, permission and refusal events,
        whose state fields stay. Other events, the run's status, traces and the spend ledger stay.
      properties:
        days: {type: integer}
        defaultDays: {type: integer}
        minDays: {type: integer}
        maxDays: {type: integer}
    RunContentRetentionSettings:
      type: object
      properties:
        days:
          type: integer
          description: Days to keep a finished run's content. Leave out for the default (30).
    HomeBackupRetention:
      type: object
      required: [days, defaultDays, minDays, maxDays]
      description: >-
        A key change starts a new backup repository for each agent's home. The old one stays readable for
        the checkpoints written to it for `days`, then it is deleted. The deadline is set when the new
        repository starts, so a change applies to later key changes only.
      properties:
        days: {type: integer}
        defaultDays: {type: integer}
        minDays: {type: integer}
        maxDays: {type: integer}
    HomeBackupRetentionSettings:
      type: object
      properties:
        days:
          type: integer
          description: Days to keep an old home backup repository. Leave out for the default (7).
    LeakGuardSettings:
      type: object
      properties:
        matchThreshold:
          type: integer
          description: Characters. Leave out for the default (24).
    FetchTrustedHost:
      type: object
      required: [host]
      properties:
        host: {type: string, example: docs.example.com}
    McpServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: {$ref: "#/components/schemas/McpServer"}
    McpServerCreate:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,22}[a-z0-9])?$'
          description: A DNS label of at most 24 characters. The gateway target is `<org slug>-<name>`.
        url: {type: string}
        transport: {type: string, enum: [streamable-http, sse], default: streamable-http}
        credentialHeader:
          type: string
          description: Defaults to Authorization when a credential value is given.
        credentialPrefix:
          type: string
          description: What precedes the secret in the header value, for example `Bearer `.
        credentialValue:
          type: string
          description: The secret. Omit for a server that needs none.
        kind: {$ref: "#/components/schemas/McpServerKind"}
        dataClass: {$ref: "#/components/schemas/McpDataClass"}
    McpServerUpdate:
      type: object
      properties:
        url: {type: string}
        transport: {type: string, enum: [streamable-http, sse]}
        credentialHeader: {type: string}
        credentialPrefix: {type: string}
        credentialValue:
          type: string
          description: Replaces the secret. Leave out to keep it while changing the header or prefix.
        removeCredential: {type: boolean}
    McpTool:
      type: object
      required: [serverId, name, description, readOnlyHint, tier, contentHash, descriptionOriginalLength, descriptionCapped, descriptionCleaned, present, firstSeenAt, lastSeenAt, sink]
      properties:
        serverId: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        readOnlyHint:
          type: boolean
          description: The server's own readOnlyHint annotation. A suggestion; an admin decides the tier.
        tier: {type: string, enum: [ask, auto, never]}
        reviewReason:
          type: string
          description: Set while the tool's description or input schema changed since an admin last reviewed it.
        requiresTwoApprovers:
          type: boolean
          description: A call in the ask tier needs two approvers.
        contentHash:
          type: string
          description: SHA-256 of the sanitised description and input schema as last published.
        descriptionOriginalLength:
          type: integer
          description: Length in characters of the description as the server published it. `description` is the sanitised text.
        descriptionCapped:
          type: boolean
          description: The description, or a description in the input schema, was cut to its length cap.
        descriptionCleaned:
          type: boolean
          description: Control, invisible or tag characters were removed, or harness-lookalike tags escaped, in the description or the input schema's strings.
        unavailable:
          type: string
          description: Why agents are not offered the tool, for example a name too long.
        present:
          type: boolean
          description: False once the server stopped listing the tool.
        firstSeenAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        tierSetBy: {type: string}
        tierSetAt: {type: string, format: date-time}
        sink: {$ref: "#/components/schemas/McpToolSink"}
    McpToolList:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items: {$ref: "#/components/schemas/McpTool"}
    McpToolTwoApprovers:
      type: object
      required: [required]
      properties:
        required: {type: boolean}
    McpToolTierUpdate:
      type: object
      required: [tier]
      properties:
        tier: {type: string, enum: [ask, auto, never]}
    AgentMcpServers:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            type: object
            required: [serverId]
            properties:
              serverId: {type: string, format: uuid}
              tools:
                type: array
                items: {type: string}
                description: Narrows the allowance to these tools. Omit to allow the whole server.
    Rates:
      type: object
      required: [input, output]
      deprecated: true
      description: |
        Deprecated and never returned. Setting it on a request answers 400: add a price with
        `POST /admin/v1/prices` instead.
      properties:
        input: {type: string, example: "0.30"}
        output: {type: string, example: "1.20"}
        cacheRead: {type: string, example: "0.03"}
    Model:
      type: object
      required: [id, providerId, name, guard, format, formatOverridden, source, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        providerId: {type: string, format: uuid}
        name:
          type: string
          description: The name agents use. The gateway serves it per org as `<org slug>/<name>`.
        guard:
          type: boolean
          description: The routing guard (ADR 0048), for OpenRouter providers.
        rates: {$ref: "#/components/schemas/Rates", deprecated: true}
        format: {$ref: "#/components/schemas/ModelFormat"}
        formatOverridden:
          type: boolean
          description: Whether an admin set the format. Otherwise it follows the default and is re-derived when the default changes.
        source: {$ref: "#/components/schemas/Source"}
        managedBySecret: {type: string}
        disabledReason: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ModelCreated:
      description: The model just created, with the warnings of the save.
      allOf:
        - $ref: "#/components/schemas/Model"
        - type: object
          properties:
            warnings:
              type: array
              items: {type: string}
              description: Only on this response. For example, the model's price has a cache_read price but its provider format cannot cache, so it runs uncached (ADR 0068).
    ModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: {$ref: "#/components/schemas/Model"}
    ModelCreate:
      type: object
      required: [providerId, name]
      properties:
        providerId: {type: string, format: uuid}
        name: {type: string}
        guard: {type: boolean}
        format:
          type: string
          description: A `ModelFormat` within what the provider offers. Omit for the default.
        rates: {$ref: "#/components/schemas/Rates", deprecated: true}
    ModelUpdate:
      type: object
      properties:
        guard: {type: boolean}
        format:
          type: string
          description: Overrides the format with a `ModelFormat` within what the provider offers. An empty string goes back to the default.
        rates: {$ref: "#/components/schemas/Rates", deprecated: true}
        clearRates:
          type: boolean
          deprecated: true
          description: Deprecated; setting it answers 400.
    Role:
      type: string
      enum: [admin, owner]
    Token:
      type: object
      required: [id, name, prefix, role, createdAt, expiresAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        prefix:
          type: string
          description: The public part of the token, to tell tokens apart.
        role: {$ref: "#/components/schemas/Role"}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
    TokenList:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items: {$ref: "#/components/schemas/Token"}
    TokenCreate:
      type: object
      required: [name, role]
      properties:
        name: {type: string, maxLength: 200}
        role: {$ref: "#/components/schemas/Role"}
        expiresIn:
          type: integer
          minimum: 3600
          maximum: 7776000
          description: Seconds until the token expires. Default 2592000 (30 days).
    TokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: {$ref: "#/components/schemas/Token"}
        secret:
          type: string
          description: "Send as `Authorization: Bearer <secret>`. Shown only here."
    PriceRates:
      type: object
      description: USD per million tokens as decimal strings with at most 6 fraction digits. A free model needs an explicit "0".
      properties:
        input: {type: string}
        output: {type: string}
        cacheRead: {type: string}
        cacheWrite: {type: string}
        reasoning: {type: string}
    PriceTier:
      type: object
      required: [contextOver, prices]
      properties:
        contextOver:
          type: integer
          format: int64
          description: The tier applies when the input side of a request (input, cache reads and writes) exceeds this many tokens; its rates replace the base rates they name.
        prices: {$ref: "#/components/schemas/PriceRates"}
    PriceMatch:
      type: object
      description: Exactly one of glob (`*` any characters, `?` one, case-insensitive) and regex (RE2, whole name).
      properties:
        glob: {type: string}
        regex: {type: string}
    PriceEntry:
      type: object
      required: [id, provider, match, validFrom, prices, tokenizer, ratio, source]
      properties:
        id: {type: string}
        provider: {type: string, description: "Provider type the price applies to, or *."}
        match: {$ref: "#/components/schemas/PriceMatch"}
        validFrom: {type: string, description: "Date yyyy-mm-dd (UTC)."}
        prices: {$ref: "#/components/schemas/PriceRates"}
        tiers:
          type: array
          items: {$ref: "#/components/schemas/PriceTier"}
        tokenizer: {type: string, enum: [bytes, "tiktoken:o200k_base", "tiktoken:cl100k_base"]}
        ratio: {type: string, description: "UTF-8 bytes per token, used to estimate usage a provider did not report."}
        toolOverheadTokens: {type: integer}
        hiddenThinking: {type: boolean}
        maxOutput: {type: integer, description: "Largest output in tokens; an aborted response without usage settles at the request max_tokens, or at this when it was not logged."}
        source:
          type: object
          required: [url, accessed]
          properties:
            url: {type: string}
            accessed: {type: string}
        note: {type: string}
    PriceInput:
      type: object
      required: [name, provider, match, prices]
      properties:
        name: {type: string, description: "Names the price; a new version of the same name replaces it from validFrom on."}
        provider: {type: string}
        match: {$ref: "#/components/schemas/PriceMatch"}
        prices: {$ref: "#/components/schemas/PriceRates"}
        tiers:
          type: array
          items: {$ref: "#/components/schemas/PriceTier"}
        tokenizer: {type: string, enum: [bytes, "tiktoken:o200k_base", "tiktoken:cl100k_base"]}
        ratio: {type: string}
        toolOverheadTokens: {type: integer}
        hiddenThinking: {type: boolean}
        maxOutput: {type: integer, description: "Largest output in tokens; an aborted response without usage settles at the request max_tokens, or at this when it was not logged."}
        validFrom: {type: string, format: date-time, description: "Default now."}
    PriceVersion:
      type: object
      required: [id, name, provider, match, prices, validFrom, createdBy, createdAt]
      properties:
        id: {type: string, format: uuid, description: "The ledger cites it as org#<id>."}
        name: {type: string}
        provider: {type: string}
        match: {$ref: "#/components/schemas/PriceMatch"}
        prices: {$ref: "#/components/schemas/PriceRates"}
        tiers:
          type: array
          items: {$ref: "#/components/schemas/PriceTier"}
        tokenizer: {type: string}
        ratio: {type: string}
        validFrom: {type: string, format: date-time}
        retiredAt: {type: string, format: date-time}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
    PriceSaved:
      description: The price version just saved, with the warnings of the save.
      allOf:
        - $ref: "#/components/schemas/PriceVersion"
        - type: object
          properties:
            warnings:
              type: array
              items: {type: string}
              description: Only on this response. For example, a cache_read price whose provider format cannot cache runs uncached (ADR 0068).
    PriceList:
      type: object
      required: [prices]
      properties:
        prices:
          type: array
          items: {$ref: "#/components/schemas/PriceVersion"}
    DefaultPrices:
      type: object
      required: [version, previousVersions, entries]
      properties:
        version: {type: string}
        previousVersions:
          type: array
          items: {type: string}
        entries:
          type: array
          items: {$ref: "#/components/schemas/PriceEntry"}
    PriceChange:
      type: object
      required: [kind, id, validFrom]
      properties:
        kind: {type: string, enum: [added, removed, changed]}
        id: {type: string}
        validFrom: {type: string}
        before: {$ref: "#/components/schemas/PriceEntry"}
        after: {$ref: "#/components/schemas/PriceEntry"}
        fields:
          type: array
          items: {type: string}
    DefaultPriceChanges:
      type: object
      required: [to, changes]
      properties:
        from: {type: string}
        to: {type: string}
        changes:
          type: array
          items: {$ref: "#/components/schemas/PriceChange"}
    FlaggedPrice:
      type: object
      required: [priceRef, model, requests, lastSeen, costUsd, gatewayCostUsd]
      properties:
        priceRef: {type: string}
        model: {type: string}
        requests: {type: integer, format: int64}
        lastSeen: {type: string, format: date-time}
        costUsd: {type: string, description: "What Koinon computed (counts for limits and reports)."}
        gatewayCostUsd: {type: string}
    FlaggedPriceList:
      type: object
      required: [flagged]
      properties:
        flagged:
          type: array
          items: {$ref: "#/components/schemas/FlaggedPrice"}
    SpendLine:
      type: object
      required: [model, requests, inputTokens, outputTokens, reasoningTokens, reportedUsd, estimatedUsd, estimatedRequests, estimatedOutputTokens, gatewayRequests, gatewayUsd, gatewayComparedUsd, flaggedRequests, provisionalRequests, reservedUsd]
      properties:
        model: {type: string}
        requests: {type: integer, format: int64}
        inputTokens: {type: integer, format: int64}
        outputTokens: {type: integer, format: int64, description: "Output tokens, reasoning (thinking) tokens included."}
        reasoningTokens:
          type: [integer, "null"]
          format: int64
          description: "The part of outputTokens the provider reported as reasoning, or null when no request of the model reported a split. Null does not mean the model did not think: Anthropic Messages has no separate reasoning count and counts thinking inside outputTokens. Thinking is billed as output: at the output rate unless the price names a reasoning rate (ADR 0069 amendment 2026-10-29)."
        reportedUsd: {type: string, description: "Cost of requests whose usage the provider reported."}
        estimatedUsd: {type: string, description: "Cost of requests whose usage was estimated. Counts toward limits."}
        estimatedRequests: {type: integer, format: int64}
        estimatedOutputTokens:
          type: integer
          format: int64
          description: "Output tokens of the estimated requests: for a response cut short, the output usage the gateway logged before the cut (none for a chat-completion stream)."
        gatewayRequests: {type: integer, format: int64, description: "Requests agentgateway priced itself."}
        gatewayUsd: {type: string, description: "agentgateway's own cost of those requests."}
        gatewayComparedUsd: {type: string, description: "Koinon's cost of the same requests, to compare with gatewayUsd."}
        flaggedRequests: {type: integer, format: int64, description: "Requests flagged for review (cost differs from the gateway's by more than 1%, usage missing, or an unusable price)."}
        provisionalRequests: {type: integer, format: int64, description: "Requests whose provider bill is pending; their cost is Koinon's price of the usage the gateway logged until the provider reports."}
        reservedUsd: {type: string, description: "What the provisional requests hold back from the gateway keys' limits (their max_tokens bound minus the charge). Not a cost and not counted by budgets; released when they settle."}
    SpendReport:
      type: object
      required: [since, models, systemChecks]
      properties:
        since: {type: string, format: date-time}
        models:
          type: array
          description: Spend of agents, per model.
          items: {$ref: "#/components/schemas/SpendLine"}
        systemChecks:
          type: object
          description: |
            Requests Koinon made itself, such as the provider echo check, which belong to no agent.
            They are billed like any request and count toward the org's monthly cap and the platform
            ceiling, but not toward any agent's limit.
          required: [requests, costUsd]
          properties:
            requests: {type: integer, format: int64}
            costUsd: {type: string}
    AuditEvent:
      type: object
      required: [id, actorKind, actorId, action, targetKind, targetId, summary, requestId, createdAt, chainSeq, prevHash, hash]
      properties:
        id: {type: string, format: uuid}
        actorKind: {type: string, enum: [user, token, agent, secret, system, cli]}
        actorId: {type: string}
        action: {type: string, description: "<area>.<verb>, for example approval.approve."}
        targetKind: {type: string}
        targetId: {type: string}
        summary: {type: object, description: "{before, after} without secret values.", additionalProperties: true}
        requestId: {type: string}
        createdAt: {type: string, format: date-time}
        chainSeq: {type: integer, format: int64, description: "Position in the org's hash chain (the install chain for scope=install), from 1."}
        prevHash: {type: string, description: "Hash of the previous event, lower-case hex."}
        hash: {type: string, description: "sha256 of the canonical event and prevHash, lower-case hex."}
    AuditEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}
        nextPageToken: {type: string, description: "Absent on the last page."}
    DefaultModel:
      type: object
      properties:
        model: {type: string, description: "The model name. Absent: the org has no default model."}
    OrgBudget:
      type: object
      required: [spentThisMonthUsd, monthStart]
      properties:
        monthlyCapUsd: {type: string, description: "Calendar month in UTC. Absent: no cap."}
        platformCeilingUsd: {type: string, description: "Set by a platform admin; absent: off."}
        spentThisMonthUsd: {type: string}
        monthStart: {type: string, format: date-time}
    OrgBudgetUpdate:
      type: object
      properties:
        monthlyCapUsd: {type: string, description: "Decimal with at most 12 fraction digits, above 0 and at most 1000000. Leave out to clear."}
    AgentBudget:
      type: object
      required: [agentId, dailyLimitUsd, spentTodayUsd, dayStart]
      properties:
        agentId: {type: string, format: uuid}
        dailyLimitUsd: {type: string}
        spentTodayUsd: {type: string}
        dayStart: {type: string, format: date-time}
    AgentBudgetUpdate:
      type: object
      required: [dailyLimitUsd]
      properties:
        dailyLimitUsd: {type: string}
