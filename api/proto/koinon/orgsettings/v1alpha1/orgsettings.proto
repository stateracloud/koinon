syntax = "proto3";

package koinon.orgsettings.v1alpha1;

option go_package = "github.com/stateracloud/koinon/internal/gen/koinon/orgsettings/v1alpha1;orgsettingsv1alpha1";

// OrgSettingsService is the UI's face of the org's settings that are not owned by another service
// (leak guard and trace settings have their own). It is the connect-rpc face of the same service
// layer the admin API uses. Admins and owners only. Every change is audited.
service OrgSettingsService {
  rpc GetRunContentRetention(GetRunContentRetentionRequest) returns (GetRunContentRetentionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetRunContentRetention sets how long a finished run's stored content is kept, or returns it to the
  // default (30 days) when days is 0. Audited as org.run_content_retention.set.
  rpc SetRunContentRetention(SetRunContentRetentionRequest) returns (SetRunContentRetentionResponse);
  rpc GetHomeBackupRetention(GetHomeBackupRetentionRequest) returns (GetHomeBackupRetentionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetHomeBackupRetention sets how long an old home backup repository is kept after a key change, or
  // returns it to the default (7 days) when days is 0. Audited as org.home_backup_retention.set.
  rpc SetHomeBackupRetention(SetHomeBackupRetentionRequest) returns (SetHomeBackupRetentionResponse);
  rpc GetApproverNotRequester(GetApproverNotRequesterRequest) returns (GetApproverNotRequesterResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetApproverNotRequester turns the optional rule "the approver must not be the requester" on or
  // off (issue #1175, ADR 0005). Audited as org.approver_not_requester.set.
  rpc SetApproverNotRequester(SetApproverNotRequesterRequest) returns (SetApproverNotRequesterResponse);
  rpc GetRunLimits(GetRunLimitsRequest) returns (GetRunLimitsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetRunLimits changes some of the org's run limits (issue #492, ADR 0066). A limit that is not set
  // stays as it is; 0 returns it to the default. Runs that are queued but not started get the new
  // limits when they start. Audited as org.run_limits.set.
  rpc SetRunLimits(SetRunLimitsRequest) returns (SetRunLimitsResponse);
}

// RunContentRetention is the org's effective retention of stored run content. Once a finished run is
// older than days, the purge job blanks the payload of its content events (messages, thoughts and tool
// calls) and strips the text from prompt, permission and refusal events, whose state fields stay. Other
// events, the run's status, traces and the spend ledger stay.
message RunContentRetention {
  int32 days = 1;
  int32 default_days = 2;
  int32 min_days = 3;
  int32 max_days = 4;
}

message GetRunContentRetentionRequest {
  string org_id = 1;
}

message GetRunContentRetentionResponse {
  RunContentRetention retention = 1;
}

message SetRunContentRetentionRequest {
  string org_id = 1;
  // days to keep a finished run's content; 0 returns it to the default.
  int32 days = 2;
}

message SetRunContentRetentionResponse {
  RunContentRetention retention = 1;
}

// HomeBackupRetention is the org's effective retention of old home backup repositories. A key change
// starts a new backup repository for each agent's home; the old one stays readable for the
// checkpoints written to it for days, then it is deleted. The deadline is set when the new repository
// starts, so a change applies to later key changes only.
message HomeBackupRetention {
  int32 days = 1;
  int32 default_days = 2;
  int32 min_days = 3;
  int32 max_days = 4;
}

message GetHomeBackupRetentionRequest {
  string org_id = 1;
}

message GetHomeBackupRetentionResponse {
  HomeBackupRetention retention = 1;
}

message SetHomeBackupRetentionRequest {
  string org_id = 1;
  // days to keep an old home backup repository; 0 returns it to the default.
  int32 days = 2;
}

message SetHomeBackupRetentionResponse {
  HomeBackupRetention retention = 1;
}

// The optional org rule "the approver must not be the requester". It is off by default. When it is
// on, the person who created a task cannot approve the calls of that task, and an approval scope does
// not cover the calls of tasks that the scope's creator requested. A second-person rule on the code
// host, such as two approvals on a protected branch, stays the org's own code-host setting.
message GetApproverNotRequesterRequest {
  string org_id = 1;
}

message GetApproverNotRequesterResponse {
  bool on = 1;
}

message SetApproverNotRequesterRequest {
  string org_id = 1;
  bool on = 2;
}

message SetApproverNotRequesterResponse {
  bool on = 1;
}

// RunLimit is one run limit of the org. value is the limit in force; it is default_value when the
// org set none.
message RunLimit {
  int32 value = 1;
  int32 default_value = 2;
  int32 min = 3;
  int32 max = 4;
}

// RunLimits are the org's run limits (DB2, ADR 0066).
message RunLimits {
  // max_concurrent_runs is the most runs of the org that start or run at the same time. The other
  // runs wait in the queue.
  RunLimit max_concurrent_runs = 1;
  // trigger_concurrency is the most trigger, webhook and task-creation items of the org that run at
  // the same time.
  RunLimit trigger_concurrency = 2;
  // trigger_rate_per_minute is the most of those items that start in one minute.
  RunLimit trigger_rate_per_minute = 3;
  // sandbox_creations_per_minute is the most sandboxes that Koinon creates or starts for the org in
  // one minute.
  RunLimit sandbox_creations_per_minute = 4;
}

message GetRunLimitsRequest {
  string org_id = 1;
}

message GetRunLimitsResponse {
  RunLimits limits = 1;
}

// SetRunLimitsRequest changes the limits that are set. A limit that is not set stays as it is; 0
// returns it to the default.
message SetRunLimitsRequest {
  string org_id = 1;
  optional int32 max_concurrent_runs = 2;
  optional int32 trigger_concurrency = 3;
  optional int32 trigger_rate_per_minute = 4;
  optional int32 sandbox_creations_per_minute = 5;
}

message SetRunLimitsResponse {
  RunLimits limits = 1;
}
