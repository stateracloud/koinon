syntax = "proto3";

package koinon.gateway.v1alpha1;

option go_package = "github.com/stateracloud/koinon/internal/gen/koinon/gateway/v1alpha1;gatewayv1alpha1";

// GatewayStateService is the State stream of ADR 0097 decision 2.1: koinon-api sends a gateway copy
// the full desired state of the gateway, one revision at a time, and the copy confirms each half of a
// revision once it serves it. It is the config delivery of Koinon's own gateway; the agentgateway
// drivers keep rendering files and CRDs. It is internal: only a gateway copy calls it.
//
// Nothing here carries secret material: a StateUpdate holds key ids and key hashes, never a key, and
// names the file a credential is mounted at, never its content (ADR 0097 decision 5, the secret store).
service GatewayStateService {
  // StreamState sends the latest revision at once and every later one when it is published. Each
  // message is a full snapshot (state of the world), not a delta, so a copy that reconnects needs
  // nothing but the next message.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // The stream message is StateUpdate, the name ADR 0097 and the State types use for a revision.
  rpc StreamState(StreamStateRequest) returns (stream StateUpdate);
  // AckRevision tells koinon-api that the copy serves one half of a revision. A copy acks the model
  // half and the MCP half apart, because the two paths are applied apart (MCPGateway.ApplyMCP). An
  // ack of a revision covers every earlier one for that half. Idempotent.
  rpc AckRevision(AckRevisionRequest) returns (AckRevisionResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message StreamStateRequest {
  // copy_id names one process incarnation of a gateway copy (for example pod UID plus a boot nonce),
  // 1 to 253 characters. A copy must never reuse it after a restart: acks are recorded under it, and
  // an ack under a reused id would count for a process that has not loaded the revision.
  string copy_id = 1;
  // halves lists the halves this copy serves, and so acks. Empty means both (a client from before
  // this field). The reconciler waits only for copies that serve a half.
  repeated Half halves = 2;
}

// Half is one of the two paths a gateway copy serves.
enum Half {
  HALF_UNSPECIFIED = 0;
  HALF_MODEL = 1;
  HALF_MCP = 2;
}

message AckRevisionRequest {
  string copy_id = 1;
  int64 revision = 2;
  Half half = 3;
}

message AckRevisionResponse {}

// StateUpdate is one revision of the gateway's desired state: the keys both halves need, then the
// model half and the MCP half (gateway.State, ADR 0097 decision 2.1). The keys are at the top level
// so neither half is a copy of them.
message StateUpdate {
  // revision grows by one per published change of the state and is the number the copy acks. 0 only
  // in a snapshot that has not been stored yet.
  int64 revision = 1;
  repeated Key keys = 2;
  ModelState model = 3;
  MCPState mcp = 4;
  // egress is the org half of the forge and registry routes (ADR 0097 step 2, ADR 0120 section 2).
  // It is applied with each revision and has no ack of its own yet.
  EgressState egress = 5;
}

// AgentRef names an agent.
message AgentRef {
  string org = 1;
  string name = 2;
}

// Key is the gateway-side record of an API key: id, owner and hash. The key itself never enters it.
message Key {
  string id = 1;
  AgentRef agent = 2;
  // hash is "sha256:<hex>" of the key material.
  string hash = 3;
}

message ModelState {
  repeated AgentLimit limits = 1;
  repeated Provider providers = 2;
  repeated AgentModels models = 3;
}

message AgentLimit {
  AgentRef agent = 1;
  Limit limit = 2;
}

// Limit is a per-agent spend limit (gateway.Limit).
message Limit {
  // unit is "USD", the only unit.
  string unit = 1;
  // amount_pico_usd is the exact amount in pico-USD (money.USD).
  int64 amount_pico_usd = 2;
  // window_seconds is 0 for no window.
  int64 window_seconds = 3;
  string generation = 4;
}

// Provider is an org's OpenAI-compatible upstream. api_key_file is where the provider key is mounted
// in the gateway, not the key.
message Provider {
  string org = 1;
  string name = 2;
  string type = 3;
  string base_url = 4;
  string api_key_file = 5;
  string anthropic_workspace_id = 6;
  repeated Model models = 7;
}

message Model {
  string name = 1;
  string format = 2;
  Thinking thinking = 3;
  bool guard = 4;
  // price is unset for a model without one; the gateway does not serve it.
  Price price = 5;
}

// Thinking is internal/thinking.Capability as the table records it.
message Thinking {
  string thinks = 1;
  string on = 2;
  string off = 3;
  string display = 4;
  repeated string betas = 5;
  string usage_split = 6;
}

// Price is per million tokens in USD, as decimal strings.
message Price {
  string input = 1;
  string output = 2;
  string cache_read = 3;
  string cache_write = 4;
  string reasoning = 5;
  repeated PriceTier tiers = 6;
}

message PriceTier {
  int64 context_over = 1;
  string input = 2;
  string output = 3;
  string cache_read = 4;
  string cache_write = 5;
  string reasoning = 6;
}

message AgentModels {
  AgentRef agent = 1;
  repeated string models = 2;
}

message MCPState {
  repeated MCPTarget targets = 1;
  repeated AgentTools tools = 2;
}

// MCPTarget is an upstream MCP server. credential_file is where the target's credential is mounted in
// the gateway, not the credential; credential_header and credential_prefix say how it is sent. ca_file is
// where the target's own CA bundle (public certificates) is mounted, empty for the system roots.
message MCPTarget {
  string name = 1;
  string url = 2;
  bool sse = 3;
  string org = 4;
  string credential_header = 5;
  string credential_prefix = 6;
  string credential_file = 7;
  string ca_file = 8;
  bool insecure_skip_verify = 9;
  // builtin names code that runs in koinon-gateway in place of an upstream URL ("a2a", ADR 0123).
  string builtin = 10;
  repeated RemoteAgent remote_agents = 11;
  // handle_key_file holds the key that signs the task and context handles of the built-in target.
  string handle_key_file = 12;
  // ask marks Koinon's approval-gated proxy for the ask-tier tools of an org's server (internal/mcpask).
  // The gateway sends it the agent header; an org's own server never gets that header.
  bool ask = 13;
}

// RemoteAgent is one external A2A agent of a built-in "a2a" target (ADR 0123 decision 9).
message RemoteAgent {
  string name = 1;
  string id = 2;
  string card_url = 3;
  string credential_header = 4;
  string credential_prefix = 5;
  string credential_file = 6;
  string ca_file = 7;
  bool insecure_skip_verify = 8;
  // card_hash is the pin: the SHA-256 of the canonical agent card, in hex.
  string card_hash = 9;
  // agents are the names of the Koinon agents that may call this remote agent.
  repeated string agents = 10;
}

message AgentTools {
  AgentRef agent = 1;
  repeated ToolGrant grants = 2;
}

message ToolGrant {
  string target = 1;
  repeated string tools = 2;
  bool all = 3;
}

// EgressState is the org routes of the egress listener. The gateway merges them with its platform
// route file. A route that fails to load closes all org routes; it never opens one.
message EgressState {
  repeated EgressRoute routes = 1;
  // credentials say where the gateway reads each credential that a route names, and how it sends it
  // (#1086 part C). A route whose credential is not here is refused (503 credential_unavailable).
  repeated EgressCredential credentials = 2;
  // actors are Koinon's record of the Agent Substrate actors (issue #1386, ADR 0120 amendment item 5):
  // the gateway finds the org and the agent of an actor JWT here, never in the token. An actor that is
  // not here, or a UID that is not equal, is refused.
  repeated EgressActor actors = 3;
}

// EgressActor is one Agent Substrate actor of a sandbox that is not deleted or archived. It holds no
// token, only names.
message EgressActor {
  // atespace is the org's Substrate workspace, name the actor name and uid the UID that Substrate gave
  // the actor: the three must all be equal to the claims of the token.
  string atespace = 1;
  string name = 2;
  string uid = 3;
  // org is the org slug (actortoken.Actor.Org), agent the agent ID and run the run that holds the
  // sandbox, empty when the State does not name one.
  string org = 4;
  string agent = 5;
  string run = 6;
}

// EgressCredential is one credential of the egress routes. file is where a sealed envelope (v2, ADR
// 0097 decision 12) is mounted in the gateway: ciphertext that only the gateway key opens, never the
// value. The envelope is bound to the org ID and the agent ID in the file name.
message EgressCredential {
  // name is the name that the routes give in their credential field.
  string name = 1;
  // org is the org slug and agent the agent's name at the gateway: the routes that name the
  // credential must have the same org and agent.
  string org = 2;
  string agent = 3;
  string file = 4;
  // scheme is how the value goes upstream in the Authorization header: "basic" (base64 of
  // user ":" value) or "bearer".
  string scheme = 5;
  // user is the user name of the basic scheme, for example "x-access-token" for a forge token.
  string user = 6;
}

// EgressRoute is one org route (gateway route.Route). It names a credential, never its value.
message EgressRoute {
  // name is unique in the set and holds a "/".
  string name = 1;
  // class is "forge" or "registry".
  string class = 2;
  // org is the org slug. It is never empty for a route in the state.
  string org = 3;
  // agent narrows the route to one agent (the agent's name at the gateway). Empty: every agent of org.
  string agent = 4;
  string host = 5;
  // port is the TCP port. 0 means 443.
  int32 port = 6;
  repeated string methods = 7;
  repeated string path_prefixes = 8;
  // paths are path patterns: the segment "*" matches one segment, "**" any number of segments.
  repeated string paths = 9;
  repeated string query_keys = 10;
  // query_values are required query parameters with their one exact value.
  map<string, string> query_values = 11;
  bool any_query = 12;
  // deny makes the route a refusal that wins over every allow of its scope.
  bool deny = 13;
  // credential is the name of the secret the gateway attaches. Empty means none.
  string credential = 14;
}
