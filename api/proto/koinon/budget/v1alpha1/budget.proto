syntax = "proto3";

package koinon.budget.v1alpha1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/stateracloud/koinon/internal/gen/koinon/budget/v1alpha1;budgetv1alpha1";

// BudgetService sets an org's monthly cap and its agents' daily limits and lists the in-app
// notifications about them (plan item BG1, ADR 0056). Amounts are USD decimal strings.
// The cap is per calendar month in UTC, an agent's limit per UTC day. Admins and owners write;
// the platform ceiling is for platform admins. Every change is audited.
service BudgetService {
  // GetOrgBudget returns the cap, the platform ceiling and this month's spend.
  rpc GetOrgBudget(GetOrgBudgetRequest) returns (GetOrgBudgetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListOrgBudgets returns every org's cap, platform ceiling and spend this month. Platform
  // admins only.
  rpc ListOrgBudgets(ListOrgBudgetsRequest) returns (ListOrgBudgetsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetMonthlyCap sets the cap, or clears it with an empty amount. It cannot exceed the ceiling.
  rpc SetMonthlyCap(SetMonthlyCapRequest) returns (SetMonthlyCapResponse);

  // SetPlatformCeiling sets the org's ceiling, or clears it with an empty amount. Platform
  // admins only. The org's cap must already fit under it.
  rpc SetPlatformCeiling(SetPlatformCeilingRequest) returns (SetPlatformCeilingResponse);

  // GetAgentBudget returns an agent's effective daily limit and today's spend.
  rpc GetAgentBudget(GetAgentBudgetRequest) returns (GetAgentBudgetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListAgentBudgets returns every agent's effective daily limit, template default and
  // today's spend.
  rpc ListAgentBudgets(ListAgentBudgetsRequest) returns (ListAgentBudgetsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetAgentBudget sets an agent's daily limit. A template's spendUSD is only the default for
  // a new agent.
  rpc SetAgentBudget(SetAgentBudgetRequest) returns (SetAgentBudgetResponse);

  // GetAgentRunLimits returns the limits a run of the agent gets: the effective values, the
  // template's defaults and the admin's overrides (ADR 0081).
  rpc GetAgentRunLimits(GetAgentRunLimitsRequest) returns (GetAgentRunLimitsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetAgentRunLimits replaces the agent's overrides of its run limits. A zero value clears that
  // override; all zero clears them all. It applies to runs queued afterwards.
  rpc SetAgentRunLimits(SetAgentRunLimitsRequest) returns (SetAgentRunLimitsResponse);

  // GetOrgContinuationLimits returns the org's default per-task USD cap for continuation runs
  // (issue #99): the effective value and the platform default. Admins and owners.
  rpc GetOrgContinuationLimits(GetOrgContinuationLimitsRequest) returns (GetOrgContinuationLimitsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetOrgContinuationTaskSpend sets the org's default per-task USD cap for continuation runs. An
  // empty amount clears it, so the platform default applies. It applies from the next time a run
  // hits its time limit.
  rpc SetOrgContinuationTaskSpend(SetOrgContinuationTaskSpendRequest) returns (SetOrgContinuationTaskSpendResponse);

  // GetAgentContinuationLimits returns the continuation limits a task of the agent gets: the
  // effective values, the template's and org's defaults and the admin's overrides.
  rpc GetAgentContinuationLimits(GetAgentContinuationLimitsRequest) returns (GetAgentContinuationLimitsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetAgentContinuationLimits replaces the agent's overrides of its continuation limits. Unset
  // fields follow the template (the count) or the org's default (the cap); a count of 0 switches
  // continuation off for the agent.
  rpc SetAgentContinuationLimits(SetAgentContinuationLimitsRequest) returns (SetAgentContinuationLimitsResponse);

  // ListNotifications returns the caller's notifications in this org, newest first: budget
  // warnings at 80% and stops at 100%. Owners and admins receive them; platform admins also
  // those about the platform ceiling.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // MarkNotificationRead marks one of the caller's notifications read.
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse);
}

message OrgBudget {
  // monthly_cap_usd is empty when there is no cap.
  string monthly_cap_usd = 1;
  // platform_ceiling_usd is empty when the ceiling is off.
  string platform_ceiling_usd = 2;
  string spent_this_month_usd = 3;
  google.protobuf.Timestamp month_start = 4;
  // estimated_this_month_usd is the part of the spend that came from estimated usage.
  string estimated_this_month_usd = 5;
  // system_checks_this_month_usd is the part of the spend that came from Koinon's own requests
  // (the provider echo check), which belong to no agent. It counts toward the cap.
  string system_checks_this_month_usd = 6;
}

message ListOrgBudgetsRequest {}

message OrgBudgetSummary {
  string org_id = 1;
  string org_slug = 2;
  string org_name = 3;
  // monthly_cap_usd and platform_ceiling_usd are empty when unset.
  string monthly_cap_usd = 4;
  string platform_ceiling_usd = 5;
  string spent_this_month_usd = 6;
}

message ListOrgBudgetsResponse {
  repeated OrgBudgetSummary orgs = 1;
  google.protobuf.Timestamp month_start = 2;
}

message GetOrgBudgetRequest {
  string org_id = 1;
}

message GetOrgBudgetResponse {
  OrgBudget budget = 1;
}

message SetMonthlyCapRequest {
  string org_id = 1;
  string monthly_cap_usd = 2;
}

message SetMonthlyCapResponse {
  OrgBudget budget = 1;
}

message SetPlatformCeilingRequest {
  string org_id = 1;
  string platform_ceiling_usd = 2;
}

message SetPlatformCeilingResponse {
  OrgBudget budget = 1;
}

message AgentBudget {
  string agent_id = 1;
  string daily_limit_usd = 2;
  string spent_today_usd = 3;
  google.protobuf.Timestamp day_start = 4;
  // agent_name and template_default_usd are set by ListAgentBudgets. The default is the
  // spendUSD of the agent's active version.
  string agent_name = 5;
  string template_default_usd = 6;
}

message GetAgentBudgetRequest {
  string org_id = 1;
  string agent_id = 2;
}

message GetAgentBudgetResponse {
  AgentBudget budget = 1;
}

message ListAgentBudgetsRequest {
  string org_id = 1;
}

message ListAgentBudgetsResponse {
  repeated AgentBudget budgets = 1;
}

message SetAgentBudgetRequest {
  string org_id = 1;
  string agent_id = 2;
  string daily_limit_usd = 3;
}

message SetAgentBudgetResponse {
  AgentBudget budget = 1;
}

// RunLimitValues are the limits of one run. Zero (or empty) means unset.
message RunLimitValues {
  // max_model_requests counts every model request through the agent's key.
  int64 max_model_requests = 1;
  // max_spend_usd is a USD decimal string.
  string max_spend_usd = 2;
  // max_duration_seconds is the wall-clock limit.
  int64 max_duration_seconds = 3;
}

message AgentRunLimits {
  string agent_id = 1;
  string agent_name = 2;
  // effective is what a run queued now gets: the override, else the template's value.
  RunLimitValues effective = 3;
  // template_default is the agent's active version (the template's values).
  RunLimitValues template_default = 4;
  // override is what an admin set; unset fields follow the template.
  RunLimitValues override = 5;
}

message GetAgentRunLimitsRequest {
  string org_id = 1;
  string agent_id = 2;
}

message GetAgentRunLimitsResponse {
  AgentRunLimits limits = 1;
}

message SetAgentRunLimitsRequest {
  string org_id = 1;
  string agent_id = 2;
  RunLimitValues override = 3;
}

message SetAgentRunLimitsResponse {
  AgentRunLimits limits = 1;
}

message OrgContinuationLimits {
  // task_spend_usd is the effective per-task cap: the org's value, else the platform default.
  string task_spend_usd = 1;
  // platform_default_task_spend_usd is what an org that sets none gets.
  string platform_default_task_spend_usd = 2;
  // overridden is true when the org set its own value.
  bool overridden = 3;
}

message GetOrgContinuationLimitsRequest {
  string org_id = 1;
}

message GetOrgContinuationLimitsResponse {
  OrgContinuationLimits limits = 1;
}

message SetOrgContinuationTaskSpendRequest {
  string org_id = 1;
  // task_spend_usd is a USD decimal string; empty clears the org's value.
  string task_spend_usd = 2;
}

message SetOrgContinuationTaskSpendResponse {
  OrgContinuationLimits limits = 1;
}

// ContinuationValues are the continuation limits of one task of an agent.
message ContinuationValues {
  // max_continuations is the continuation runs a task gets; 0 means continuation is off.
  int32 max_continuations = 1;
  // task_spend_usd is the task's spend (all its runs) at which no further continuation starts.
  string task_spend_usd = 2;
}

// ContinuationOverride is what an admin set on one agent.
message ContinuationOverride {
  // max_continuations is unset when the agent follows the template; 0 switches continuation off.
  optional int32 max_continuations = 1;
  // task_spend_usd is empty when the agent follows the org's default.
  string task_spend_usd = 2;
}

message AgentContinuationLimits {
  string agent_id = 1;
  string agent_name = 2;
  // effective is what a task gets now: the override, else the template's count and the org's cap.
  ContinuationValues effective = 3;
  // template_default is the agent's active version's count and the org's cap.
  ContinuationValues template_default = 4;
  ContinuationOverride override = 5;
}

message GetAgentContinuationLimitsRequest {
  string org_id = 1;
  string agent_id = 2;
}

message GetAgentContinuationLimitsResponse {
  AgentContinuationLimits limits = 1;
}

message SetAgentContinuationLimitsRequest {
  string org_id = 1;
  string agent_id = 2;
  ContinuationOverride override = 3;
}

message SetAgentContinuationLimitsResponse {
  AgentContinuationLimits limits = 1;
}

message Notification {
  string id = 1;
  // kind is budget.warning (80%), budget.reached (100%) or agent.unhealthy.
  string kind = 2;
  // level is agent_daily, org_monthly or platform_ceiling.
  string level = 3;
  // threshold is 80 or 100.
  int32 threshold = 4;
  string limit_usd = 5;
  string spent_usd = 6;
  // agent_id is set for agent_daily.
  string agent_id = 7;
  google.protobuf.Timestamp window_start = 8;
  google.protobuf.Timestamp created_at = 9;
  // read_at is unset while the notification is unread.
  google.protobuf.Timestamp read_at = 10;
  // message is the text of notifications that are not about a budget (kind agent.unhealthy: an
  // agent whose sandbox keeps getting stuck; agent_id names it).
  string message = 11;
}

message ListNotificationsRequest {
  string org_id = 1;
  // max_results defaults to 50 and is at most 200.
  int32 max_results = 2;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
}

message MarkNotificationReadRequest {
  string org_id = 1;
  string notification_id = 2;
}

message MarkNotificationReadResponse {}
