syntax = "proto3";

package koinon.template.v1alpha1;

import "koinon/auth/v1alpha1/auth.proto";

option go_package = "github.com/stateracloud/koinon/internal/gen/koinon/template/v1alpha1;templatev1alpha1";

// TemplateService lists the agent templates shipped with Koinon (ADR 0020).
// Templates are platform data: they belong to no org, and every signed-in
// user can list them.
service TemplateService {
  // ListTemplates returns the current content of every template.
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Flavor is the earlier, closed list of harnesses (ADR 0035). Harnesses are named by string since
// ADR 0112 ("opencode" is the built-in one); the fields of this type are deprecated and kept so
// the API stays wire- and source-compatible.
enum Flavor {
  FLAVOR_UNSPECIFIED = 0;
  FLAVOR_OPENCODE = 1;
  // Hermes and pi were dropped before v0.1 shipped (ADR 0059). The values stay so the API stays
  // wire- and source-compatible; no flavor matches them, so the API rejects them.
  FLAVOR_HERMES = 2 [deprecated = true];
  FLAVOR_PI = 3 [deprecated = true];
}

// Preset maps a grant's risk tiers to allow, ask or deny (ADR 0008, 0049).
enum Preset {
  PRESET_UNSPECIFIED = 0;
  PRESET_READ_ONLY = 1;
  PRESET_STANDARD = 2;
  PRESET_TRUSTED = 3;
}

// Grant is a grant on a connector type. On a template or a draft agent it is a
// proposal; activating the agent approves it.
message Grant {
  // Connector type, for example "github".
  string connector = 1;
  repeated string scopes = 2;
  Preset preset = 3;
  // How many targets (for GitHub: repositories) the user picks. Both zero when
  // the template sets no bound.
  int32 targets_min = 4;
  int32 targets_max = 5;
  string purpose = 6;
  // On an agent, the connection the grant uses and the targets (for GitHub:
  // repositories, owner/name) it is narrowed to; activating the agent approves
  // them with the grant. Empty on a template.
  string connection_id = 7;
  repeated string repositories = 8;
}

// RunLimits cap a single run; the first one reached cancels it (plan item A4, ADR 0081).
message RunLimits {
  // Wall-clock time a run may be owned (starting or running), in seconds.
  int64 max_duration_seconds = 1;
  // Deprecated: tokens are reported, not enforced (ADR 0081). Kept so older clients and stored
  // templates still decode; it caps nothing and is zero on new templates and agents.
  int64 max_tokens = 2 [deprecated = true];
  // Model requests a run may make: every request through the agent's key counts, the harness's
  // own title, summary and compaction calls included.
  int64 max_model_requests = 3;
  // USD a run may spend, by the ledger's settled cost, as an exact decimal string such as "2.00".
  string max_spend_usd = 4;
}

// TriggerType says what starts work on an agent (ADR 0066).
enum TriggerType {
  TRIGGER_TYPE_UNSPECIFIED = 0;
  TRIGGER_TYPE_SCHEDULE = 1;
  TRIGGER_TYPE_DIRECT_MESSAGE = 2;
  // Reserved for v0.2; rejected until then.
  TRIGGER_TYPE_CODE_HOST_EVENT = 3;
  // Reserved for v0.2; rejected until then.
  TRIGGER_TYPE_CHANNEL_EVENT = 4;
}

// Trigger is one way work starts on an agent, with the instruction it gets when the trigger fires.
// It belongs to a version and takes effect when that version is activated.
message Trigger {
  // Names the trigger within the agent, a lowercase slug; stable across versions.
  string id = 1;
  TriggerType type = 2;
  // Schedule only: a five-field cron expression (minute hour day-of-month month day-of-week).
  string cron = 3;
  // Schedule only: an IANA zone name, for example "Europe/Tallinn".
  string timezone = 4;
  // Text given to the agent when the trigger fires.
  string instruction = 5;
  // Who is asked when the agent asks a person without naming one. Every type but direct_message
  // (which asks the person in the chat). Unset: the org's default, today its admins and owners.
  NotifyTarget notify = 6;
}

// NotifyTargetKind says who a trigger's task asks (ADR 0066 amendment 2026-10-28).
enum NotifyTargetKind {
  NOTIFY_TARGET_KIND_UNSPECIFIED = 0;
  // One member of the org.
  NOTIFY_TARGET_KIND_USER = 1;
  // Everyone with the role or higher (member, admin or owner).
  NOTIFY_TARGET_KIND_ROLE = 2;
  // A chat channel. Reserved for v0.2; refused until chat connectors exist.
  NOTIFY_TARGET_KIND_CHANNEL = 3;
}

// NotifyTarget is who is asked when the agent asks a person without naming one.
message NotifyTarget {
  NotifyTargetKind kind = 1;
  // Kind USER: the user's ID.
  string user_id = 2;
  // Kind ROLE: MEMBER, ADMIN or OWNER.
  koinon.auth.v1alpha1.OrgRole role = 3;
  // Kind CHANNEL (v0.2): must be empty until then.
  string channel_id = 4;
}

// Template is one version of an agent template.
message Template {
  // Identifies this exact content; agents are created from it.
  string id = 1;
  // Stable template name, for example "repo-helper".
  string slug = 2;
  // Hex SHA-256 of the canonical template document.
  string content_hash = 3;
  // The template's own version label, for example "0.1.0".
  string version = 4;
  string display_name = 5;
  string description = 6;
  // Deprecated: use allowed_harnesses. A harness with no Flavor value is left out.
  repeated Flavor allowed_flavors = 7 [deprecated = true];
  // Deprecated: use default_harness. Unspecified when the default harness has no Flavor value.
  Flavor default_flavor = 8 [deprecated = true];
  // Logical model name; "default" is the install's default model.
  string model = 9;
  string instructions = 10;
  repeated Grant grants = 11;
  RunLimits run_limits = 12;
  // Spend limit as a decimal string, for example "10.00".
  string spend_limit_usd = 13;
  repeated Trigger triggers = 14;
  // Agents made from the template are ephemeral by default: each task gets a fresh sandbox
  // without a home, deleted when the task ends (ADR 0065 decision 13c).
  bool ephemeral = 15;
  // The starting value of the agent's thinking setting, "on" or "off"; empty when the template
  // names none, which is the default, on (ADR 0069 amendment 2026-10-29).
  string thinking = 16;
  // Names of the harnesses the agent may run on (ADR 0112), for example "opencode".
  repeated string allowed_harnesses = 17;
  // The harness an agent gets when the request names none; one of allowed_harnesses.
  string default_harness = 18;
}

// ListTemplatesRequest is empty.
message ListTemplatesRequest {}

// ListTemplatesResponse lists the templates, sorted by slug.
message ListTemplatesResponse {
  repeated Template templates = 1;
}
