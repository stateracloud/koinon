syntax = "proto3";

package koinon.provider.v1alpha1;

import "google/protobuf/timestamp.proto";
import "koinon/outward/v1alpha1/outward.proto";

option go_package = "github.com/stateracloud/koinon/internal/gen/koinon/provider/v1alpha1;providerv1alpha1";

// ProviderService manages an org's model providers and models (ADR 0056) for the UI. It is the
// connect-rpc face of the same service layer the admin API uses, so validation, the upstream URL
// policy and the audit trail are the same. Admins and owners only: members do not see providers.
//
// Entries declared by a labelled Kubernetes Secret (source "secret") are read-only: changing or
// deleting a live one fails with FAILED_PRECONDITION and names the Secret. Provider keys are write-only;
// they are never returned.
service ProviderService {
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateProvider(CreateProviderRequest) returns (CreateProviderResponse);
  rpc UpdateProvider(UpdateProviderRequest) returns (UpdateProviderResponse);
  // DeleteProvider deletes a provider entered here, with its models. A declared provider can be
  // deleted only after its Secret was deleted (removed).
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse);

  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateModel(CreateModelRequest) returns (CreateModelResponse);
  rpc UpdateModel(UpdateModelRequest) returns (UpdateModelResponse);
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);

  // ModelFormats says which formats a model may use on a provider and which one it gets by default
  // (ADR 0069), so the model form offers exactly what the server will accept.
  rpc ModelFormats(ModelFormatsRequest) returns (ModelFormatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetDefaultModel returns the org's default model (ADR 0086), which agents without a model
  // setting run on, and the models it may be set to: the ones the org serves and has a price for.
  rpc GetDefaultModel(GetDefaultModelRequest) returns (GetDefaultModelResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetDefaultModel sets the org's default model, or clears it with an empty model. The model must
  // be one the org serves and has a price for. Audited as org.default_model.set.
  rpc SetDefaultModel(SetDefaultModelRequest) returns (SetDefaultModelResponse);

  // CheckProviderEcho runs the echo check on one model of the provider: one tiny chat request
  // through the gateway asking the model to repeat a fixed line exactly, to catch masking of names
  // and addresses on the provider's side. It is metered like any request, runs only when called
  // and stores the result on the provider. Admins and owners only.
  rpc CheckProviderEcho(CheckProviderEchoRequest) returns (CheckProviderEchoResponse);

  // ProviderTypeInfo says what a provider type offers before any provider of that type exists, so the
  // provider form shows only the fields the server will accept.
  rpc ProviderTypeInfo(ProviderTypeInfoRequest) returns (ProviderTypeInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Provider is an upstream model API of the org. It never holds the key.
message Provider {
  string id = 1;
  string name = 2;
  // type is the agentgateway provider name, such as openai, openrouter or ollama.
  string type = 3;
  string url = 4;
  // has_key is whether an API key is stored.
  bool has_key = 5;
  // source is "ui" for a provider entered here and "secret" for one declared by a Secret.
  string source = 6;
  string managed_by_secret = 7;
  // disabled_reason says why the provider is not served, empty when it is.
  string disabled_reason = 8;
  // removed is set when the declaring Secret was deleted.
  bool removed = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // anthropic_workspace_id is the Anthropic workspace the gateway names for the provider's models,
  // for an API key not scoped to a workspace. Empty when unset. An identifier, not a credential.
  string anthropic_workspace_id = 12;
  // formats are the model formats the provider's type offers, preferred first (ADR 0069).
  repeated ModelFormat formats = 13;
  // echo_check is the latest echo check of the provider; unset when none ran.
  EchoCheck echo_check = 14;
  // credential_lost_at is set when the API key was lost with the key that encrypted it (`koinon-api keys
  // forget`, ADR 0085 decision 13): the provider is not served until the key is entered again; has_key is false. Unset otherwise.
  google.protobuf.Timestamp credential_lost_at = 15;
  // has_cost_key is whether a cost API key is stored: an admin key with which koinon-reconciler reads
  // the provider's cost API once a day and records the ledger's difference from it (ADR 0056,
  // amendment 2026-11-06). anthropic and openai providers at their own API URL only.
  bool has_cost_key = 16;
  // cost_scope is the part of the provider's account whose cost is this provider key's: the
  // Anthropic workspace ID ("default" for the default workspace), or the OpenAI project ID or API
  // key ID (key_..., the key's ID, never the key).
  string cost_scope = 17;
  // cost_key_lost_at is set when the cost API key was lost with the key that encrypted it; it must
  // be entered again. Unset otherwise.
  google.protobuf.Timestamp cost_key_lost_at = 18;
  // admin_disabled is set while an admin holds the target off (the outward switch, ADR 0110 decision 5): it is
  // not called, probed or offered to runs. Unset otherwise.
  koinon.outward.v1alpha1.AdminDisabled admin_disabled = 19;
}

// EchoCheck is the result of an echo check (CheckProviderEcho).
message EchoCheck {
  // The model the check used.
  string model = 1;
  // True when the reply was the line, character for character.
  bool unchanged = 2;
  // The line sent and the reply received.
  string sent = 3;
  string received = 4;
  // The difference between them, in order; every segment of an unchanged result is EQUAL.
  repeated EchoDiffSegment diff = 5;
  google.protobuf.Timestamp checked_at = 6;
}

// EchoDiffSegment is a run of characters in the sent line, the reply or both.
message EchoDiffSegment {
  enum Op {
    OP_UNSPECIFIED = 0;
    // In both.
    OP_EQUAL = 1;
    // In the line sent but not in the reply: the provider removed or replaced it.
    OP_DELETED = 2;
    // In the reply but not in the line sent.
    OP_INSERTED = 3;
  }
  Op op = 1;
  string text = 2;
}

// CheckProviderEchoRequest names the provider and one of its models.
message CheckProviderEchoRequest {
  string org_id = 1;
  string provider_id = 2;
  // A model of the provider that the org serves and has a price for.
  string model = 3;
}

// CheckProviderEchoResponse holds the result.
message CheckProviderEchoResponse {
  EchoCheck echo_check = 1;
}

// ModelFormat is a model wire format as the server's format table names it: id is the stored value,
// label how it reads to a person. The set is open and grows with the formats Koinon supports.
message ModelFormat {
  string id = 1;
  string label = 2;
}

// Rates are deprecated: per-model rates were folded into org prices (PriceService, ADR 0056). The
// message stays for wire compatibility; the server never fills it and refuses requests that set it.
message Rates {
  string input = 1;
  string output = 2;
  string cache_read = 3;
}

message Model {
  string id = 1;
  string provider_id = 2;
  // name is the plain name agents ask for; the gateway serves it as "<org slug>/<name>".
  string name = 3;
  // guard is the routing guard, for OpenRouter providers only.
  bool guard = 4;
  // rates is deprecated and never set; prices are org price entries (PriceService).
  Rates rates = 5 [deprecated = true];
  string source = 6;
  string managed_by_secret = 7;
  string disabled_reason = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // format is the model's wire format: "openai" (chat completions) or "anthropic" (Messages)
  // (ADR 0069).
  string format = 11;
  // format_overridden is set when an admin chose the format; otherwise it follows the default and
  // is re-derived when the default changes.
  bool format_overridden = 12;
}

message ListProvidersRequest {
  string org_id = 1;
}

message ListProvidersResponse {
  repeated Provider providers = 1;
}

message CreateProviderRequest {
  string org_id = 1;
  string name = 2;
  string type = 3;
  string url = 4;
  // api_key is empty for keyless upstreams such as Ollama.
  string api_key = 5 [debug_redact = true];
  // anthropic_workspace_id is allowed for type "anthropic" only: wrkspc_ followed by letters and digits.
  string anthropic_workspace_id = 6;
  // cost_api_key is the optional cost API key (an Anthropic or OpenAI admin key that may read the
  // cost API; write-only, never returned). anthropic and openai providers at their own API URL only;
  // needs cost_scope.
  string cost_api_key = 7 [debug_redact = true];
  // cost_scope is the cost scope of that key (see Provider.cost_scope).
  string cost_scope = 8;
}

message CreateProviderResponse {
  Provider provider = 1;
}

message UpdateProviderRequest {
  string org_id = 1;
  string provider_id = 2;
  // Fields left unset stay.
  optional string type = 3;
  optional string url = 4;
  // api_key replaces the key; set to "" it removes the key.
  optional string api_key = 5 [debug_redact = true];
  // anthropic_workspace_id replaces the workspace ID; set to "" it removes it.
  optional string anthropic_workspace_id = 6;
  // cost_api_key replaces the cost API key (an Anthropic or OpenAI admin key that may read the cost
  // API; write-only, never returned); set to "" it removes the key and its scope.
  optional string cost_api_key = 7 [debug_redact = true];
  // cost_scope replaces the cost scope; required with a cost API key (see Provider.cost_scope).
  optional string cost_scope = 8;
}

message UpdateProviderResponse {
  Provider provider = 1;
}

message DeleteProviderRequest {
  string org_id = 1;
  string provider_id = 2;
}

message DeleteProviderResponse {}

message ListModelsRequest {
  string org_id = 1;
}

message ListModelsResponse {
  repeated Model models = 1;
}

message CreateModelRequest {
  string org_id = 1;
  string provider_id = 2;
  string name = 3;
  bool guard = 4;
  // rates is deprecated: a request that sets it fails with INVALID_ARGUMENT. Add a price with
  // PriceService.SetPrice instead.
  Rates rates = 5 [deprecated = true];
  // format is the model's wire format, within what the provider offers. Empty means the default
  // (ADR 0069); a value marks the model as overridden.
  string format = 6;
}

message CreateModelResponse {
  Model model = 1;
  // warnings are non-fatal notes, for example that the model runs without prompt caching because
  // Koinon has no cache mode for its provider format (ADR 0068).
  repeated string warnings = 2;
}

message UpdateModelRequest {
  string org_id = 1;
  string model_id = 2;
  optional bool guard = 3;
  // rates and clear_rates are deprecated: a request that sets either fails with INVALID_ARGUMENT.
  Rates rates = 4 [deprecated = true];
  bool clear_rates = 5 [deprecated = true];
  // format overrides the model's wire format, within what the provider offers; set to "" it goes
  // back to the default and is no longer overridden.
  optional string format = 6;
}

message UpdateModelResponse {
  Model model = 1;
}

message DeleteModelRequest {
  string org_id = 1;
  string model_id = 2;
}

message DeleteModelResponse {}

message ModelFormatsRequest {
  string org_id = 1;
  string provider_id = 2;
  // name is the model name; the default depends on its family.
  string name = 3;
}

message ModelFormatsResponse {
  // default_format is the id of the format the model gets unless overridden. The formats the
  // provider offers are Provider.formats.
  string default_format = 1;
}

message ProviderTypeInfoRequest {
  string org_id = 1;
  string type = 2;
}

message ProviderTypeInfoResponse {
  // formats are the model formats the type offers, preferred first.
  repeated ModelFormat formats = 1;
  // takes_workspace_id is set when the type takes an Anthropic workspace ID.
  bool takes_workspace_id = 2;
  // takes_cost_key is set when Koinon reads the type's cost API (anthropic and openai, at their own
  // API URL), so the provider takes a cost API key and a cost scope.
  bool takes_cost_key = 3;
}

message GetDefaultModelRequest {
  string org_id = 1;
}

// DefaultModelChoice is a model the org serves and has a price for.
message DefaultModelChoice {
  string name = 1;
  string provider = 2;
}

message GetDefaultModelResponse {
  // model is the org's default model; empty when the org has none.
  string model = 1;
  // available are the models the default may be set to.
  repeated DefaultModelChoice available = 2;
}

message SetDefaultModelRequest {
  string org_id = 1;
  // model is the new default model; empty clears the default.
  string model = 2;
}

message SetDefaultModelResponse {
  // model is the org's default model after the change; empty when it has none.
  string model = 1;
}
