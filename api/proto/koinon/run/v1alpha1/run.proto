syntax = "proto3";

package koinon.run.v1alpha1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/stateracloud/koinon/internal/gen/koinon/run/v1alpha1;runv1alpha1";

// RunService reads, cancels and streams runs (ADR 0030). Every request names
// the org it acts in; IDs from another org are not found.
service RunService {
  // GetRun returns one run. Viewers and above.
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CancelRun cancels a run that has not finished. Members and above.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);

  // WatchRun streams the run's events with seq greater than after_seq, first
  // the stored ones and then new ones as they are written, each exactly once
  // and in seq order. To resume after a dropped stream, call again with the
  // last seq received. The first message is a snapshot of the run; another
  // snapshot follows whenever its state changes. The stream ends after the
  // run has finished and every event has been sent. Heartbeat messages keep a quiet
  // stream open. Viewers and above.
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// RunState is the ADR 0030 state machine.
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_QUEUED = 1;
  RUN_STATE_STARTING = 2;
  RUN_STATE_RUNNING = 3;
  RUN_STATE_PARKED = 4;
  RUN_STATE_SUCCEEDED = 5;
  RUN_STATE_FAILED = 6;
  RUN_STATE_CANCELED = 7;
}

// ParkReason says why a parked run waits.
enum ParkReason {
  PARK_REASON_UNSPECIFIED = 0;
  PARK_REASON_APPROVAL = 1;
  PARK_REASON_BUDGET = 2;
  PARK_REASON_A2A = 3;
  PARK_REASON_INPUT_REQUIRED = 4;
}

// FailureClass says what kind of error ended a run (ADR 0030, amendment of 2026-10-26). Retries
// and the message to the person follow from it. Unset on a run that did not fail.
enum FailureClass {
  FAILURE_CLASS_UNSPECIFIED = 0;
  // A passing fault (a 5xx, an overloaded provider, a dropped stream); retried with backoff.
  FAILURE_CLASS_TRANSIENT = 1;
  // The provider rate-limited the request; retried after its Retry-After.
  FAILURE_CLASS_THROTTLED = 2;
  // The input does not fit the model's context window.
  FAILURE_CLASS_CONTEXT_OVERFLOW = 3;
  // A run limit (model requests or spend) or a spend limit (agent, org or platform) stopped the
  // run.
  FAILURE_CLASS_BUDGET = 4;
  // A policy denied the request; never retried.
  FAILURE_CLASS_POLICY = 5;
  // Anything unknown; never retried.
  FAILURE_CLASS_FATAL = 6;
  // The sandbox never became ready within the org's cap; never retried.
  FAILURE_CLASS_SANDBOX_UNAVAILABLE = 7;
  // The agent kept repeating itself after one nudge (the same action, the same error, messages
  // without a tool call, or two actions taking turns); never retried.
  FAILURE_CLASS_LOOP = 8;
}

// Run is one execution of an agent for a ticket.
message Run {
  string id = 1;
  string org_id = 2;
  string ticket_id = 3;
  string agent_id = 4;
  string agent_version_id = 5;
  RunState state = 6;
  ParkReason park_reason = 7;
  // Why the run failed or was canceled.
  string outcome_reason = 8;
  // Limits copied from the agent's version (or the agent's override) when the run was queued.
  int64 max_wall_clock_seconds = 9;
  // Deprecated: tokens are reported, not enforced (ADR 0081). Zero on new runs.
  int64 max_tokens = 10 [deprecated = true];
  // Tokens the run's requests used, input plus output as the gateway reports them (cache reads
  // and writes are part of the input). The split by type is in cost.
  int64 tokens_used = 11;
  // The seq of the newest event.
  int64 last_event_seq = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Timestamp finished_at = 15;
  // Model spend recorded for the run by the spend ledger (plan item L1). Set
  // by GetRun and on the runs of GetTicket; unset elsewhere.
  Cost cost = 16;
  // The class of the error that failed or stopped the run. Unspecified when the run did not
  // fail, or failed before classes existed.
  FailureClass failure_class = 17;
  // The run's request limit: 0 for a run queued before run limits existed (ADR 0081). Progress is
  // cost.requests.
  int64 max_model_requests = 18;
  // The run's spend limit in USD as a decimal string; empty when the run has none. Progress is
  // cost.usd.
  string max_spend_usd = 19;
}

// Cost is model spend recorded by the spend ledger from agentgateway's access
// log (plan item L1).
message Cost {
  // Charged model requests.
  int64 requests = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  // USD as an exact decimal string with at least two fraction digits, for
  // example "0.0021" or "0.00".
  string usd = 4;
  // False when some request had no price, so usd undercounts.
  bool priced = 5;
  // Requests whose usage the provider did not report and Koinon estimated (included in
  // requests, tokens and usd). Zero when every request reported its usage.
  int64 estimated_requests = 6;
  // input_tokens is the total input, cache reads and writes included. The split by type: the
  // uncached input is input_tokens - cache_read_tokens - cache_write_tokens. reasoning_tokens is
  // part of output_tokens where the provider reports it.
  int64 cache_read_tokens = 7;
  int64 cache_write_tokens = 8;
  int64 reasoning_tokens = 9;
}

// RunEvent is one session update or lifecycle note of a run.
message RunEvent {
  string run_id = 1;
  // Gap-free and strictly increasing per run, from 1.
  int64 seq = 2;
  // For example "session.update" or "run.canceled".
  string kind = 3;
  google.protobuf.Struct payload = 4;
  google.protobuf.Timestamp created_at = 5;
  // True when the org's retention has passed and the payload was removed; the event itself stays.
  bool content_purged = 6;
}

// GetRunRequest names a run.
message GetRunRequest {
  string org_id = 1;
  string run_id = 2;
}

// GetRunResponse holds the run.
message GetRunResponse {
  Run run = 1;
}

// CancelRunRequest names a run.
message CancelRunRequest {
  string org_id = 1;
  string run_id = 2;
  // Shown on the ticket; defaults to "canceled by <user>".
  string reason = 3;
}

// CancelRunResponse holds the canceled run.
message CancelRunResponse {
  Run run = 1;
}

// WatchRunRequest names a run and where to resume.
message WatchRunRequest {
  string org_id = 1;
  string run_id = 2;
  // Stream events with a greater seq; 0 streams from the start.
  int64 after_seq = 3;
}

// WatchRunResponse carries a run snapshot, one event, live text or a heartbeat.
message WatchRunResponse {
  oneof item {
    Run run = 1;
    RunEvent event = 2;
    // Sent every 30 seconds while the stream has sent nothing else, so a proxy or load
    // balancer does not cut a quiet run's stream as idle. Clients ignore it.
    Heartbeat heartbeat = 3;
    // Text the agent is typing, sent about every 100 ms while it types. Live only: never stored,
    // not part of the seq order, and a client that joins late or drops a stream misses it. The
    // event for the finished message or thought follows with its whole text and replaces it; a
    // client that has that event drops the item's live text (LiveChunk.item).
    LiveChunks live = 4;
  }
}

// LiveChunks is a batch of live text, in the order it was typed.
message LiveChunks {
  repeated LiveChunk chunks = 1;
}

// LiveChunk is a piece of the message or thought in progress.
message LiveChunk {
  // kind is the run event kind of the item the text belongs to, for example
  // "acp.agent_message_chunk" or "acp.agent_thought_chunk".
  string kind = 1;
  string text = 2;
  // item names the item the text belongs to. The run event stored for the item carries the same
  // name as "item" in its payload. A client that has that event drops the item's live text, in
  // whatever order the two arrive. Empty for a sender that does not name items.
  string item = 3;
}

// Heartbeat is an empty keep-alive message.
message Heartbeat {}
