syntax = "proto3";

package koinon.connection.v1alpha1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "koinon/outward/v1alpha1/outward.proto";

option go_package = "github.com/stateracloud/koinon/internal/gen/koinon/connection/v1alpha1;connectionv1alpha1";

// ConnectionService manages an org's connections to external systems
// (ADR 0007): one configured instance of a connector type, such as one GitHub
// App installation. Secrets entered here are sealed straight into the encrypted
// secret store (ADR 0021, 0056); no response ever contains them.
service ConnectionService {
  // ListConnectorTypes returns the connector types this install ships, with
  // their scopes and setup guides. Any signed-in user.
  rpc ListConnectorTypes(ListConnectorTypesRequest) returns (ListConnectorTypesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CreateGitHubConnection creates a GitHub App connection. The private key
  // is stored encrypted and never returned. Admins and owners.
  rpc CreateGitHubConnection(CreateGitHubConnectionRequest) returns (CreateGitHubConnectionResponse);

  // CreateGiteaConnection creates a Gitea connection: a bot account on a Gitea server with a read
  // token and a write token (ADR 0063). Both tokens are stored encrypted and never returned.
  // Admins and owners.
  rpc CreateGiteaConnection(CreateGiteaConnectionRequest) returns (CreateGiteaConnectionResponse);

  // SetConnectionSecret replaces the secret fields of a connection entered here: a GitHub App's private
  // key, or a Gitea connection's two tokens. It is how a secret lost with its key-encryption key is
  // entered again (ADR 0085 decision 13), and how one is rotated. Every secret field of the connector
  // is required; the other settings stay. It clears the lost mark and the last test result. A
  // declared connection's secret is changed in its Kubernetes Secret instead (FAILED_PRECONDITION).
  // Audited without the secret. Admins and owners.
  rpc SetConnectionSecret(SetConnectionSecretRequest) returns (SetConnectionSecretResponse);

  // GetConnection returns one connection. Viewers and above.
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListConnections returns the org's connections, oldest first. Viewers and
  // above.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // TestConnection runs the setup guide's checks against the provider and
  // records the result. Nothing is written to the provider. Admins and owners.
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);

  // DeleteConnection deletes a connection and its stored secret fields for good. A connection entered
  // here can be deleted; a declared one only after its Secret was deleted (removed). While agents are
  // bound to it the call fails with FAILED_PRECONDITION and lists them. Audited. Admins and owners.
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse);

  // ListInstallationRepos lists the repositories a GitHub connection's App
  // installation can access, for choosing what to bind an agent to. Koinon
  // asks GitHub with a metadata-read installation token; nothing is written.
  // Admins and owners.
  rpc ListInstallationRepos(ListInstallationReposRequest) returns (ListInstallationReposResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Tier is a scope's risk tier (ADR 0008).
enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_READ = 1;
  TIER_REVERSIBLE_WRITE = 2;
  TIER_EXTERNAL_OR_IRREVERSIBLE = 3;
  TIER_FORBIDDEN = 4;
}

// Scope is a grantable capability of a connector type.
message Scope {
  string id = 1;
  Tier tier = 2;
  string description = 3;
  // MCP tools the scope exposes behind agentgateway.
  repeated string tools = 4;
}

// ConnectorType is a platform-curated connector type.
message ConnectorType {
  string id = 1;
  string version = 2;
  string display_name = 3;
  string description = 4;
  // "app-credential", "federated" or "delegated-user".
  string auth_type = 5;
  repeated Scope scopes = 6;
  // The whole connector type document as JSON, setup guide included; its
  // shape is connectors/schema/connector.schema.json.
  google.protobuf.Struct document = 7;
}

// ListConnectorTypesRequest is empty.
message ListConnectorTypesRequest {}

// ListConnectorTypesResponse lists the connector types.
message ListConnectorTypesResponse {
  repeated ConnectorType connector_types = 1;
}

// ConnectionStatus is the outcome of the last test.
enum ConnectionStatus {
  CONNECTION_STATUS_UNSPECIFIED = 0;
  CONNECTION_STATUS_UNTESTED = 1;
  CONNECTION_STATUS_OK = 2;
  CONNECTION_STATUS_FAILING = 3;
}

// CheckResult is one setup-guide check.
message CheckResult {
  // The check's name, e.g. github.installation.
  string check = 1;
  // The setup-guide step it validates, so the UI can point at it.
  string step = 2;
  bool ok = 3;
  // What went wrong, or what was found. Never contains secrets.
  string message = 4;
}

// GitHubConnection is the non-secret part of a GitHub App connection.
message GitHubConnection {
  int64 app_id = 1;
  int64 installation_id = 2;
  // SHA-256 fingerprint of the private key's public half, as GitHub shows it
  // under the App's private keys.
  string key_fingerprint = 3;
  // The host's web base URL when it is not github.com (GitHub Enterprise
  // Server), https://host[:port]; empty for github.com.
  string base_url = 4;
  // PEM certificates trusted for that host besides the system roots. Public;
  // empty when the host's certificate chains to the system roots.
  string ca_bundle = 5;
  // Directories, relative to the repository root, that run CI on this host besides the
  // connector's own CI paths (a Gitea server's WORKFLOW_DIRS). create_pull_request refuses
  // changes to them.
  repeated string ci_dirs = 6;
}

// GiteaConnection is the non-secret part of a Gitea connection (ADR 0063).
message GiteaConnection {
  // The server's web base URL, https://host[:port][/path]; the REST API is at /api/v1 under it.
  string base_url = 1;
  // PEM certificates trusted for that server besides the system roots. Public.
  string ca_bundle = 2;
  // Directories, relative to the repository root, that run CI on this server besides the
  // connector's own CI paths (WORKFLOW_DIRS).
  repeated string ci_dirs = 3;
  // When each token was entered in Koinon. Gitea does not expose a token's creation date, so
  // this is the age Koinon can show (ADR 0063).
  google.protobuf.Timestamp read_token_set_at = 4;
  google.protobuf.Timestamp write_token_set_at = 5;
  // The age after which Koinon warns that a token is old, from the connector type. Nothing
  // blocks on age and Koinon never rotates a token. Zero for no warning.
  int64 token_warn_after_seconds = 6;
}

// Connection is a configured connector instance.
message Connection {
  string id = 1;
  string org_id = 2;
  // Connector type ID, e.g. github.
  string connector = 3;
  string display_name = 4;
  ConnectionStatus status = 5;
  google.protobuf.Timestamp last_tested_at = 6;
  repeated CheckResult last_test = 7;
  google.protobuf.Timestamp created_at = 8;
  // source is "ui" for a connection entered here and "secret" for one declared by a
  // labelled Kubernetes Secret (ADR 0056), which is managed_by_secret.
  string source = 11;
  string managed_by_secret = 12;
  // removed is set when the declaring Secret was deleted. The connection stays, for the audit log and
  // the agents bound to it, but is not usable: bound agents report why and runs that need it fail
  // with that reason. Restoring the Secret restores the connection.
  bool removed = 13;
  // credential_lost_at is set when the secret was lost with the key that encrypted it (`koinon-api keys
  // forget`, ADR 0085 decision 13): the connection is not usable (bound agents report it and runs that need it fail) until the
  // secret is entered again. Unset otherwise.
  google.protobuf.Timestamp credential_lost_at = 15;
  // admin_disabled is set while an admin holds the target off (the outward switch, ADR 0110 decision 5): it is
  // not called, probed or offered to runs. Unset otherwise.
  koinon.outward.v1alpha1.AdminDisabled admin_disabled = 16;

  oneof settings {
    GitHubConnection github = 10;
    GiteaConnection gitea = 14;
  }
}

// CreateGitHubConnectionRequest carries the setup guide's fields.
message CreateGitHubConnectionRequest {
  string org_id = 1;
  string display_name = 2;
  int64 app_id = 3;
  int64 installation_id = 4;
  // Secure input (ADR 0021): the App's PEM private key. Stored only as an
  // envelope in Postgres (ADR 0056), never returned or logged.
  string private_key = 5 [debug_redact = true];
  // Run TestConnection right after creating it.
  bool test = 6;
  // Web base URL of a GitHub Enterprise Server host, https://host[:port]. Empty
  // is github.com. The REST API is reached at /api/v3 on the same host.
  string base_url = 7;
  // PEM certificates that sign the host's TLS certificate, when the system
  // roots do not. Used for Koinon's API calls and for git in sandboxes.
  string ca_bundle = 8;
  // Directories that run CI on this host besides the connector's own CI paths, relative to the
  // repository root. Optional; at most 20.
  repeated string ci_dirs = 9;
}

// CreateGitHubConnectionResponse holds the new connection and, when asked
// for, the test results.
message CreateGitHubConnectionResponse {
  Connection connection = 1;
  repeated CheckResult results = 2;
}

// CreateGiteaConnectionRequest carries the setup guide's fields.
message CreateGiteaConnectionRequest {
  string org_id = 1;
  string display_name = 2;
  // The server's web base URL, https://host[:port][/path]. Required.
  string base_url = 3;
  // Secure input (ADR 0021): the bot's read token and write token. Stored only as an envelope in
  // Postgres (ADR 0056), never returned or logged.
  string read_token = 4 [debug_redact = true];
  string write_token = 5 [debug_redact = true];
  // PEM certificates that sign the server's TLS certificate, when the system roots do not.
  string ca_bundle = 6;
  // Directories that run CI on this server besides the connector's own CI paths. At most 20.
  repeated string ci_dirs = 7;
  // Run TestConnection right after creating it.
  bool test = 8;
}

// CreateGiteaConnectionResponse holds the new connection and, when asked for, the test results.
message CreateGiteaConnectionResponse {
  Connection connection = 1;
  repeated CheckResult results = 2;
}

// SetConnectionSecretRequest names a connection and carries its new secret fields. The secret's
// connector must be the connection's.
message SetConnectionSecretRequest {
  string org_id = 1;
  string connection_id = 2;
  oneof secret {
    GitHubConnectionSecret github = 3;
    GiteaConnectionSecret gitea = 4;
  }
  // Run TestConnection right after storing the secret.
  bool test = 5;
}

// GitHubConnectionSecret is the secret field of a GitHub App connection.
message GitHubConnectionSecret {
  // Secure input (ADR 0021): the App's PEM private key, a new one or the one GitHub still lists.
  // Stored only as an envelope in Postgres (ADR 0056), never returned or logged.
  string private_key = 1 [debug_redact = true];
}

// GiteaConnectionSecret is the secret fields of a Gitea connection (ADR 0063).
message GiteaConnectionSecret {
  // Secure input (ADR 0021): the bot's read token and write token, both required. A token equal to
  // the stored one keeps the date it was entered. Stored only as an envelope, never returned or logged.
  string read_token = 1 [debug_redact = true];
  string write_token = 2 [debug_redact = true];
}

// SetConnectionSecretResponse holds the connection and, when asked for, the test results.
message SetConnectionSecretResponse {
  Connection connection = 1;
  repeated CheckResult results = 2;
}

// GetConnectionRequest names a connection.
message GetConnectionRequest {
  string org_id = 1;
  string connection_id = 2;
}

// GetConnectionResponse holds the connection.
message GetConnectionResponse {
  Connection connection = 1;
}

message DeleteConnectionRequest {
  string org_id = 1;
  string connection_id = 2;
}

message DeleteConnectionResponse {}

// BoundAgents is the error detail of a DeleteConnection refused with FAILED_PRECONDITION because
// agents are still bound to the connection.
message BoundAgents {
  repeated BoundAgent agents = 1;
}

message BoundAgent {
  string id = 1;
  string display_name = 2;
}

// ListConnectionsRequest names the org.
message ListConnectionsRequest {
  string org_id = 1;
}

// ListConnectionsResponse lists the org's connections.
message ListConnectionsResponse {
  repeated Connection connections = 1;
}

// TestConnectionRequest names a connection.
message TestConnectionRequest {
  string org_id = 1;
  string connection_id = 2;
}

// TestConnectionResponse holds the checks in setup-guide order.
message TestConnectionResponse {
  Connection connection = 1;
  repeated CheckResult results = 2;
}

// ListInstallationReposRequest names a GitHub connection and a page.
message ListInstallationReposRequest {
  string org_id = 1;
  string connection_id = 2;
  // Empty for the first page; otherwise next_page_token of the previous
  // response, sent with the same query.
  string page_token = 3;
  // Keeps only repositories whose owner/name contains it, ignoring case.
  // At most 200 characters.
  string query = 4;
}

// InstallationRepo is one repository the installation can access.
message InstallationRepo {
  // owner/name as GitHub spells it: the name to bind.
  string full_name = 1;
  bool private = 2;
  string default_branch = 3;
}

// ListInstallationReposResponse is one page, in GitHub's order.
message ListInstallationReposResponse {
  repeated InstallationRepo repos = 1;
  // Empty on the last page. A filtered page can hold fewer repositories than
  // an unfiltered one, or none, and still have a next page.
  string next_page_token = 2;
  // How many repositories the installation can access, before the query.
  int64 total_count = 3;
}
