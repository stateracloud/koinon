syntax = "proto3";

package koinon.agent.v1alpha1;

import "google/protobuf/timestamp.proto";
import "koinon/template/v1alpha1/template.proto";

option go_package = "github.com/stateracloud/koinon/internal/gen/koinon/agent/v1alpha1;agentv1alpha1";

// AgentService manages an org's agents (ADR 0020). Every request names the
// org it acts in; IDs from another org are not found.
service AgentService {
  // CreateAgentFromTemplate creates a draft agent from a template. Members
  // and above.
  rpc CreateAgentFromTemplate(CreateAgentFromTemplateRequest) returns (CreateAgentFromTemplateResponse);

  // GetAgent returns one agent. Viewers and above.
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListAgents returns the org's agents, oldest first. Viewers and above.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ActivateAgent activates a draft, or moves an active agent to its newer proposed version
  // (ADR 0066), and so approves the grants that version proposes. Admins and owners only.
  rpc ActivateAgent(ActivateAgentRequest) returns (ActivateAgentResponse);

  // SetAgentTriggers proposes a new version with the given triggers (everything else carried over
  // from the latest version). The triggers fire nothing until ActivateAgent activates that
  // version; an active agent keeps running its active version meanwhile. Audited. Admins and
  // owners only.
  rpc SetAgentTriggers(SetAgentTriggersRequest) returns (SetAgentTriggersResponse);

  // ResumeAgent clears the unhealthy state of an agent whose sandbox got stuck again and again
  // (ADR 0054), so it takes runs again; its stuck sandbox is recreated. Audited. Admins and owners
  // only.
  rpc ResumeAgent(ResumeAgentRequest) returns (ResumeAgentResponse);

  // GetAgentModel says which model the agent's next run uses and where that choice comes from, and
  // lists the models an admin may pick. Admins and owners only.
  rpc GetAgentModel(GetAgentModelRequest) returns (GetAgentModelResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetAgentModel sets the agent's model, or clears it with "default". It is a setting of the
  // agent, not a new version: it applies to the agent's next run. The model must be one the org
  // serves and has a price for. Audited, with the old and the new value. Admins and owners only.
  rpc SetAgentModel(SetAgentModelRequest) returns (SetAgentModelResponse);

  // SetAgentThinking sets whether the agent's model thinks: "on" or "off", or clears the setting
  // with an empty value so the version's value (a template's spec.model.thinking) and then the
  // default, on, apply. Thinking is on unless somebody turns it off (ADR 0069 amendment
  // 2026-10-29). Like the model it is a setting of the agent, not a new version, and applies to the
  // next run. A model that cannot think ignores it (GetAgentModel says so). Audited, with the old
  // and the new value. Admins and owners only.
  rpc SetAgentThinking(SetAgentThinkingRequest) returns (SetAgentThinkingResponse);

  // SetAgentKeepWarm asks for the agent's sandbox to stay up (it is never idle-stopped and starts
  // when found stopped), or withdraws the request. A request, not a promise: the operator caps
  // the keep-warm sandboxes per org (reconciler.keepWarmPerOrg) and the reconciler grants requests
  // oldest agent first; Agent.keep_warm_granted says whether this one was. Like the model it is a
  // setting of the agent, not a new version. Audited, with the old and the new value. Fails with
  // FailedPrecondition on an archived agent. Admins and owners only (ADR 0049 amendment 2026-11-01).
  rpc SetAgentKeepWarm(SetAgentKeepWarmRequest) returns (SetAgentKeepWarmResponse);

  // GetAgentSandboxResources returns the agent's sandbox CPU and memory sizing: its own override,
  // the template's values, what the next sandbox gets, and the platform bounds an override must
  // stay inside (ADR 0083). Admins and owners only.
  rpc GetAgentSandboxResources(GetAgentSandboxResourcesRequest) returns (GetAgentSandboxResourcesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetAgentSandboxResources sets the agent's sandbox resource override, or clears the values left
  // empty so the template's value and then the platform default apply. A value outside the
  // platform bounds is refused with INVALID_ARGUMENT and a message that names the bounds. Like the
  // model it is a setting of the agent, not a new version; a change recreates the sandbox at the
  // next run (the size is part of the sandbox spec hash). Audited, with the old and the new
  // override. Admins and owners only.
  rpc SetAgentSandboxResources(SetAgentSandboxResourcesRequest) returns (SetAgentSandboxResourcesResponse);

  // RunAgentTrigger fires one schedule trigger of the active version now, as the scheduler would
  // at a due time, with the trigger's instruction. The task is marked as a manual fire. Audited.
  // Admins and owners only.
  rpc RunAgentTrigger(RunAgentTriggerRequest) returns (RunAgentTriggerResponse);

  // ArchiveAgent archives a draft or active agent and cancels its unfinished
  // runs. Admins and owners only.
  rpc ArchiveAgent(ArchiveAgentRequest) returns (ArchiveAgentResponse);
}

// AgentStatus is the agent lifecycle (ADR 0020).
enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_DRAFT = 1;
  AGENT_STATUS_ACTIVE = 2;
  AGENT_STATUS_ARCHIVED = 3;
}

// Agent is an agent and the definition it runs.
message Agent {
  string id = 1;
  string org_id = 2;
  string display_name = 3;
  AgentStatus status = 4;
  // Deprecated: use harness. Unspecified when the harness has no Flavor value.
  koinon.template.v1alpha1.Flavor flavor = 5 [deprecated = true];
  // The template content the agent was created from, if any.
  string template_id = 6;
  string template_slug = 7;
  // The newest version. ActivateAgent must name it.
  int32 latest_version = 8;
  // The approved version runs execute; 0 before the first activation.
  int32 active_version = 9;
  // Grants the latest version proposes.
  repeated koinon.template.v1alpha1.Grant proposed_grants = 10;
  // Grants approved with the active version.
  repeated koinon.template.v1alpha1.Grant approved_grants = 11;
  string instructions = 12;
  string model = 13;
  koinon.template.v1alpha1.RunLimits run_limits = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp activated_at = 16;
  google.protobuf.Timestamp archived_at = 17;
  // Set while the agent is unhealthy: its sandbox got stuck three times in 24 hours and was not
  // recreated again (ADR 0054). New runs are refused until ResumeAgent.
  google.protobuf.Timestamp unhealthy_at = 18;
  string unhealthy_reason = 19;
  // Triggers the latest version proposes; they have no effect until it is activated.
  repeated koinon.template.v1alpha1.Trigger proposed_triggers = 20;
  // Triggers of the active version: the ones in effect.
  repeated koinon.template.v1alpha1.Trigger approved_triggers = 21;
  // The latest version is ephemeral: each task gets a fresh sandbox without a home, deleted when
  // the task ends (ADR 0065 decision 13c).
  bool ephemeral = 22;
  // Set while the agent's sandbox and volume are archived (ADR 0032 amendment): the home is in
  // its last checkpoint and the next run restores it into a fresh sandbox.
  google.protobuf.Timestamp sandbox_archived_at = 23;
  // The agent's own model setting (SetAgentModel); empty when it follows the version and the org
  // default. When set it wins over `model`, which is the latest version's.
  string model_setting = 24;
  // The agent's own sandbox resource override (SetAgentSandboxResources); every value empty when
  // it follows the template and the platform default.
  SandboxResources sandbox_resources = 25;
  // Whether an org admin asked for the agent's sandbox to stay up (SetAgentKeepWarm; ADR 0049
  // amendment 2026-11-01). A request: the operator caps how many the reconciler grants per org.
  bool keep_warm = 26;
  // Whether the reconciler granted the request under the operator's per-org cap
  // (reconciler.keepWarmPerOrg). Only meaningful with keep_warm; false for an archived agent. A new
  // request reads false until the reconciler's next pass.
  bool keep_warm_granted = 27;
  // The name of the harness the agent runs on (ADR 0112), for example "opencode". Fixed when the
  // agent is created.
  string harness = 28;
}

// CreateAgentFromTemplateRequest names the template and the user's choices.
message CreateAgentFromTemplateRequest {
  string org_id = 1;
  // A Template.id from ListTemplates.
  string template_id = 2;
  string display_name = 3;
  // Deprecated: use harness. Read only when harness is empty.
  koinon.template.v1alpha1.Flavor flavor = 4 [deprecated = true];
  // Where the template's grants apply: one entry per grant on a connector
  // type with targets. A grant whose template sets targets min above zero
  // needs one. Stored with the agent's version; ActivateAgent approves it with
  // the grant.
  repeated GrantBinding grants = 5;
  // Overrides the template's ephemeral setting; unset keeps it.
  optional bool ephemeral = 6;
  // One of the template's allowed harnesses, by name; empty picks its default (ADR 0112).
  string harness = 7;
}

// GrantBinding binds a template grant to one of the org's connections and
// the targets it is narrowed to.
message GrantBinding {
  // The grant's connector type, for example "github".
  string connector = 1;
  // A connection of that type in the org (ConnectionService).
  string connection_id = 2;
  // For GitHub: repositories as owner/name. Their number must be within the
  // template grant's targets min and max, and the connection's installation
  // must be able to access each of them.
  repeated string repositories = 3;
}

// CreateAgentFromTemplateResponse holds the new draft.
message CreateAgentFromTemplateResponse {
  Agent agent = 1;
}

// GetAgentRequest names an agent.
message GetAgentRequest {
  string org_id = 1;
  string agent_id = 2;
}

// GetAgentResponse holds the agent.
message GetAgentResponse {
  Agent agent = 1;
}

// ListAgentsRequest names the org.
message ListAgentsRequest {
  string org_id = 1;
}

// ListAgentsResponse lists the org's agents.
message ListAgentsResponse {
  repeated Agent agents = 1;
}

// ActivateAgentRequest names the draft and the version the caller reviewed.
message ActivateAgentRequest {
  string org_id = 1;
  string agent_id = 2;
  // Must equal the agent's latest_version, so the caller approves exactly the
  // grants they saw; otherwise the call fails with FailedPrecondition.
  int32 version = 3;
  // Start fresh sessions, with a handoff, on the agent's open tickets: their next run begins a new
  // session from the agent's last notes and replies instead of loading the old one, so the new
  // version's instructions apply (ADR 0051 amendment). Default off; audited.
  bool apply_to_open_tickets = 4;
}

// ActivateAgentResponse holds the active agent.
message ActivateAgentResponse {
  Agent agent = 1;
  // How many open tickets were marked to start a fresh session.
  int32 tickets_restarting = 2;
}

// ResumeAgentRequest names the agent.
message ResumeAgentRequest {
  string org_id = 1;
  string agent_id = 2;
}

// ResumeAgentResponse holds the agent, healthy again.
message ResumeAgentResponse {
  Agent agent = 1;
}

// ArchiveAgentRequest names the agent.
message ArchiveAgentRequest {
  string org_id = 1;
  string agent_id = 2;
}

// ArchiveAgentResponse holds the archived agent.
message ArchiveAgentResponse {
  Agent agent = 1;
}

// SetAgentTriggersRequest replaces the triggers of the agent's latest version in a new version.
message SetAgentTriggersRequest {
  string org_id = 1;
  string agent_id = 2;
  // Must equal the agent's latest_version, so a concurrent edit is not overwritten; otherwise the
  // call fails with FailedPrecondition.
  int32 base_version = 3;
  // The complete list; empty removes every trigger.
  repeated koinon.template.v1alpha1.Trigger triggers = 4;
}

// SetAgentTriggersResponse holds the agent with its new proposed version.
message SetAgentTriggersResponse {
  Agent agent = 1;
}

// ModelSource says where an agent's effective model comes from, in order of precedence.
enum ModelSource {
  MODEL_SOURCE_UNSPECIFIED = 0;
  // The agent's own setting (SetAgentModel).
  MODEL_SOURCE_AGENT = 1;
  // The model of the agent's active version (a template's spec.model).
  MODEL_SOURCE_VERSION = 2;
  // The default model: the org's stored default model (ADR 0086), or the platform's
  // --default-model when the org has none.
  MODEL_SOURCE_ORG_DEFAULT = 3;
  // Nothing: the agent, its version and the platform name no model and the org has no default
  // model, so a run would fail until an admin sets one.
  MODEL_SOURCE_NONE = 4;
}

// GetAgentModelRequest names an agent.
message GetAgentModelRequest {
  string org_id = 1;
  string agent_id = 2;
}

// ServedModel is a model the org serves and has a price for.
message ServedModel {
  string name = 1;
  string provider = 2;
}

// GetAgentModelResponse is the agent's model setting and what it resolves to.
message GetAgentModelResponse {
  // The agent's setting; empty for default.
  string setting = 1;
  // The active version's model; empty when the version names none ("default" in a template).
  string version_model = 2;
  // The model the next run uses; empty with MODEL_SOURCE_NONE.
  string effective = 3;
  ModelSource source = 4;
  // Set when the agent's setting is no longer served or priced: runs fail until it is changed.
  string problem = 5;
  // Models the org serves and has a price for, by provider and name: the picker's choices.
  repeated ServedModel available = 6;
  // The agent's thinking setting for the effective model.
  ThinkingState thinking = 7;
}

// ThinkingState is the agent's thinking setting and what it resolves to (ADR 0069 amendment
// 2026-10-29).
message ThinkingState {
  // The agent's own setting: "on", "off", or empty when it follows the version and the default.
  string setting = 1;
  // The active version's value (a template's spec.model.thinking); empty when it names none.
  string version_setting = 2;
  // What the layers resolve to, "on" or "off", whether or not the model can think.
  string effective = 3;
  // Whether the effective model thinks. When false the setting has no effect and the UI says
  // "not supported by this model".
  bool supported = 4;
  // The form the next run sends (internal/thinking.Mode): "none" when the model does not think,
  // "adaptive-summarized" or "default" for thinking on, "disabled" or "effort-none" for thinking off.
  string mode = 5;
  // Whether the effective model thinks whatever the setting. A UI then offers no off choice and says
  // "this model always thinks"; setting "off" is refused with that message.
  bool always_thinks = 6;
  // Whether the setting resolves to off and the model thinks anyway (it always thinks). The setting
  // is kept for a model that can stop; runs think.
  bool off_overridden = 7;
  // What a UI shows about the setting: "this model always thinks; your off setting doesn't apply"
  // when off_overridden, empty otherwise.
  string notice = 8;
}

// SetAgentModelRequest sets the agent's model.
message SetAgentModelRequest {
  string org_id = 1;
  string agent_id = 2;
  // "default" (or empty) clears the setting; otherwise a model the org serves and has a price for.
  string model = 3;
}

// SetAgentModelResponse holds the result, as GetAgentModel would return it.
message SetAgentModelResponse {
  GetAgentModelResponse model = 1;
}

// SetAgentThinkingRequest sets the agent's thinking setting.
message SetAgentThinkingRequest {
  string org_id = 1;
  string agent_id = 2;
  // "on" or "off"; empty clears the setting.
  string thinking = 3;
}

// SetAgentThinkingResponse holds the result, as GetAgentModel would return it.
message SetAgentThinkingResponse {
  GetAgentModelResponse model = 1;
}

// SandboxResources are the four sandbox sizing values, as Kubernetes quantities such as "250m" or
// "2Gi". An empty value is unset.
message SandboxResources {
  string cpu_request = 1;
  string cpu_limit = 2;
  string memory_request = 3;
  string memory_limit = 4;
}

// SandboxRange bounds one value. An empty min or max is unbounded on that side.
message SandboxRange {
  string min = 1;
  string max = 2;
}

// SandboxBounds are the platform's range for each of the four values (chart sandbox.resources.bounds).
message SandboxBounds {
  SandboxRange cpu_request = 1;
  SandboxRange cpu_limit = 2;
  SandboxRange memory_request = 3;
  SandboxRange memory_limit = 4;
}

// GetAgentSandboxResourcesRequest names the agent.
message GetAgentSandboxResourcesRequest {
  string org_id = 1;
  string agent_id = 2;
}

// SandboxResourcesState is the agent's sandbox sizing and where it comes from.
message SandboxResourcesState {
  // The agent's own override; empty values follow the template.
  SandboxResources override = 1;
  // The active version's (or, before activation, the latest version's) template values; empty
  // values take the platform default.
  SandboxResources template = 2;
  // What the next sandbox gets: override, else template, else platform default, clamped to the bounds.
  SandboxResources effective = 3;
  // The platform bounds an override must stay inside.
  SandboxBounds bounds = 4;
  // Whether the platform raises the memory request to the memory limit (Kata, ADR 0083); a memory
  // request in an override then has no effect.
  bool memory_request_equals_limit = 5;
}

// GetAgentSandboxResourcesResponse holds the state.
message GetAgentSandboxResourcesResponse {
  SandboxResourcesState state = 1;
}

// SetAgentSandboxResourcesRequest sets the agent's override.
message SetAgentSandboxResourcesRequest {
  string org_id = 1;
  string agent_id = 2;
  // The whole override: a value left empty is cleared.
  SandboxResources resources = 3;
}

// SetAgentSandboxResourcesResponse holds the result, as GetAgentSandboxResources would return it.
message SetAgentSandboxResourcesResponse {
  SandboxResourcesState state = 1;
}

// SetAgentKeepWarmRequest sets or withdraws the agent's keep-warm request.
message SetAgentKeepWarmRequest {
  string org_id = 1;
  string agent_id = 2;
  bool keep_warm = 3;
}

// SetAgentKeepWarmResponse holds the agent as GetAgent would return it.
message SetAgentKeepWarmResponse {
  Agent agent = 1;
}

// RunAgentTriggerRequest names the trigger to fire.
message RunAgentTriggerRequest {
  string org_id = 1;
  string agent_id = 2;
  // The trigger's ID in the agent's active version. It must be a schedule trigger.
  string trigger_id = 3;
}

// RunAgentTriggerResponse names the task the fire created.
message RunAgentTriggerResponse {
  string task_id = 1;
}
