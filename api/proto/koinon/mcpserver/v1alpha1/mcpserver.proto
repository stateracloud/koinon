syntax = "proto3";

package koinon.mcpserver.v1alpha1;

import "google/protobuf/timestamp.proto";
import "koinon/outward/v1alpha1/outward.proto";

option go_package = "github.com/stateracloud/koinon/internal/gen/koinon/mcpserver/v1alpha1;mcpserverv1alpha1";

// McpServerService manages an org's remote MCP servers (ADR 0057) for the UI. It is the connect-rpc
// face of the same service layer the admin API uses, so validation, the upstream URL policy and the
// audit trail are the same. Admins and owners only: members do not see servers.
//
// Servers declared by a labelled Kubernetes Secret (source "secret") are read-only: changing or
// deleting a live one fails with FAILED_PRECONDITION and names the Secret. Their tools' tiers can still
// be set here. Credentials are write-only; they are never returned.
service McpServerService {
  rpc ListServers(ListServersRequest) returns (ListServersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateServer adds a server. A server that asks each user to sign in with OAuth is refused with
  // INVALID_ARGUMENT (planned for v0.2).
  rpc CreateServer(CreateServerRequest) returns (CreateServerResponse);
  rpc UpdateServer(UpdateServerRequest) returns (UpdateServerResponse);
  // SetServerClass sets what a server exposes: its kind and the legs of the leak guard (ADR 0084) it
  // carries. It works for declared servers too, which the declaring Secret does not describe. Audited
  // as mcp_server.data_class.set.
  rpc SetServerClass(SetServerClassRequest) returns (SetServerClassResponse);
  // DeleteServer deletes a server entered here, with its tools and the agents' allowances of it. A
  // declared server can be deleted only after its Secret was deleted (removed).
  rpc DeleteServer(DeleteServerRequest) returns (DeleteServerResponse);

  // ListTools returns the tools of one server, or of all the org's servers when server_id is empty.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetToolTier moves a tool to a tier and clears its review flag.
  rpc SetToolTier(SetToolTierRequest) returns (SetToolTierResponse);
  // SetToolTwoApprovers turns on or off the requirement that a call to the tool in the ask tier needs
  // two approvers: distinct admins or owners, neither the ticket's creator. Off by default.
  rpc SetToolTwoApprovers(SetToolTwoApproversRequest) returns (SetToolTwoApproversResponse);
  // SetToolSink declares a tool's sink class, address arguments and result legs (ADR 0091). The
  // request names the content hash of the tool the admin reviewed; if the server republished the tool
  // since, the call fails with ABORTED (HTTP 409) and nothing changes. Audited as
  // mcp_tool.declaration.set. A changed server URL or tool content hash puts the declaration back to
  // the default, audited as mcp_tool.declaration.reset.
  rpc SetToolSink(SetToolSinkRequest) returns (SetToolSinkResponse);
  // AcknowledgeToolReview clears a tool's review flag without changing its tier.
  rpc AcknowledgeToolReview(AcknowledgeToolReviewRequest) returns (AcknowledgeToolReviewResponse);

  // GetAgentServers returns the servers an agent may use.
  rpc GetAgentServers(GetAgentServersRequest) returns (GetAgentServersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetAgentServers replaces the servers an agent may use.
  rpc SetAgentServers(SetAgentServersRequest) returns (SetAgentServersResponse);
}

enum Tier {
  TIER_UNSPECIFIED = 0;
  // ASK: a human approves each call (ADR 0008, 0042). Every new tool starts here.
  TIER_ASK = 1;
  // AUTO: the agent calls the tool directly.
  TIER_AUTO = 2;
  // NEVER: no agent may call the tool.
  TIER_NEVER = 3;
}

enum Health {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_UNKNOWN = 1;
  HEALTH_HEALTHY = 2;
  // UNHEALTHY: three probes in a row failed; the server's tools are withdrawn from agents.
  HEALTH_UNHEALTHY = 3;
}

// Server is a remote MCP server of the org. It never holds the credential.
message Server {
  string id = 1;
  string name = 2;
  string url = 3;
  // transport is "streamable-http" or "sse".
  string transport = 4;
  bool has_credential = 5;
  string credential_header = 6;
  string credential_prefix = 7;
  // source is "ui" for a server entered here and "secret" for one declared by a Secret.
  string source = 8;
  string managed_by_secret = 9;
  // disabled_reason says why the server is not served, empty when it is.
  string disabled_reason = 10;
  // removed is set when the declaring Secret was deleted.
  bool removed = 11;
  Health health = 12;
  string health_reason = 13;
  google.protobuf.Timestamp health_checked_at = 14;
  google.protobuf.Timestamp health_since = 15;
  google.protobuf.Timestamp tools_synced_at = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  // gateway_target is the name of the server's target in the gateway, "<org slug>-<name>", which is
  // also the prefix of its tools in an agent's tool list.
  string gateway_target = 19;
  // kind is "fetch", "search" or "other"; data_class lists the session legs the server's results can
  // set, in the order untrusted_input, private_data (see ServerClass). A server nobody classified is
  // kind "other" with both legs.
  string kind = 20;
  repeated string data_class = 21;
  // code_host_connection_id is the org's code-host connection the server acts through, empty for none.
  // The code-host sink class of its tools is looked up in that connection's repository list only; a
  // server without one is external-high. A changed URL clears it.
  string code_host_connection_id = 22;
  // credential_lost_at is set when the credential was lost with the key that encrypted it (`koinon-api keys
  // forget`, ADR 0085 decision 13): the server is not served until the credential is entered again; has_credential
  // is false and credential_header and credential_prefix are kept, so only the value is asked for. Unset otherwise.
  google.protobuf.Timestamp credential_lost_at = 23;
  // admin_disabled is set while an admin holds the target off (the outward switch, ADR 0110 decision 5): it is
  // not called, probed or offered to runs. Unset otherwise.
  koinon.outward.v1alpha1.AdminDisabled admin_disabled = 24;
}

// ServerClass is what a server declares it exposes (ADR 0084 decision 8).
message ServerClass {
  // kind is "fetch" (reads web pages or other untrusted documents), "search" (sends a query to a
  // search provider) or "other".
  string kind = 1;
  // data_class are the session legs the server's results can set (ADR 0091), any of "untrusted_input"
  // (returns text an outsider controls) and "private_data" (returns data the org does not want to
  // leave). A server may carry both; none is allowed. Where a call goes is not a server leg: it is the
  // sink class of each tool (ToolSink).
  repeated string data_class = 2;
  // code_host_connection_id links the server to one of the org's code-host connections (see Server).
  // Empty means none.
  string code_host_connection_id = 3;
}

message Tool {
  string server_id = 1;
  string name = 2;
  string description = 3;
  // read_only_hint is the server's own readOnlyHint annotation: a suggestion for the admin, who decides
  // the tier.
  bool read_only_hint = 4;
  Tier tier = 5;
  // review_reason is set while the tool's description or input schema changed since an admin last
  // reviewed it. It does not block the tool.
  string review_reason = 6;
  // present is false once the server stopped listing the tool.
  bool present = 7;
  google.protobuf.Timestamp first_seen_at = 8;
  google.protobuf.Timestamp last_seen_at = 9;
  string tier_set_by = 10;
  google.protobuf.Timestamp tier_set_at = 11;
  // requires_two_approvers: a call in the ask tier needs two approvers.
  bool requires_two_approvers = 12;
  // content_hash identifies the description and input schema as last published.
  string content_hash = 13;
  // unavailable says why agents are not offered the tool ("unavailable: name too long ..."); empty when
  // they are.
  string unavailable = 14;
  // description is the sanitised text (ADR 0057 amendment, #52). description_original_length is the
  // length in characters of the description as the server published it; description_capped says it,
  // or a description in the input schema, was cut to its cap; description_cleaned says control,
  // invisible or tag characters were removed or harness-lookalike tags escaped.
  int64 description_original_length = 15;
  bool description_capped = 16;
  bool description_cleaned = 17;
  // sink is the tool's declaration for the leak guard (ADR 0091). A tool nobody declared is
  // external-high with the server's legs.
  ToolSink sink = 18;
}

// ToolSink is what a tool declares about its calls (ADR 0091 decision 2).
message ToolSink {
  // sink_class is "none", "internal", "external-low" or "external-high": the fixed class of the tool.
  // For a derived tool it is the class of a call whose address arguments do not parse, always
  // "external-high".
  string sink_class = 1;
  // derivation is "fixed" (use sink_class), "code_host" (internal only for a non-public repository of
  // the org's code-host scope; address_args are the owner and repo arguments, in that order) or "fetch"
  // (internal for a fetch-trusted host, otherwise external-low; address_args is the url argument).
  string derivation = 2;
  // address_args name the arguments that say where a call goes. Every other argument is payload.
  repeated string address_args = 3;
  // result_untrusted_input and result_private_data say what the tool's results carry for the session
  // legs. Unset is the server's own leg.
  optional bool result_untrusted_input = 4;
  optional bool result_private_data = 5;
}

// Allowance is a server an agent may use, optionally narrowed to some of its tools.
message Allowance {
  string server_id = 1;
  // tools narrows the allowance; empty allows the whole server, including tools it adds later (which
  // enter the ask tier).
  repeated string tools = 2;
}

message ListServersRequest {
  string org_id = 1;
}

message ListServersResponse {
  repeated Server servers = 1;
}

message CreateServerRequest {
  string org_id = 1;
  string name = 2;
  string url = 3;
  // transport defaults to "streamable-http".
  string transport = 4;
  // credential_header defaults to Authorization when credential_value is set.
  string credential_header = 5;
  // credential_prefix precedes the secret in the header value, for example "Bearer ".
  string credential_prefix = 6;
  string credential_value = 7 [debug_redact = true];
  // class is what the server exposes; leaving it out is the unclassified default (kind "other", both
  // legs).
  ServerClass class = 8;
}

message CreateServerResponse {
  Server server = 1;
}

message UpdateServerRequest {
  string org_id = 1;
  string server_id = 2;
  // Fields left unset stay.
  optional string url = 3;
  optional string transport = 4;
  // Setting any of the credential fields replaces the credential's header and prefix; credential_value
  // replaces the secret, and leaving it out keeps the stored one.
  optional string credential_header = 5;
  optional string credential_prefix = 6;
  optional string credential_value = 7 [debug_redact = true];
  bool remove_credential = 8;
}

message UpdateServerResponse {
  Server server = 1;
}

message SetServerClassRequest {
  string org_id = 1;
  string server_id = 2;
  ServerClass class = 3;
}

message SetServerClassResponse {
  Server server = 1;
}

message DeleteServerRequest {
  string org_id = 1;
  string server_id = 2;
}

message DeleteServerResponse {}

message ListToolsRequest {
  string org_id = 1;
  string server_id = 2;
}

message ListToolsResponse {
  repeated Tool tools = 1;
}

message SetToolTierRequest {
  string org_id = 1;
  string server_id = 2;
  string tool = 3;
  Tier tier = 4;
}

message SetToolSinkRequest {
  string org_id = 1;
  string server_id = 2;
  string tool = 3;
  ToolSink sink = 4;
  // content_hash is the Tool.content_hash the admin reviewed. Required.
  string content_hash = 5;
}

message SetToolSinkResponse {
  Tool tool = 1;
}

message SetToolTierResponse {
  Tool tool = 1;
}

message AcknowledgeToolReviewRequest {
  string org_id = 1;
  string server_id = 2;
  string tool = 3;
}

message AcknowledgeToolReviewResponse {
  Tool tool = 1;
}

message GetAgentServersRequest {
  string org_id = 1;
  string agent_id = 2;
}

message GetAgentServersResponse {
  repeated Allowance servers = 1;
}

message SetAgentServersRequest {
  string org_id = 1;
  string agent_id = 2;
  repeated Allowance servers = 3;
}

message SetAgentServersResponse {
  repeated Allowance servers = 1;
}

message SetToolTwoApproversRequest {
  string org_id = 1;
  string server_id = 2;
  string tool = 3;
  bool required = 4;
}

message SetToolTwoApproversResponse {
  Tool tool = 1;
}
