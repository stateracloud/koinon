# SPDX-License-Identifier: Apache-2.0
#
# Koinon Helm values (v0.1 skeleton, plan item H1). No secret goes in here: credentials are
# referenced by Secret name, and the chart generates the database and bootstrap-admin passwords.

nameOverride: ""
fullnameOverride: ""

# The cluster's DNS domain. Sandboxes reach agentgateway by its fully qualified Service name,
# because OpenShell's policy DNS resolves names without the pod's search domains.
clusterDomain: cluster.local

# Settings for every image the chart runs or hands to Koinon: the three Koinon images, the hook
# Jobs, the preflight probe pods, the harness images that become sandboxes, agentgateway (standalone
# mode), the CNPG Postgres image and the default sandboxPolicy.supervisorImages. See the guide
# "Private registries and mirrors". OpenShell, the CNPG operator, Agent Sandbox and agentgateway's
# controller are separate releases; set the same things on their charts.
global:
  # Image pull Secrets (type kubernetes.io/dockerconfigjson, in the release namespace) for every pod
  # the chart renders and for the CNPG Cluster: [{name: regcred}]. A plain string also works:
  # [regcred]. Merged with the deprecated top-level imagePullSecrets, de-duplicated.
  # Sandbox pods are not Koinon's to configure: set server.sandboxImagePullSecrets on the OpenShell
  # release (the preflight checks it).
  imagePullSecrets: []
  # Replace the registry host of every image with this one (a path prefix is fine):
  # imageRegistry: artifactory.example.com/proxy turns ghcr.io/stateracloud/koinon/api:1 into
  # artifactory.example.com/proxy/stateracloud/koinon/api:1. The rest of the reference, digest
  # included, is kept. Empty leaves every image as is.
  imageRegistry: ""
  # Replace the registry host per upstream, for mirrors that have one repository per upstream:
  #   registryMirrors: {ghcr.io: artifactory.example.com/ghcr-remote, docker.io: artifactory.example.com/docker-remote}
  # A host listed here wins over imageRegistry; a bare name or user/name is on docker.io. With
  # --set, escape the dots: --set 'global.registryMirrors.ghcr\.io=artifactory.example.com/ghcr-remote'.
  registryMirrors: {}

# Koinon images: <registry>/<repository>:<tag>[@<digest>]. The tag defaults to .Chart.AppVersion.
# registry is the upstream the images are published at; leave it at its default when you use
# global.imageRegistry or global.registryMirrors, which rewrite whatever this says.
image:
  registry: ghcr.io/stateracloud/koinon
  tag: ""
  pullPolicy: IfNotPresent
# DEPRECATED: use global.imagePullSecrets. Still honoured, and merged with it.
imagePullSecrets: []

api:
  image:
    repository: api
    tag: ""
    digest: ""
  replicas: 1
  port: 8080
  # The internal OTLP/HTTP receiver (spend ledger, plan item L1; run traces, ADR 0074).
  # agentgateway exports its access log here and koinon-agentd exports run spans. Every request
  # needs a bearer token; the NetworkPolicy admits only those two senders as a second layer.
  # The listener has two tokens with separate scopes (issue 55): otlpToken admits /v1/logs (the
  # gateway's), otlpTracesToken admits /v1/traces (only koinon-agentd's). Each path refuses the other's.
  otlpPort: 4318
  # The /v1/logs bearer token. By default the ensure-secrets hook Job generates the Secret
  # koinon-otlp-token (key "token": 64 hex characters) and never changes it. koinon-api and the
  # gateway mount it; koinon-agentd and sandboxes never see it. existingSecret names your own Secret
  # with a "token" key instead.
  #
  # Rotation: accepting the current and the previous token needs no downtime. Edit the Secret: copy
  # the old "token" value to a key "previous" and put a new random value (`openssl rand -hex 32`) in
  # "token". koinon-api and koinon-agentd pick the files up within about a minute (kubelet refreshes
  # the mounted Secret; they re-read every few seconds). agentgateway watches the token file and
  # reloads it, so the gateway's next export carries the new token without a restart (kubernetes
  # mode: the controller reads the Secret and pushes the value to the proxy). When every sender sends
  # the new token, delete "previous". See https://koinon.stateracloud.com/docs/operate/secret-keys/.
  # With a Secret you manage (existingSecret), rotate the same way.
  otlpToken:
    existingSecret: ""
  # The /v1/traces bearer token, held only by koinon-agentd (the sender) and koinon-api (the check);
  # the gateway and sandboxes never see it. The hook Job generates the Secret koinon-otlp-traces-token
  # (key "token") unless existingSecret names your own. Rotation is the same as for otlpToken
  # ("previous" plus a new "token"); only koinon-agentd sends it, so there is no gateway to reload.
  otlpTracesToken:
    existingSecret: ""
  # The GitHub tools MCP server (plan item C3): its own listener and Service, reachable only from
  # agentgateway (NetworkPolicy), never through the API Service or ingress.
  toolsPort: 8081
  # Saved work from a stuck sandbox, for koinon-agentd only (ADR 0054).
  savedWorkPort: 8082
  # The MCP leak guard (ADR 0084, ADR 0091): agentgateway's mcpGuardrails call it (gRPC, ExtMcp) before
  # every tools/call of an org's MCP server and after its result, and fail the call closed when it
  # cannot be reached. Its own listener and Service, reachable only from the gateway (NetworkPolicy).
  guardPort: 8083
  # The byte cap per run for external-low calls once a session holds both legs (ADR 0091); over it
  # the call is refused with text the agent reads.
  leakGuardByteCap: 2048
  # The DBOS runtime inside koinon-api (ADR 0066, plan item DB1): schedules and durable timers. No
  # new Deployment. Its tables are created by the migration Job (ADR 0060), so the Job must run
  # this image first; off until a feature needs it.
  durable:
    enabled: false
  # 512Mi: a password hash or check holds 64 MiB, and at most two run at once (internal/auth).
  # The run-trace router (ADR 0074) holds spans in memory and sizes itself from this limit, which the
  # chart passes as KOINON_MEMORY_LIMIT_BYTES (or the container's cgroup limit, if lower): its destination queues take 20% of it, spans waiting for
  # attribution 5%, turn roots waiting for the ledger 3% and export requests being decoded 8%. It drops
  # spans, oldest first, rather than grow past them. Raise the limit before raising any of these
  # (--trace-queue-bytes, --trace-intake-bytes, --trace-held-bytes, --trace-request-bytes).
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

reconciler:
  image:
    repository: reconciler
    tag: ""
    digest: ""
  # Extra replicas stand by: one reconciles at a time, holding a Postgres advisory lock.
  replicas: 1
  # Stop a sandbox after this long without activity (ADRs 0049, 0066): its last start, the last
  # run that finished or parked, the last pre-wake signal (task created, a person typing, a cron
  # about to fire). It starts again when a run is queued, a park is resolved or a signal arrives.
  # The platform default; an org overrides it (org_settings).
  idleTimeout: 10m
  # A sandbox whose run parked on a2a or input_required stays up this long from the park (ADR 0066
  # decision 11); approval and budget parks use idleTimeout. Overridable per org.
  parkWarm: 15m
  # Archive tier (plan item AR1, ADR 0032): a sandbox stopped this long, whose home's latest
  # checkpoint is complete, is deleted with its volume; the next run restores the home and reloads
  # the same session. Needs checkpoints.enabled. A negative value (-1h) turns it off. The same value
  # for every org; per-org tuning is not built.
  archiveAfter: 168h
  # Sandbox start/stop jobs that run at once, outside the gateway update (plan item LT1).
  sandboxJobs: 8
  # A sandbox starts on demand (the first run, claimable work or a pre-wake signal), not when its
  # agent is activated. An org admin can mark an agent keep-warm; this caps the keep-warm sandboxes
  # per org (the oldest agents win). 0 is the default of 2; a negative value grants none (old issue 315).
  keepWarmPerOrg: 2
  # A changed sandbox spec (a new OpenShell supervisor image, harness image or resources) recreates
  # each sandbox through the usual path: held runs finish, the home gate passes, a checkpoint is taken
  # first. This is a token bucket: that many sandboxes may be recreated at once, and the allowance
  # comes back at this many per resync interval, so an OpenShell upgrade does not recreate the whole
  # fleet at once (ADR 0085 decision 9). 0 is the default of 4; a negative value is no cap. The
  # supervisor image is read from the OpenShell gateway ConfigMap named by preflight.openshell.
  maxRecreatesPerPass: 4
  # Time between full passes. Postgres NOTIFY wakes the reconciler earlier for new runs and
  # agent changes; the timer covers idle timeouts and drift.
  resyncInterval: 30s
  # Home volume of an archived agent: delete (with its sandbox) or retain (the stopped sandbox,
  # and so its OpenShell workspace PVC, is kept; its key and provider record are deleted).
  homeRetention: delete
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

agentd:
  image:
    repository: agentd
    tag: ""
    digest: ""
  replicas: 1
  # PodDisruptionBudget, rendered only when replicas > 1 (ADR 0085). maxUnavailable rather than
  # minAvailable: each evicted replica drains for up to drainDeadlineSeconds, so a node drain takes
  # them one at a time at any replica count; minAvailable: 1 would let it evict all but one together.
  podDisruptionBudget:
    maxUnavailable: 1
  # Runs each replica drives at once (one exec stream each).
  workers: 8
  # Run lease; when a replica dies, another takes its runs over after this long.
  lease: 30s
  # On SIGTERM (a rollout, a node drain) a replica lets the turns in progress finish for up to this
  # many seconds before it hands the runs over (ADR 0085). The pod's terminationGracePeriodSeconds is
  # this plus 30, so Kubernetes never kills the drain.
  drainDeadlineSeconds: 300
  # agentgateway's base URL as sandboxes reach it. Empty uses the gateway Service: the chart's own in
  # standalone mode, the one the controller creates for Koinon's Gateway in kubernetes mode.
  gatewayURL: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    # Saving a stuck sandbox's work (up to 50 MB, ADR 0054) holds it in memory a few times over.
    limits: {memory: 512Mi}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The goose migration Job ("koinon-api migrate"), run as a Helm hook with the migration role.
migrations:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  # How long the Job waits for the database to accept connections. In cnpg mode the post-upgrade
  # grant hook (koinon-api migrate --grants-only) also waits this long for the CNPG Cluster to create
  # the install audit writer role (ADR 0100). Keep it below helm's --timeout (default 5m), which
  # bounds each hook: then the hook fails with its own message, not a Helm timeout.
  wait: 4m
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# Install preflight ("koinon-api preflight", plan item H2): a pre-install and pre-upgrade hook Job
# that fails the release when Agent Sandbox, the OpenShell gateway, openshell.runtimeClassName,
# the CNPG operator (postgres.mode=cnpg) or the agentgateway GatewayClass, CRDs and controller
# (gateway.mode=kubernetes) is missing or unsupported, and warns when Kata guest seccomp is off (ADR 0048 decision 2).
preflight:
  enabled: true
  # Kills the Job after this long; keep it below helm's --timeout (default 5m).
  activeDeadlineSeconds: 240
  # OpenShell's gateway configuration: the ConfigMap <openshell fullname>-config in the OpenShell
  # release's namespace (key gateway.toml). The preflight reads it to check that the gateway has
  # sandbox pull secrets (when global.imagePullSecrets, imageRegistry or registryMirrors is set) and
  # that sandboxPolicy admits its supervisor image. Read-only, by name; a ConfigMap it cannot read
  # fails the preflight while sandboxPolicy pins a supervisor image (the reconciler reads the same
  # ConfigMap for the sandbox spec hash, old issue 489) and only warns otherwise.
  openshell:
    namespace: openshell
    configMap: openshell-config
    # The gateway's StatefulSet (or Deployment) in that namespace, <openshell fullname>. The preflight reads
    # its OPENSHELL_K8S_SA_TOKEN_TTL_SECS, which wins over sa_token_ttl_secs in the ConfigMap, and compares
    # it with sandboxPolicy.supervisorTokenMaxSeconds. Unreadable: the check warns instead of passing.
    workload: openshell
  # Where the Agent Sandbox controller runs; its image tag must be v1.0.x.
  agentSandbox:
    namespace: agent-sandbox-system
    controller: agent-sandbox-controller
  # Where agentgateway's controller runs (gateway.mode=kubernetes); its image tag must be v1.7.x. The
  # proxy's NetworkPolicy also admits egress to this namespace, where the proxy fetches its xDS
  # configuration.
  agentgateway:
    namespace: agentgateway-system
    controller: agentgateway
    # The controller's xDS port (its chart's agwGrpc).
    xdsPort: 9978
  # Guest seccomp check: one short-lived unprivileged pod in the release namespace with
  # openshell.runtimeClassName and seccompProfile RuntimeDefault (the koinon-api image) reports
  # its /proc/self/status Seccomp and whether keyctl is denied. Off only warns.
  seccompProbe:
    enabled: true
    timeout: 2m
  # NetworkPolicy enforcement check, functional so that it works with any network plugin: a
  # server pod, a client pod (both the koinon-api image, the cluster's default runtime) and a
  # NetworkPolicy denying ingress to the server, all in the release namespace and deleted
  # afterwards. If the client still connects, the preflight warns that the chart's
  # NetworkPolicies (OTLP receiver, gateway access) are advisory. It never fails the install.
  # Runs alongside the seccomp probe.
  networkPolicyProbe:
    enabled: true
    timeout: 90s
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

postgres:
  # cnpg: render a CloudNativePG Cluster (the operator is a prerequisite).
  # external: connect to an existing Postgres 18+ through DSNs in a Secret.
  mode: cnpg
  cnpg:
    # 1 is the default so a small install needs one node. CNPG's PodDisruptionBudget on a
    # single-instance Cluster allows no eviction, so `kubectl drain` (a Talos, kubeadm or cloud node
    # upgrade) stalls on the node that runs the primary. For production use instances >= 2 (the PDB
    # then allows one eviction and the drain fails over), or set nodeMaintenanceWindow below for the
    # drain. See the guide "Upgrading", section "Draining a node that runs the database".
    instances: 1
    # Rendered as the Cluster's spec.nodeMaintenanceWindow when not empty. Off by default: it is a
    # temporary switch for one drain, not a steady state. {inProgress: true, reusePVC: true} drops
    # the PDB and lets the pod restart on another node with the same PVC (about 1-2 min of database
    # downtime on a single instance; the API, agentd and reconciler log database errors meanwhile).
    # Set it before the drain, remove it after. Leave reusePVC true on a single instance: false
    # would delete the only copy of the data.
    nodeMaintenanceWindow: {}
    # Pinned by digest (multi-arch index).
    imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:f7e00138159bb45d70b624ba25e446924cb3ed1bf366d13e936c3f81b914064e
    database: koinon
    storage:
      size: 5Gi
      storageClass: ""
    resources: {}
    # Namespace of the CNPG operator, allowed through the database NetworkPolicy.
    operatorNamespace: cnpg-system
    # Bring your own role Secrets: a Secret name per role, with the keys `username` (the role,
    # koinon_<role>) and `password`, type kubernetes.io/basic-auth. A role left empty gets a Secret
    # that the ensure-secrets hook Job creates with a random password if it does not exist yet
    # (never overwritten, kept on uninstall). The chart itself renders no password, so renders are
    # deterministic (Argo CD, Flux, helm template).
    existingSecrets:
      migrate: ""
      api: ""
      reconciler: ""
      agentd: ""
  external:
    # Secret with one libpq URI per role (sslmode=verify-full recommended). The migration role owns
    # the schema; the component roles need only DML. Components may share one role.
    secretName: ""
    keys:
      migrate: migrate-uri
      api: api-uri
      reconciler: reconciler-uri
      agentd: agentd-uri

gateway:
  # The gateway modes are decided in ADR 0049 and ADR 0058.
  # standalone: the chart installs agentgateway, configured by the reconciler.
  # kubernetes: FROZEN (ADR 0097 decision 4, issue #274). It keeps passing the gateway behaviour suite
  # and gets no new features; it is deleted with agentgateway in ADR 0097 step 3 (v0.3). Do not add values for it.
  # Use an existing agentgateway controller (v1.7.x, with its CRDs, and a GatewayClass).
  # The chart renders no gateway; the reconciler creates Koinon's own Gateway, AgentgatewayModels,
  # AgentgatewayPolicies, AgentgatewayBackend, HTTPRoute and key ConfigMaps in this namespace and never
  # touches other gateways (plan item G2). There is no fallback to standalone: the install preflight
  # fails when the controller, its CRDs or the GatewayClass are missing. Budgets are enforced by the
  # spend ledger, which revokes a key that is out of budget (the S2 fallback, ADR 0058).
  mode: standalone
  standalone:
    image:
      repository: ghcr.io/agentgateway/agentgateway
      tag: v1.7.0
      digest: sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
    # LLM and MCP listener.
    port: 8080
    # The key that encrypts MCP session IDs (agentgateway v1.7 always encrypts them; SESSION_KEY).
    # By default the ensure-secrets hook Job generates the Secret koinon-gateway-session-key (key
    # "key": 64 hex characters, `openssl rand -hex 32`) and never changes it. existingSecret names
    # your own Secret with that key instead.
    sessionKey:
      existingSecret: ""
    # SQLite budget store; one replica only.
    persistence:
      size: 1Gi
      storageClass: ""
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  kubernetes:
    # The GatewayClass of the existing controller.
    gatewayClassName: agentgateway
    # The listener of Koinon's Gateway, for LLM and MCP requests. The controller names the proxy's
    # Service after the Gateway (koinon-gateway by default).
    port: 4000

# Model providers and models are not chart values: orgs add them in the UI or the admin API, or
# declare them with labelled Secrets (ADR 0056, https://koinon.stateracloud.com/docs/operate/models/). Their keys are encrypted
# in Postgres with the key-encryption keys below.
# Providers and remote MCP servers may not name loopback, link-local or metadata addresses, names
# without a dot, or hosts in Koinon's own namespace (they would make the gateway a request-forgery
# proxy). List the internal upstreams you do want, exactly as written in the provider or server URL,
# optionally with a port, for example "ollama.lab.example.com:11434". Only a platform admin can
# change this. Add the same addresses to networkPolicy.gatewayEgressTo so the gateway may reach them.
egress:
  allowedInternalHosts: []

# DEPRECATED, removed after the next release: the old name of egress.allowedInternalHosts. Both are
# joined.
providers:
  allowedInternalHosts: []

secrets:
  # A native ValidatingAdmissionPolicy (issue #604) limits the reconciler to Secrets labelled
  # koinon.dev/managed-by=koinon-reconciler, so it can never change the KEK Secret or the Secrets
  # koinon-api owns. Its own switch, apart from kek.guard.enabled: turning the KEK guard off to delete
  # the Secret on purpose does not lift this fence. Turn it off only where the install may not create
  # cluster-scoped objects (the policy is cluster-scoped).
  reconcilerFence:
    enabled: true
  kek:
    # A Secret you manage, with one file per key-encryption key named by its ID (base64 of 32 random
    # bytes) plus a file "active" holding the active ID. Empty: koinon-api creates the Secret
    # "koinon-kek" on its first start and never overwrites it (the chart renders no key material, so
    # helm template, Argo CD and Flux cannot replace it). With existingSecret, whoever updates it (GitOps
    # or a plain kubectl apply) must be listed in guard.extraWriters below. Back it up: without it, stored provider keys
    # and connection secrets cannot be read.
    existingSecret: ""
    # A native ValidatingAdmissionPolicy (issue #604) refuses DELETE of the KEK Secret, and UPDATE by
    # any identity except the koinon-api and key-admin service accounts, so a deleted or replaced
    # Secret cannot become a new key quietly. extraWriters are further user names (for example
    # "system:serviceaccount:argocd:argocd-application-controller") that may update it: needed when
    # a GitOps tool applies a Secret you named in existingSecret. A plain `kubectl apply` or
    # `helm`-less update of that Secret by your own user is an UPDATE too: add that user name here as
    # well, or the policy refuses it. The policy that
    # limits the reconciler to Secrets labelled koinon.dev/managed-by=koinon-reconciler is
    # secrets.reconcilerFence.enabled, a separate switch. To delete the Secret on purpose, set
    # enabled=false, upgrade, delete it, then set it back.
    guard:
      enabled: true
      extraWriters: []
    # "koinon-api keys status" warns when the active key is older than this.
    activePeriod: 8760h
    # Wrapping the KEKs with a KMS (optional; ADR 0085 decision 12, https://koinon.stateracloud.com/docs/operate/secret-keys/). The
    # default, local, keeps the KEKs in the Secret as they are; it is fully supported. With a KMS the
    # Secret holds only KEKs encrypted by the KMS key, which never leaves the KMS. Every pod signs in
    # with its own service account; no KMS credential is in these values. koinon-api and the
    # reconciler may then only decrypt, and the key-admin Job, with its own service account, is the
    # only identity that encrypts: it creates the first KEK and adds the one keyAdmin.addKey names.
    kms:
      # local, openbao (an OpenBao or Vault transit key) or awskms (an AWS KMS key).
      backend: local
      awskms:
        # The key's AWS region, and the key: a symmetric encryption key (SYMMETRIC_DEFAULT), named
        # by its key ARN (recommended), key ID, alias/<name> or alias ARN. Both required with
        # backend awskms. Keep the key spelled the same: it is stored with every wrapped KEK.
        region: ""
        keyId: ""
        # https://host[:port] of a KMS or STS VPC endpoint with its own DNS name; empty is the
        # region's public endpoint (private DNS of an interface endpoint needs nothing here).
        endpoint: ""
        stsEndpoint: ""
        # A ConfigMap in the release namespace with ca.crt, for a TLS-inspecting egress proxy;
        # empty is the image's system roots.
        caConfigMap: ""
        # Pod identity only, never an access key: each identity is an IAM role. With IRSA, set all three
        # roles' ARNs here; the chart puts each on its ServiceAccount (<fullname>-api,
        # <fullname>-reconciler, <fullname>-key-admin) as eks.amazonaws.com/role-arn. With EKS Pod
        # Identity leave them empty and associate each role with its ServiceAccount in EKS.
        # Policies: koinon-api and the reconciler kms:Decrypt on the key; the key-admin Job
        # kms:Encrypt and kms:Decrypt. https://koinon.stateracloud.com/docs/operate/secret-keys/ has the policies.
        roleArns:
          api: ""
          reconciler: ""
          keyAdmin: ""
        # Bound on one call to KMS, as a Go duration; empty is 5s.
        timeout: ""
      openbao:
        # https://host:port of the server. Required with backend openbao.
        address: ""
        # A ConfigMap in the release namespace with ca.crt, the CA that signed the server's
        # certificate (a CA is not secret). Empty: the image's system roots.
        caConfigMap: ""
        # The OpenBao namespace (X-Vault-Namespace), if any.
        namespace: ""
        # Mount path of the transit engine, and the transit key (create it first; aes256-gcm96).
        transitMount: transit
        key: ""
        # Mount path of the Kubernetes auth method, and its roles, one per identity. Bind each role
        # to its service account (<fullname>-api, <fullname>-reconciler, <fullname>-key-admin) in
        # the release namespace. Policies: koinon-api and the reconciler get update on
        # <transitMount>/decrypt/<key>; the key-admin Job update on <transitMount>/encrypt/<key> and
        # <transitMount>/decrypt/<key>. Never grant create: transit encrypt would then make a
        # missing key, so a mistyped key name would wrap the KEKs under a new key.
        authMount: kubernetes
        roles:
          api: koinon-api
          reconciler: koinon-reconciler
          keyAdmin: koinon-key-admin
        # Bound on one call to OpenBao, as a Go duration; empty is 5s.
        timeout: ""
      keyAdmin:
        # The ID of a KEK for the key-admin Job to add, wrapped by the KMS, if the key set does not
        # hold it yet (kek-YYYYMMDD-xxxx: lower-case letters, digits and dashes). Set a new ID to
        # rotate or to move from local KEKs, upgrade, then in koinon-api: keys activate <ID>, keys
        # rewrap, keys retire the old ones. The Job runs again whenever this or the KMS settings
        # change; with nothing to do it changes nothing.
        addKey: ""
        # Recovery from a lost KMS key that wrapped the active KEK (https://koinon.stateracloud.com/docs/operate/secret-keys/, issue
        # #255): with addKey set to a new ID, when the KEK Secret has no usable active KEK (you removed
        # the entries of the lost KEKs and `active` names one of them), the Job makes the added KEK
        # active in the same write. With a working active KEK it changes nothing about activation.
        # Turn it off again afterwards.
        activateIfNoActive: false
        # Every KEK the Job wraps is bound to the install ID in the database (old issue 615): a KEK Secret
        # copied to another install, or a database restored into the wrong one, does not open. true
        # also binds the KEKs of the primary wrapping key wrapped before that (the KEKs themselves
        # are unchanged). A binary older than old issue 615 cannot read a bound KEK, so leave it false until
        # you will not roll back below it (https://koinon.stateracloud.com/docs/operate/secret-keys/).
        rewrapUnbound: false
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
  # Only for installs that predate the secret store and still have a Kubernetes Secret per GitHub
  # connection: lets koinon-api delete those Secrets after it moved their fields into Postgres. Turn
  # it off again afterwards.
  migrateLegacyConnections: false

# Price refresh (ADR 0098, maintainer decision 2026-11-07). Three modes:
#   enabled unset (the default): auto. koinon-api fetches OpenRouter's public model list (one
#     unauthenticated GET per interval) only while some org has an openrouter provider, checked at
#     every tick (at most an hour apart). With no such provider it makes no request.
#   enabled: false: off. koinon-api makes no request to any price source; prices change only with an
#     upgrade or when an admin accepts a proposal ("koinon-api prices fetch", then "prices proposals accept").
#   enabled: true: on. koinon-api fetches every source it has an adapter for (OpenRouter only, so far),
#     whatever providers exist.
# IN AUTO AND ON, SMALL PRICE CHANGES APPLY BY THEMSELVES: a change of at most maxChangePercent
# (default 25) against the last reviewed price, and only after two fetches 24 hours apart returned it,
# is written to the platform price list with no person involved, at most maxAutoPerDay (default 10) a
# day. Larger changes wait as proposals. So a new install has no OpenRouter price estimate for its
# first day: koinon-api logs a warning and counts the unpriced models (koinon_price_unpriced_models)
# until then. Every change is audited and "koinon-api prices platform rollback" undoes it.
prices:
  refresh:
    # Unset (null) is auto; false is off; true is on.
    enabled: null
    interval: 24h
    # The auto-apply bounds can only be tightened: maxChangePercent 1-25, maxAutoPerDay 1-10. Unset
    # keeps koinon-api's defaults (25 and 10).
    maxChangePercent: null
    maxAutoPerDay: null

# Home checkpoints (plan item HC1, ADR 0032, practice B3). Off by default. When on, koinon-agentd saves
# each agent's home (sessions, notes, scratch work; caches and node_modules excluded) to an
# S3-compatible bucket with kopia: hourly while the sandbox runs, before an idle stop and before a
# recreation, and restores it into a recreated sandbox before the harness starts. The backup reads
# the home as tar over exec; the restore goes through OpenShell's flow-controlled upload channel
# (the openshell-upload-v1 SSH subsystem), which needs OpenShell v0.1.4 or later (ADR 0032, issue
# 169). A sandbox is
# recreated only after its latest backup completed; a failed backup blocks the recreation and marks
# the agent unhealthy with the reason. One repository per agent at orgs/<org>/homes/<agent>/; its
# random password is sealed with the secret store's KEK, which only koinon-api holds: koinon-agentd
# asks it for the password per checkpoint (ADR 0054). koinon-agentd is the only component with the
# storage credentials, so the NetworkPolicy of the bucket's namespace needs to admit koinon-agentd
# (and koinon-api) pods only. Give koinon-agentd room: about 512Mi of memory per concurrent backup
# (agentd.resources) and scratch space for the staged homes (scratchSize).
checkpoints:
  enabled: false
  s3:
    # Secret with the keys AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, endpoint (host:port or an
    # http(s) URL; the scheme decides TLS) and region. Required when enabled.
    existingSecret: ""
    # Required when enabled. Create the bucket first.
    bucket: ""
    # The S3 client addresses buckets path-style on every endpoint but AWS's, which is what Garage,
    # SeaweedFS, Ceph RGW and MinIO need. Kept as a statement of the requirement: false is refused.
    pathStyle: true
  # Time between a running sandbox's checkpoints.
  interval: 1h
  # Restore-only mode (ADR 0110 decision 4): koinon-agentd restores homes from the bucket and lists
  # its snapshots, but creates no snapshot, applies no retention and deletes no repository. Set it on
  # a restored copy that still points at its source's bucket (a drill or staging copy): without it the
  # copy writes into the source's kopia repositories and prunes them. Leave it false on a live install
  # and on a replacement that owns the bucket.
  readOnly: false
  # Size limit of the emptyDir where koinon-agentd stages a home while it is saved or restored.
  # A home stages up to 4Gi (checkpoint.DefaultLimits); 2 backups and 1 restore run at once
  # (agentd Checkpoints.Concurrency and RestoreConcurrency), plus about 2Gi for kopia's caches:
  # (2 + 1) * 4Gi + 2Gi. Going over the limit evicts the agentd pod, so lower it only together
  # with the per-home limit.
  scratchSize: 14Gi

# GitHub connector (plan item C1). The REST API base URL used to verify connections, mint
# installation tokens and open approved pull requests; GitHub Enterprise Server uses
# https://<host>/api/v3. The e2e test points it at a fake.
github:
  apiUrl: https://api.github.com

# Harness images (ADR 0035, ADR 0112): <image.registry>/<repository>:<tag>[@<digest>], the tag defaulting to
# .Chart.AppVersion. Every entry becomes a harness the reconciler can run; an agent whose harness
# has no entry is reported as a reconcile error. Remove an entry to turn that harness off.
harnesses:
  opencode:
    image:
      repository: sandbox
      tag: ""
      digest: ""

# Pre-pull the harness images on the nodes that run Kata sandboxes (plan item LT1, practice B6), so
# a sandbox start does not wait for an image pull. A DaemonSet whose init containers each run one
# harness image (the image and its pull secrets are rewritten like every other image) and exit, then
# a pause container keeps the pod, and so the pulled images' reference, on the node. It runs in the
# release namespace with the default runtime class, never in a sandbox namespace, and weakens
# nothing in ADR 0045: sandboxes still run under the kata runtime class and the admission policy.
# Koinon does not place sandbox pods (the Agent Sandbox controller does, on the runtime class's
# own node selector), so this cannot prefer nodes for sandboxes; it makes the nodes they land on
# warm. Turn it on once the Kata nodes carry a label to select them by.
harnessPrepull:
  enabled: false
  # Selects the Kata nodes, for example katacontainers.io/kata-runtime: "true" (kata-deploy's
  # label). Required when enabled: without it the images would be pulled onto every node.
  nodeSelector: {}
  tolerations: []
  # Keeps the pod alive after its init containers have pulled the images.
  pauseImage: registry.k8s.io/pause:3.10
  priorityClassName: ""
  resources:
    requests: {cpu: 5m, memory: 8Mi}
    limits: {memory: 32Mi}

# OpenShell gateway that the reconciler and agentd talk to over gRPC.
openshell:
  # host:port of the gateway. Required: the chart refuses to render without it.
  address: ""
  # Secret with the client certificate (tls.crt, tls.key, ca.crt) for mTLS. Required: the chart
  # refuses to render without it unless insecure is true.
  clientTLSSecret: ""
  # Dial the gateway in plaintext. Only for a service mesh that provides mTLS between Koinon and the
  # gateway; otherwise the exec channel that controls every sandbox crosses the cluster in clear
  # text. The components log a warning. Not allowed together with clientTLSSecret.
  insecure: false
  # Default sandbox runtime class (ADR 0045). A Kata class must carry overhead.podFixed memory and
  # cpu; the preflight warns when either is missing. Kubernetes adds podFixed to the scheduler's and
  # ResourceQuota's view of each pod and to the pod cgroup's limits (sum of container limits plus
  # podFixed). Without it the scheduler undercounts every vm sandbox, a sandbox near its memory limit
  # can get the VMM OOM-killed, and the guest's and VMM's cpu comes out of the workload's limit.
  # Sizing (ADR 0039, 2026-11-11 amendment): Kata gives the guest default_memory plus the container
  # limits, but the host charges guest RAM only as the guest touches it, so podFixed covers what one
  # sandbox uses beyond its limits (guest kernel and kata-agent, shim, VMM, virtiofsd), not
  # default_memory. kata-deploy ships memory 130Mi, cpu 250m for Cloud Hypervisor (Talos's kata
  # handler) and 320Mi, 250m for QEMU. Measure as Kata's sizing guide says (host side: the pod
  # cgroup's memory.current minus the nominal VM size, under load) and raise it if needed. With enable_mem_prealloc or hugepages the whole guest is charged at boot, so
  # podFixed must also cover default_memory.
  runtimeClassName: kata
  # The OpenShell gateway's gateway_id (its chart's gatewayId; the default there is openshell). In
  # managed mode OpenShell names each workspace's namespace openshell-<gatewayId>-<workspace> and
  # labels it openshell.ai/gateway-id; the sandbox observer reads pods there. The preflight compares
  # it with the gateway's gateway.toml.
  gatewayId: openshell

# URL browsers reach Koinon at, for example https://koinon.example.com. Its scheme sets the
# session cookies' Secure attribute (http:// turns it off, so logins work without TLS) and it is
# the base of the default OIDC redirect URL. Empty derives it from the ingress (https with
# ingress.tlsSecretName, else http); with the ingress off it stays empty, which means https:
# fine for `kubectl port-forward`, since browsers treat localhost as secure. Set it when you
# expose the API another way.
publicUrl: ""

# This install's mark (issue 461). koinon-reconciler and koinon-agentd label every OpenShell object they make
# with a hash of it and refuse an object that carries another install's, so two installs on one gateway (a
# restore next to the live install) cannot adopt, stop or delete each other's sandboxes. The ensure-secrets
# hook Job generates it once into koinon-install-mark (key "token": 64 hex characters) and never changes it; it
# is not in Postgres, so a restored database gets its own. With existingSecret you supply that Secret (same key);
# to take over another install's objects deliberately, give it the same token. Losing the Secret (the namespace
# is deleted) ends the install's ownership: see the backup and restore guide. koinon-api also reads it (ADR 0110):
# it records the hash in the database and refuses the API tokens and sessions another install issued, so a
# restored copy with a new mark does not accept the source's credentials until a platform admin re-enables them.
installMark:
  existingSecret: ""

# Restore-hold (issue #462): koinon-api, koinon-agentd and koinon-reconciler start and answer health and
# reads, but do no automatic work. No schedule fires and no pending workflow is recovered, no run is claimed
# or taken over, no sandbox is converged, no code-host scope or price list is fetched, and koinon-api
# refuses the outward calls an admin starts (a provider check, a connection test, an MCP server add, a
# trace destination test, approving a request, Run now) with "install is held for restore". Start a restored
# install with this on, check it (docs: Back up and restore), then release it: set it to false and
# upgrade. It is read at start, so a release is a rollout of the three Deployments.
restoreHold: false

# The release of a restored copy (ADR 0110 decision 1). A restored copy has none of its source's declarative
# Secrets, so its importer would remove every provider, MCP server and connection the source declared. The
# release step records those removals and keeps them waiting; they happen only with this on. The
# restore-release-check Job (a pre-upgrade hook while restoreHold is false) fails `helm upgrade` when the
# release would remove something and this is false, so the install stays held. Set it for the release of a
# drill or staging copy whose removals you accept, and remove it afterwards: a value left set accepts every
# removal that waits at the next koinon-api start.
restore:
  acceptImporterDeletions: false

# Bootstrap platform admin (plan item A1). The one-time password is generated once into the Secret
# <fullname>-bootstrap-admin by the ensure-secrets hook Job and never changed by it. Disable once OIDC works:
# enabled=false turns the API's password login off and revokes the bootstrap sessions. The bootstrap admin
# is the only platform admin until you set oidc.platformAdminGroups and a user in one of those groups has
# logged in, so do that first.
bootstrapAdmin:
  enabled: true
  # Login name, applied on every start (changing it renames the login).
  username: admin
  # Bring your own Secret holding the one-time password under the key `password`; the hook Job then
  # does not create one. The chart renders no password either way.
  existingSecret: ""

# Generic OIDC login (plan item A2, ADR 0004). Users log in with the IdP; roles in the default org
# come from groupMappings, every other role from Postgres.
oidc:
  enabled: false
  issuerUrl: ""
  clientId: ""
  # Secret with the client secret. Empty name: a public client (PKCE only).
  clientSecret:
    existingSecret: ""
    key: client-secret
  # Empty defaults to <publicUrl>/auth/oidc/callback; one of the two is required.
  redirectUrl: ""
  # Requested besides openid.
  scopes: [email, profile]
  # ID token claim holding the user's groups.
  groupsClaim: groups
  # IdP group -> role in the default org (viewer, member, admin or owner), for example
  # {koinon-admins: admin, staff: member}. Reconciled on every start.
  groupMappings: {}
  # IdP groups (in groupsClaim) whose members are platform admins, for example [koinon-platform].
  # Reconciled at every login like groupMappings: a user who gains a listed group becomes a platform
  # admin, one who loses all of them stops being one. Only grants made by this setting are revoked;
  # the bootstrap admin keeps its own. Empty changes nothing. Names may contain spaces but not commas,
  # because the list reaches koinon-api as a comma-separated environment variable. Set it, and log in once as a user in
  # one of the groups, before you set bootstrapAdmin.enabled=false: without it nobody can set the
  # platform budget ceilings (/platform/budgets).
  platformAdminGroups: []
  # Identity mode of the default org: platform (roles from Koinon only), idp (from groupMappings)
  # or hybrid (both).
  defaultOrgIdentityMode: hybrid

# Session lifetimes, for password and OIDC logins alike. IdP group changes take effect at the next
# login, so maxLifetime bounds how long a removed group keeps granting access.
session:
  idleTimeout: 2h
  maxLifetime: 12h

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  # Secret with the TLS certificate for host. Empty serves plain HTTP.
  tlsSecretName: ""

# Optional Gateway API HTTPRoute for the API and web UI (gateway.networking.k8s.io/v1), for clusters
# that expose services through a Gateway instead of an Ingress. The Gateway and its TLS belong to the
# cluster. parentRefs are rendered as given, for example
#   parentRefs:
#     - {group: gateway.networking.k8s.io, kind: Gateway, name: shared, namespace: gateway, sectionName: https}
# With the route on and publicUrl empty, the public URL is https://<first hostname>; set publicUrl when
# the Gateway serves the route over plain HTTP.
# Leave networkPolicy.apiFrom empty with a Gateway whose proxy is not a pod a NetworkPolicy can select
# (Cilium's node-level Envoy, for example). The web UI follows runs over long-lived streams: if the
# Gateway closes idle or long requests, raise its limits with timeouts (Gateway API HTTPRouteTimeouts,
# rendered into the route's rule as given), for example {request: "0s", backendRequest: "0s"} for none.
httpRoute:
  enabled: false
  annotations: {}
  hostnames: []
  parentRefs: []
  timeouts: {}

networkPolicy:
  enabled: true
  # Extra peers allowed to reach the API port (for example the ingress controller's or Gateway's namespace).
  # Empty allows every source.
  apiFrom: []
  # Peers allowed to scrape agentgateway's stats port (15020). Like metrics.allowFrom, this only
  # opens the port; it works with any scraper (prometheus-operator, a VictoriaMetrics VMServiceScrape,
  # a plain Prometheus config), with metrics.serviceMonitor.enabled left false.
  metricsFrom: []
  # Egress rules added to agentgateway's, for internal model upstreams (it may otherwise reach DNS,
  # koinon-api and the public internet only). Each item is a NetworkPolicy egress rule, for example
  #   - to: [{ipBlock: {cidr: 10.7.0.0/24}}]
  #     ports: [{port: 11434}]
  # List the same hosts in egress.allowedInternalHosts so providers and MCP servers may name them. The
  # rule covers every upstream the gateway calls: model providers and remote MCP servers.
  gatewayEgressTo: []

# Prometheus metrics of koinon-api, koinon-reconciler and koinon-agentd (ADR 0023, amendment
# 2026-10-26): each serves /metrics, without authentication, on this port of its pod. A Service
# <release>-koinon-<component>-metrics exposes it. No metric carries an org, agent, user, ticket or run ID.
metrics:
  port: 9090
  # Peers allowed to scrape the three components' metrics port: NetworkPolicy `from` entries, for
  # example Prometheus's namespace:
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  # Empty (the default) admits nobody, so with networkPolicy.enabled the metrics are not scrapable
  # until you name the scraper. (networkPolicy.metricsFrom is separate: agentgateway's stats port.)
  # This only opens the port. A scraper that is not prometheus-operator (for example VictoriaMetrics'
  # VMServiceScrape) needs no ServiceMonitor: leave serviceMonitor.enabled false, list its namespace
  # here and in networkPolicy.metricsFrom, and point it at the <release>-koinon-<component>-metrics
  # Services (port "metrics").
  allowFrom: []
  serviceMonitor:
    # A prometheus-operator ServiceMonitor per component, plus one for agentgateway's stats port
    # (gateway.mode=standalone) or a PodMonitor on the controller's proxy pods (kubernetes). Needs
    # the monitoring.coreos.com/v1 ServiceMonitor CRD, and in kubernetes mode the PodMonitor CRD:
    # enabling it without them fails the install.
    enabled: false
    # Extra labels on the ServiceMonitors, for example the release label your Prometheus selects on.
    labels: {}
    # Render the ServiceMonitors without checking the cluster for the CRD, for `helm template`
    # pipelines, kustomize helmCharts without apiVersions, and a first Argo CD sync that installs
    # the CRD in the same sync.
    skipCapabilityCheck: false
    # Scrape interval, for example 30s; empty uses the Prometheus default.
    interval: ""
  prometheusRule:
    # Alerting rules as a prometheus-operator PrometheusRule (templates/prometheusrule.yaml; the
    # rules are documented in the metrics guide). Needs the monitoring.coreos.com/v1 PrometheusRule
    # CRD: enabling it without the CRD fails the install, unless skipCapabilityCheck is set.
    enabled: false
    # Extra labels, for example the release label your Prometheus selects rules on.
    labels: {}
    skipCapabilityCheck: false
    # How long durable workflows may wait for a version no koinon-api runs before the alert fires.
    # It covers a rolling upgrade, where the new pods carry the old version's workflows over within
    # a sweep (a minute).
    durableStrandedFor: 15m

# The sandbox observer (ADR 0078): when OpenShell says only "ConfigurationPending" about a sandbox
# that never became ready, the reconciler reads the sandbox's pod (get only, by name) to find out why:
# an image that cannot be pulled, a container that keeps crashing, a refused pod. On by default.
# Cluster-scoped objects it renders (templates/sandbox-observer.yaml): a ClusterRole with get on pods
# and agents.x-k8s.io sandboxes, a ClusterRole that lets the reconciler create RoleBindings and bind
# that one ClusterRole, and a ValidatingAdmissionPolicy that limits those bindings to OpenShell
# workspace namespaces of openshell.gatewayId, with the fixed name, role and subject. It needs
# sandboxPolicy.enabled. Off, the chart renders none of it, the reconciler reads nothing, and a pull
# error stays an "unknown" wait cause (the preflight warns). Planned to go away once OpenShell
# surfaces pod failures itself.
sandboxObserver:
  enabled: true

# Default-deny NetworkPolicy for OpenShell sandbox namespaces (spike 8.15, ADR 0045).
# On by default. Standard networking.k8s.io/v1 only (no CNI-specific features). The chart
# renders a ClusterRole, binding and ValidatingAdmissionPolicy (templates/sandbox-networkpolicy.yaml);
# the reconciler applies a NetworkPolicy named <namespace>-<fullname>-sandbox-default-deny in each
# workspace namespace of openshell.gatewayId: empty podSelector, policyTypes [Ingress, Egress], no
# allow rules. OpenShell's own workload and supervisor policies are additive with it. Off, the
# chart renders none of it and the reconciler applies nothing.
sandboxNetworkPolicy:
  enabled: true

# LimitRange for OpenShell sandbox namespaces (#76, ADR 0083 follow-up). On by default. OpenShell
# cannot size the supervisor or its init containers; the reconciler applies a LimitRange named
# <namespace>-<release>-sandbox-limitrange in each workspace namespace of openshell.gatewayId
# (defaultRequest 50m/64Mi, default 250m/256Mi for type Container, covering init containers too). The chart renders
# a ClusterRole, binding and ValidatingAdmissionPolicy (templates/sandbox-limitrange.yaml). Off, the
# chart renders none of it and the reconciler applies nothing new; existing LimitRanges stay until
# removed (`kubectl delete limitrange -A -l koinon.dev/sandbox-limit-range=true`). Needs
# sandboxPolicy.enabled.
sandboxLimitRange:
  enabled: true

# Size of every agent sandbox (ADR 0083): CPU and memory requests and limits on the agent container.
# A template may set its own (spec.resources); a value it leaves out takes the default below, and
# the bounds clamp every value, the template's included (the reconciler logs a warning when one is
# clamped). The supervisor and init containers are sized by sandboxLimitRange (#76). Changing
# a value recreates the sandboxes it applies to once, restoring their homes from the checkpoint.
# Kubernetes quantities: 250m, 2, 1Gi. A bound left empty is not set; the reconciler refuses to
# start on a bad quantity, a minimum above its maximum, or a default request above its limit.
#
# Recommended values per isolation tier (ADR 0075):
#   vm (Kata, the default): memory 512Mi-8Gi, cpu request 100m-2, cpu limit up to 4, and
#     memoryRequestEqualsLimit: true (the defaults below).
#   hardened (gVisor or runc with the hardened policy): memory 256Mi-8Gi, a request may be below
#     its limit (memoryRequestEqualsLimit: false).
#   dev (kind, a laptop): requests of 50m cpu and 256Mi memory, a memory limit of 1Gi, so a dozen
#     sandboxes fit.
sandbox:
  resources:
    default:
      cpu: {request: 250m, limit: "2"}
      memory: {request: 1Gi, limit: 2Gi}
    bounds:
      cpu:
        request: {min: 100m, max: "2"}
        limit: {min: 100m, max: "4"}
      memory:
        request: {min: 512Mi, max: 8Gi}
        limit: {min: 512Mi, max: 8Gi}
    # Raise the memory request to the limit. The default runtime class is Kata, and a Kata guest
    # never returns memory to the host, so a request below the limit lets the node be
    # over-committed on memory that cannot be reclaimed. Turn it off for runtimes that can.
    memoryRequestEqualsLimit: true

# ValidatingAdmissionPolicy for OpenShell sandbox namespaces (ADRs 0045, 0048).
sandboxPolicy:
  enabled: true
  # Which namespaces the policies bind to. The chart adds openshell.ai/gateway-id=<openshell.gatewayId>
  # (scopeToGateway), so a release's policies cover only its own gateway's workspace namespaces: two
  # Koinon releases with their own gateways on one cluster do not block each other's sandboxes
  # (old issue 460).
  # A selector with no matchLabels, In or Exists requirement (only NotIn / DoesNotExist) turns off the
  # namespace label policy's matchConditions pre-filter, so that policy then judges every namespace
  # update in the cluster (issue 507).
  namespaceSelector:
    matchLabels:
      openshell.ai/managed-by: openshell
  # false binds to namespaceSelector as written, so every OpenShell gateway's namespaces (the scope
  # before this setting existed). Upgrade note: a single install changes nothing, provided
  # openshell.gatewayId equals the gateway's gateway_id, because its workspace namespaces carry the
  # gateway-id label OpenShell sets. If they differ, every sandbox policy matches no namespace; the
  # preflight fails the install on that mismatch while scopeToGateway is true.
  scopeToGateway: true
  # Runtime classes allowed for sandbox workload pods (the vm tier, ADR 0075). Any class not
  # listed here is refused by the policy. kata-qemu-runtime-rs is the Rust runtime that Kata 4.x's
  # kata-deploy (4.3.1) creates by default; it marks the Go-runtime kata-qemu deprecated (old issue 442).
  # openshell.runtimeClassName, the class the reconciler requests, must be one of these: the chart
  # fails the render when it is not.
  runtimeClasses: [kata, kata-qemu, kata-qemu-runtime-rs]
  # Images allowed in OpenShell supervisor pods (label openshell.ai/boundary-role=supervisor),
  # for every container and init container (ADR 0045: a pinned supervisor image). Empty uses
  # OpenShell 0.1.7's own, ghcr.io/nvidia/openshell/supervisor:0.1.7, rewritten by
  # global.imageRegistry and global.registryMirrors like every other image: set the mirror on the
  # OpenShell release to the same place and the two agree. Change the list with the OpenShell
  # version, or when the gateway pulls the image from somewhere the rewrite does not produce (it is
  # used exactly as written, by tag or digest). The preflight compares it with the gateway's
  # supervisor_image.
  supervisorImages: []
  # Longest lifetime (expirationSeconds) of the one ServiceAccount token a supervisor pod may
  # project (audience openshell-gateway; ADR 0006 amendment 2026-11-09). OpenShell 0.1.7 defaults
  # to 3600 and clamps its own setting (OPENSHELL_K8S_SA_TOKEN_TTL_SECS) to 600-86400: raise this
  # to match when the gateway is configured for a longer TTL.
  supervisorTokenMaxSeconds: 3600
  validationActions: [Deny]
  # Requesting identities (request.userInfo.username) allowed to write each kind of object in
  # sandbox namespaces. Everyone else is denied, cluster admins included. CONNECT (pods/exec, attach,
  # portforward, proxy; services/proxy) is denied to everyone with no exemption; the break-glass
  # is the runbook https://koinon.stateracloud.com/docs/operate/sandbox-break-glass/, not an identity list.
  identities:
    # Pods: the Agent Sandbox controller.
    pods:
      - system:serviceaccount:agent-sandbox-system:agent-sandbox-controller
    # Supervisor pods: OpenShell 0.1.7's gateway creates each sandbox's supervisor pod itself
    # (os-supervisor-*, label openshell.ai/boundary-role=supervisor) and starts both pods by
    # removing their openshell.ai/bootstrap scheduling gate. These identities may create pods
    # with that label only, never workload pods, and change pod specs only by removing
    # scheduling gates; the shape rules still apply.
    supervisorPods:
      - system:serviceaccount:openshell:openshell
    # agents.x-k8s.io Sandboxes: the OpenShell gateway and the Agent Sandbox controller.
    sandboxes:
      - system:serviceaccount:openshell:openshell
      - system:serviceaccount:agent-sandbox-system:agent-sandbox-controller
    # Secrets: the OpenShell gateway.
    secrets:
      - system:serviceaccount:openshell:openshell
    # Namespace labels: the identities that own the sandbox namespaces' lifecycle (OpenShell's managed
    # workspace mode has the gateway create them). Only these may add, change or remove the labels the
    # policies select by (openshell.ai/managed-by, openshell.ai/gateway-id and every key of
    # namespaceSelector) on a namespace the policies cover; everyone else is denied, cluster admins
    # included, so a namespace cannot be moved out of the policies by relabelling (old issue 475).
    namespaces:
      - system:serviceaccount:openshell:openshell
