# SPDX-License-Identifier: Apache-2.0
# Every Secret an operator can supply instead of letting the chart or the ensure-secrets hook make
# it, and the default mTLS to OpenShell (a client certificate, not openshell.insecure): the
# mounts and keys of each reach the components, which test/chartsmoke starts with fake Secrets.
openshell:
  address: openshell.openshell.svc:8080
  clientTLSSecret: koinon-openshell-client
postgres:
  mode: external
  external:
    secretName: koinon-db
bootstrapAdmin:
  existingSecret: koinon-bootstrap-admin-ext
api:
  otlpToken:
    existingSecret: koinon-otlp-token-ext
  otlpTracesToken:
    existingSecret: koinon-otlp-traces-token-ext
gateway:
  standalone:
    sessionKey:
      existingSecret: koinon-gateway-session-key-ext
secrets:
  kek:
    existingSecret: koinon-kek-ext
oidc:
  enabled: true
  issuerUrl: https://idp.example.com
  clientId: koinon
  redirectUrl: https://koinon.example.com/auth/oidc/callback
  clientSecret:
    existingSecret: koinon-oidc-client-ext
    key: client-secret
