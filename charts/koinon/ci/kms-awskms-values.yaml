# SPDX-License-Identifier: Apache-2.0
# The KEKs wrapped by an AWS KMS key (ADR 0085 decision 12, old issue 417): the key-admin Job creates the KEK
# Secret and adds a second KEK; koinon-api and the reconciler only decrypt. Each signs in with IRSA
# (its ServiceAccount's role). The chart smoke test runs LocalStack (KMS and STS) with TLS at this
# endpoint, adds what the EKS Pod Identity Webhook would to the pods (and makes the database
# external, as for every values file).
openshell:
  address: openshell.openshell.svc:8080
  insecure: true
bootstrapAdmin:
  enabled: false
secrets:
  kek:
    kms:
      backend: awskms
      awskms:
        region: us-east-1
        keyId: alias/koinon-kek
        endpoint: https://localstack:4566
        stsEndpoint: https://localstack:4566
        caConfigMap: localstack-ca
        roleArns:
          api: arn:aws:iam::000000000000:role/koinon-api-decrypt
          reconciler: arn:aws:iam::000000000000:role/koinon-reconciler-decrypt
          keyAdmin: arn:aws:iam::000000000000:role/koinon-key-admin-encrypt
      # A key move (issue 688, 1298): the old key is the read-only second key. koinon-api, the reconciler
      # and the key-admin Job start with the --read-only-* flags; the smoke test never calls the old key.
      readOnly:
        backend: awskms
        awskms:
          region: us-east-1
          keyId: alias/koinon-kek-old
          endpoint: https://localstack:4566
          stsEndpoint: https://localstack:4566
      keyAdmin:
        addKey: smoke-added-kek
        # The Job runs with the recovery flag (#255); the Secret it just created has a working
        # active KEK, so it must add the KEK inactive and leave the active one alone.
        activateIfNoActive: true
# The agentgateway MCP driver (the fallback, #1239). With the koinon driver the gateway recipient key needs an AWS
# KMS key of its own (gateway.mcp.koinon.recipientKey.kms.awskms.keyId), and the smoke test makes none. This file
# also keeps the fallback rendered and started in the standalone mode.
gateway:
  mcp:
    driver: agentgateway

# Substrate is the default driver (#1093), but it refuses the agentgateway fallback (issue #1489): only
# koinon-gateway checks the actor JWT. So this file stays on OpenShell, with its three features on, until
# #1094 removes the driver and the fallback with it.
execution:
  driver: openshell
sandboxObserver:
  enabled: true
sandboxNetworkPolicy:
  enabled: true
sandboxLimitRange:
  enabled: true
