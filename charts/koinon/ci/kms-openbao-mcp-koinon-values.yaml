# SPDX-License-Identifier: Apache-2.0
# koinon-gateway's MCP path with a gateway recipient key wrapped by OpenBao (ADR 0097 decision 12, issue #1151).
openshell:
  address: openshell.openshell.svc:8080
  insecure: true
bootstrapAdmin:
  enabled: false
secrets:
  kek:
    kms:
      backend: openbao
      openbao:
        address: https://openbao:8443
        key: koinon-kek
        caConfigMap: openbao-ca
      keyAdmin:
        addKey: smoke-added-kek
        activateIfNoActive: true
gateway:
  mcp:
    driver: koinon
