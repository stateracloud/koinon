# SPDX-License-Identifier: Apache-2.0
# No client TLS Secret: the mesh provides mTLS (openshell.insecure).
openshell:
  insecure: true
postgres:
  mode: external
  external:
    secretName: koinon-db
gateway:
  mode: kubernetes
networkPolicy:
  enabled: false
sandboxPolicy:
  enabled: false
preflight:
  seccompProbe:
    enabled: false
