# SPDX-License-Identifier: Apache-2.0
# No client TLS Secret: the mesh provides mTLS (openshell.insecure).
openshell:
  address: openshell.openshell.svc:8080
  insecure: true
postgres:
  mode: external
  external:
    secretName: koinon-db
gateway:
  mode: kubernetes
networkPolicy:
  enabled: false
sandboxPolicy:
  enabled: false
# The observer and the sandbox default-deny NetworkPolicy need the policy.
sandboxObserver:
  enabled: false
sandboxNetworkPolicy:
  enabled: false
preflight:
  seccompProbe:
    enabled: false
