# koinon-gateway serves the MCP path (ADR 0097 step 2, issue #278); agentgateway keeps the LLM path.
openshell:
  address: openshell.openshell.svc:8080
  insecure: true
postgres:
  mode: external
  external:
    secretName: koinon-db
bootstrapAdmin:
  enabled: false
gateway:
  mcp:
    driver: koinon
    # The egress listener and the actor token key (#1086 part C2): the ensure-secrets Job makes the key,
    # koinon-agentd starts with the seed and koinon-gateway with the public key.
    koinon:
      egress:
        enabled: true
