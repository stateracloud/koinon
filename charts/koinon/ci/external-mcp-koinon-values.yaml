# koinon-gateway serves the MCP path (ADR 0097 step 2, issue #278); agentgateway keeps the LLM path.
openshell:
  address: openshell.openshell.svc:8080
  insecure: true
postgres:
  mode: external
  external:
    secretName: koinon-db
bootstrapAdmin:
  enabled: false
gateway:
  mcp:
    driver: koinon
    koinon:
      acceptOrgTargetsDropped: true
