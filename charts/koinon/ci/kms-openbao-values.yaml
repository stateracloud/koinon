# SPDX-License-Identifier: Apache-2.0
# The KEKs wrapped by OpenBao transit (ADR 0085 decision 12): the key-admin Job creates the KEK
# Secret and adds a second KEK; koinon-api and the reconciler only decrypt. The chart smoke test
# runs an OpenBao with TLS and Kubernetes auth at this address (and makes the database external,
# as for every values file).
openshell:
  address: openshell.openshell.svc:8080
  insecure: true
bootstrapAdmin:
  enabled: false
secrets:
  kek:
    kms:
      backend: openbao
      openbao:
        address: https://openbao:8443
        caConfigMap: openbao-ca
        key: koinon-kek
      keyAdmin:
        addKey: smoke-added-kek
