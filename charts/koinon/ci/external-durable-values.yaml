# SPDX-License-Identifier: Apache-2.0
# The DBOS runtime on (ADR 0066, 0085): koinon-api gets its pod name as the executor ID and the
# migrate Job creates the DBOS tables and the executor heartbeat table. No client TLS Secret: the mesh
# provides mTLS (openshell.insecure).
openshell:
  address: openshell.openshell.svc:8080
  insecure: true
postgres:
  mode: external
  external:
    secretName: koinon-db
gateway:
  mode: kubernetes
networkPolicy:
  enabled: false
sandboxPolicy:
  enabled: false
# The KEK guard policy and the reconciler Secret fence are cluster-scoped too (issue #604), so both
# are off here: this install may not create cluster-scoped objects.
secrets:
  reconcilerFence:
    enabled: false
  kek:
    guard:
      enabled: false
# The observer, NetworkPolicy writer and LimitRange writer need the policy.
sandboxObserver:
  enabled: false
sandboxNetworkPolicy:
  enabled: false
sandboxLimitRange:
  enabled: false
preflight:
  seccompProbe:
    enabled: false
api:
  durable:
    enabled: true
# The price refresh on, with both auto-apply bounds (ADR 0098): koinon-api must start with its flags.
# The other values files leave prices.refresh.enabled unset, so they start it in auto mode.
prices:
  refresh:
    enabled: true
    interval: 12h
    maxChangePercent: 10
    maxAutoPerDay: 3
