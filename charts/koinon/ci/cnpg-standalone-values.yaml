# SPDX-License-Identifier: Apache-2.0
# Default modes with OpenShell mTLS, ingress on and a KEK Secret you manage.
secrets:
  kek:
    existingSecret: koinon-kek-gitops
openshell:
  address: openshell.openshell.svc:8080
  address: openshell.openshell.svc:8080
  clientTLSSecret: koinon-openshell-client
ingress:
  enabled: true
  className: nginx
  host: koinon.example.com
  tlsSecretName: koinon-tls
networkPolicy:
  apiFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
oidc:
  enabled: true
  issuerUrl: https://idp.example.com/realms/koinon
  clientId: koinon
  clientSecret:
    existingSecret: koinon-oidc
  groupMappings:
    koinon-admins: admin
    staff: member
  platformAdminGroups: [koinon-platform]
bootstrapAdmin:
  existingSecret: koinon-bootstrap-admin-gitops
imagePullSecrets:
  - name: ghcr-pull
harnessPrepull:
  enabled: true
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
