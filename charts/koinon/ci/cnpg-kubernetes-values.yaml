# SPDX-License-Identifier: Apache-2.0
# No client TLS Secret: the mesh provides mTLS (openshell.insecure).
openshell:
  address: openshell.openshell.svc:8080
  insecure: true
gateway:
  mode: kubernetes
  # koinon-gateway, the default MCP driver, needs standalone mode: kubernetes mode keeps agentgateway.
  mcp:
    driver: agentgateway
postgres:
  cnpg:
    instances: 3
    storage:
      storageClass: fast
