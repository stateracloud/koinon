# SPDX-License-Identifier: Apache-2.0
# Restore-hold on the default standalone install (issue #1358): the shape of the restore drill. The
# default MCP driver (koinon-gateway) and the koinon model driver start with --restore-hold and are
# ready with no State revision, deny-all. The smoke tests prove they answer /readyz with 200.
restoreHold: true
openshell:
  address: openshell.openshell.svc:8080
  insecure: true
postgres:
  mode: external
  external:
    secretName: koinon-db
bootstrapAdmin:
  enabled: false
gateway:
  model:
    driver: koinon
# The OpenShell and Kata checks need a cluster with both; this install only proves the held gateways.
preflight:
  enabled: false
