{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
gateway.mcp.driver=koinon: koinon-gateway serves the MCP path (ADR 0097 step 2, issue #278). It is
its own Deployment and Service next to agentgateway, which keeps the LLM path and stays the fallback.

The pods keep no state, so there are two or more, spread over nodes, with a PodDisruptionBudget. Each
follows the State stream of koinon-api (the OTLP listener, with the same bearer token as agentgateway's
access log) and applies the revision the reconciler published. A pod is not ready before its first
revision applied, so a rollout never takes the old pods away before the new ones can serve.

Secret custody (ADR 0097 decision 5, ADR 0120): the pod has no key-encryption key and no Kubernetes API
access (no token is mounted). Its only database access is the leak guard's own login: koinon_mcpgateway,
a member of the group role koinon_gateway and of no other (koinon_gateway gets exactly what the guard reads
and writes, `koinon-api migrate`). It reads the credential files of the MCP targets from the Secret of the
MCP credentials, which the reconciler writes apart from the LLM provider keys: the pod mounts no provider
key. The decrypt key for org credentials comes in the next slice (S4c of issue #278).

The database login in each mode: cnpg mode renders a ConfigMap with the URL (no password, verify-full
against the cluster CA) and the pod takes the generated password as PGPASSWORD; external mode mounts a
key of the external Secret (postgres.external.keys.mcpgateway) as the URL file.
*/ -}}
{{- if include "koinon.mcpKoinon" . }}
{{- if ne .Values.gateway.mode "standalone" }}
{{- fail "gateway.mcp.driver=koinon (the default) needs gateway.mode=standalone: koinon-gateway reads the Secret the standalone reconciler fills, and kubernetes mode is frozen (ADR 0097 decision 4). With gateway.mode=kubernetes set gateway.mcp.driver=agentgateway" }}
{{- end }}
{{- $name := include "koinon.componentName" (list . "mcp-gateway") }}
{{- $m := .Values.gateway.mcp.koinon }}
{{- $drain := int $m.drainTimeoutSeconds }}
{{- $delay := int $m.shutdownDelaySeconds }}
{{- /* A tool call is never retried. It may wait up to the call timeout (120 s, mcpgateway.DefaultCallTimeout) for a person's approval and then run upstream for up to the call timeout (mcpgateway.MinDrain, 240 s). A shorter drain cuts each call that is in flight at a rollout. */ -}}
{{- if lt $drain 240 }}
{{- fail "gateway.mcp.koinon.drainTimeoutSeconds must be at least 240, twice the call timeout of koinon-gateway (an approval wait and an upstream call): a shorter drain cuts a tool call in flight at each rollout" }}
{{- end }}
{{- $dbDir := include "koinon.mcpGatewayDBURLDir" . }}
{{- $mcpKeysDir := include "koinon.gatewayMCPKeysDir" . }}
{{- $gwKey := include "koinon.gwKey" . }}
{{- $egress := include "koinon.egressListener" . }}
{{- $eg := $m.egress }}
{{- if $egress }}
{{- if eq (int $eg.port) (int $m.port) }}
{{- fail "gateway.mcp.koinon.egress.port must differ from gateway.mcp.koinon.port" }}
{{- end }}
{{- /* koinon-gateway refuses an --egress-ca-file without a PEM certificate and does not start (#1487): fail the render instead of a pod in CrashLoopBackOff. */ -}}
{{- if and $eg.caBundle (not (regexMatch `(?s)-----BEGIN CERTIFICATE-----\s*[A-Za-z0-9+/=]+.*?-----END CERTIFICATE-----` $eg.caBundle)) }}
{{- fail "gateway.mcp.koinon.egress.caBundle holds no PEM certificate (-----BEGIN CERTIFICATE----- ... -----END CERTIFICATE-----): set it to the PEM bundle of the extra CA roots, or leave it empty for the system roots only" }}
{{- end }}
{{- end }}
{{- if eq .Values.postgres.mode "cnpg" }}
---
# The URL of the guard's database login, without a password (the pod sets PGPASSWORD). It holds no secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "koinon.mcpGatewayDBURLConfigName" . }}
  labels:
    {{- include "koinon.labels" (list . "mcp-gateway") | nindent 4 }}
data:
  url: {{ printf "postgres://%s@%s-rw.%s.svc:5432/%s?sslmode=verify-full&sslrootcert=/etc/koinon/db-ca/ca.crt" (include "koinon.pgRole" "mcpgateway") (include "koinon.pgCluster" .) .Release.Namespace .Values.postgres.cnpg.database | quote }}
{{- end }}
{{- if and $egress $eg.caBundle }}
---
# The extra CA roots of the egress upstreams (gateway.mcp.koinon.egress.caBundle). Public certificates only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-egress-ca
  labels:
    {{- include "koinon.labels" (list . "mcp-gateway") | nindent 4 }}
data:
  ca.crt: {{ $eg.caBundle | quote }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "mcp-gateway") | nindent 4 }}
  {{- with include "koinon.gwKeyServiceAccountAnnotations" (dict "root" . "role" "gateway") | trim }}
  # IRSA: the IAM role that may decrypt with the gateway's KMS key (recipientKey.kms.awskms.roleArns.gateway).
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "mcp-gateway") | nindent 4 }}
  annotations:
    # Argo CD only: it is not ready before koinon-api serves the State stream and the reconciler has
    # published a revision, as for the agentgateway Deployment.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ int $m.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "koinon.selectorLabels" (list . "mcp-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "koinon.labels" (list . "mcp-gateway") | nindent 8 }}
      {{- with $m.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The shutdown delay (readiness is 503 while the pod still serves), the drain deadline, then 30
      # seconds for the process to exit.
      terminationGracePeriodSeconds: {{ add $delay $drain 30 }}
      {{- with include "koinon.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "koinon.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "koinon.selectorLabels" (list . "mcp-gateway") | nindent 14 }}
      containers:
        - name: koinon-gateway
          image: {{ include "koinon.image" (list . $m.image) }}
          imagePullPolicy: IfNotPresent
          args:
            - --listen-addr=:{{ int $m.port }}
            - --health-addr=:15021
            - --metrics-addr=:15020
            - --state-url=http://{{ include "koinon.componentName" (list . "api") }}.{{ .Release.Namespace }}.svc:{{ .Values.api.otlpPort }}
            - --state-token-file={{ include "koinon.otlpTokenDir" . }}/token
            - --database-url-file={{ $dbDir }}/url
            - --shutdown-delay={{ $delay }}s
            - --drain-timeout={{ $drain }}s
            {{- if $gwKey }}
            - --recipient-key-dir={{ include "koinon.gwKeyDir" . }}
            {{- end }}
            {{- if include "koinon.restoreHold" . }}
            # Held install (restoreHold, ADR 0107, issue #1358): ready with no State revision (a held
            # reconciler publishes none) and deny-all, as the held standalone gateway of issue #530.
            - --restore-hold
            {{- end }}
            {{- with include "koinon.substrateActorJWTArgs" . | trim }}
            # Substrate (ADR 0120, amendments of issues #1386 and #1489): atenet-egress adds the actor JWT that ateapi
            # mints, with one audience for each listener (MCP and egress). The gateway trusts one issuer, from these
            # values only, and checks its TLS with the CA bundle.
            {{- . | nindent 12 }}
            {{- end }}
            {{- if $egress }}
            # The egress listener (#1086 part C2): the forge routes of the State stream, behind the actor token.
            - --egress-addr=:{{ int $eg.port }}
            {{- if include "koinon.ed25519ActorToken" . }}
            - {{ printf "--actor-token-issuer=%s" $eg.actorToken.issuer | quote }}
            - --actor-token-keys-dir=/etc/koinon/actor-token-keys
            {{- end }}
            {{- with concat (.Values.egress.allowedInternalHosts | default list) (.Values.providers.allowedInternalHosts | default list) | uniq }}
            - --egress-allowed-hosts={{ join "," . }}
            {{- end }}
            {{- if $eg.caBundle }}
            - --egress-ca-file=/etc/koinon/egress-ca/ca.crt
            {{- end }}
            {{- end }}
          env:
            {{- if eq .Values.postgres.mode "cnpg" }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "koinon.pgSecret" (list . "mcpgateway") }}
                  key: password
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if $egress }}
            # The egress dialer refuses every Service in Koinon's namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            - name: KOINON_MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
            {{- if $gwKey }}
            {{- include "koinon.gwKeyKmsEnv" (dict "root" . "role" "gateway") | trim | nindent 12 }}
            {{- end }}
          ports:
            - name: mcp
              containerPort: {{ int $m.port }}
            {{- if $egress }}
            - name: egress
              containerPort: {{ int $eg.port }}
            {{- end }}
            - name: stats
              containerPort: 15020
            - name: health
              containerPort: 15021
          # Liveness stays 200 while the pod drains, readiness turns 503 on SIGTERM and before the
          # first revision applied.
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          securityContext:
            {{- include "koinon.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The credential files and CA bundles of the MCP targets: a directory mount, so a rotated
            # credential needs no restart. The LLM provider keys are not mounted.
            - name: mcp-keys
              mountPath: {{ $mcpKeysDir }}
              readOnly: true
            - name: mcp-db
              mountPath: {{ $dbDir }}
              readOnly: true
            {{- include "koinon.dbVolumeMount" . | nindent 12 }}
            {{- include "koinon.otlpTokenVolumeMount" . | nindent 12 }}
            {{- if $egress }}
            {{- if include "koinon.ed25519ActorToken" . }}
            # The public actor token key only, as <key id>.pub: the gateway verifies, it cannot sign.
            - name: actor-token-keys
              mountPath: /etc/koinon/actor-token-keys
              readOnly: true
            {{- end }}
            {{- if $eg.caBundle }}
            - name: egress-ca
              mountPath: /etc/koinon/egress-ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with include "koinon.substrateActorJWTCAVolumeMount" . | trim }}
            # The CA bundle of the Substrate issuer (issues #1386 and #1489): public certificates only.
            {{- . | nindent 12 }}
            {{- end }}
            {{- if $gwKey }}
            # The wrapped private keys (ADR 0097 12.3): only this Deployment mounts them. The Secret may not
            # exist yet (the key-admin Job makes it), and the pod is ready without a key.
            - name: gateway-key
              mountPath: {{ include "koinon.gwKeyDir" . }}
              readOnly: true
            {{- if eq (include "koinon.kms" .) "openbao" }}
            - name: gateway-kms-token
              mountPath: {{ include "koinon.gwKeyTokenDir" . }}
              readOnly: true
            {{- end }}
            {{- include "koinon.kmsVolumeMount" . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: mcp-keys
          secret:
            secretName: {{ include "koinon.gatewayMCPKeysName" . }}
            defaultMode: 0444
        {{- if eq .Values.postgres.mode "cnpg" }}
        - name: mcp-db
          configMap:
            name: {{ include "koinon.mcpGatewayDBURLConfigName" . }}
        {{- else }}
        - name: mcp-db
          secret:
            secretName: {{ required "postgres.external.secretName is required in external mode" .Values.postgres.external.secretName }}
            defaultMode: 0440
            items:
              - key: {{ required "postgres.external.keys.mcpgateway is required when gateway.mcp.driver=koinon" .Values.postgres.external.keys.mcpgateway }}
                path: url
        {{- end }}
        {{- include "koinon.dbVolume" . | nindent 8 }}
        {{- include "koinon.otlpTokenVolume" . | nindent 8 }}
        {{- if $egress }}
        {{- if include "koinon.ed25519ActorToken" . }}
        - name: actor-token-keys
          secret:
            secretName: {{ include "koinon.actorTokenKeyName" . }}
            defaultMode: 0444
            items:
              - key: public.pem
                path: {{ $eg.actorToken.keyId }}.pub
        {{- end }}
        {{- if $eg.caBundle }}
        - name: egress-ca
          configMap:
            name: {{ $name }}-egress-ca
        {{- end }}
        {{- end }}
        {{- with include "koinon.substrateActorJWTCAVolume" . | trim }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if $gwKey }}
        - name: gateway-key
          secret:
            secretName: {{ include "koinon.gwKeySecretName" . }}
            optional: true
            defaultMode: 0444
        {{- if eq (include "koinon.kms" .) "openbao" }}
        # The gateway pod mounts no automatic service account token. OpenBao's Kubernetes auth reads this one.
        - name: gateway-kms-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  {{- with $m.recipientKey.kms.openbao.audience }}
                  audience: {{ . | quote }}
                  {{- end }}
        {{- end }}
        {{- include "koinon.kmsVolume" . | nindent 8 }}
        {{- end }}
      {{- with $m.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "mcp-gateway") | nindent 4 }}
spec:
  selector:
    {{- include "koinon.selectorLabels" (list . "mcp-gateway") | nindent 4 }}
  ports:
    - name: mcp
      port: {{ int $m.port }}
      targetPort: mcp
    {{- if $egress }}
    - name: egress
      port: {{ int $eg.port }}
      targetPort: egress
    {{- end }}
    - name: stats
      port: 15020
      targetPort: stats
---
# A node drain evicts the pods one at a time; each drains for up to the drain timeout.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "mcp-gateway") | nindent 4 }}
spec:
  maxUnavailable: {{ int $m.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "koinon.selectorLabels" (list . "mcp-gateway") | nindent 6 }}
{{- end }}
