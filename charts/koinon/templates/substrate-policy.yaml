{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
Native ValidatingAdmissionPolicies for Substrate's namespace (ADR 0120 section 6, issue 1089;
NEVER Kyverno, no CNI-specific feature). Worker pods run privileged (D7), so this namespace holds
nothing else and these rules are what fences them. Rules key on the requesting identity, which a
pod's creator cannot choose.
- pods: only the Substrate controller and Kubernetes' own workload controllers (the Deployments,
  DaemonSets and StatefulSets of Substrate's control plane) create pods or change their spec. Every
  image of every container and init container is pinned by digest (the platform controllers' pods
  are exempt until Substrate publishes by digest: execution.substrate.workerPolicy.digestExemptIdentities).
  No hostNetwork. hostPath only from workerPolicy.allowedHostPaths, on every volume. No ephemeral
  containers, for any identity, the controller included;
- CONNECT: pods/exec, attach, portforward and proxy are denied to every identity with no exemption (a
  process started that way is outside the guest launcher's and gateway's controls). Break-glass is not
  an exemption: a cluster admin suspends the binding, which shows in the audit log and as GitOps drift.
  It is its own policy because an options object has no spec or metadata;
- objects: WorkerPool, SandboxConfig and CSIDriverConfig, and the workload kinds that make pods
  (Deployments, ReplicaSets, DaemonSets, StatefulSets, Jobs, CronJobs), are written only by the
  installer (workerPolicy.installerIdentities or installerGroups, default system:masters) and by
  Kubernetes' own controllers; the Substrate controller may change the metadata of its objects and applies the Deployments of its WorkerPools. Without
  this, anyone who can write a Deployment here would get a privileged pod past the pod rules.
A CEL error denies under failurePolicy Fail.
*/ -}}
{{- if and (eq (include "koinon.substrate" .) "true") .Values.execution.substrate.workerPolicy.enabled }}
{{- $s := .Values.execution.substrate }}
{{- $w := $s.workerPolicy }}
{{- $ns := $s.namespace }}
{{- $base := printf "%s-%s" .Release.Namespace (include "koinon.fullname" .) }}
{{- $pods := printf "%s-worker-pods" $base }}
{{- $connect := printf "%s-worker-connect" $base }}
{{- $objects := printf "%s-worker-objects" $base }}
{{- $controllers := $w.controllerIdentities }}
{{- if not $controllers }}{{- $controllers = list (printf "system:serviceaccount:%s:ate-controller" $ns) }}{{- end }}
{{- $trusted := concat $controllers $w.platformControllers }}
{{- $tagOK := $w.digestExemptIdentities }}
{{- if not $tagOK }}{{- $tagOK = $w.platformControllers }}{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $pods }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers, pods/resize]
  variables:
    - name: allContainers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: trusted
      expression: {{ printf "request.userInfo.username in %s" (toJson $trusted) | quote }}
    - name: tagAllowed
      expression: {{ printf "request.userInfo.username in %s" (toJson $tagOK) | quote }}
    - name: volumes
      expression: "has(object.spec.volumes) ? object.spec.volumes : []"
  validations:
    - expression: "!has(request.subResource) || request.subResource != 'ephemeralcontainers'"
      message: ephemeral containers are not allowed in the Substrate namespace
    - expression: "request.operation != 'CREATE' || variables.trusted"
      messageExpression: "'only the Substrate controller and Kubernetes workload controllers may create pods in the Substrate namespace, not ' + request.userInfo.username"
    - expression: "request.operation != 'UPDATE' || variables.trusted || object.spec == oldObject.spec"
      messageExpression: "'only the Substrate controller may change a pod spec in the Substrate namespace, not ' + request.userInfo.username"
    - expression: "!has(object.spec.hostNetwork) || !object.spec.hostNetwork"
      message: hostNetwork is not allowed in the Substrate namespace
    - expression: "(!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: hostPID and hostIPC are not allowed in the Substrate namespace
    - expression: "!has(object.metadata.annotations) || object.metadata.annotations.all(k, !k.startsWith('io.katacontainers.'))"
      message: io.katacontainers.* annotations are not allowed in the Substrate namespace
    - expression: >-
        request.operation != 'UPDATE' || variables.trusted ||
        (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {})
      message: only the Substrate controller may change the labels of a pod in the Substrate namespace
    - expression: {{ printf "variables.volumes.all(v, !has(v.hostPath) || v.hostPath.path in %s)" (toJson $w.allowedHostPaths) | quote }}
      message: {{ printf "hostPath is allowed only for %s in the Substrate namespace" (join ", " $w.allowedHostPaths) | quote }}
    - expression: "(request.operation == 'UPDATE' && object.spec == oldObject.spec) || variables.tagAllowed || variables.allContainers.all(c, c.image.matches('@sha256:[a-f0-9]{64}$'))"
      message: images in the Substrate namespace must be pinned by digest (name@sha256:<64 hex digits>)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $pods }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $pods }}
  validationActions: {{ toJson $w.validationActions }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $connect }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CONNECT]
        resources: [pods/exec, pods/attach, pods/portforward, pods/proxy]
  validations:
    - expression: "false"
      messageExpression: "request.resource.resource + '/' + request.subResource + ' is not allowed in the Substrate namespace (requested by ' + request.userInfo.username + ')'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $connect }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $connect }}
  validationActions: {{ toJson $w.validationActions }}
  # No objectSelector: a CONNECT request's object is an options object without metadata.
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns | quote }}
{{- /* Kubernetes' own controllers write the workload objects and delete everything with the namespace. */}}
{{- $kube := concat $w.platformControllers (list "system:serviceaccount:kube-system:deployment-controller" "system:serviceaccount:kube-system:namespace-controller" "system:serviceaccount:kube-system:generic-garbage-collector") }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $objects }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [ate.dev]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [workerpools, sandboxconfigs, csidriverconfigs]
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [deployments, replicasets, daemonsets, statefulsets]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [replicationcontrollers]
      - apiGroups: [batch]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [jobs, cronjobs]
  variables:
    - name: installer
      expression: {{ printf "request.userInfo.username in %s || request.userInfo.groups.exists(g, g in %s)" (toJson $w.installerIdentities) (toJson $w.installerGroups) | quote }}
    - name: kube
      expression: {{ printf "request.userInfo.username in %s" (toJson $kube) | quote }}
    # The Substrate controller changes metadata (finalizers, annotations) of its own objects, never the spec.
    # The Substrate controller applies the Deployment of a WorkerPool (server-side apply creates and updates it).
    # It may not write any other workload kind. Its pod template follows the pod rules already at the
    # Deployment, so a bad template fails here and not only when the ReplicaSet makes the pod. The digest
    # rule cannot hold here: worker images are tags (Substrate v1.0.0), and the ReplicaSet controller is
    # digest-exempt (digestExemptIdentities, tracking issue #1140).
    - name: controllerOwn
      expression: {{ printf "request.userInfo.username in %s && request.resource.group == 'apps' && request.resource.resource == 'deployments' && (request.operation == 'DELETE' || (!has(object.spec.template.spec.hostNetwork) || !object.spec.template.spec.hostNetwork) && (!has(object.spec.template.spec.hostPID) || !object.spec.template.spec.hostPID) && (!has(object.spec.template.spec.hostIPC) || !object.spec.template.spec.hostIPC) && (!has(object.spec.template.spec.volumes) || object.spec.template.spec.volumes.all(v, !has(v.hostPath) || v.hostPath.path in %s)))" (toJson $controllers) (toJson $w.allowedHostPaths) | quote }}
    - name: controllerMetadata
      expression: {{ printf "request.userInfo.username in %s && request.operation == 'UPDATE' && request.resource.group == 'ate.dev' && has(object.spec) && has(oldObject.spec) && object.spec == oldObject.spec" (toJson $controllers) | quote }}
  validations:
    - expression: "variables.installer || variables.kube || variables.controllerOwn || variables.controllerMetadata"
      messageExpression: "'only the installer may write ' + request.resource.resource + ' in the Substrate namespace, not ' + request.userInfo.username"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $objects }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $objects }}
  validationActions: {{ toJson $w.validationActions }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns | quote }}
{{- end }}
