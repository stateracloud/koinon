{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
Native ValidatingAdmissionPolicies for Substrate's two namespaces (ADR 0120 section 6, issue 1089;
NEVER Kyverno, no CNI-specific feature). Worker pods run with SYS_ADMIN and NET_ADMIN (D7), so they
live in their own namespace (execution.substrate.workerNamespace) and these rules fence them. Rules
key on the requesting identity, which a pod's creator cannot choose.
Worker namespace:
- pods: only the ReplicaSet controller creates them, and only for a ReplicaSet (a controller
  ownerReference). The ate-controller applies the pool Deployments. No hostNetwork, hostPID or
  hostIPC; hostPath only from workerPolicy.allowedHostPaths; volumes of the kinds hostPath, emptyDir,
  configMap, downwardAPI and projected only; no projected serviceAccountToken source and
  automountServiceAccountToken not true (the worker has no Kubernetes client, ADR 0120 section 2.4);
  added capabilities and an Unconfined profile only on the worker container (a main container named worker with a worker image), and only with the
  shape that Substrate sets for the gVisor or the micro-VM class (workerPolicy.workerShapes; a spec compares it with
  Substrate's source at the pinned commit); digests pinned (the platform
  controllers' pods are exempt until Substrate publishes by digest: workerPolicy.digestExemptIdentities);
  no ephemeral containers, for any identity;
- objects: WorkerPool and the workload kinds that make pods are written only by the installer and by
  Kubernetes' own controllers. The ate-controller applies the pool Deployments and may change the
  metadata of its objects.
Control-plane namespace (ate-system): the control plane and atelet. Its pods come from Kubernetes'
workload controllers. No hostNetwork, no ephemeral containers, digests pinned (same exemption). A pod
may mount a hostPath only when the DaemonSet controller creates it for a DaemonSet (a controller
ownerReference) and runs as the node agent ServiceAccount (workerPolicy.nodeAgent.serviceAccount),
and only for workerPolicy.nodeAgent.allowedHostPaths. Every other pod there gets no hostPath.
Worker namespace: pods/exec, attach, portforward, pods/proxy and services/proxy are denied to every
identity with no exemption (a process started that way is outside the guest launcher's and gateway's
controls). Control-plane namespace: the pod and service proxies are denied to every identity, and exec, attach and
port-forward are allowed to the installer identities only (workerPolicy.installerIdentities or installerGroups); each
request carries an audit annotation. Break-glass is not an exemption: a cluster admin suspends the binding, which shows in the
audit log and as GitOps drift. The workload kinds, WorkerPool and CSIDriverConfig are written only by
the installer (workerPolicy.installerIdentities or installerGroups, default system:masters) and by
Kubernetes' own controllers. Without this, anyone who can write a Deployment would get a privileged
pod past the pod rules. A CEL error denies under failurePolicy Fail.
Worker namespace NetworkPolicies (issue 1158): NetworkPolicies add up, so any identity that can write one there can give
workers more egress than the chart's policy allows. Only the installer, the Substrate controller and Kubernetes' own
controllers may write them. The controller's policies (the per-pool policy) may allow egress only to the control-plane
namespace and to DNS (kube-system, port 53): an egress rule needs a `to` list, no peer is an ipBlock, a same-namespace
peer or a selector that is not a plain namespace name, and a DNS peer needs ports that are all 53. The controller
may not write or delete the chart's own policy (<fullname>-substrate-workers). Its ingress may come only from the control-plane
namespace and Koinon's namespace. Open point: the controller may still change or delete other policies of the namespace, such as an
operator's own fence (workerNetworkPolicy.enabled=false); the controller's policies carry no marker that the rule can key on. Kubernetes' own controllers may delete a policy and
change its metadata (garbage collection, namespace deletion), never its spec.
*/ -}}
{{- if and (eq (include "koinon.substrate" .) "true") .Values.execution.substrate.workerPolicy.enabled }}
{{- $s := .Values.execution.substrate }}
{{- $w := $s.workerPolicy }}
{{- $ns := $s.namespace }}
{{- $wns := $s.workerNamespace }}
{{- if eq $ns $wns }}{{- fail "execution.substrate.workerNamespace must differ from execution.substrate.namespace: worker pods run with extra capabilities and do not share a namespace with the control plane (ADR 0120 section 6)" }}{{- end }}
{{- $base := printf "%s-%s" .Release.Namespace (include "koinon.fullname" .) }}
{{- $pods := printf "%s-worker-pods" $base }}
{{- $ctlPods := printf "%s-control-pods" $base }}
{{- $connect := printf "%s-worker-connect" $base }}
{{- $objects := printf "%s-worker-objects" $base }}
{{- $netpol := printf "%s-worker-netpol" $base }}
{{- $controllers := $w.controllerIdentities }}
{{- if not $controllers }}{{- $controllers = list (printf "system:serviceaccount:%s:ate-controller" $ns) }}{{- end }}
{{- $trusted := concat $w.podCreators $controllers }}
{{- $platformTrusted := concat $controllers $w.platformControllers }}
{{- $tagOK := $w.digestExemptIdentities }}
{{- /* The worker images per sandbox class (workerShapes.<class>.images), and the image of the WorkerPool that the chart makes
(rewritten by the registry mirrors like every image) in the list of its class. The class of a worker container is the class
of its image: a gVisor image gets only the gVisor capability set, a micro-VM image only the micro-VM set (issue #1176). With
no worker image no container is a worker container, so a worker pod has no extra capability and no Unconfined profile and
does not start: the policy fails closed. */}}
{{- $gvisorImages := $w.workerShapes.gvisor.images | default list }}
{{- $microImages := $w.workerShapes.microvm.images | default list }}
{{- with $poolImage := include "koinon.substrate.workerPoolImage" . }}
{{- if eq $s.workerPool.sandboxClass "microvm" }}{{- $microImages = append $microImages $poolImage }}{{- else }}{{- $gvisorImages = append $gvisorImages $poolImage }}{{- end }}
{{- end }}
{{- range $gvisorImages }}{{- if has . $microImages }}{{- fail (printf "execution.substrate.workerPolicy.workerShapes: the image %s is in the gvisor and the microvm list; a worker image has one sandbox class" .) }}{{- end }}{{- end }}
{{- /* append onto list, not concat: concat of two empty lists is null, and `c.image in null` is a CEL error. */}}
{{- $workerImages := list }}
{{- range (concat $gvisorImages $microImages) }}{{- $workerImages = append $workerImages . }}{{- end }}
{{- $gvisorCaps := $w.workerShapes.gvisor.capabilities }}
{{- $microCaps := $w.workerShapes.microvm.capabilities }}
{{- $dsc := "system:serviceaccount:kube-system:daemon-set-controller" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $pods }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers, pods/resize]
  variables:
    - name: allContainers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    # Only an init container can share no name with a main container, so an init container named worker is never the
    # worker container: it gets no capability and no Unconfined profile (issue #1176).
    - name: initNames
      expression: "has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.name) : []"
    - name: creator
      expression: {{ printf "request.userInfo.username in %s" (toJson $w.podCreators) | quote }}
    - name: trusted
      expression: {{ printf "request.userInfo.username in %s" (toJson $trusted) | quote }}
    - name: tagAllowed
      expression: {{ printf "request.userInfo.username in %s" (toJson $tagOK) | quote }}
    - name: volumes
      expression: "has(object.spec.volumes) ? object.spec.volumes : []"
    - name: unchanged
      expression: "request.operation == 'UPDATE' && object.spec == oldObject.spec"
  validations:
    - expression: "!has(request.subResource) || request.subResource != 'ephemeralcontainers'"
      message: ephemeral containers are not allowed in the worker namespace
    - expression: "request.operation != 'CREATE' || variables.creator"
      messageExpression: "'only the ReplicaSet controller may create pods in the worker namespace, not ' + request.userInfo.username"
    - expression: "request.operation != 'CREATE' || (has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o, o.kind == 'ReplicaSet' && has(o.controller) && o.controller))"
      message: a pod in the worker namespace must belong to a ReplicaSet (pools are Deployments that the Substrate controller applies)
    - expression: "request.operation != 'UPDATE' || variables.trusted || variables.unchanged"
      messageExpression: "'only the Substrate controller may change a pod spec in the worker namespace, not ' + request.userInfo.username"
    - expression: "!has(object.spec.hostNetwork) || !object.spec.hostNetwork"
      message: hostNetwork is not allowed in the worker namespace
    - expression: "(!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: hostPID and hostIPC are not allowed in the worker namespace
    - expression: "!has(object.metadata.annotations) || object.metadata.annotations.all(k, !k.startsWith('io.katacontainers.'))"
      message: io.katacontainers.* annotations are not allowed in the worker namespace
    - expression: >-
        request.operation != 'UPDATE' || variables.trusted ||
        (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {})
      message: only the Substrate controller may change the labels of a pod in the worker namespace
    - expression: {{ printf "variables.volumes.all(v, !has(v.hostPath) || v.hostPath.path in %s)" (toJson $w.allowedHostPaths) | quote }}
      message: {{ printf "hostPath is allowed only for %s in the worker namespace" (join ", " $w.allowedHostPaths) | quote }}
    - expression: "variables.volumes.all(v, has(v.hostPath) || has(v.emptyDir) || has(v.configMap) || has(v.downwardAPI) || has(v.projected))"
      message: volumes in the worker namespace must be hostPath, emptyDir, configMap, downwardAPI or projected (no PVC, CSI, ephemeral, NFS or other network volume)
    - expression: "variables.volumes.all(v, !has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(src, !has(src.serviceAccountToken)))"
      message: a projected serviceAccountToken volume is not allowed in the worker namespace (the worker has no Kubernetes client)
    - expression: "variables.volumes.all(v, !has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(src, has(src.configMap) || has(src.downwardAPI) || has(src.clusterTrustBundle) || has(src.podCertificate)))"
      message: a projected volume in the worker namespace may hold only configMap, downwardAPI, clusterTrustBundle and podCertificate sources (no Secret)
    - expression: "variables.allContainers.all(c, (!has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef))) && (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef))))"
      message: a Secret in the environment of a worker container is not allowed (no secrets in sandboxes)
    - expression: "!has(object.spec.automountServiceAccountToken) || !object.spec.automountServiceAccountToken"
      message: automountServiceAccountToken must not be true in the worker namespace
    - expression: "variables.allContainers.all(c, !has(c.securityContext) || ((!has(c.securityContext.privileged) || !c.securityContext.privileged) && (!has(c.securityContext.procMount) || c.securityContext.procMount != 'Unmasked')))"
      message: privileged containers and an unmasked /proc are not allowed in the worker namespace (the capability ceiling is the limit)
    - expression: "variables.allContainers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))"
      message: hostPort is not allowed in the worker namespace
    # The worker container is the one that Substrate's controller shapes (cmd/atecontroller workerpool_apply.go:377-468):
    # a main container (not an init container) named `worker` whose image is one of the worker images. Only it may have an
    # Unconfined profile and added capabilities, and only the shape that Substrate sets for the class of its image. Every
    # other container has neither.
    - expression: {{ printf "(!has(object.spec.securityContext) || !has(object.spec.securityContext.seccompProfile) || object.spec.securityContext.seccompProfile.type != 'Unconfined') && (!has(object.spec.securityContext) || !has(object.spec.securityContext.appArmorProfile) || object.spec.securityContext.appArmorProfile.type != 'Unconfined') && variables.allContainers.all(c, (c.name == 'worker' && !('worker' in variables.initNames) && c.image in %s) || !has(c.securityContext) || ((!has(c.securityContext.seccompProfile) || c.securityContext.seccompProfile.type != 'Unconfined') && (!has(c.securityContext.appArmorProfile) || c.securityContext.appArmorProfile.type != 'Unconfined')))" (toJson $workerImages) | quote }}
      message: an Unconfined seccomp or AppArmor profile is allowed only on the worker container (a main container named worker with a worker image), never on the pod and never on another container
    - expression: {{ printf "variables.allContainers.all(c, (c.name == 'worker' && !('worker' in variables.initNames) && c.image in %s) || !has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0)" (toJson $workerImages) | quote }}
      message: added capabilities are allowed only on the worker container (a main container named worker with a worker image) in the worker namespace
    - expression: {{ printf "variables.allContainers.all(c, !(c.name == 'worker' && !('worker' in variables.initNames) && c.image in %s) || (has(c.securityContext) && has(c.securityContext.runAsUser) && c.securityContext.runAsUser == 0 && has(c.securityContext.runAsGroup) && c.securityContext.runAsGroup == 0 && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop == ['ALL'] && has(c.securityContext.capabilities.add) && ((c.image in %s && c.securityContext.capabilities.add.all(x, x in %s) && %s.all(x, x in c.securityContext.capabilities.add)) || (c.image in %s && c.securityContext.capabilities.add.all(x, x in %s) && %s.all(x, x in c.securityContext.capabilities.add)))))" (toJson $workerImages) (toJson $gvisorImages) (toJson $gvisorCaps) (toJson $gvisorCaps) (toJson $microImages) (toJson $microCaps) (toJson $microCaps) | quote }}
      message: the worker container must have the exact shape that Substrate sets (runAsUser 0, runAsGroup 0, no privilege escalation, drop ALL, and the added capabilities of the sandbox class of its image, gVisor or micro-VM)
    - expression: "variables.unchanged || variables.tagAllowed || variables.allContainers.all(c, c.image.matches('@sha256:[a-f0-9]{64}$'))"
      message: images in the worker namespace must be pinned by digest (name@sha256:<64 hex digits>)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $pods }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $pods }}
  validationActions: {{ toJson $w.validationActions }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $wns | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $ctlPods }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers, pods/resize]
  variables:
    - name: allContainers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: trusted
      expression: {{ printf "request.userInfo.username in %s" (toJson $platformTrusted) | quote }}
    # Only Kubernetes' workload controllers create pods here. The Substrate controller does not: it
    # writes the pool Deployments in the worker namespace, so it gets no pod CREATE in this one.
    - name: creator
      expression: {{ printf "request.userInfo.username in %s" (toJson $w.platformControllers) | quote }}
    - name: tagAllowed
      expression: {{ printf "request.userInfo.username in %s" (toJson $tagOK) | quote }}
    - name: volumes
      expression: "has(object.spec.volumes) ? object.spec.volumes : []"
    - name: unchanged
      expression: "request.operation == 'UPDATE' && object.spec == oldObject.spec"
    # The node agent rule: the DaemonSet controller creates the pod for a DaemonSet, and it runs as the
    # node agent ServiceAccount. Nothing else in this namespace gets a hostPath.
    - name: nodeAgent
      expression: {{ printf "request.userInfo.username in %s && has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o, o.kind == 'DaemonSet' && has(o.controller) && o.controller) && has(object.spec.serviceAccountName) && object.spec.serviceAccountName in %s" (toJson (list $dsc)) (toJson (list $w.nodeAgent.serviceAccount)) | quote }}
  validations:
    - expression: "!has(request.subResource) || request.subResource != 'ephemeralcontainers'"
      message: ephemeral containers are not allowed in the Substrate namespace
    - expression: "request.operation != 'CREATE' || variables.creator"
      messageExpression: "'only Kubernetes workload controllers may create pods in the Substrate namespace, not ' + request.userInfo.username"
    - expression: "request.operation != 'CREATE' || (has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o, has(o.controller) && o.controller))"
      message: a pod in the Substrate namespace must have a controller ownerReference (a workload controller makes it)
    - expression: "request.operation != 'UPDATE' || variables.trusted || variables.unchanged"
      messageExpression: "'only the Substrate controller may change a pod spec in the Substrate namespace, not ' + request.userInfo.username"
    - expression: "!has(object.spec.hostNetwork) || !object.spec.hostNetwork"
      message: hostNetwork is not allowed in the Substrate namespace
    - expression: "(!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: hostPID and hostIPC are not allowed in the Substrate namespace
    - expression: "!has(object.metadata.annotations) || object.metadata.annotations.all(k, !k.startsWith('io.katacontainers.'))"
      message: io.katacontainers.* annotations are not allowed in the Substrate namespace
    - expression: {{ printf "variables.unchanged || variables.volumes.all(v, !has(v.hostPath) || (variables.nodeAgent && v.hostPath.path in %s))" (toJson $w.nodeAgent.allowedHostPaths) | quote }}
      message: {{ printf "hostPath in the Substrate namespace is allowed only for the DaemonSet pod of ServiceAccount %s and only for %s" $w.nodeAgent.serviceAccount (join ", " $w.nodeAgent.allowedHostPaths) | quote }}
    - expression: "variables.unchanged || variables.tagAllowed || variables.allContainers.all(c, c.image.matches('@sha256:[a-f0-9]{64}$'))"
      message: images in the Substrate namespace must be pinned by digest (name@sha256:<64 hex digits>)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $ctlPods }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $ctlPods }}
  validationActions: {{ toJson $w.validationActions }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $connect }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CONNECT]
        resources: [pods/exec, pods/attach, pods/portforward, pods/proxy, services/proxy]
  variables:
    - name: installer
      expression: {{ printf "request.userInfo.username in %s || request.userInfo.groups.exists(g, g in %s)" (toJson $w.installerIdentities) (toJson $w.installerGroups) | quote }}
    - name: inControlPlane
      expression: {{ printf "request.namespace == %s" (toJson $ns) | quote }}
  validations:
    # The worker namespace denies every identity. The control-plane namespace admits exec, attach and port-forward for the
    # installer identities only (an operator debug route), and denies the pod and service proxies to everyone.
    - expression: "variables.inControlPlane && variables.installer && request.resource.resource == 'pods' && request.subResource in ['exec', 'attach', 'portforward']"
      messageExpression: "request.resource.resource + '/' + request.subResource + ' is not allowed in the Substrate namespaces for ' + request.userInfo.username + ' (the installer identities may exec, attach and port-forward in the control-plane namespace only)'"
  # Every request that reaches this policy leaves a record in the audit log: who, what and where.
  auditAnnotations:
    - key: connect
      valueExpression: "request.userInfo.username + ' ' + request.resource.resource + '/' + request.subResource + ' ' + request.namespace + '/' + request.name"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $connect }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $connect }}
  # The audit annotation is written for allowed requests whatever the actions are. Audit is added so that a refused
  # request is recorded too.
  validationActions: {{ toJson (uniq (append $w.validationActions "Audit")) }}
  # No objectSelector: a CONNECT request's object is an options object without metadata.
  matchResources:
    namespaceSelector:
      matchExpressions:
        - {key: kubernetes.io/metadata.name, operator: In, values: {{ toJson (list $ns $wns) }}}
{{- /* Kubernetes' own controllers write the workload objects and delete everything with the namespace. */}}
{{- $kube := concat $w.platformControllers (list "system:serviceaccount:kube-system:deployment-controller" "system:serviceaccount:kube-system:namespace-controller" "system:serviceaccount:kube-system:generic-garbage-collector") }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $objects }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [ate.dev]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [workerpools, sandboxconfigs, csidriverconfigs]
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [deployments, replicasets, daemonsets, statefulsets]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [replicationcontrollers]
      - apiGroups: [batch]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [jobs, cronjobs]
  variables:
    - name: installer
      expression: {{ printf "request.userInfo.username in %s || request.userInfo.groups.exists(g, g in %s)" (toJson $w.installerIdentities) (toJson $w.installerGroups) | quote }}
    - name: kube
      expression: {{ printf "request.userInfo.username in %s" (toJson $kube) | quote }}
    # A cluster-scoped object (SandboxConfig, CSIDriverConfig) has no request.namespace key in CEL: the read
    # fails with "no such key". The variable is the empty string for such an object.
    - name: reqNamespace
      expression: "has(request.namespace) ? request.namespace : ''"
    # The Substrate controller applies the Deployment of a WorkerPool in the worker namespace (server-side
    # apply creates and updates it) and deletes it. It may not write any other workload kind, or
    # anything in the control-plane namespace. The pod template follows the pod rules already at the
    # Deployment, so a bad template fails here and not only when the ReplicaSet makes the pod. The
    # digest rule cannot hold here: worker images are tags (Substrate v1.0.1), and the ReplicaSet
    # controller is digest-exempt (digestExemptIdentities, tracking issue #1140).
    - name: controllerOwn
      expression: {{ printf "request.userInfo.username in %s && variables.reqNamespace == %s && request.resource.group == 'apps' && request.resource.resource == 'deployments' && (request.operation == 'DELETE' || (!has(object.spec.template.spec.hostNetwork) || !object.spec.template.spec.hostNetwork) && (!has(object.spec.template.spec.hostPID) || !object.spec.template.spec.hostPID) && (!has(object.spec.template.spec.hostIPC) || !object.spec.template.spec.hostIPC) && (!has(object.spec.template.spec.automountServiceAccountToken) || !object.spec.template.spec.automountServiceAccountToken) && object.spec.template.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged) && (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged)) && (!has(object.spec.template.spec.volumes) || object.spec.template.spec.volumes.all(v, !has(v.hostPath) || v.hostPath.path in %s)))" (toJson $controllers) ($wns | quote) (toJson $w.allowedHostPaths) | quote }}
    - name: controllerMetadata
      expression: {{ printf "request.userInfo.username in %s && variables.reqNamespace in %s && request.operation == 'UPDATE' && request.resource.group == 'ate.dev' && has(object.spec) && has(oldObject.spec) && object.spec == oldObject.spec" (toJson $controllers) (toJson (list $ns $wns "")) | quote }}
{{- if include "koinon.imageCache" . }}
    # The image cache CA hook Job (issue #1191) restarts atelet when the CA changes: it writes one annotation on the
    # pod template of the atelet DaemonSet and nothing else. The Job is not an installer identity. The rule admits
    # only an UPDATE of the DaemonSet atelet in the control-plane namespace, by the Job's ServiceAccount, where the
    # selector, the update strategy, the pod spec (images, env, volumes, security context) and the labels are
    # unchanged and the annotations of the pod template differ at the one stamp key. A create, a delete, another
    # DaemonSet, another namespace or any other change is denied.
    - name: caStampOld
      expression: "has(oldObject.spec.template.metadata.annotations) ? oldObject.spec.template.metadata.annotations : {}"
    - name: caStampNew
      expression: "has(object.spec.template.metadata.annotations) ? object.spec.template.metadata.annotations : {}"
    - name: caMetaOld
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
    - name: caMetaNew
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: caStamp
      expression: {{ printf "request.userInfo.username == %s && variables.reqNamespace == %s && request.operation == 'UPDATE' && request.resource.group == 'apps' && request.resource.resource == 'daemonsets' && object.metadata.name == 'atelet' && object.spec.template.spec == oldObject.spec.template.spec && object.spec.selector == oldObject.spec.selector && has(object.spec.updateStrategy) == has(oldObject.spec.updateStrategy) && (!has(object.spec.updateStrategy) || object.spec.updateStrategy == oldObject.spec.updateStrategy) && has(object.spec.template.metadata.labels) == has(oldObject.spec.template.metadata.labels) && (!has(object.spec.template.metadata.labels) || object.spec.template.metadata.labels == oldObject.spec.template.metadata.labels) && has(object.metadata.labels) == has(oldObject.metadata.labels) && (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) && has(object.spec.minReadySeconds) == has(oldObject.spec.minReadySeconds) && (!has(object.spec.minReadySeconds) || object.spec.minReadySeconds == oldObject.spec.minReadySeconds) && has(object.spec.revisionHistoryLimit) == has(oldObject.spec.revisionHistoryLimit) && (!has(object.spec.revisionHistoryLimit) || object.spec.revisionHistoryLimit == oldObject.spec.revisionHistoryLimit) && has(object.spec.template.metadata.finalizers) == has(oldObject.spec.template.metadata.finalizers) && (!has(object.spec.template.metadata.finalizers) || object.spec.template.metadata.finalizers == oldObject.spec.template.metadata.finalizers) && has(object.spec.template.metadata.ownerReferences) == has(oldObject.spec.template.metadata.ownerReferences) && (!has(object.spec.template.metadata.ownerReferences) || object.spec.template.metadata.ownerReferences == oldObject.spec.template.metadata.ownerReferences) && variables.caMetaNew.all(k, k == 'deprecated.daemonset.template.generation' || (k in variables.caMetaOld && variables.caMetaOld[k] == variables.caMetaNew[k])) && variables.caMetaOld.all(k, k == 'deprecated.daemonset.template.generation' || k in variables.caMetaNew) && has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences) && has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) && (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers) && variables.caStampNew.all(k, k == 'koinon.dev/imagecache-ca-sha256' || (k in variables.caStampOld && variables.caStampOld[k] == variables.caStampNew[k])) && (!('koinon.dev/imagecache-ca-sha256' in variables.caStampNew) || variables.caStampNew['koinon.dev/imagecache-ca-sha256'].matches('^[0-9a-f]{64}$')) && variables.caStampOld.all(k, k == 'koinon.dev/imagecache-ca-sha256' || k in variables.caStampNew)" (printf "system:serviceaccount:%s:%s" .Release.Namespace (include "koinon.componentName" (list . "imagecache-ca")) | quote) ($ns | quote) | quote }}
{{- end }}
  validations:
    - expression: "variables.installer || variables.kube || variables.controllerOwn || variables.controllerMetadata{{ if include "koinon.imageCache" . }} || variables.caStamp{{ end }}"
      messageExpression: "'only the installer may write ' + request.resource.resource + ' in the Substrate namespace, not ' + request.userInfo.username"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $objects }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $objects }}
  validationActions: {{ toJson $w.validationActions }}
  matchResources:
    namespaceSelector:
      matchExpressions:
        - {key: kubernetes.io/metadata.name, operator: In, values: {{ toJson (list $ns $wns) }}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $netpol }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [networkpolicies]
  variables:
    - name: installer
      expression: {{ printf "request.userInfo.username in %s || request.userInfo.groups.exists(g, g in %s)" (toJson $w.installerIdentities) (toJson $w.installerGroups) | quote }}
    - name: controller
      expression: {{ printf "request.userInfo.username in %s" (toJson $controllers) | quote }}
    # Kubernetes' own controllers: the garbage collector removes an owned policy and the namespace controller empties a
    # namespace that is being deleted. They never write a spec.
    - name: kube
      expression: {{ printf "request.userInfo.username in %s" (toJson (list "system:serviceaccount:kube-system:generic-garbage-collector" "system:serviceaccount:kube-system:namespace-controller" "system:kube-controller-manager")) | quote }}
    - name: specUnchanged
      expression: "request.operation == 'UPDATE' && object.spec == oldObject.spec"
    # The policy of the chart is the floor of the namespace: the controller does not write or delete it.
    - name: chartPolicy
      expression: {{ printf "request.name == %s" (printf "%s-substrate-workers" (include "koinon.fullname" .) | toJson) | quote }}
  validations:
    - expression: "variables.installer || variables.controller || (variables.kube && (request.operation == 'DELETE' || variables.specUnchanged))"
      messageExpression: "'only the installer and the Substrate controller may ' + (request.operation == 'DELETE' ? 'delete' : 'write') + ' a NetworkPolicy in the worker namespace, not ' + request.userInfo.username"
    - expression: "variables.installer || !variables.controller || !variables.chartPolicy"
      message: the Substrate controller must not write or delete the NetworkPolicy of the chart in the worker namespace
    # The controller's policies reach the control-plane namespace and DNS only. An egress rule without `to` allows every
    # destination, so it is denied.
    - expression: >-
        variables.installer || !variables.controller || request.operation == 'DELETE' ||
        !has(object.spec.egress) || object.spec.egress.all(r, has(r.to) && size(r.to) > 0 && r.to.all(p,
          !has(p.ipBlock) && has(p.namespaceSelector) &&
          (!has(p.namespaceSelector.matchExpressions) || size(p.namespaceSelector.matchExpressions) == 0) &&
          has(p.namespaceSelector.matchLabels) && size(p.namespaceSelector.matchLabels) == 1 &&
          'kubernetes.io/metadata.name' in p.namespaceSelector.matchLabels &&
          (p.namespaceSelector.matchLabels['kubernetes.io/metadata.name'] == {{ toJson $ns }} ||
            (p.namespaceSelector.matchLabels['kubernetes.io/metadata.name'] == 'kube-system' &&
             has(r.ports) && size(r.ports) > 0 && r.ports.all(q, has(q.port) && q.port == 53 && !has(q.endPort))))))
      message: {{ printf "a NetworkPolicy of the Substrate controller in the worker namespace may allow egress only to namespace %s and to DNS (kube-system, port 53): no ipBlock, no pod in the worker namespace, no empty rule" $ns | quote }}
    # Ingress adds up too: a listener in a worker that any host can reach is a way out past default-deny egress. The controller's
    # policies admit ingress only from the control-plane namespace and Koinon's namespace, like the policy of the chart.
    - expression: >-
        variables.installer || !variables.controller || request.operation == 'DELETE' ||
        !has(object.spec.ingress) || object.spec.ingress.all(r, has(r.from) && size(r.from) > 0 && r.from.all(p,
          !has(p.ipBlock) && has(p.namespaceSelector) &&
          (!has(p.namespaceSelector.matchExpressions) || size(p.namespaceSelector.matchExpressions) == 0) &&
          has(p.namespaceSelector.matchLabels) && size(p.namespaceSelector.matchLabels) == 1 &&
          'kubernetes.io/metadata.name' in p.namespaceSelector.matchLabels &&
          p.namespaceSelector.matchLabels['kubernetes.io/metadata.name'] in {{ toJson (list $ns .Release.Namespace) }}))
      message: {{ printf "a NetworkPolicy of the Substrate controller in the worker namespace may admit ingress only from namespaces %s and %s: no ipBlock, no empty rule" $ns .Release.Namespace | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $netpol }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $netpol }}
  validationActions: {{ toJson $w.validationActions }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $wns | quote }}
{{- end }}
