{{- /*
Least-privilege RBAC. agentd, gateway and the migration Job get no Kubernetes API access.
The API gets, in this namespace: list and watch on Secrets, to import the labelled declarative
Secrets (koinon.dev/secret-type, plan item PV1, ADR 0056) - the verbs cannot be limited by label, so
the API can read every Secret here, as it already could by name; get and delete, to move the
connection Secrets of earlier versions into the secret store; create, to make the KEK Secret on
its first start (create cannot be limited by name); update on the KEK Secret by name, for
"koinon-api keys" (add, activate, retire); create on Events, to report invalid declarative
Secrets; and delete on Secrets only while secrets.migrateLegacyConnections is set, to remove a
legacy connection Secret after its fields were moved.
The reconciler gets what it renders:
- patch on the standalone agentgateway ConfigMap (by name; standalone.ConfigMapDeliverer sends a
  merge patch and never reads it) and the per-agent key Secrets (plan items G1, R2) in this
  namespace; Secrets have no list or watch, so it can only reach names it already knows (they are
  recorded in Postgres);
- the same Secret verbs write the provider keys Secret (koinon-gateway-providers, plan item PV1);
- in kubernetes mode (plan item G2), in this namespace only: create, patch, get, list and delete on the
  Gateway API and agentgateway objects it renders (Gateway, HTTPRoute, AgentgatewayModel, -Policy,
  -Backend, -Parameters) and on ConfigMaps (the per-org key lists and the model catalog; create and list
  cannot be limited by name, so it can reach every ConfigMap here), and list on Events, to read the
  controller's NACK warnings. It never reads or writes objects of other namespaces, and its apply and
  prune only touch objects that carry its labels;
- read and delete on Agent Sandbox objects cluster-wide, to garbage-collect sandboxes the OpenShell
  gateway no longer lists (ADR 0048 finding 1.8).
Sandboxes, workspaces, providers and policies go through the OpenShell gateway, not this API.
*/ -}}
{{- $api := include "koinon.componentName" (list . "api") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $api }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create]
  {{- if .Values.secrets.migrateLegacyConnections }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [delete]
  {{- end }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "koinon.kekSecretName" . }}]
    verbs: [update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $api }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $api }}
subjects:
  - kind: ServiceAccount
    name: {{ $api }}
    namespace: {{ .Release.Namespace }}
---
{{- $name := include "koinon.componentName" (list . "reconciler") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "reconciler") | nindent 4 }}
rules:
  {{- if eq .Values.gateway.mode "standalone" }}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "koinon.gatewayConfigName" . }}]
    verbs: [patch]
  {{- end }}
  {{- if eq .Values.gateway.mode "kubernetes" }}
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [agentgateway.dev]
    resources: [agentgatewaybackends, agentgatewaymodels, agentgatewayparameters, agentgatewaypolicies]
    verbs: [get, list, create, patch, delete]
  {{- end }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "reconciler") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" .Release.Namespace $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "koinon.labels" (list . "reconciler") | nindent 4 }}
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" .Release.Namespace $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "koinon.labels" (list . "reconciler") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" .Release.Namespace $name | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
