{{- /*
Least-privilege RBAC. agentd, gateway and the migration Job get no Kubernetes API access.
The API gets, in this namespace: list and watch on Secrets, to import the labelled declarative
Secrets (koinon.dev/secret-type, plan item PV1, ADR 0056) - the verbs cannot be limited by label, so
the API can read every Secret here, as it already could by name; get and delete, to move the
connection Secrets of earlier versions into the secret store and remove them; update on the KEK
Secret by name, for "koinon-api keys" (add, activate, retire); and create on Events, to report
invalid declarative Secrets.
The reconciler gets what it renders:
- patch on the standalone agentgateway ConfigMap (by name; standalone.ConfigMapDeliverer sends a
  merge patch and never reads it) and the per-agent key Secrets (plan items G1, R2) in this
  namespace; Secrets have no list or watch, so it can only reach names it already knows (they are
  recorded in Postgres);
- the same Secret verbs write the provider keys Secret (koinon-gateway-providers, plan item PV1);
- read and delete on Agent Sandbox objects cluster-wide, to garbage-collect sandboxes the OpenShell
  gateway no longer lists (ADR 0048 finding 1.8).
Sandboxes, workspaces, providers and policies go through the OpenShell gateway, not this API.
*/ -}}
{{- $api := include "koinon.componentName" (list . "api") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $api }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "koinon.kekSecretName" . }}]
    verbs: [update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $api }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $api }}
subjects:
  - kind: ServiceAccount
    name: {{ $api }}
    namespace: {{ .Release.Namespace }}
---
{{- $name := include "koinon.componentName" (list . "reconciler") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "reconciler") | nindent 4 }}
rules:
  {{- if eq .Values.gateway.mode "standalone" }}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "koinon.gatewayConfigName" . }}]
    verbs: [patch]
  {{- end }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "reconciler") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" .Release.Namespace $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "koinon.labels" (list . "reconciler") | nindent 4 }}
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" .Release.Namespace $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "koinon.labels" (list . "reconciler") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" .Release.Namespace $name | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
