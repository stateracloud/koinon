{{- /*
Least-privilege RBAC. agentd, gateway and the migration Job get no Kubernetes API access.
The API gets, in this namespace: list and watch on Secrets, to import the labelled declarative
Secrets (koinon.dev/secret-type, plan item PV1, ADR 0056) - the verbs cannot be limited by label, so
the API can read every Secret here, as it already could by name; get and delete, to move the
connection Secrets of earlier versions into the secret store; create, to make the KEK Secret on
its first start (create cannot be limited by name); update on the KEK Secret by name, for
"koinon-api keys" (add, activate, retire); create on Events, to report invalid declarative
Secrets; and delete on Secrets only while secrets.migrateLegacyConnections is set, to remove a
legacy connection Secret after its fields were moved.
The reconciler gets what it renders:
- on the standalone agentgateway ConfigMap: patch by name, and create (the chart does not render
  the ConfigMap, so that a render never resets it: standalone.ConfigMapDeliverer creates it when
  missing, owned by the gateway Deployment, which it reads by name); create cannot be limited by
  name; and the per-agent key Secrets (plan items G1, R2) in this
  namespace; Secrets have no list or watch, so it can only reach names it already knows (they are
  recorded in Postgres);
- the same Secret verbs write the provider keys Secret (koinon-gateway-providers, plan item PV1);
- in kubernetes mode (plan item G2), in this namespace only: create, patch, get, list and delete on the
  Gateway API and agentgateway objects it renders (Gateway, HTTPRoute, AgentgatewayModel, -Policy,
  -Backend, -Parameters) and on ConfigMaps (the per-org key lists and the model catalog; create and list
  cannot be limited by name, so it can reach every ConfigMap here), and list on Events, to read the
  controller's NACK warnings. It never reads or writes objects of other namespaces, and its apply and
  prune only touch objects that carry its labels.
Nothing in this file is cluster-scoped, and nothing here touches Agent Sandbox objects: sandboxes,
workspaces, providers and policies go through the OpenShell gateway, not the Kubernetes API.
Garbage-collecting orphaned sandboxes is not built; when it is, scope it to the sandbox namespaces
with a Role.
The cluster-scoped grants outside this file are:
- the sandbox observer's (sandboxObserver.enabled, on by default; ADR 0078):
  templates/sandbox-observer.yaml gives the reconciler create on RoleBindings and bind on one
  ClusterRole, fenced by a native ValidatingAdmissionPolicy to OpenShell workspace namespaces, and
  what the RoleBinding grants there is get on pods and Sandboxes;
- the sandbox default-deny NetworkPolicy writer (sandboxNetworkPolicy.enabled, on by default; spike
  8.15, ADR 0045): templates/sandbox-networkpolicy.yaml gives the reconciler create/get/update/patch
  on NetworkPolicies, fenced by a native ValidatingAdmissionPolicy to the fixed default-deny shape
  in this gateway's workspace namespaces. That is the one write the reconciler makes in sandbox
  namespaces (besides the observer RoleBinding).
*/ -}}
{{- $api := include "koinon.componentName" (list . "api") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $api }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create]
  {{- if .Values.secrets.migrateLegacyConnections }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [delete]
  {{- end }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "koinon.kekSecretName" . }}]
    verbs: [update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $api }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $api }}
subjects:
  - kind: ServiceAccount
    name: {{ $api }}
    namespace: {{ .Release.Namespace }}
---
{{- $name := include "koinon.componentName" (list . "reconciler") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "reconciler") | nindent 4 }}
rules:
  {{- if eq .Values.gateway.mode "standalone" }}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "koinon.gatewayConfigName" . }}]
    verbs: [patch]
  # create cannot be limited by resourceNames.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{ include "koinon.componentName" (list . "gateway") }}]
    verbs: [get]
  # The reason agentgateway refused a config is only in its log (ADR 0050): the reconciler reads
  # the gateway pods' logs to report it. pods/log cannot be limited by resourceNames of pods.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  {{- end }}
  {{- if eq .Values.gateway.mode "kubernetes" }}
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [agentgateway.dev]
    resources: [agentgatewaybackends, agentgatewaymodels, agentgatewayparameters, agentgatewaypolicies]
    verbs: [get, list, create, patch, delete]
  {{- end }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "reconciler") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
