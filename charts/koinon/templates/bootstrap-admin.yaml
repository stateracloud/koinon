{{- /*
Bootstrap platform admin (plan item A1): a one-time password generated at install and read back
from the live Secret on upgrade, so it never changes underneath the API. The first login forces a
password change. Rendering without a cluster (helm template, GitOps) cannot read the live Secret
and generates a new password each time: set bootstrapAdmin.existingSecret there, and the chart
renders no Secret.
*/ -}}
{{- if and .Values.bootstrapAdmin.enabled (not .Values.bootstrapAdmin.existingSecret) }}
{{- $name := include "koinon.componentName" (list . "bootstrap-admin") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.bootstrapAdmin.username | quote }}
  password: {{ include "koinon.persistentPassword" (list . $name "password") | quote }}
{{- end }}
