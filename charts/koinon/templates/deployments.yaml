{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /* koinon-api, koinon-reconciler and koinon-agentd. */ -}}
{{- $configHash := include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
{{- range $component := list "api" "reconciler" "agentd" }}
{{- $v := index $.Values $component }}
{{- $name := include "koinon.componentName" (list $ $component) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list $ $component) | nindent 4 }}
  annotations:
    # Argo CD only: after the migration Job (sync wave 1, migrate-job.yaml). Helm and Flux ignore it.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ $v.replicas }}
  {{- if eq $component "agentd" }}
  {{- /* ADR 0085: a rollout starts the new worker before the old one drains, and never lowers the ready count. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      {{- include "koinon.selectorLabels" (list $ $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "koinon.labels" (list $ $component) | nindent 8 }}
      {{- if or (eq $component "reconciler") $v.podAnnotations }}
      annotations:
        {{- if eq $component "reconciler" }}
        {{- /* Only the reconciler reads config.yaml; roll it when the file changes. */}}
        checksum/config: {{ $configHash }}
        {{- end }}
        {{- with $v.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      {{- if eq $component "agentd" }}
      {{- /* The drain on SIGTERM lasts up to drainDeadlineSeconds (ADR 0085); the grace period must outlast it or the kubelet kills the pod mid-drain. */}}
      terminationGracePeriodSeconds: {{ add (int ($.Values.agentd.drainDeadlineSeconds | default 300)) 30 }}
      {{- end }}
      {{- /* The reconciler renders key Secrets; the API imports declarative Secrets and manages the KEK Secret (PV1). */}}
      automountServiceAccountToken: {{ has $component (list "reconciler" "api") }}
      enableServiceLinks: false
      {{- include "koinon.imagePullSecrets" $ | nindent 6 }}
      securityContext:
        {{- include "koinon.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: {{ $component }}
          image: {{ include "koinon.image" (list $ $v.image) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- if eq $component "reconciler" }}
          ports:
            - name: health
              containerPort: 8082
            - name: metrics
              containerPort: {{ $.Values.metrics.port }}
          # Not ready until the key-encryption keys are loaded (koinon-api creates them on its first start).
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          {{- end }}
          {{- if eq $component "api" }}
          args: ["serve", "--addr", ":{{ $v.port }}", "--otlp-addr", ":{{ $v.otlpPort }}", "--tools-addr", ":{{ $v.toolsPort }}", "--saved-work-addr", ":{{ $v.savedWorkPort }}", "--saved-work-secret", "{{ include "koinon.savedWorkSecretName" $ }}", "--guard-addr", ":{{ $v.guardPort }}", "--leak-guard-byte-cap", "{{ int $v.leakGuardByteCap }}"{{ if $v.durable.enabled }}, "--durable"{{ end }}{{ if $.Values.prices.refresh.enabled }}, "--prices-refresh-enabled", "--prices-refresh-interval", "{{ $.Values.prices.refresh.interval }}"{{ end }}]
          ports:
            - name: http
              containerPort: {{ $v.port }}
            - name: otlp
              containerPort: {{ $v.otlpPort }}
            - name: tools
              containerPort: {{ $v.toolsPort }}
            - name: savedwork
              containerPort: {{ $v.savedWorkPort }}
            - name: guard
              containerPort: {{ $v.guardPort }}
            - name: metrics
              containerPort: {{ $.Values.metrics.port }}
          # Until the first migration has run, koinon-api retries its bootstrap without serving;
          # the startup probe keeps the liveness probe from restarting it meanwhile.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 150
          # Not ready while the database schema is outside the goose range this build supports (ADR 0085);
          # liveness stays /healthz so the pod waits instead of restarting.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          {{- end }}
          {{- if eq $component "agentd" }}
          ports:
            - name: health
              containerPort: 8082
            - name: metrics
              containerPort: {{ $.Values.metrics.port }}
          # Not ready while the database schema is outside the goose range this build supports (ADR 0085).
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          {{- end }}
          env:
            # Prometheus /metrics, on its own port (values: metrics).
            - name: KOINON_METRICS_ADDR
              value: {{ printf ":%d" (int $.Values.metrics.port) | quote }}
            {{- if eq $component "reconciler" }}
            {{- include "koinon.configEnv" $ | nindent 12 }}
            {{- end }}
            {{- include "koinon.commonEnv" $ | nindent 12 }}
            {{- include "koinon.dbEnv" (list $ $component) | nindent 12 }}
            {{- if has $component (list "api" "reconciler") }}
            {{- include "koinon.githubEnv" $ | nindent 12 }}
            {{- include "koinon.kekEnv" (dict "root" $ "component" $component) | nindent 12 }}
            {{- with include "koinon.providerEnv" $ | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- if eq $component "api" }}
            {{- include "koinon.apiEnv" $ | trim | nindent 12 }}
            {{- end }}
            {{- if eq $component "agentd" }}
            {{- include "koinon.agentdEnv" $ | nindent 12 }}
            {{- end }}
          securityContext:
            {{- include "koinon.containerSecurityContext" $ | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            {{- if eq $component "reconciler" }}
            {{- include "koinon.configVolumeMount" $ | nindent 12 }}
            {{- end }}
            {{- include "koinon.dbVolumeMount" $ | nindent 12 }}
            {{- if eq $component "reconciler" }}
            {{- include "koinon.kekVolumeMount" $ | nindent 12 }}
            {{- end }}
            {{- if has $component (list "api" "reconciler") }}
            {{- with include "koinon.kmsVolumeMount" $ | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- if eq $component "agentd" }}
            {{- include "koinon.otlpTokenVolumeMount" $ | nindent 12 }}
            {{- include "koinon.savedWorkVolumeMount" $ | nindent 12 }}
            {{- if $.Values.checkpoints.enabled }}
            - name: checkpoints
              mountPath: /var/lib/koinon/checkpoints
            {{- end }}
            {{- end }}
            {{- if ne $component "api" }}
            {{- include "koinon.openshellVolumeMount" $ | nindent 12 }}
            {{- else }}
            {{- with include "koinon.apiSecretVolumeMounts" $ | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if eq $component "reconciler" }}
        {{- include "koinon.configVolume" $ | nindent 8 }}
        {{- end }}
        {{- include "koinon.dbVolume" $ | nindent 8 }}
        {{- if eq $component "reconciler" }}
        {{- include "koinon.kekVolume" $ | nindent 8 }}
        {{- end }}
        {{- if has $component (list "api" "reconciler") }}
        {{- with include "koinon.kmsVolume" $ | trim }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if eq $component "agentd" }}
        {{- include "koinon.otlpTokenVolume" $ | nindent 8 }}
        {{- include "koinon.savedWorkVolume" $ | nindent 8 }}
        {{- if $.Values.checkpoints.enabled }}
        - name: checkpoints
          emptyDir:
            sizeLimit: {{ $.Values.checkpoints.scratchSize | quote }}
        {{- end }}
        {{- end }}
        {{- if ne $component "api" }}
        {{- include "koinon.openshellVolume" $ | nindent 8 }}
        {{- else }}
        {{- with include "koinon.apiSecretVolumes" $ | trim }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "koinon.componentName" (list . "api") }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
spec:
  selector:
    {{- include "koinon.selectorLabels" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
    - name: otlp
      port: {{ .Values.api.otlpPort }}
      targetPort: otlp
---
# The GitHub tools MCP server, for agentgateway only (see networkpolicy.yaml). A Service of its own
# keeps it off the API Service, which the ingress exposes.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "koinon.componentName" (list . "api-tools") }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
spec:
  selector:
    {{- include "koinon.selectorLabels" (list . "api") | nindent 4 }}
  ports:
    - name: tools
      port: {{ .Values.api.toolsPort }}
      targetPort: tools
---
# The MCP leak guard (ADR 0091), for agentgateway only (see networkpolicy.yaml): the reconciler renders
# its address into every org MCP route's mcpGuardrails (failClosed).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "koinon.componentName" (list . "api-guard") }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
spec:
  selector:
    {{- include "koinon.selectorLabels" (list . "api") | nindent 4 }}
  ports:
    - name: guard
      port: {{ .Values.api.guardPort }}
      targetPort: guard
      appProtocol: kubernetes.io/h2c
---
# Saved work from a stuck sandbox, for koinon-agentd only (ADR 0054; see networkpolicy.yaml). Its own
# Service and port keep it apart from the tools, which trust agentgateway's agent header.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "koinon.componentName" (list . "api-saved-work") }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
spec:
  selector:
    {{- include "koinon.selectorLabels" (list . "api") | nindent 4 }}
  ports:
    - name: savedwork
      port: {{ .Values.api.savedWorkPort }}
      targetPort: savedwork
