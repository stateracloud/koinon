{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
LimitRange for OpenShell sandbox namespaces (#76, ADR 0083 follow-up).

OpenShell cannot size the os-supervisor-* pod or its init containers (upstream
NVIDIA/OpenShell #3930 and #3415). They stay BestEffort and are the first evicted
under memory pressure. Every pod in an OpenShell workspace namespace is OpenShell's,
so a reconciler-owned LimitRange (defaultRequest 50m/64Mi, default 250m/256Mi for
type Container, which also covers init containers) is the portable fix.

On by default (sandboxLimitRange.enabled). The chart does not install LimitRanges
into workspace namespaces itself (they are created later by OpenShell): the
reconciler applies one named <namespace>-<fullname>-sandbox-limitrange in each
workspace namespace of openshell.gatewayId.

Cluster-scoped objects, all prefixed <namespace>-<fullname> like the sandbox policies:
- a ClusterRole that lets the reconciler create, get, update and patch LimitRanges;
- a ClusterRoleBinding of that role to the reconciler;
- a native ValidatingAdmissionPolicy (never Kyverno) that bounds the grant: the
  reconciler may write a LimitRange only in a sandbox namespace of this gateway,
  with the fixed name and the sized shape. Nobody else may write that name
  in a sandbox namespace. failurePolicy Fail.

sandboxLimitRange.enabled=false renders none of it and the reconciler applies nothing.
sandboxPolicy.enabled and validationActions including Deny are required when this is on
(koinon.sandboxLimitRange checks in _helpers.tpl): without Deny the ClusterRole grant
is only Warn/Audit-fenced.
*/ -}}
{{- if .Values.sandboxLimitRange.enabled }}
{{- $name := include "koinon.sandboxLimitRange" . }}
{{- $writer := printf "%s-writer" $name }}
{{- $policy := printf "%s-binding" $name }}
{{- $sa := include "koinon.componentName" (list . "reconciler") }}
{{- $user := printf "system:serviceaccount:%s:%s" .Release.Namespace $sa }}
{{- $gatewayID := .Values.openshell.gatewayId }}
{{- $sel := .Values.sandboxPolicy.namespaceSelector }}
{{- $conds := list }}
{{- range $k, $v := ($sel.matchLabels | default dict) }}
{{- $conds = append $conds (printf "(%s in variables.labels && variables.labels[%s] == %s)" ($k | quote) ($k | quote) ($v | quote)) }}
{{- end }}
{{- range ($sel.matchExpressions | default list) }}
{{- $k := .key | quote }}
{{- if eq .operator "In" }}
{{- $conds = append $conds (printf "(%s in variables.labels && variables.labels[%s] in %s)" $k $k (.values | toJson)) }}
{{- else if eq .operator "NotIn" }}
{{- $conds = append $conds (printf "(!(%s in variables.labels) || !(variables.labels[%s] in %s))" $k $k (.values | toJson)) }}
{{- else if eq .operator "Exists" }}
{{- $conds = append $conds (printf "(%s in variables.labels)" $k) }}
{{- else if eq .operator "DoesNotExist" }}
{{- $conds = append $conds (printf "(!(%s in variables.labels))" $k) }}
{{- else }}
{{- fail (printf "sandboxPolicy.namespaceSelector.matchExpressions: operator %q is not supported by the sandbox LimitRange writer policy (In, NotIn, Exists, DoesNotExist)" .operator) }}
{{- end }}
{{- end }}
{{- if not $conds }}
{{- fail "sandboxPolicy.namespaceSelector selects nothing: the sandbox LimitRange writer policy needs it to say which namespaces are sandbox namespaces" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $writer }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [limitranges]
    verbs: [create, get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $writer }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $writer }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policy }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [limitranges]
  matchConditions:
    - name: reconciler-or-sandbox-limitrange
      expression: >-
        request.userInfo.username == {{ $user | quote }} || object.metadata.name == {{ $name | quote }}
  variables:
    - name: reconciler
      expression: {{ printf "request.userInfo.username == %s" ($user | quote) | quote }}
    - name: labels
      expression: "has(namespaceObject.metadata.labels) ? namespaceObject.metadata.labels : {'koinon.dev/none': ''}"
    - name: sandboxNamespace
      expression: {{ join " && " $conds | quote }}
    - name: ourGateway
      expression: >-
        variables.sandboxNamespace && 'openshell.ai/gateway-id' in variables.labels &&
        variables.labels['openshell.ai/gateway-id'] == {{ $gatewayID | quote }} &&
        'openshell.ai/sandbox-workspace' in variables.labels &&
        namespaceObject.metadata.name.startsWith({{ printf "openshell-%s-" $gatewayID | quote }}) &&
        namespaceObject.metadata.name != {{ .Release.Namespace | quote }}
    - name: sized
      expression: >-
        has(object.spec.limits) && size(object.spec.limits) == 1 &&
        object.spec.limits[0].type == 'Container' &&
        has(object.spec.limits[0].defaultRequest) && size(object.spec.limits[0].defaultRequest) == 2 &&
        'cpu' in object.spec.limits[0].defaultRequest && 'memory' in object.spec.limits[0].defaultRequest &&
        string(object.spec.limits[0].defaultRequest['cpu']) == '50m' &&
        string(object.spec.limits[0].defaultRequest['memory']) == '64Mi' &&
        has(object.spec.limits[0].default) && size(object.spec.limits[0].default) == 2 &&
        'cpu' in object.spec.limits[0].default && 'memory' in object.spec.limits[0].default &&
        string(object.spec.limits[0].default['cpu']) == '250m' &&
        string(object.spec.limits[0].default['memory']) == '256Mi' &&
        (!has(object.spec.limits[0].min) || size(object.spec.limits[0].min) == 0) &&
        (!has(object.spec.limits[0].max) || size(object.spec.limits[0].max) == 0) &&
        (!has(object.spec.limits[0].maxLimitRequestRatio) || size(object.spec.limits[0].maxLimitRequestRatio) == 0)
  validations:
    - expression: "variables.reconciler || !variables.sandboxNamespace"
      reason: Forbidden
      messageExpression: "'only the Koinon reconciler may write the sandbox LimitRange in sandbox namespaces, not ' + request.userInfo.username"
    - expression: "!variables.reconciler || variables.ourGateway"
      reason: Forbidden
      message: {{ printf "the sandbox LimitRange may be written only in OpenShell workspace namespaces of gateway %s" $gatewayID | quote }}
    - expression: {{ printf "!variables.reconciler || object.metadata.name == %s" ($name | quote) | quote }}
      reason: Forbidden
      message: {{ printf "the sandbox LimitRange must be named %s" $name | quote }}
    - expression: "!variables.reconciler || variables.sized"
      reason: Forbidden
      message: "the sandbox LimitRange must set Container defaults to 50m/64Mi requests and 250m/256Mi limits"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policy }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $policy }}
  validationActions: {{ toJson .Values.sandboxPolicy.validationActions }}
{{- end }}
