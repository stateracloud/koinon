{{- /*
Grafana dashboards (metrics.grafanaDashboard.enabled), as a ConfigMap that the Grafana dashboard
sidecar loads (it selects ConfigMaps by the label in metrics.grafanaDashboard.labels). Off by
default. One file per dashboard in dashboards/. Every query uses only the fixed label sets of
ADR 0023. hack/dashboard-metrics-check.sh keeps the metric names in step with the code.
*/ -}}
{{- if .Values.metrics.grafanaDashboard.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "koinon.componentName" (list . "dashboards") }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
    {{- with .Values.metrics.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  koinon-leak-guard.json: |-
    {{- .Files.Get "dashboards/leak-guard.json" | nindent 4 }}
{{- end }}
