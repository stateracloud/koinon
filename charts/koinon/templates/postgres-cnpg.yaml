{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
postgres.mode=cnpg: a CloudNativePG Cluster with least-privilege roles (ADR 0003):
- koinon_migrate owns the database and its schema and runs the migrations;
- koinon_app (NOLOGIN) receives DML on everything koinon_migrate creates;
- koinon_api, koinon_reconciler and koinon_agentd log in and inherit koinon_app.
The role Secrets are not rendered: the ensure-secrets hook Job creates the missing ones with a
random password, or postgres.cnpg.existingSecrets names your own (templates/ensure-secrets.yaml). TLS is required for every TCP connection;
clients verify the server against the cluster CA.
*/ -}}
{{- if eq .Values.postgres.mode "cnpg" }}
{{- $cluster := include "koinon.pgCluster" . }}
{{- $db := .Values.postgres.cnpg.database }}
{{- $migrate := include "koinon.pgRole" "migrate" }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "koinon.labels" (list . "postgres") | nindent 4 }}
spec:
  instances: {{ .Values.postgres.cnpg.instances }}
  imageName: {{ include "koinon.imageRef" (list . .Values.postgres.cnpg.imageName) }}
  {{- with include "koinon.imagePullSecrets" . }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- with .Values.postgres.cnpg.nodeMaintenanceWindow }}
  nodeMaintenanceWindow:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  enableSuperuserAccess: false
  postgresql:
    pg_hba:
      - hostnossl all all all reject
      - hostssl all all all scram-sha-256
  bootstrap:
    initdb:
      database: {{ $db }}
      owner: {{ $migrate }}
      secret:
        name: {{ include "koinon.pgSecret" (list . "migrate") }}
      postInitApplicationSQL:
        - CREATE ROLE koinon_app NOLOGIN
        # The only role that may insert install audit events (ADR 0100 decision 1.1a). Migration 00066
        # grants it INSERT; only koinon-api's login role is a member, below.
        - CREATE ROLE koinon_install_audit_writer NOLOGIN
        - GRANT CONNECT ON DATABASE {{ $db }} TO koinon_app
        - GRANT USAGE ON SCHEMA public TO koinon_app
        - ALTER DEFAULT PRIVILEGES FOR ROLE {{ $migrate }} IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO koinon_app
        - ALTER DEFAULT PRIVILEGES FOR ROLE {{ $migrate }} IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO koinon_app
        - ALTER DEFAULT PRIVILEGES FOR ROLE {{ $migrate }} IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO koinon_app
  managed:
    roles:
      {{- range $role := list "api" "reconciler" "agentd" }}
      - name: {{ include "koinon.pgRole" $role }}
        ensure: present
        login: true
        inherit: true
        {{- /* Both group roles exist before CNPG reconciles managed roles (postInitApplicationSQL), so
               membership never waits on a migration; the migration grants the groups their table privileges. */}}
        inRoles: [koinon_app{{ if eq $role "api" }}, koinon_install_audit_writer{{ end }}]
        passwordSecret:
          name: {{ include "koinon.pgSecret" (list $ $role) }}
      {{- end }}
  storage:
    size: {{ .Values.postgres.cnpg.storage.size }}
    {{- with .Values.postgres.cnpg.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- with .Values.postgres.cnpg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
