{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
goose migrations ("koinon-api migrate") as a Helm hook, run with the migration role, which owns the
schema; the component roles only get DML. Migrations are forward-only (ADR 0027), so they run
before an upgrade rolls the Deployments.

In external mode the database exists before the release: pre-install,pre-upgrade. In cnpg mode the
release creates the database, so a post-install hook would deadlock `helm install --wait`: Helm
runs post-install hooks only once every resource is ready, and koinon-api cannot be ready before
the schema exists. So on install in cnpg mode the Job is an ordinary release resource, named
<fullname>-migrate-install so that it never collides with the pre-upgrade hook of later upgrades,
which drops it from the release. It waits for the database; until it finishes, components retry
their connection.

Argo CD renders with `helm template`, where .Release.IsInstall is always true, so under Argo the
cnpg Job is always this ordinary resource, and an ordinary Job cannot take a new image: its spec is
immutable, and nothing orders it before the new pods. So the Job also carries Argo CD hook
annotations (ADR 0060): `argocd.argoproj.io/hook: Sync` runs it in the Sync phase, and with
`BeforeHookCreation` Argo deletes the previous run and creates a fresh Job on every sync, so each
new image migrates. Sync wave "1" puts it after wave 0 (the CNPG Cluster, which Argo waits to be
healthy before the next wave, the ServiceAccount, NetworkPolicies) and before the koinon
Deployments in wave "2" (deployments.yaml). The migration is idempotent (goose Up), so rerunning it
on every sync is harmless. Plain Helm and Flux's helm-controller ignore the argocd.argoproj.io/*
annotations and keep using the Helm hooks and the ordinary install Job.
*/ -}}
{{- $name := include "koinon.componentName" (list . "migrate") }}
{{- $hook := "pre-install,pre-upgrade" }}
{{- $asResource := false }}
{{- if eq .Values.postgres.mode "cnpg" }}
{{- if .Release.IsInstall }}
{{- $asResource = true }}
{{- $name = include "koinon.componentName" (list . "migrate-install") }}
{{- else }}
{{- $hook = "pre-upgrade" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "migrate") | nindent 4 }}
  {{- if not $asResource }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "migrate") | nindent 4 }}
  {{- if not $asResource }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- else }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "koinon.labels" (list . "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- include "koinon.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "koinon.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "koinon.image" (list . .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /* External database: the operator creates the install audit writer role before the
          upgrade and no hook creates it later, so a missing role fails the Job with the remedy
          (ADR 0100 decision 1.1a), checked before any migration; with postgres.external.apiRole also
          koinon-api's membership in it. In cnpg mode the post-upgrade grant hook waits for it. */}}
          args: ["migrate", "--wait", {{ .Values.migrations.wait | quote }}{{ if .Values.api.durable.enabled }}, "--durable"{{ end }}{{ if ne .Values.postgres.mode "cnpg" }}, "--require-install-writer"{{ with .Values.postgres.external.apiRole }}, "--install-writer-member", {{ . | quote }}{{ end }}{{ end }}]
          env:
            {{- include "koinon.dbEnv" (list . "migrate") | nindent 12 }}
          securityContext:
            {{- include "koinon.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            {{- include "koinon.dbVolumeMount" . | nindent 12 }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "koinon.dbVolume" . | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
