{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
gateway.mode=standalone: agentgateway v1.6.0 without CRDs or controller (ADR 0048). One replica,
because the budget store is SQLite on a PVC.

The config ConfigMap belongs to the reconciler (plan item G1), which rewrites it with per-agent key
hashes, budgets and MCP routes; agentgateway hot-reloads it. The chart writes a bootstrap config
(the model upstream from values, no keys, so every request is refused) on install only. On upgrade
it renders the live data unchanged, so it never undoes the reconciler's work.
*/ -}}
{{- if eq .Values.gateway.mode "standalone" }}
{{- $name := include "koinon.componentName" (list . "gateway") }}
{{- $cmName := include "koinon.gatewayConfigName" . }}
{{- $gw := .Values.gateway.standalone }}
{{- $keyDir := "/secrets/model" }}
{{- $existing := lookup "v1" "ConfigMap" .Release.Namespace $cmName }}
{{- $config := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "config.yaml") }}
{{- $config = index $existing.data "config.yaml" }}
{{- else }}
{{- $models := list }}
{{- $catalog := dict }}
{{- /* Only priced models are served, as in the reconciler's config (ADR 0041). */ -}}
{{- range $model := .Values.model.models }}
{{- if $model.rates }}
{{- $params := dict "baseUrl" (required "model.baseUrl is required when model.models is set" $.Values.model.baseUrl) }}
{{- if $.Values.model.apiKeySecret.name }}
{{- $_ := set $params "apiKey" (dict "file" (printf "%s/%s" $keyDir $.Values.model.apiKeySecret.key)) }}
{{- end }}
{{- $m := dict "name" $model.name "provider" (dict "custom" (dict "providerOverride" $.Values.model.provider "formats" (list (dict "type" "completions")))) "params" $params }}
{{- with $model.overrides }}
{{- $_ := set $m "overrides" . }}
{{- end }}
{{- $models = append $models $m }}
{{- $_ := set $catalog $model.name (dict "rates" $model.rates) }}
{{- end }}
{{- end }}
{{- /*
Same document as internal/gateway/standalone renders for the same models and no keys, for the
fixed revision "bootstrap" (standalone.BootstrapRevision) instead of a content hash
(internal/gateway/standalone/chart_test.go compares them): agentgateway keeps the static `config`
section of the file it started with, and refuses to reload a file with frontendPolicies.accessLog
while that section has the deprecated config.logging.fields, so the access-log fields go in
frontendPolicies. The admin listener (config dump and UI) stays on localhost; the reconciler
detects reloads with each revision's probe key on the llm listener (standalone.ReloadProbeKey).
*/ -}}
{{- $revision := "bootstrap" }}
{{- $base := dict "database" (dict "url" "sqlite:///data/agentgateway.db?mode=rwc") "adminAddr" "localhost:15000" "statsAddr" "[::]:15020" "readinessAddr" "[::]:15021" "logging" (dict "format" "json") }}
{{- $otlp := dict "host" (printf "%s.%s.svc:%v" (include "koinon.componentName" (list . "api")) .Release.Namespace .Values.api.otlpPort) "protocol" "http" }}
{{- $accessLog := dict "add" (dict "koinon.key" "default(apiKey.name, \"\")" "koinon.agent" "default(apiKey.agent, \"\")" "koinon.request" "uuid()" "koinon.config" (quote $revision)) "otlp" $otlp }}
{{- if $catalog }}
{{- $_ := set $base "modelCatalog" (list (dict "inline" (dict "providers" (dict $.Values.model.provider (dict "models" $catalog))))) }}
{{- end }}
{{- /* The reload probe key, refused before routing by the authorization rule and its zero budget. */ -}}
{{- $probeBudget := dict "name" "koinon-reload-probe" "limit" (dict "unit" "Tokens" "amount" 0) "window" (dict "rolling" "24h") "onBudgetExceeded" "Block" }}
{{- $probe := dict "keyHash" (printf "sha256:%s" (sha256sum (printf "koinon-probe-%s" $revision))) "metadata" (dict "name" "koinon-reload-probe" "agent" "") "budgets" (list $probeBudget) }}
{{- $apiKey := dict "mode" "strict" "location" (dict "header" (dict "name" "authorization" "prefix" "Bearer ")) "keys" (list $probe) }}
{{- $authorization := dict "rules" (list "apiKey.name != \"koinon-reload-probe\"") }}
{{- $doc := dict "config" $base "frontendPolicies" (dict "accessLog" $accessLog) "gateways" (dict "default" (dict "port" (int $gw.port))) }}
{{- $_ := set $doc "llm" (dict "policies" (dict "apiKey" $apiKey "authorization" $authorization) "models" $models) }}
{{- $config = printf "# Bootstrap config written by the Koinon chart; the reconciler owns this ConfigMap.\n%s" (toYaml $doc) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cmName }}
  labels:
    {{- include "koinon.labels" (list . "gateway") | nindent 4 }}
    koinon.dev/owner: reconciler
data:
  config.yaml: |
    {{- $config | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "koinon.labels" (list . "gateway") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $gw.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $gw.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "gateway") | nindent 4 }}
spec:
  # SQLite budget store: exactly one replica, and the old pod stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "koinon.selectorLabels" (list . "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "koinon.labels" (list . "gateway") | nindent 8 }}
      {{- with $gw.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "koinon.podSecurityContext" . | nindent 8 }}
      containers:
        - name: agentgateway
          image: {{ printf "%s:%s" $gw.image.repository $gw.image.tag }}{{ with $gw.image.digest }}@{{ . }}{{ end }}
          imagePullPolicy: IfNotPresent
          args: ["-f", "/config/config.yaml"]
          ports:
            - name: llm
              containerPort: {{ $gw.port }}
            - name: stats
              containerPort: 15020
            - name: readiness
              containerPort: 15021
          readinessProbe:
            httpGet: {path: /healthz/ready, port: readiness}
          securityContext:
            {{- include "koinon.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $gw.resources | nindent 12 }}
          volumeMounts:
            # A directory mount (not subPath), so ConfigMap updates reach the hot reload.
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.model.apiKeySecret.name }}
            - name: model-key
              mountPath: {{ $keyDir }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $cmName }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.model.apiKeySecret.name }}
        - name: model-key
          secret:
            secretName: {{ .Values.model.apiKeySecret.name }}
            items:
              - key: {{ .Values.model.apiKeySecret.key }}
                path: {{ .Values.model.apiKeySecret.key }}
        {{- end }}
      {{- with $gw.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gw.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gw.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "gateway") | nindent 4 }}
spec:
  selector:
    {{- include "koinon.selectorLabels" (list . "gateway") | nindent 4 }}
  ports:
    - name: llm
      port: {{ $gw.port }}
      targetPort: llm
    # agentgateway_config_synchronized: the reconciler reads it to detect a rejected config.
    - name: stats
      port: 15020
      targetPort: stats
{{- end }}
