{{- /*
gateway.mode=standalone: agentgateway v1.7.0 without CRDs or controller (ADR 0048). One replica,
because the budget store is SQLite on a PVC.

The config ConfigMap (koinon.gatewayConfigName) is not rendered. The reconciler (plan item G1)
creates it when it is missing, with an ownerReference to the Deployment below, and rewrites it with
per-agent key hashes, budgets and MCP routes; agentgateway hot-reloads it. Rendering it here would
reset it on every render that cannot read the live object (helm template, Argo CD, Flux), and all
agent traffic would be refused until the next reconcile. The pod below waits (ContainerCreating)
until the ConfigMap exists.

Held install (restoreHold=true, ADR 0107, issue #530): the reconciler converges nothing, so it writes no
config and the pod above could never start. The chart then renders a second, fixed ConfigMap
(koinon.gatewayHeldConfigName) with a deny-all config and the Deployment mounts that one. The gateway
turns ready (helm --wait and GitOps health checks finish) and refuses every request. Releasing the hold
is the rollout that mounts the reconciler's ConfigMap again; the chart stops rendering the held one.
The two never share a name, so the reconciler's ConfigMap (and its ownership) is never touched.

MCP sessions: agentgateway v1.7 always encrypts MCP session IDs. SESSION_KEY comes from a Secret the
ensure-secrets hook Job generates (a template cannot: a random value changes on every render), as an
env var so it stays out of the config ConfigMap. A fixed key keeps sessions valid across restarts.
*/ -}}
{{- if eq .Values.gateway.mode "standalone" }}
{{- $name := include "koinon.componentName" (list . "gateway") }}
{{- $gw := .Values.gateway.standalone }}
{{- if .Values.restoreHold }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "koinon.gatewayHeldConfigName" . }}
  labels:
    {{- include "koinon.labels" (list . "gateway") | nindent 4 }}
data:
  config.yaml: |
    # Rendered by the chart while restoreHold is true (ADR 0107, issue #530). Deny-all: the gateway is
    # ready, and refuses every request (no key is valid, and the authorization rule never admits).
    config:
      adminAddr: localhost:15000
      statsAddr: '[::]:15020'
      readinessAddr: '[::]:15021'
      logging:
        format: json
    gateways:
      default:
        port: {{ $gw.port }}
    llm:
      policies:
        apiKey:
          mode: strict
          location:
            header:
              name: authorization
              prefix: 'Bearer '
          keys: []
        authorization:
          rules:
            - "false"
      models: []
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "koinon.gatewayProvidersName" . }}
  labels:
    {{- include "koinon.labels" (list . "gateway") | nindent 4 }}
    koinon.dev/owner: reconciler
# The reconciler fills this Secret with the opened provider keys, one data key per provider
# (plan item PV1). The chart renders no data, so an upgrade leaves what the reconciler wrote.
type: Opaque
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "koinon.labels" (list . "gateway") | nindent 4 }}
  annotations:
    # Argo CD only: with a WaitForFirstConsumer storage class the claim binds once the gateway pod
    # (sync wave 2) is scheduled, so it must not hold up wave 0. Helm and Flux ignore it.
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes: [ReadWriteOnce]
  {{- with $gw.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $gw.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "gateway") | nindent 4 }}
  annotations:
    # Argo CD only: its config ConfigMap is created by koinon-reconciler, so this Deployment cannot
    # become healthy before the reconciler runs, which is in sync wave 2 (after the migration Job).
    # Left in wave 0 it would stall the sync before the migration. Helm and Flux ignore it.
    argocd.argoproj.io/sync-wave: "2"
spec:
  # SQLite budget store: exactly one replica, and the old pod stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "koinon.selectorLabels" (list . "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "koinon.labels" (list . "gateway") | nindent 8 }}
      {{- with $gw.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with include "koinon.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "koinon.podSecurityContext" . | nindent 8 }}
      containers:
        - name: agentgateway
          image: {{ include "koinon.imageRef" (list . (printf "%s:%s%s" $gw.image.repository $gw.image.tag (ternary (printf "@%s" $gw.image.digest) "" (not (empty $gw.image.digest))))) }}
          imagePullPolicy: IfNotPresent
          args: ["-f", "/config/config.yaml"]
          env:
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "koinon.gatewaySessionKeyName" . }}
                  key: key
          ports:
            - name: llm
              containerPort: {{ $gw.port }}
            - name: stats
              containerPort: 15020
            - name: readiness
              containerPort: 15021
          readinessProbe:
            httpGet: {path: /healthz/ready, port: readiness}
          securityContext:
            {{- include "koinon.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $gw.resources | nindent 12 }}
          volumeMounts:
            # A directory mount (not subPath), so ConfigMap updates reach the hot reload.
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            # Provider keys, as files in a directory (not subPath): kubelet updates the Secret
            # volume in place, so a rotated key needs no pod restart. Only this pod mounts it.
            - name: provider-keys
              mountPath: /secrets/providers
              readOnly: true
            # The bearer token of koinon-api's OTLP listener, which agentgateway sends with its
            # access log. A file, so it stays out of the config ConfigMap.
            {{- include "koinon.otlpTokenVolumeMount" . | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ ternary (include "koinon.gatewayHeldConfigName" .) (include "koinon.gatewayConfigName" .) (eq (toString .Values.restoreHold) "true") }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: provider-keys
          secret:
            secretName: {{ include "koinon.gatewayProvidersName" . }}
            defaultMode: 0444
        {{- include "koinon.otlpTokenVolume" . | nindent 8 }}
      {{- with $gw.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gw.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gw.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "gateway") | nindent 4 }}
spec:
  selector:
    {{- include "koinon.selectorLabels" (list . "gateway") | nindent 4 }}
  ports:
    - name: llm
      port: {{ $gw.port }}
      targetPort: llm
    # agentgateway_config_synchronized: the reconciler reads it to detect a rejected config.
    - name: stats
      port: 15020
      targetPort: stats
{{- end }}
