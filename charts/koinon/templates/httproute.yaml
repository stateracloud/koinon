{{- /*
Optional Gateway API HTTPRoute for the API and web UI, for clusters that expose services through a
Gateway instead of an Ingress controller; off by default. The Gateway (and its TLS) belongs to the
cluster: parentRefs are rendered exactly as given, so spell out group and kind if your GitOps tool
compares them.
*/ -}}
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "koinon.componentName" (list . "api") }}
  labels:
    {{- include "koinon.labels" (list . "api") | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "koinon.componentName" (list . "api") }}
          port: {{ .Values.api.port }}
{{- end }}
