{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
Native ValidatingAdmissionPolicies for OpenShell sandbox namespaces (ADR 0045, ADR 0048 decision 3;
never Kyverno). Rules key on the requesting identity, which a pod's creator cannot choose:
- only the Agent Sandbox controller creates pods or changes their spec, with two exceptions for
  the OpenShell gateway, which OpenShell 0.1.7 needs: it creates supervisor pods (label
  openshell.ai/boundary-role=supervisor) next to the workload pod the controller creates, and it
  starts both by removing their openshell.ai/bootstrap scheduling gate. The gateway may change a
  pod's spec only by removing scheduling gates: containers, init containers, tolerations, node
  selector, affinity and deadline must stay as they were (the other spec fields are immutable);
- only the OpenShell gateway (and the controller) writes Sandbox objects, only the controller writes
  the Agent Sandbox extension kinds (SandboxTemplate, SandboxClaim, SandboxWarmPool), and only the
  gateway writes Secrets;
- pods/resize is a spec change like any other: only the controller resizes a sandbox pod;
- everyone else is denied, cluster admins included: debug through OpenShell exec and logs;
- CONNECT is denied to every identity, with no exemption: pods/exec, pods/attach, pods/portforward,
  pods/proxy and services/proxy would run a process (or reach a port) outside the OpenShell
  supervisor's Landlock/seccomp policy and OCSF audit. Neither the OpenShell gateway nor the Agent
  Sandbox controller uses them (both talk through the supervisor's relay). It is a third policy
  because an options object has no spec or metadata, and admission runs before the connection is
  made. DELETE stays out: deleting a pod does not weaken confinement. Break-glass is not an
  exemption but the runbook https://koinon.stateracloud.com/docs/operate/sandbox-break-glass/ (a cluster admin suspends the CONNECT
  binding, which shows in the audit log and as GitOps drift).
Shape rules apply to every pod: no ephemeral containers, host namespaces, hostPath or privileged
containers, no added capabilities, host ports or seccomp profile other than RuntimeDefault, no
io.katacontainers.* annotations (they can switch off guest seccomp, spike 8.16), and
sandbox workload pods run on an allowed runtime class, set automountServiceAccountToken=false and
project no ServiceAccount token (ADR 0006); supervisor pods run only the pinned supervisor image
(sandboxPolicy.supervisorImages), set automountServiceAccountToken=false as well, and project
exactly one kind of ServiceAccount token: the OpenShell 0.1.7 supervisor exchanges a token for the
audience openshell-gateway at startup (ADR 0006 amendment 2026-11-09), so every projected token on
a supervisor pod needs that audience and an expiry of at most sandboxPolicy.supervisorTokenMaxSeconds.
Every pod the controller or the gateway writes carries openshell.ai/boundary-role=workload or
=supervisor (issue 418), so one of the two role rule sets always applies; both identities are denied
a pod without a valid role, on CREATE and on UPDATE.
A CEL error denies under failurePolicy Fail; test against real OpenShell pods before relying on it.
*/ -}}
{{- if .Values.sandboxPolicy.enabled }}
{{- $p := .Values.sandboxPolicy }}
{{- if not (has .Values.openshell.runtimeClassName $p.runtimeClasses) }}
{{- fail (printf "openshell.runtimeClassName %q is not in sandboxPolicy.runtimeClasses %v: the sandbox policy would refuse every sandbox pod the reconciler creates. Add it to sandboxPolicy.runtimeClasses, set openshell.runtimeClassName to one of them, or disable sandboxPolicy.enabled" .Values.openshell.runtimeClassName $p.runtimeClasses) }}
{{- end }}
{{- $base := printf "%s-%s" .Release.Namespace (include "koinon.fullname" .) }}
{{- $pods := printf "%s-sandbox-pods" $base }}
{{- $objects := printf "%s-sandbox-objects" $base }}
{{- $connect := printf "%s-sandbox-connect" $base }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $pods }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        # pods/resize (in-place resize, Kubernetes 1.33+) changes container resources outside a
        # spec UPDATE of the pod itself; it gets the same identity test, so the ADR 0083 bounds the
        # controller applies cannot be lifted by another identity (issue 673).
        resources: [pods, pods/ephemeralcontainers, pods/resize]
  variables:
    # Every container and init container (ephemeral containers are refused outright below).
    - name: allContainers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: trusted
      expression: {{ printf "request.userInfo.username in %s" (toJson $p.identities.pods) | quote }}
    - name: supervisor
      expression: >-
        has(object.metadata.labels) && 'openshell.ai/boundary-role' in object.metadata.labels &&
        object.metadata.labels['openshell.ai/boundary-role'] == 'supervisor'
    # An update that only removes scheduling gates. On a pod, every spec field other than these
    # is immutable (pod update rules), so comparing them covers the whole spec.
    - name: onlyUngates
      expression: >-
        oldObject != null &&
        object.spec.containers == oldObject.spec.containers &&
        has(object.spec.initContainers) == has(oldObject.spec.initContainers) &&
        (!has(object.spec.initContainers) || object.spec.initContainers == oldObject.spec.initContainers) &&
        has(object.spec.tolerations) == has(oldObject.spec.tolerations) &&
        (!has(object.spec.tolerations) || object.spec.tolerations == oldObject.spec.tolerations) &&
        has(object.spec.nodeSelector) == has(oldObject.spec.nodeSelector) &&
        (!has(object.spec.nodeSelector) || object.spec.nodeSelector == oldObject.spec.nodeSelector) &&
        has(object.spec.affinity) == has(oldObject.spec.affinity) &&
        (!has(object.spec.affinity) || object.spec.affinity == oldObject.spec.affinity) &&
        has(object.spec.activeDeadlineSeconds) == has(oldObject.spec.activeDeadlineSeconds) &&
        (!has(object.spec.activeDeadlineSeconds) || object.spec.activeDeadlineSeconds == oldObject.spec.activeDeadlineSeconds) &&
        (!has(object.spec.schedulingGates) ||
          (has(oldObject.spec.schedulingGates) && object.spec.schedulingGates.all(g, g in oldObject.spec.schedulingGates)))
    - name: workload
      expression: >-
        has(object.metadata.labels) && 'openshell.ai/boundary-role' in object.metadata.labels &&
        object.metadata.labels['openshell.ai/boundary-role'] == 'workload'
    - name: supervisorCreator
      expression: {{ printf "request.userInfo.username in %s" (toJson ($p.identities.supervisorPods | default list)) | quote }}
    # The Sandbox that controls this pod (ownerReferences, set by the Agent Sandbox controller before
    # it creates the pod). Empty when no Sandbox controls the pod.
    - name: owningSandboxes
      expression: >-
        !has(object.metadata.ownerReferences) ? [] :
        object.metadata.ownerReferences.filter(o,
          o.kind == 'Sandbox' && o.apiVersion.startsWith('agents.x-k8s.io/') &&
          has(o.controller) && o.controller).map(o, o.name)
  validations:
    - expression: "!has(request.subResource) || request.subResource != 'ephemeralcontainers'"
      message: ephemeral containers are not allowed on sandbox pods
    - expression: "request.operation != 'CREATE' || variables.trusted || (variables.supervisorCreator && variables.supervisor)"
      messageExpression: "'only the Agent Sandbox controller (and the OpenShell gateway, for supervisor pods) may create pods in sandbox namespaces, not ' + request.userInfo.username"
    - expression: >-
        request.operation != 'UPDATE' || variables.trusted || object.spec == oldObject.spec ||
        (variables.supervisorCreator && variables.onlyUngates)
      messageExpression: "'only the Agent Sandbox controller may change sandbox pod specs (the OpenShell gateway only by removing scheduling gates), not ' + request.userInfo.username"
    # Every pod a trusted identity writes carries a boundary role, so one of the two rule sets below
    # always applies: an unlabelled pod would escape both (no token rules, no image rules). Other
    # identities (the kubelet writing status) are not held to it on UPDATE; they cannot create pods.
    - expression: >-
        (request.operation != 'CREATE' && !variables.trusted && !variables.supervisorCreator) ||
        variables.workload || variables.supervisor
      message: sandbox pods must carry the label openshell.ai/boundary-role=workload or openshell.ai/boundary-role=supervisor
    - expression: "!has(object.spec.hostNetwork) || !object.spec.hostNetwork"
      message: hostNetwork is not allowed
    - expression: "(!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: host PID and IPC namespaces are not allowed
    # The SPIRE Workload API socket never reaches a sandbox (ADR 0097 decision 11.2, issue 282): an agent
    # that could read it would fetch a usable identity. hostPath is refused outright just below; the
    # socket rule says why when a hostPath names the socket's usual directories, and the CSI rule
    # refuses the SPIFFE CSI driver, which mounts the same socket without a hostPath in the pod.
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath) ||
          !(v.hostPath.path.contains('spire') || v.hostPath.path.contains('spiffe')))
      message: the SPIRE agent socket must not be mounted in sandbox pods
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.csi) || v.csi.driver != 'csi.spiffe.io')"
      message: SPIFFE CSI volumes (csi.spiffe.io) are not allowed in sandbox pods
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: hostPath volumes are not allowed
    # Claims (issue 475; ADR 0045 amendment 2026-11-10): a pod rule sees the pod, not the
    # PersistentVolume behind a claim, so a claim to a hostPath or csi.spiffe.io PV would pass the
    # volume rules above. A sandbox pod therefore mounts only the claim its own Sandbox made. Agent
    # Sandbox v1.0.7 names the claim of volumeClaimTemplate T for Sandbox S "T-S" and mounts it as
    # volume T (sandbox_controller.go:1510-1516); OpenShell 0.1.7 asks for exactly one template,
    # "workspace" (driver.rs:7562-7590). Any other claim, a generic ephemeral volume, and a claim
    # on a pod no Sandbox controls are denied. "T-S" is ambiguous when T may contain '-' (volume
    # "workspace-sb" on Sandbox "a" and volume "workspace" on Sandbox "sb-a" give one name), so the
    # objects policy refuses hyphens in template names and this rule refuses them in the volume name.
    # CREATE only: pod volumes cannot change after create (the API server refuses it), and an UPDATE
    # that only drops the owner reference (the garbage collector orphaning the pod when its Sandbox is
    # deleted with orphan propagation) must not be denied and leave the pod stuck. The rule above
    # already denies any other identity a spec change.
    - expression: >-
        request.operation != 'CREATE' || !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.persistentVolumeClaim) ||
          (size(variables.owningSandboxes) == 1 && !v.name.contains('-') &&
            v.persistentVolumeClaim.claimName == v.name + '-' + variables.owningSandboxes[0]))
      message: sandbox pods may mount only the PersistentVolumeClaim their Sandbox made (volumeClaimTemplate name-sandbox name)
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.ephemeral))"
      message: generic ephemeral volumes are not allowed in sandbox pods
    - expression: >-
        object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged))
      message: privileged containers are not allowed
    # Pod fields of issue 673, for both boundary roles: OpenShell 0.1.7 renders every container of
    # the workload and the supervisor pod with capabilities drop [ALL] and no add, the pod with
    # seccompProfile RuntimeDefault, and no host ports (driver-kubernetes driver.rs
    # apply_supervisor_sandbox_runtime_boundary, sandbox_runtime.rs supervisor_pod). An added
    # capability or an Unconfined or Localhost profile would widen what the agent's process may do
    # under Kata guest seccomp (spike 8.12); a hostPort opens a node port to the pod around the
    # NetworkPolicies. A profile that is not set is left to the pod (OpenShell sets it on the pod).
    - expression: >-
        variables.allContainers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) ||
          !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0)
      message: sandbox pods must not add Linux capabilities (securityContext.capabilities.add)
    - expression: >-
        (!has(object.spec.securityContext) || !has(object.spec.securityContext.seccompProfile) ||
          object.spec.securityContext.seccompProfile.type == 'RuntimeDefault') &&
        variables.allContainers.all(c, !has(c.securityContext) || !has(c.securityContext.seccompProfile) ||
          c.securityContext.seccompProfile.type == 'RuntimeDefault')
      message: sandbox pods must use the RuntimeDefault seccomp profile (no Unconfined or Localhost profile on the pod or a container)
    - expression: >-
        variables.allContainers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))
      message: hostPort is not allowed in sandbox pods
    - expression: >-
        !has(object.metadata.labels) || !('openshell.ai/boundary-role' in object.metadata.labels) ||
        object.metadata.labels['openshell.ai/boundary-role'] != 'workload' ||
        (has(object.spec.runtimeClassName) && object.spec.runtimeClassName in {{ toJson $p.runtimeClasses }})
      message: {{ printf "sandbox workload pods must use runtimeClassName %s" (join " or " $p.runtimeClasses) | quote }}
    # Defence in depth for ADR 0006: Agent Sandbox templates default to no token, but nothing at
    # admission held a controller regression or compromise to it. The explicit false also keeps the
    # ServiceAccount admission plugin from injecting its kube-api-access projected volume. Supervisor
    # pods follow the same automount rule but may project the one token OpenShell 0.1.7 needs (see
    # the supervisor rules below).
    - expression: >-
        !variables.workload ||
        (has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false)
      message: sandbox workload pods must set automountServiceAccountToken to false
    - expression: >-
        !variables.workload || !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) ||
          v.projected.sources.all(s, !has(s.serviceAccountToken)))
      message: sandbox workload pods must not project a ServiceAccount token
    # Supervisor pods (OpenShell 0.1.7, driver-kubernetes sandbox_runtime.rs): automount false and
    # one projected token, audience openshell-gateway, which the supervisor exchanges for a gateway
    # JWT. The supervisor never calls the Kubernetes API, so a token for the API server audience
    # (an empty or missing audience means that) is denied, as is a long-lived one.
    - expression: >-
        !variables.supervisor ||
        (has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false)
      message: sandbox supervisor pods must set automountServiceAccountToken to false
    - expression: >-
        !variables.supervisor || !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) ||
          v.projected.sources.all(s, !has(s.serviceAccountToken) ||
            (has(s.serviceAccountToken.audience) && s.serviceAccountToken.audience == 'openshell-gateway')))
      message: sandbox supervisor pods may project only a ServiceAccount token for the audience openshell-gateway
    - expression: >-
        !variables.supervisor || !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) ||
          v.projected.sources.all(s, !has(s.serviceAccountToken) ||
            (has(s.serviceAccountToken.expirationSeconds) && s.serviceAccountToken.expirationSeconds <= {{ int $p.supervisorTokenMaxSeconds }})))
      message: {{ printf "sandbox supervisor pods must bound the ServiceAccount token to %d seconds (expirationSeconds)" (int $p.supervisorTokenMaxSeconds) | quote }}
    - expression: >-
        !variables.supervisor ||
        (object.spec.containers.all(c, c.image in {{ include "koinon.supervisorImages" . }}) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image in {{ include "koinon.supervisorImages" . }})))
      message: {{ printf "sandbox supervisor pods must use the pinned supervisor image (%s)" (join " or " (include "koinon.supervisorImages" . | fromJsonArray)) | quote }}
    - expression: >-
        !has(object.metadata.annotations) ||
        object.metadata.annotations.all(k, !k.startsWith('io.katacontainers.'))
      message: io.katacontainers.* annotations are not allowed on sandbox pods (they can switch off guest seccomp)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $pods }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $pods }}
  validationActions: {{ toJson $p.validationActions }}
  matchResources:
    namespaceSelector:
      {{- include "koinon.sandboxNamespaceSelector" $ | nindent 6 }}
{{- if $p.scopeToGateway }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ printf "%s-unlabelled" $pods }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $pods }}
  validationActions: {{ toJson $p.validationActions }}
  matchResources:
    namespaceSelector:
      {{- include "koinon.sandboxUnlabelledSelector" $ | nindent 6 }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $objects }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [agents.x-k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [sandboxes]
      # The Agent Sandbox extension kinds (Agent Sandbox v1.0.7, issue 673): a SandboxClaim or a
      # SandboxWarmPool makes the controller create Sandboxes, and so pods, from a SandboxTemplate,
      # around the OpenShell gateway. OpenShell 0.1.7 writes none of them, so only the Agent Sandbox
      # controller (sandboxPolicy.identities.pods) may change their spec.
      - apiGroups: [extensions.agents.x-k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [sandboxtemplates, sandboxclaims, sandboxwarmpools]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  variables:
    - name: isSecret
      expression: "request.resource.resource == 'secrets'"
    - name: isExtension
      expression: "request.resource.group == 'extensions.agents.x-k8s.io'"
    - name: trusted
      expression: {{ printf "request.userInfo.username in (variables.isSecret ? %s : variables.isExtension ? %s : %s)" (toJson $p.identities.secrets) (toJson $p.identities.pods) (toJson $p.identities.sandboxes) | quote }}
    # Metadata-only updates (labels, finalizers, owner references) stay open to system controllers.
    - name: contentUnchanged
      expression: >-
        request.operation == 'UPDATE' && (variables.isSecret
          ? (has(object.data) == has(oldObject.data) && (!has(object.data) || object.data == oldObject.data))
          : (has(object.spec) == has(oldObject.spec) && (!has(object.spec) || object.spec == oldObject.spec)))
  validations:
    - expression: "variables.isExtension || variables.trusted || variables.contentUnchanged"
      messageExpression: "'only the OpenShell gateway may write ' + request.resource.resource + ' in sandbox namespaces, not ' + request.userInfo.username"
    - expression: "!variables.isExtension || variables.trusted || variables.contentUnchanged"
      messageExpression: "'only the Agent Sandbox controller may write ' + request.resource.resource + ' in sandbox namespaces, not ' + request.userInfo.username"
    # Claim templates (issue 475; ADR 0045): the pods policy accepts the claim "<template>-<sandbox>", so
    # a template name must not contain '-' (OpenShell 0.1.7 uses only "workspace") and a template must
    # not bind its claim to a chosen PersistentVolume. Applies to every identity, trusted ones included.
    - expression: >-
        variables.isSecret || !has(object.spec) || !has(object.spec.volumeClaimTemplates) ||
        object.spec.volumeClaimTemplates.all(t, has(t.metadata) && has(t.metadata.name) && !t.metadata.name.contains('-'))
      message: Sandbox volumeClaimTemplates names must be set and must not contain '-'
    - expression: >-
        variables.isSecret || !has(object.spec) || !has(object.spec.volumeClaimTemplates) ||
        object.spec.volumeClaimTemplates.all(t, !has(t.spec) || !has(t.spec.volumeName) || t.spec.volumeName == '')
      message: Sandbox volumeClaimTemplates must not set spec.volumeName (a claim bound to a chosen PersistentVolume)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $objects }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $objects }}
  validationActions: {{ toJson $p.validationActions }}
  matchResources:
    namespaceSelector:
      {{- include "koinon.sandboxNamespaceSelector" $ | nindent 6 }}
{{- if $p.scopeToGateway }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ printf "%s-unlabelled" $objects }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $objects }}
  validationActions: {{ toJson $p.validationActions }}
  matchResources:
    namespaceSelector:
      {{- include "koinon.sandboxUnlabelledSelector" $ | nindent 6 }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $connect }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CONNECT]
        resources: [pods/exec, pods/attach, pods/portforward, pods/proxy, services/proxy]
  validations:
    - expression: "false"
      messageExpression: "request.resource.resource + '/' + request.subResource + ' is not allowed in sandbox namespaces (requested by ' + request.userInfo.username + '): use OpenShell exec and logs; see https://koinon.stateracloud.com/docs/operate/sandbox-break-glass/'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $connect }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $connect }}
  validationActions: {{ toJson $p.validationActions }}
  # No objectSelector: a CONNECT request's object is an options object without metadata, so a
  # selector would match nothing. Sandbox pods are selected by their namespace.
  matchResources:
    namespaceSelector:
      {{- include "koinon.sandboxNamespaceSelector" $ | nindent 6 }}
{{- if $p.scopeToGateway }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ printf "%s-unlabelled" $connect }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $connect }}
  validationActions: {{ toJson $p.validationActions }}
  # No objectSelector: a CONNECT request's object is an options object without metadata, so a
  # selector would match nothing. Sandbox pods are selected by their namespace.
  matchResources:
    namespaceSelector:
      {{- include "koinon.sandboxUnlabelledSelector" $ | nindent 6 }}
{{- end }}
{{- /*
Namespace labels (old issue 475): the policies above select namespaces by label, so removing or
changing openshell.ai/managed-by or openshell.ai/gateway-id takes a namespace out of all of them.
Only the identities that own the namespace lifecycle (sandboxPolicy.identities.namespaces) may change
the labels the selectors use on a namespace the policies cover. The policy cannot bind by namespace
selector: for a Namespace the selector reads the NEW object's labels, which is the object that has
just left the selection. It binds to every namespace UPDATE and judges the OLD object's labels itself,
with the same selector semantics as the bindings (koinon.selectorCEL). Pod and Sandbox rules need no
such care; this one fails closed on any CEL error, so it only reads labels.
*/}}
{{- $nsPolicy := printf "%s-sandbox-namespaces" $base }}
{{- $scope := include "koinon.selectorCEL" (list (include "koinon.sandboxNamespaceSelector" $ | fromYaml) "variables.oldLabels") }}
{{- if $p.scopeToGateway }}
{{- $scope = printf "(%s) || (%s)" $scope (include "koinon.selectorCEL" (list (include "koinon.sandboxUnlabelledSelector" $ | fromYaml) "variables.oldLabels")) }}
{{- end }}
{{- /*
  A pre-filter is sound only when the selector has a positive requirement (a matchLabels entry, an In
  or an Exists expression): then a namespace with none of the guarded keys is outside every branch of
  `covered`. NotIn and DoesNotExist match a namespace that lacks the key, so a selector with only
  those covers a namespace with no labels at all, and the filter would let its relabel through. The
  gateway-id label that scopeToGateway adds does not count: the unlabelled branch has none.
*/ -}}
{{- $positive := false }}
{{- if ($p.namespaceSelector.matchLabels | default dict) }}{{- $positive = true }}{{- end }}
{{- range ($p.namespaceSelector.matchExpressions | default list) }}{{- if or (eq .operator "In") (eq .operator "Exists") }}{{- $positive = true }}{{- end }}{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $nsPolicy }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [namespaces]
  # Only an UPDATE of a namespace that carries one of the guarded keys reaches the variables and the
  # validation: every other namespace update in the cluster (Argo CD's managedNamespaceMetadata
  # included) passes untouched, so a CEL error in the validation cannot block it. The keys come from
  # koinon.sandboxGuardedLabels, not a fixed prefix, because namespaceSelector is configurable. The
  # test reads the OLD object, as the validation does. It is rendered only when the selector has a
  # positive requirement (matchLabels, In, Exists): a selector of NotIn / DoesNotExist alone covers
  # a namespace without the keys, and that namespace must still reach the validation.
{{- if $positive }}
  matchConditions:
    - name: old-object-has-a-guarded-label
      expression: {{ printf "has(oldObject.metadata.labels) && %s.exists(k, k in oldObject.metadata.labels)" (include "koinon.sandboxGuardedLabels" .) | quote }}
{{- end }}
  variables:
    - name: trusted
      expression: {{ printf "request.userInfo.username in %s" (toJson ($p.identities.namespaces | default list)) | quote }}
    - name: oldLabels
      expression: "has(oldObject.metadata.labels) ? oldObject.metadata.labels : {'koinon.dev/none': ''}"
    - name: newLabels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {'koinon.dev/none': ''}"
    - name: covered
      expression: {{ $scope | quote }}
    - name: guarded
      expression: {{ include "koinon.sandboxGuardedLabels" . | quote }}
  validations:
    - expression: >-
        variables.trusted || !variables.covered ||
        variables.guarded.all(k, (k in variables.oldLabels) == (k in variables.newLabels) &&
          (!(k in variables.oldLabels) || variables.oldLabels[k] == variables.newLabels[k]))
      messageExpression: >-
        'only the namespace lifecycle owners may change the labels the sandbox policies select by (' +
        variables.guarded.join(', ') + ') on a sandbox namespace, not ' + request.userInfo.username
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $nsPolicy }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $nsPolicy }}
  validationActions: {{ toJson $p.validationActions }}
{{- end }}
