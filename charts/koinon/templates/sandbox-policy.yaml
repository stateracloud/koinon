{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
Native ValidatingAdmissionPolicies for OpenShell sandbox namespaces (ADR 0045, ADR 0048 decision 3;
never Kyverno). Rules key on the requesting identity, which a pod's creator cannot choose:
- only the Agent Sandbox controller creates pods or changes their spec, with two exceptions for
  the OpenShell gateway, which OpenShell 0.1.7 needs: it creates supervisor pods (label
  openshell.ai/boundary-role=supervisor) next to the workload pod the controller creates, and it
  starts both by removing their openshell.ai/bootstrap scheduling gate. The gateway may change a
  pod's spec only by removing scheduling gates: containers, init containers, tolerations, node
  selector, affinity and deadline must stay as they were (the other spec fields are immutable);
- only the OpenShell gateway (and the controller) writes Sandbox objects, and only the gateway
  writes Secrets;
- everyone else is denied, cluster admins included: debug through OpenShell exec and logs;
- CONNECT is denied to every identity, with no exemption: pods/exec, pods/attach, pods/portforward,
  pods/proxy and services/proxy would run a process (or reach a port) outside the OpenShell
  supervisor's Landlock/seccomp policy and OCSF audit. Neither the OpenShell gateway nor the Agent
  Sandbox controller uses them (both talk through the supervisor's relay). It is a third policy
  because an options object has no spec or metadata, and admission runs before the connection is
  made. DELETE stays out: deleting a pod does not weaken confinement. Break-glass is not an
  exemption but the runbook docs/ops/sandbox-break-glass.md (a cluster admin suspends the CONNECT
  binding, which shows in the audit log and as GitOps drift).
Shape rules apply to every pod: no ephemeral containers, host namespaces, hostPath or privileged
containers, no io.katacontainers.* annotations (they can switch off guest seccomp, spike 8.16), and
sandbox workload pods run on an allowed runtime class, set automountServiceAccountToken=false and
project no ServiceAccount token (ADR 0006); supervisor pods run only the pinned supervisor image
(sandboxPolicy.supervisorImages), set automountServiceAccountToken=false as well, and project
exactly one kind of ServiceAccount token: the OpenShell 0.1.7 supervisor exchanges a token for the
audience openshell-gateway at startup (ADR 0006 amendment 2026-11-09), so every projected token on
a supervisor pod needs that audience and an expiry of at most sandboxPolicy.supervisorTokenMaxSeconds.
A CEL error denies under failurePolicy Fail; test against real OpenShell pods before relying on it.
*/ -}}
{{- if .Values.sandboxPolicy.enabled }}
{{- $p := .Values.sandboxPolicy }}
{{- if not (has .Values.openshell.runtimeClassName $p.runtimeClasses) }}
{{- fail (printf "openshell.runtimeClassName %q is not in sandboxPolicy.runtimeClasses %v: the sandbox policy would refuse every sandbox pod the reconciler creates. Add it to sandboxPolicy.runtimeClasses, set openshell.runtimeClassName to one of them, or disable sandboxPolicy.enabled" .Values.openshell.runtimeClassName $p.runtimeClasses) }}
{{- end }}
{{- $base := printf "%s-%s" .Release.Namespace (include "koinon.fullname" .) }}
{{- $pods := printf "%s-sandbox-pods" $base }}
{{- $objects := printf "%s-sandbox-objects" $base }}
{{- $connect := printf "%s-sandbox-connect" $base }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $pods }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: trusted
      expression: {{ printf "request.userInfo.username in %s" (toJson $p.identities.pods) | quote }}
    - name: supervisor
      expression: >-
        has(object.metadata.labels) && 'openshell.ai/boundary-role' in object.metadata.labels &&
        object.metadata.labels['openshell.ai/boundary-role'] == 'supervisor'
    # An update that only removes scheduling gates. On a pod, every spec field other than these
    # is immutable (pod update rules), so comparing them covers the whole spec.
    - name: onlyUngates
      expression: >-
        oldObject != null &&
        object.spec.containers == oldObject.spec.containers &&
        has(object.spec.initContainers) == has(oldObject.spec.initContainers) &&
        (!has(object.spec.initContainers) || object.spec.initContainers == oldObject.spec.initContainers) &&
        has(object.spec.tolerations) == has(oldObject.spec.tolerations) &&
        (!has(object.spec.tolerations) || object.spec.tolerations == oldObject.spec.tolerations) &&
        has(object.spec.nodeSelector) == has(oldObject.spec.nodeSelector) &&
        (!has(object.spec.nodeSelector) || object.spec.nodeSelector == oldObject.spec.nodeSelector) &&
        has(object.spec.affinity) == has(oldObject.spec.affinity) &&
        (!has(object.spec.affinity) || object.spec.affinity == oldObject.spec.affinity) &&
        has(object.spec.activeDeadlineSeconds) == has(oldObject.spec.activeDeadlineSeconds) &&
        (!has(object.spec.activeDeadlineSeconds) || object.spec.activeDeadlineSeconds == oldObject.spec.activeDeadlineSeconds) &&
        (!has(object.spec.schedulingGates) ||
          (has(oldObject.spec.schedulingGates) && object.spec.schedulingGates.all(g, g in oldObject.spec.schedulingGates)))
    - name: workload
      expression: >-
        has(object.metadata.labels) && 'openshell.ai/boundary-role' in object.metadata.labels &&
        object.metadata.labels['openshell.ai/boundary-role'] == 'workload'
    - name: supervisorCreator
      expression: {{ printf "request.userInfo.username in %s" (toJson ($p.identities.supervisorPods | default list)) | quote }}
  validations:
    - expression: "!has(request.subResource) || request.subResource != 'ephemeralcontainers'"
      message: ephemeral containers are not allowed on sandbox pods
    - expression: "request.operation != 'CREATE' || variables.trusted || (variables.supervisorCreator && variables.supervisor)"
      messageExpression: "'only the Agent Sandbox controller (and the OpenShell gateway, for supervisor pods) may create pods in sandbox namespaces, not ' + request.userInfo.username"
    - expression: >-
        request.operation != 'UPDATE' || variables.trusted || object.spec == oldObject.spec ||
        (variables.supervisorCreator && variables.onlyUngates)
      messageExpression: "'only the Agent Sandbox controller may change sandbox pod specs (the OpenShell gateway only by removing scheduling gates), not ' + request.userInfo.username"
    - expression: "!has(object.spec.hostNetwork) || !object.spec.hostNetwork"
      message: hostNetwork is not allowed
    - expression: "(!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: host PID and IPC namespaces are not allowed
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: hostPath volumes are not allowed
    - expression: >-
        object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged))
      message: privileged containers are not allowed
    - expression: >-
        !has(object.metadata.labels) || !('openshell.ai/boundary-role' in object.metadata.labels) ||
        object.metadata.labels['openshell.ai/boundary-role'] != 'workload' ||
        (has(object.spec.runtimeClassName) && object.spec.runtimeClassName in {{ toJson $p.runtimeClasses }})
      message: {{ printf "sandbox workload pods must use runtimeClassName %s" (join " or " $p.runtimeClasses) | quote }}
    # Defence in depth for ADR 0006: Agent Sandbox templates default to no token, but nothing at
    # admission held a controller regression or compromise to it. The explicit false also keeps the
    # ServiceAccount admission plugin from injecting its kube-api-access projected volume. Supervisor
    # pods follow the same automount rule but may project the one token OpenShell 0.1.7 needs (see
    # the supervisor rules below).
    - expression: >-
        !variables.workload ||
        (has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false)
      message: sandbox workload pods must set automountServiceAccountToken to false
    - expression: >-
        !variables.workload || !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) ||
          v.projected.sources.all(s, !has(s.serviceAccountToken)))
      message: sandbox workload pods must not project a ServiceAccount token
    # Supervisor pods (OpenShell 0.1.7, driver-kubernetes sandbox_runtime.rs): automount false and
    # one projected token, audience openshell-gateway, which the supervisor exchanges for a gateway
    # JWT. The supervisor never calls the Kubernetes API, so a token for the API server audience
    # (an empty or missing audience means that) is denied, as is a long-lived one.
    - expression: >-
        !variables.supervisor ||
        (has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false)
      message: sandbox supervisor pods must set automountServiceAccountToken to false
    - expression: >-
        !variables.supervisor || !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) ||
          v.projected.sources.all(s, !has(s.serviceAccountToken) ||
            (has(s.serviceAccountToken.audience) && s.serviceAccountToken.audience == 'openshell-gateway')))
      message: sandbox supervisor pods may project only a ServiceAccount token for the audience openshell-gateway
    - expression: >-
        !variables.supervisor || !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) ||
          v.projected.sources.all(s, !has(s.serviceAccountToken) ||
            (has(s.serviceAccountToken.expirationSeconds) && s.serviceAccountToken.expirationSeconds <= {{ int $p.supervisorTokenMaxSeconds }})))
      message: {{ printf "sandbox supervisor pods must bound the ServiceAccount token to %d seconds (expirationSeconds)" (int $p.supervisorTokenMaxSeconds) | quote }}
    - expression: >-
        !variables.supervisor ||
        (object.spec.containers.all(c, c.image in {{ include "koinon.supervisorImages" . }}) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image in {{ include "koinon.supervisorImages" . }})))
      message: {{ printf "sandbox supervisor pods must use the pinned supervisor image (%s)" (join " or " (include "koinon.supervisorImages" . | fromJsonArray)) | quote }}
    - expression: >-
        !has(object.metadata.annotations) ||
        object.metadata.annotations.all(k, !k.startsWith('io.katacontainers.'))
      message: io.katacontainers.* annotations are not allowed on sandbox pods (they can switch off guest seccomp)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $pods }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $pods }}
  validationActions: {{ toJson $p.validationActions }}
  matchResources:
    namespaceSelector:
      {{- toYaml $p.namespaceSelector | nindent 6 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $objects }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [agents.x-k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [sandboxes]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  variables:
    - name: isSecret
      expression: "request.resource.resource == 'secrets'"
    - name: trusted
      expression: {{ printf "request.userInfo.username in (variables.isSecret ? %s : %s)" (toJson $p.identities.secrets) (toJson $p.identities.sandboxes) | quote }}
    # Metadata-only updates (labels, finalizers, owner references) stay open to system controllers.
    - name: contentUnchanged
      expression: >-
        request.operation == 'UPDATE' && (variables.isSecret
          ? (has(object.data) == has(oldObject.data) && (!has(object.data) || object.data == oldObject.data))
          : (has(object.spec) == has(oldObject.spec) && (!has(object.spec) || object.spec == oldObject.spec)))
  validations:
    - expression: "variables.trusted || variables.contentUnchanged"
      messageExpression: "'only the OpenShell gateway may write ' + request.resource.resource + ' in sandbox namespaces, not ' + request.userInfo.username"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $objects }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $objects }}
  validationActions: {{ toJson $p.validationActions }}
  matchResources:
    namespaceSelector:
      {{- toYaml $p.namespaceSelector | nindent 6 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $connect }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CONNECT]
        resources: [pods/exec, pods/attach, pods/portforward, pods/proxy, services/proxy]
  validations:
    - expression: "false"
      messageExpression: "request.resource.resource + '/' + request.subResource + ' is not allowed in sandbox namespaces (requested by ' + request.userInfo.username + '): use OpenShell exec and logs; see docs/ops/sandbox-break-glass.md'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $connect }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  policyName: {{ $connect }}
  validationActions: {{ toJson $p.validationActions }}
  # No objectSelector: a CONNECT request's object is an options object without metadata, so a
  # selector would match nothing. Sandbox pods are selected by their namespace.
  matchResources:
    namespaceSelector:
      {{- toYaml $p.namespaceSelector | nindent 6 }}
{{- end }}
