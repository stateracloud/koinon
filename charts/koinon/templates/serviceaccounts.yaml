{{- /*
One ServiceAccount per component. Only the reconciler and the API talk to the Kubernetes API, so
only their tokens are mounted. The migration Job's ServiceAccount is a hook object in migrate-job.yaml.
*/ -}}
{{- $components := list "api" "reconciler" "agentd" }}
{{- if eq .Values.gateway.mode "standalone" }}
{{- $components = append $components "gateway" }}
{{- end }}
{{- range $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "koinon.componentName" (list $ .) }}
  labels:
    {{- include "koinon.labels" (list $ .) | nindent 4 }}
  {{- with include "koinon.kmsServiceAccountAnnotations" (dict "root" $ "role" .) | trim }}
  # IRSA: the IAM role the KMS key's policies grant (secrets.kek.kms.awskms.roleArns).
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ has . (list "reconciler" "api") }}
{{- end }}
