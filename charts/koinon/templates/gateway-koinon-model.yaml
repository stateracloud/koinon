{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
gateway.model.driver=koinon: koinon-gateway serves the model path (ADR 0097 step 2, issue #279, slice 1:
the proxy and the usage tap). It is its own Deployment and Service next to agentgateway, which keeps
serving every agent and stays the default. With execution.driver=openshell nothing routes agents to this
Service yet: the switch only brings the gateway up, so it can be tested. With execution.driver=substrate the
agents' model calls come here (issue #1489): the guest holds no gateway key, and this gateway checks the actor
JWT that atenet-egress adds.

The pods keep no state, so there are two or more, spread over nodes, with a PodDisruptionBudget. Each
follows the State stream of koinon-api (the OTLP listener, with the same bearer token as agentgateway's
access log), applies the model half of each revision, and sends its usage records to koinon-api's OTLP
logs receiver with the same token. A pod is not ready before its first revision applied.

Secret custody (ADR 0097 decision 5, ADR 0120): the pod has no database login, no key-encryption key and
no Kubernetes API access (no token is mounted). It reads the provider keys the reconciler opens from the
provider-keys Secret, at the path agentgateway reads them from.
*/ -}}
{{- if include "koinon.modelKoinon" . }}
{{- if ne .Values.gateway.mode "standalone" }}
{{- fail "gateway.model.driver=koinon needs gateway.mode=standalone: koinon-gateway reads the Secret the standalone reconciler fills, and kubernetes mode is frozen (ADR 0097 decision 4)" }}
{{- end }}
{{- $name := include "koinon.componentName" (list . "model-gateway") }}
{{- $m := .Values.gateway.model.koinon }}
{{- $drain := int $m.drainTimeoutSeconds }}
{{- $delay := int $m.shutdownDelaySeconds }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "model-gateway") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "model-gateway") | nindent 4 }}
  annotations:
    # Argo CD only: it is not ready before koinon-api serves the State stream and the reconciler has
    # published a revision, as for the agentgateway Deployment.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ int $m.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "koinon.selectorLabels" (list . "model-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "koinon.labels" (list . "model-gateway") | nindent 8 }}
      {{- with $m.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The shutdown delay (readiness is 503 while the pod still serves), the drain deadline, then 30
      # seconds for the process to exit.
      terminationGracePeriodSeconds: {{ add $delay $drain 30 }}
      {{- with include "koinon.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "koinon.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "koinon.selectorLabels" (list . "model-gateway") | nindent 14 }}
      containers:
        - name: koinon-gateway
          image: {{ include "koinon.image" (list . $m.image) }}
          imagePullPolicy: IfNotPresent
          args:
            - --listen-addr=:{{ int $m.port }}
            - --mcp-path=false
            - --model-path
            - --health-addr=:15021
            - --metrics-addr=:15020
            - --state-url=http://{{ include "koinon.componentName" (list . "api") }}.{{ .Release.Namespace }}.svc:{{ .Values.api.otlpPort }}
            - --state-token-file={{ include "koinon.otlpTokenDir" . }}/token
            - --shutdown-delay={{ $delay }}s
            - --drain-timeout={{ $drain }}s
            {{- if include "koinon.restoreHold" . }}
            # Held install (restoreHold, ADR 0107, issue #1358): ready with no State revision, deny-all.
            - --restore-hold
            {{- end }}
            {{- with include "koinon.substrateActorJWTArgs" . | trim }}
            # Substrate (ADR 0120 amendment of 2026-11-27, issue #1489): the agents' model calls carry the actor JWT
            # that atenet-egress adds, for the model audience; the guest sends only a public placeholder.
            {{- . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KOINON_MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
          ports:
            - name: model
              containerPort: {{ int $m.port }}
            - name: stats
              containerPort: 15020
            - name: health
              containerPort: 15021
          # Liveness stays 200 while the pod drains, readiness turns 503 on SIGTERM and before the
          # first revision applied.
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          securityContext:
            {{- include "koinon.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The provider keys, as in the agentgateway pod: a directory mount,
            # so a rotated credential needs no restart.
            - name: provider-keys
              mountPath: /secrets/providers
              readOnly: true
            {{- include "koinon.otlpTokenVolumeMount" . | nindent 12 }}
            {{- with include "koinon.substrateActorJWTCAVolumeMount" . | trim }}
            # The CA bundle of the Substrate issuer (issue #1489): public certificates only.
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: provider-keys
          secret:
            secretName: {{ include "koinon.gatewayProvidersName" . }}
            defaultMode: 0444
        {{- include "koinon.otlpTokenVolume" . | nindent 8 }}
        {{- with include "koinon.substrateActorJWTCAVolume" . | trim }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with $m.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "model-gateway") | nindent 4 }}
spec:
  selector:
    {{- include "koinon.selectorLabels" (list . "model-gateway") | nindent 4 }}
  ports:
    - name: model
      port: {{ int $m.port }}
      targetPort: model
    - name: stats
      port: 15020
      targetPort: stats
---
# A node drain evicts the pods one at a time; each drains for up to the drain timeout.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "model-gateway") | nindent 4 }}
spec:
  maxUnavailable: {{ int $m.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "koinon.selectorLabels" (list . "model-gateway") | nindent 6 }}
{{- end }}
