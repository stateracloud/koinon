{{- include "koinon.validate" . }}
# Koinon's non-secret configuration, read by api, reconciler and agentd from
# /etc/koinon/config/config.yaml. Secrets are referenced by name only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "koinon.componentName" (list . "config") }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
data:
  config.yaml: |
    gateway:
      mode: {{ .Values.gateway.mode }}
      {{- if eq .Values.gateway.mode "standalone" }}
      configMap: {{ include "koinon.gatewayConfigName" . }}
      {{- $gwHost := include "koinon.gatewayHost" . }}
      url: http://{{ $gwHost }}:{{ .Values.gateway.standalone.port }}
      adminUrl: http://{{ $gwHost }}:15000
      statsUrl: http://{{ $gwHost }}:15020
      port: {{ .Values.gateway.standalone.port }}
      databaseUrl: sqlite:///data/agentgateway.db?mode=rwc
      # agentgateway exports its access log here, for the spend ledger (plan item L1).
      accessLogOtlp: {{ include "koinon.componentName" (list . "api") }}.{{ .Release.Namespace }}.svc:{{ .Values.api.otlpPort }}
      {{- if .Values.model.apiKeySecret.name }}
      modelKeyFile: /secrets/model/{{ .Values.model.apiKeySecret.key }}
      {{- end }}
      {{- else }}
      gatewayClassName: {{ .Values.gateway.kubernetes.gatewayClassName }}
      {{- end }}
    model:
      {{- toYaml .Values.model | nindent 6 }}
    openshell:
      address: {{ .Values.openshell.address | quote }}
      tls: {{ if .Values.openshell.clientTLSSecret }}/etc/koinon/openshell-tls{{ else }}""{{ end }}
      runtimeClassName: {{ .Values.openshell.runtimeClassName }}
    reconciler:
      idleTimeout: {{ .Values.reconciler.idleTimeout }}
      resyncInterval: {{ .Values.reconciler.resyncInterval }}
      homeRetention: {{ .Values.reconciler.homeRetention }}
    githubTools:
      url: http://{{ include "koinon.componentName" (list . "api-tools") }}.{{ .Release.Namespace }}.svc:{{ .Values.api.toolsPort }}/mcp
    flavors:
      {{- range $flavor, $f := .Values.flavors }}
      {{ $flavor }}:
        image: {{ include "koinon.image" (list $ $f.image) }}
      {{- end }}
    bootstrapAdmin:
      enabled: {{ .Values.bootstrapAdmin.enabled }}
