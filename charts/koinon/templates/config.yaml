{{- include "koinon.validate" . }}
# Koinon's non-secret configuration, read by koinon-reconciler from
# /etc/koinon/config/config.yaml (KOINON_CONFIG). koinon-api and koinon-agentd take their settings
# from KOINON_* environment variables instead. Secrets are referenced by name only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "koinon.componentName" (list . "config") }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
data:
  config.yaml: |
    gateway:
      mode: {{ .Values.gateway.mode }}
      {{- if eq .Values.gateway.mode "standalone" }}
      configMap: {{ include "koinon.gatewayConfigName" . }}
      # The reconciler creates the ConfigMap when it is missing, owned by this Deployment.
      deployment: {{ include "koinon.componentName" (list . "gateway") }}
      {{- $gwHost := include "koinon.gatewayHost" . }}
      url: http://{{ $gwHost }}:{{ .Values.gateway.standalone.port }}
      statsUrl: http://{{ $gwHost }}:15020
      port: {{ .Values.gateway.standalone.port }}
      databaseUrl: sqlite:///data/agentgateway.db?mode=rwc
      # agentgateway exports its access log here, for the spend ledger (plan item L1).
      accessLogOtlp: {{ include "koinon.componentName" (list . "api") }}.{{ .Release.Namespace }}.svc:{{ .Values.api.otlpPort }}
      # The bearer token the receiver requires: a file in the gateway pod (the Secret is mounted there).
      accessLogOtlpTokenFile: {{ include "koinon.otlpTokenDir" . }}/token
      # The reconciler writes the opened provider keys into this Secret; the gateway mounts it.
      providerKeysSecret: {{ include "koinon.gatewayProvidersName" . }}
      providerKeysDir: /secrets/providers
      {{- else }}
      # Koinon's own Gateway; the controller names the proxy's Service after it.
      name: {{ include "koinon.componentName" (list . "gateway") }}
      gatewayClassName: {{ .Values.gateway.kubernetes.gatewayClassName }}
      url: http://{{ include "koinon.gatewayHost" . }}:{{ .Values.gateway.kubernetes.port }}
      port: {{ .Values.gateway.kubernetes.port }}
      accessLogOtlp: {{ include "koinon.componentName" (list . "api") }}.{{ .Release.Namespace }}.svc:{{ .Values.api.otlpPort }}
      # The Secret (key token) with the bearer token the receiver requires; the controller reads it.
      accessLogOtlpTokenSecret: {{ include "koinon.otlpTokenName" . }}
      # The Secret the proxy reads provider keys and MCP credentials from, through the controller.
      providerKeysSecret: {{ include "koinon.gatewayProvidersName" . }}
      providerKeysDir: /secrets/providers
      {{- end }}
    openshell:
      address: {{ include "koinon.openshellAddress" . | quote }}
      tls: {{ if .Values.openshell.clientTLSSecret }}/etc/koinon/openshell-tls{{ else }}""{{ end }}
      runtimeClassName: {{ .Values.openshell.runtimeClassName }}
      gatewayId: {{ .Values.openshell.gatewayId | quote }}
      # OpenShell's gateway ConfigMap: its supervisor_image is part of the sandbox spec hash (ADR 0085).
      gatewayConfig:
        namespace: {{ .Values.preflight.openshell.namespace | quote }}
        configMap: {{ .Values.preflight.openshell.configMap | quote }}
    sandboxObserver:
      enabled: {{ .Values.sandboxObserver.enabled }}
      {{- if .Values.sandboxObserver.enabled }}
      clusterRole: {{ include "koinon.observerRole" . }}
      serviceAccount: {{ include "koinon.componentName" (list . "reconciler") }}
      {{- end }}
    sandboxNetworkPolicy:
      enabled: {{ .Values.sandboxNetworkPolicy.enabled }}
      {{- if .Values.sandboxNetworkPolicy.enabled }}
      name: {{ include "koinon.sandboxDefaultDeny" . | quote }}
      {{- end }}
    reconciler:
      idleTimeout: {{ .Values.reconciler.idleTimeout }}
      parkWarm: {{ .Values.reconciler.parkWarm }}
      archiveAfter: {{ .Values.reconciler.archiveAfter }}
      sandboxJobs: {{ .Values.reconciler.sandboxJobs }}
      keepWarmPerOrg: {{ .Values.reconciler.keepWarmPerOrg }}
      maxRecreatesPerPass: {{ .Values.reconciler.maxRecreatesPerPass }}
      resyncInterval: {{ .Values.reconciler.resyncInterval }}
      homeRetention: {{ .Values.reconciler.homeRetention }}
      checkpoints: {{ .Values.checkpoints.enabled }}
    # Sandbox sizing (ADR 0083): the default, the bounds and the Kata memory rule.
    sandboxResources:
      default:
        cpu: {request: {{ .Values.sandbox.resources.default.cpu.request | quote }}, limit: {{ .Values.sandbox.resources.default.cpu.limit | quote }}}
        memory: {request: {{ .Values.sandbox.resources.default.memory.request | quote }}, limit: {{ .Values.sandbox.resources.default.memory.limit | quote }}}
      bounds:
        cpu:
          request: {min: {{ .Values.sandbox.resources.bounds.cpu.request.min | quote }}, max: {{ .Values.sandbox.resources.bounds.cpu.request.max | quote }}}
          limit: {min: {{ .Values.sandbox.resources.bounds.cpu.limit.min | quote }}, max: {{ .Values.sandbox.resources.bounds.cpu.limit.max | quote }}}
        memory:
          request: {min: {{ .Values.sandbox.resources.bounds.memory.request.min | quote }}, max: {{ .Values.sandbox.resources.bounds.memory.request.max | quote }}}
          limit: {min: {{ .Values.sandbox.resources.bounds.memory.limit.min | quote }}, max: {{ .Values.sandbox.resources.bounds.memory.limit.max | quote }}}
      memoryRequestEqualsLimit: {{ .Values.sandbox.resources.memoryRequestEqualsLimit }}
    # The MCP leak guard (ADR 0091): every org MCP route's mcpGuardrails, failClosed.
    mcpGuard:
      url: http://{{ include "koinon.componentName" (list . "api-guard") }}.{{ .Release.Namespace }}.svc:{{ .Values.api.guardPort }}
    mcpAsk:
      url: http://{{ include "koinon.componentName" (list . "api-tools") }}.{{ .Release.Namespace }}.svc:{{ .Values.api.toolsPort }}/mcp-ask
    koinonTools:
      url: http://{{ include "koinon.componentName" (list . "api-tools") }}.{{ .Release.Namespace }}.svc:{{ .Values.api.toolsPort }}/mcp-koinon
    githubTools:
      url: http://{{ include "koinon.componentName" (list . "api-tools") }}.{{ .Release.Namespace }}.svc:{{ .Values.api.toolsPort }}/mcp
    flavors:
      {{- range $flavor, $f := .Values.flavors }}
      {{ $flavor }}:
        image: {{ include "koinon.image" (list $ $f.image) }}
      {{- end }}
