{{- /*
The generated passwords ("koinon-api ensure-secrets"): the CNPG role Secrets (cnpg mode) and the
bootstrap admin's Secret, each created with a random password if it does not exist yet, and never
touched when it does (an existing Secret without a `password` key fails the install instead).

The chart cannot render them: a password in a template is new on every render, and a live-object read
at render time returns nothing under `helm template`, Argo CD and Flux, so every sync would change the database
roles and the admin login underneath the running pods. A hook Job that only creates what is missing
keeps every render deterministic. It runs after the preflight and before the migration Job and the
CNPG Cluster, which need the Secrets (Argo CD runs pre-install hooks as PreSync; Flux's
helm-controller runs them as Helm hooks).

Hook objects are not owned by the release, so the Secrets this Job creates survive `helm uninstall`
(like the KEK Secret). Delete them by label to start over:
  kubectl -n <ns> delete secret -l koinon.dev/release=<release>,koinon.dev/generated=password
WARNING: that selector also matches the install mark Secret (koinon-install-mark). Deleting it makes
the install lose ownership of its OpenShell sandboxes, providers and workspaces (ADR 0106); back it
up first (https://koinon.stateracloud.com/docs/operate/backup-restore/, step 3 of Back up), or delete the other Secrets by name.

No Job is rendered when every Secret comes from postgres.cnpg.existingSecrets,
bootstrapAdmin.existingSecret (or the admin is disabled), api.otlpToken.existingSecret, api.otlpTracesToken.existingSecret,
installMark.existingSecret and, in standalone gateway mode, gateway.standalone.sessionKey.existingSecret.
*/ -}}
{{- $specs := include "koinon.ensureSecrets" . | fromJsonArray }}
{{- if $specs }}
{{- $name := include "koinon.componentName" (list . "ensure-secrets") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "ensure-secrets") | nindent 4 }}
  annotations:
    {{- include "koinon.ensureSecretsHook" (list . "-19") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "ensure-secrets") | nindent 4 }}
  annotations:
    {{- include "koinon.ensureSecretsHook" (list . "-19") | nindent 4 }}
rules:
  # Reads exactly the Secrets it manages, by name. It never updates or deletes anything.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- range $specs }}
      - {{ .name }}
      {{- end }}
    verbs: [get]
  # create cannot be limited by resourceNames: this namespaced Role can create any Secret here.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "ensure-secrets") | nindent 4 }}
  annotations:
    {{- include "koinon.ensureSecretsHook" (list . "-18") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.labels" (list . "ensure-secrets") | nindent 4 }}
  annotations:
    {{- include "koinon.ensureSecretsHook" (list . "-15") | nindent 4 }}
    helm.sh/hook-output-log-policy: hook-failed,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "koinon.labels" (list . "ensure-secrets") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- include "koinon.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "koinon.podSecurityContext" . | nindent 8 }}
      containers:
        - name: ensure-secrets
          image: {{ include "koinon.image" (list . .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - ensure-secrets
            - {{ printf "--secrets=%s" ($specs | toJson) | quote }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            {{- include "koinon.containerSecurityContext" . | nindent 12 }}
          terminationMessagePolicy: FallbackToLogsOnError
          resources:
            {{- toYaml .Values.preflight.resources | nindent 12 }}
{{- end }}
