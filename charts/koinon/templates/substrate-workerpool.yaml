{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
The default shared WorkerPool of the Substrate driver (ate.dev/v1; D6: shared pools on vm). ate-setup
and the installer create no pool, and the preflight needs one per sandbox class, so the chart owns it
(issue #1089): on by default with execution.driver=substrate, never with openshell. helm upgrade changes
its size, helm uninstall removes it. The generated spec follows Substrate v1.0.1's WorkerPoolSpec:
workerImage (koinon.substrate.workerPoolImage: the pinned release image of the class unless the values
name one), replicas, sandboxClasses (exactly one entry, immutable) and
spec.template.{nodeSelector,tolerations,serviceAccountName,resources}. The spec has no
imagePullSecrets: pull access is a ServiceAccount that carries them (koinon.imagePullSecrets, ADR 0061;
the Secrets must exist in the worker namespace). The chart makes that ServiceAccount in the worker namespace (execution.substrate.workerNamespace),
named like the pool plus -worker, unless the values name one; it never mounts an API token (automountServiceAccountToken
false). A ServiceAccount that the values name must set that field itself. workerPool.spec is merged over the generated spec.
The WorkerPool CRD must exist (Substrate is a prerequisite); only the installer identity writes it
(substrate-policy.yaml, workerPolicy.installerIdentities).
*/ -}}
{{- if and (eq (include "koinon.substrate" .) "true") .Values.execution.substrate.workerPool.enabled }}
{{- $s := .Values.execution.substrate }}
{{- $p := $s.workerPool }}
{{- if eq $s.namespace $s.workerNamespace }}{{- fail "execution.substrate.workerNamespace must differ from execution.substrate.namespace" }}{{- end }}
{{- $name := default (printf "koinon-%s" $p.sandboxClass) $p.name }}
{{- $userSA := dig "template" "serviceAccountName" "" ($p.spec | default dict) }}
{{- if dig "template" "resources" nil ($p.spec | default dict) }}{{- fail "execution.substrate.workerPool.spec.template.resources is not used: set execution.substrate.workerPool.resources (both requests and limits), or set it to null for the workerLimits defaults" }}{{- end }}
{{- $image := include "koinon.substrate.workerPoolImage" . }}
{{- /* A tag image is admitted only through the interim digest exemption of the ReplicaSet controller (#1140). Without it
every worker pod is refused at admission, so refuse the render instead of a pool that never starts. */}}
{{- if and $s.workerPolicy.enabled (not (regexMatch "@sha256:[a-f0-9]{64}$" $image)) (not (has "system:serviceaccount:kube-system:replicaset-controller" $s.workerPolicy.digestExemptIdentities)) }}{{- fail (printf "execution.substrate.workerPool: the worker image %s has no digest and workerPolicy.digestExemptIdentities does not exempt the ReplicaSet controller, so the worker pods would be refused; set workerPool.workerImage to name@sha256:<digest>" $image) }}{{- end }}
{{- $pull := (include "koinon.imagePullSecrets" . | fromYaml).imagePullSecrets }}
{{- $sa := default $userSA $p.serviceAccountName }}
{{- if not $sa }}{{- $sa = printf "%s-worker" $name }}{{- end }}
{{- $tmpl := dict }}
{{- with $p.nodeSelector }}{{- $_ := set $tmpl "nodeSelector" . }}{{- end }}
{{- with $p.tolerations }}{{- $_ := set $tmpl "tolerations" . }}{{- end }}
{{- with $sa }}{{- $_ := set $tmpl "serviceAccountName" . }}{{- end }}
{{- with $p.resources }}
{{- if not (and .requests .limits) }}{{- fail "execution.substrate.workerPool.resources needs both requests and limits (a worker pod hosts many sandboxes in its own cgroup; set it to null to use the workerLimits LimitRange defaults)" }}{{- end }}
{{- $_ := set $tmpl "resources" . }}
{{- end }}
{{- /* Capacity: a worker offers its pod limits (less a memory reserve) to all its actors, and an actor books
its own limits. A pool whose worker limits are below the largest sandbox the sizing bounds permit never
places that sandbox. The limits come from workerPool.resources, else from the workerLimits LimitRange
default, per resource. A worker with no limit reports the allocatable of its node, which is shared with
other pods, so its actors could overbook the node: the chart refuses it. */}}
{{- $lim := dict }}
{{- if $s.workerLimits.enabled }}{{- $lim = deepCopy ($s.workerLimits.limitRange.default | default dict) }}{{- end }}
{{- with $p.resources }}{{- $lim = mergeOverwrite $lim (deepCopy (.limits | default dict)) }}{{- end }}
{{- $bounds := .Values.sandbox.resources.bounds }}
{{- range $r := list (dict "name" "cpu" "max" (toString $bounds.cpu.limit.max)) (dict "name" "memory" "max" (toString $bounds.memory.limit.max)) }}
{{- $have := toString (index $lim $r.name | default "") }}
{{- $src := "execution.substrate.workerLimits.limitRange.default" }}
{{- if hasKey (dig "limits" dict ($p.resources | default dict)) $r.name }}{{- $src = "execution.substrate.workerPool.resources.limits" }}{{- end }}
{{- if not $have }}
{{- fail (printf "execution.substrate.workerPool: the worker pods have no %s limit, so each worker reports the %s allocatable of its node, which other pods share, and its sandboxes could overbook the node; set execution.substrate.workerPool.resources.limits.%s (at least sandbox.resources.bounds.%s.limit.max)" $r.name $r.name $r.name $r.name) }}
{{- end }}
{{- if $r.max }}
{{- $hv := include "koinon.quantity" (dict "q" $have "what" (printf "%s.%s" $src $r.name)) | float64 }}
{{- $mv := include "koinon.quantity" (dict "q" $r.max "what" (printf "sandbox.resources.bounds.%s.limit.max" $r.name)) | float64 }}
{{- if eq $r.name "cpu" }}
{{- if lt $hv $mv }}
{{- fail (printf "execution.substrate.workerPool: the worker cpu limit %s (%s.cpu) is below sandbox.resources.bounds.cpu.limit.max %s, so a sandbox at that limit fits on no worker; raise %s.cpu to at least %s, or lower sandbox.resources.bounds.cpu.limit.max" $have $src $r.max $src $r.max) }}
{{- end }}
{{- else }}
{{- $need := include "koinon.substrate.workerMemoryNeed" (dict "mem" $mv "class" $p.sandboxClass) | float64 }}
{{- if lt $hv $need }}
{{- fail (printf "execution.substrate.workerPool: the worker memory limit %s (%s.memory) is below %dMi, which a sandbox at sandbox.resources.bounds.memory.limit.max %s needs on a %s worker (the limit plus the 64Mi worker reserve and the per-actor overhead of the class); raise %s.memory to at least %dMi, or lower sandbox.resources.bounds.memory.limit.max" $have $src (int (ceil (divf $need 1048576.0))) $r.max $p.sandboxClass $src (int (ceil (divf $need 1048576.0))) ) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /* The runtime class label (see metadata below) must be a valid label value. */}}
{{- with .Values.openshell.runtimeClassName }}
{{- if not (regexMatch "^([A-Za-z0-9][-A-Za-z0-9_.]{0,61})?[A-Za-z0-9]$" .) }}
{{- fail (printf "openshell.runtimeClassName %q is not a valid label value (at most 63 characters): the WorkerPool carries it as the label koinon.dev/runtime-class" .) }}
{{- end }}
{{- end }}
{{- /* No vm tier on a pool that gives no microVM per sandbox (ADR 0075). The rule: a sandbox with a runtime class is
put only on a worker with that class label, so the tier of that class (koinon.substrateTierMap: the entry, else
defaultTier) must be met by this pool. A sandbox with no class has no selector and can land on ANY pool, and it gets
defaultTier; so with an empty openshell.runtimeClassName, defaultTier=vm needs this pool to be a microVM. The check sees
only the pool that this chart renders (the class of workerPool.spec.sandboxClasses wins over workerPool.sandboxClass). */}}
{{- $poolClasses := ($p.spec | default dict).sandboxClasses | default (list (dict "name" $p.sandboxClass)) }}
{{- if gt (len $poolClasses) 1 }}{{- fail (printf "execution.substrate.workerPool.spec.sandboxClasses has %d entries: a WorkerPool takes exactly one sandbox class (the CRD allows at most 1)" (len $poolClasses)) }}{{- end }}
{{- $poolClass := toString (index (index $poolClasses 0) "name") }}
{{- $rc := .Values.openshell.runtimeClassName | default "" }}
{{- $tier := "" }}
{{- $src := "" }}
{{- if $rc }}
{{- /* With neither an entry nor defaultTier the helper itself fails the render (and the preflight names the other missing values first). */}}
{{- if or $s.defaultTier (hasKey ($s.runtimeClassTiers | default dict) $rc) }}{{- $tier = index (include "koinon.substrateTierMap" $ | fromJson) $rc | default "" }}{{- end }}
{{- if hasKey ($s.runtimeClassTiers | default dict) $rc }}{{- $src = printf "execution.substrate.runtimeClassTiers.%s" $rc }}{{- else }}{{- $src = printf "execution.substrate.defaultTier (no runtimeClassTiers entry names %s)" $rc }}{{- end }}
{{- else }}
{{- $tier = $s.defaultTier | default "" }}
{{- $src = "execution.substrate.defaultTier (openshell.runtimeClassName is empty, so a sandbox has no worker selector and can land on any pool)" }}
{{- end }}
{{- if and (eq $tier "vm") (ne $poolClass "microvm") }}
{{- fail (printf "%s is vm, but the pool has sandboxClass %s: the vm tier needs a microVM per sandbox (ADR 0075); set execution.substrate.workerPool.sandboxClass=microvm, or map the class to hardened or dev" $src $poolClass) }}
{{- end }}
{{- $spec := dict "workerImage" $image "replicas" $p.replicas "sandboxClasses" (list (dict "name" $p.sandboxClass)) }}
{{- if $tmpl }}{{- $_ := set $spec "template" $tmpl }}{{- end }}
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: {{ $name | quote }}
  namespace: {{ $s.workerNamespace | quote }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
    {{- /* Substrate v1.0.1 copies the WorkerPool labels to every Worker record (workersync/syncer.go:368), and
    the substrate driver selects workers on this label with the runtime class of the sandbox
    (internal/execution/substrate/template.go RuntimeClassSelector). */}}
    {{- with .Values.openshell.runtimeClassName }}
    koinon.dev/runtime-class: {{ . | quote }}
    {{- end }}
spec:
  {{- toYaml (mergeOverwrite $spec ($p.spec | default dict)) | nindent 2 }}
{{- if and (not $p.serviceAccountName) (not $userSA) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa | quote }}
  namespace: {{ $s.workerNamespace | quote }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
# The worker has no Kubernetes client (ADR 0120 section 2.4): no API token in the pod.
automountServiceAccountToken: false
{{- with $pull }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
