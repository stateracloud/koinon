{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
The default shared WorkerPool of the Substrate driver (ate.dev/v1; D6: shared pools on vm). ate-setup
creates no pool, and the preflight needs one per tier. Off by default until the WorkerPool spec is
verified on a cluster (issue 1089): the generated spec is sandboxClasses, replicas, nodeSelector and
tolerations, and workerPool.spec is merged over it for the fields this chart does not know. Pods of
the pool pull with koinon.imagePullSecrets (ADR 0061), (an unverified field name: see the issue 1089 question).
The WorkerPool CRD must exist (Substrate is a prerequisite); only the installer identity writes it
(substrate-policy.yaml, workerPolicy.installerIdentities).
*/ -}}
{{- if and (eq (include "koinon.substrate" .) "true") .Values.execution.substrate.workerPool.enabled }}
{{- $s := .Values.execution.substrate }}
{{- $p := $s.workerPool }}
{{- $spec := dict "replicas" $p.replicas "sandboxClasses" (list) }}
{{- range $p.sandboxClasses }}{{- $_ := set $spec "sandboxClasses" (append (index $spec "sandboxClasses") (dict "name" .)) }}{{- end }}
{{- with $p.nodeSelector }}{{- $_ := set $spec "nodeSelector" . }}{{- end }}
{{- with $p.tolerations }}{{- $_ := set $spec "tolerations" . }}{{- end }}
{{- with (include "koinon.imagePullSecrets" . | fromYaml).imagePullSecrets }}{{- $_ := set $spec "imagePullSecrets" . }}{{- end }}
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: {{ $p.name | quote }}
  namespace: {{ $s.namespace | quote }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  {{- toYaml (mergeOverwrite $spec ($p.spec | default dict)) | nindent 2 }}
{{- end }}
