{{- /*
The key-encryption keys (KEKs) that wrap the data keys of provider API keys and connection
secrets (ADR 0056, plan item PV1). Mounted as files into koinon-api and koinon-reconciler only.

Without secrets.kek.existingSecret the chart generates one KEK into a Secret on first install and
keeps it across upgrades: it reads the live Secret with lookup and renders its data unchanged
(and helm.sh/resource-policy: keep leaves it behind on uninstall, because losing it makes every
stored provider key and connection secret unreadable). Rotate with "koinon-api keys"
(docs/ops/secret-keys.md). BACK THIS SECRET UP.

An existing Secret holds files named by KEK ID (a-z, 0-9, ".", "-", "_"; base64 of 32 random
bytes, or 64 hex characters) plus "active" naming the active KEK.
*/ -}}
{{- if not .Values.secrets.kek.existingSecret }}
{{- $name := include "koinon.kekSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- if and $existing $existing.metadata.annotations (hasKey $existing.metadata.annotations "koinon.dev/kek-activated-at") }}
    koinon.dev/kek-activated-at: {{ index $existing.metadata.annotations "koinon.dev/kek-activated-at" | quote }}
    {{- else }}
    koinon.dev/kek-activated-at: {{ now | date "2006-01-02T15:04:05Z" | quote }}
    {{- end }}
type: Opaque
data:
  {{- if and $existing $existing.data }}
  {{- toYaml $existing.data | nindent 2 }}
  {{- else }}
  {{- $id := printf "kek-%s-%s" (now | date "20060102") (randAlphaNum 4 | lower) }}
  {{ $id }}: {{ sha256sum (randAlphaNum 64) | b64enc }}
  active: {{ $id | b64enc }}
  {{- end }}
{{- end }}
