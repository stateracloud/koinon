{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /*
NetworkPolicies of Substrate's two namespaces (execution.driver=substrate; ADR 0120 section 2, issue
1089). Standard networking.k8s.io/v1 only (no CNI-specific resource). A CNI that does not enforce
NetworkPolicy ignores all of it (the preflight's NetworkPolicy probe reports it).
- Worker namespace (execution.substrate.workerNamespace): every pod is covered. Egress goes to the
  atenet-egress pods and DNS, and nowhere else. The model route is not a worker route: the gateway
  receives an actor's traffic from atenet in the control-plane namespace
  (gatewayClientNamespaceSelector). The worker has no Kubernetes client
  and no route to the API server (ADR 0120 section 2.4); its identity is a PodCertificate projection,
  not a ServiceAccount token. Ingress comes from the control-plane namespace (atelet, the router) and
  from Koinon's namespace; worker pods do not reach each other. NetworkPolicies add up: the per-pool
  policy that Substrate's controller writes in this namespace is limited by the worker-netpol admission policy
  (substrate-policy.yaml; ADR 0120 section 6, issue 1158): it may allow egress only to the control-plane namespace
  and DNS, and only the installer and the controller write policies here. An actor's traffic to the outside runs through atenet and the gateway's
  L7 rules, not through this policy. Substrate's controller adds its own per-pool policy next to it.
- Control-plane namespace: the policy selects the pods whose `app` label is in
  workerNetworkPolicy.controlPlaneApps (an explicit list, not "every pod without the worker label",
  which would fail open for a pod that lost its label). They talk to each other and to the worker
  namespace, resolve names and reach Koinon's gateway and API pods. The API server route is NOT in this policy: it
  is its own policy for workerNetworkPolicy.apiServerApps only (below), so atenet-egress, which
  carries worker traffic out, never gets a TCP route to any address. A pod with another `app` label is not
  selected, so it keeps the cluster default: keep the list in step with the Substrate manifests.
  Ingress comes from both namespaces and from Koinon's namespace.
  The other pods of the namespace have their own list each, so no Substrate pod is unfenced: a default-deny egress policy covers every pod of the namespace (so ate-idp-server, postgres
  and rustfs have no egress at all), and per-app policies allow bucketInitJobs (the object store Job pod, selected by Job name),
  imageSource (the node agent's one image source) and apiOnlyApps (k8s-credential-provider: DNS and the API
  server ports only). Their ingress stays Substrate's own.
*/ -}}
{{- if and (eq (include "koinon.substrate" .) "true") .Values.execution.substrate.workerNetworkPolicy.enabled }}
{{- $s := .Values.execution.substrate }}
{{- $np := $s.workerNetworkPolicy }}
{{- $ns := $s.namespace }}
{{- $wns := $s.workerNamespace }}
{{- if eq $ns $wns }}{{- fail "execution.substrate.workerNamespace must differ from execution.substrate.namespace" }}{{- end }}
{{- if not $np.koinonIngressPorts }}{{- fail "execution.substrate.workerNetworkPolicy.koinonIngressPorts is empty: Koinon's pods would reach neither ateapi nor the router" }}{{- end }}
{{- if not $np.controlPlaneApps }}{{- fail "execution.substrate.workerNetworkPolicy.controlPlaneApps is empty: the control-plane policy would select no pod" }}{{- end }}
{{- if not (or $np.atenetEgressSelector.matchLabels $np.atenetEgressSelector.matchExpressions) }}{{- fail "execution.substrate.workerNetworkPolicy.atenetEgressSelector needs matchLabels or matchExpressions: an empty selector would let workers reach every pod in the control-plane namespace" }}{{- end }}
{{- $gwNS := dig "matchLabels" "kubernetes.io/metadata.name" $ns $s.gatewayClientNamespaceSelector }}
{{- if ne $gwNS $ns }}{{- fail (printf "execution.substrate.gatewayClientNamespaceSelector names namespace %q but execution.substrate.namespace is %q: the gateway would drop the worker traffic" $gwNS $ns) }}{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koinon.fullname" . }}-substrate-workers
  namespace: {{ $wns | quote }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
  egress:
    - to:
        # atenet-egress carries an actor's traffic out.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
          podSelector:
            {{- toYaml $np.atenetEgressSelector | nindent 12 }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koinon.fullname" . }}-substrate-control
  namespace: {{ $ns | quote }}
  labels:
    {{- include "koinon.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          {{- toYaml $np.controlPlaneApps | nindent 10 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $wns | quote }}
    # Koinon's pods reach two things in this namespace: ateapi (the control calls of the reconciler, agentd and the
    # provisioner) and the atenet router (agentd's guest calls). Only their container ports are open to Koinon's
    # namespace, not every port of every control-plane pod: atelet's gRPC port and ate-api-server's internal
    # port stay closed to it (issue #1446; Substrate admits them only from named pods of its own namespace).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
      ports:
        {{- range $np.koinonIngressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
  egress:
    - to:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $wns | quote }}
        # Koinon's gateway and API only (the model route and the callers of ateapi), not its database. In kubernetes
        # mode the gateway is not a chart pod: see the proxy rule below.
        {{- range (eq .Values.gateway.mode "standalone" | ternary (list "gateway" "api") (list "api")) }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace | quote }}
          podSelector:
            matchLabels:
              {{- include "koinon.selectorLabels" (list $ .) | nindent 14 }}
        {{- end }}
{{- if eq .Values.gateway.mode "kubernetes" }}
    # Kubernetes mode (issue #1469): the agentgateway controller runs the proxy of Koinon's Gateway. Its pods have the
    # label gateway.networking.k8s.io/gateway-name, not Koinon's selector labels (ADR 0058). atenet-egress sends the
    # actors' model and MCP calls there. Only the Gateway's listener port, the port that the proxy policy admits
    # (networkpolicy.yaml); the stats port (15020) stays closed (issue #1372). The port is a number: the controller,
    # not the chart, names the proxy's container ports.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
          podSelector:
            matchLabels:
              {{- include "koinon.proxySelectorLabels" . | nindent 14 }}
      ports:
        - {port: {{ .Values.gateway.kubernetes.port }}, protocol: TCP}
{{- end }}
{{- if include "koinon.mcpKoinon" . }}
    # With gateway.mcp.driver=koinon also koinon-gateway's MCP pods: the actors' MCP calls go there (#1239). Only the
    # ports that an actor needs, by the container port names (not numbers): "mcp" and, with the egress listener, "egress".
    # The stats port (15020) and the health port stay closed: the metrics of the gateway cover all agents (issue #1372).
    # The ports match the ingress rules of the mcp-gateway policy (networkpolicy.yaml).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
          podSelector:
            matchLabels:
              {{- include "koinon.selectorLabels" (list . "mcp-gateway") | nindent 14 }}
      ports:
        - {port: mcp, protocol: TCP}
        {{- if include "koinon.egressListener" . }}
        - {port: egress, protocol: TCP}
        {{- end }}
{{- end }}
{{- if include "koinon.modelKoinon" . }}
    # With gateway.model.driver=koinon also koinon-gateway's model pods: the actors' model calls go there (issue #1523;
    # Substrate requires this driver, issue #1489). Only the container port "model", by name. The stats port (15020)
    # stays closed. The port matches the ingress rule of the model-gateway policy (networkpolicy.yaml), which admits
    # atenet-egress.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
          podSelector:
            matchLabels:
              {{- include "koinon.selectorLabels" (list . "model-gateway") | nindent 14 }}
      ports:
        - {port: model, protocol: TCP}
{{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
{{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
{{- end }}
---
# The one default-deny egress policy of the control-plane namespace: every pod of the namespace has no egress unless a
# policy below allows it per app (control plane, API-only pods, the bucket-init Job, the image source). A pod that no
# list names, such as a pod of a later Substrate version, has no egress at all (fail closed; the apiServerPorts rule
# below covers the listed apiServerApps only). The pods that call
# nothing (ate-idp-server, postgres, rustfs) need no other policy. Their ingress is Substrate's own
# (ate-system-networkpolicies.yaml: default-deny-ingress at line 38, ate-idp-server at 168, postgres at 97; rustfs at
# kind/rustfs.yaml:140), so this policy lists no Ingress type: a second ingress rule here would only add to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koinon.fullname" $ }}-substrate-default-deny-egress
  namespace: {{ $ns | quote }}
  labels:
    {{- include "koinon.commonLabels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress: []
{{- if not $np.apiServerApps }}{{- fail "execution.substrate.workerNetworkPolicy.apiServerApps is empty: the control plane would lose the Kubernetes API server" }}{{- end }}
{{- $egressApp := dig "matchLabels" "app" "atenet-egress" $np.atenetEgressSelector }}
{{- if has $egressApp $np.apiServerApps }}{{- fail (printf "execution.substrate.workerNetworkPolicy.apiServerApps lists %q, the app of the pods that carry worker traffic out (atenetEgressSelector): it has no API server client, and the port rule would give it a TCP route to any address, the internet included (ADR 0120 amendment 10). Remove it from apiServerApps." $egressApp) }}{{- end }}
---
# The pods that call the Kubernetes API server (ADR 0120 amendment 10, issue 1172): TCP on apiServerPorts to any
# address. A separate policy with its own app list, so atenet-egress is not selected: it has no API server client
# (Substrate v1.0.1 20778a6d: atenet-egress.yaml:30-38 binds no RBAC, cmd/atenet/internal/router/router.go:75-79 builds
# no client in egress mode). atenet-router IS selected: its ingress mode watches EndpointSlices (router.go:73-95,
# atenet-router.yaml:16-50 ServiceAccount, Role and RoleBinding). Egress rules add up with the control policy. The policy
# lists no Ingress type.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koinon.fullname" $ }}-substrate-api-server
  namespace: {{ $ns | quote }}
  labels:
    {{- include "koinon.commonLabels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          {{- toYaml $np.apiServerApps | nindent 10 }}
  policyTypes: [Egress]
  egress:
{{- include "koinon.substrate.apiServerEgress" $ | nindent 4 }}
{{- with $np.apiOnlyApps }}
---
# Pods that call the Kubernetes API server and nothing else: DNS and the API server ports. Their ingress is
# Substrate's own (k8s-credential-provider admits the egress gateway only; ate-system-networkpolicies.yaml lines 15-35
# and 236-241), so this policy lists no Ingress type.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koinon.fullname" $ }}-substrate-api-only
  namespace: {{ $ns | quote }}
  labels:
    {{- include "koinon.commonLabels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          {{- toYaml . | nindent 10 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
{{- include "koinon.substrate.apiServerEgress" $ | nindent 4 }}
{{- end }}
{{- with $np.bucketInitJobs }}
{{- $osApp := required "execution.substrate.workerNetworkPolicy.objectStoreApp is required with bucketInitJobs: the app label of the object store pod" $np.objectStoreApp }}
{{- $osPort := required "execution.substrate.workerNetworkPolicy.objectStorePort is required with bucketInitJobs: the S3 port of the object store" $np.objectStorePort }}
---
# The bucket-init Job pod of the object store has no `app` label, so the Job name selects it. It needs DNS and the
# object store S3 port, and nothing else (kind/rustfs.yaml:93-133 creates a bucket; the object store admits it at
# kind/rustfs.yaml:140). Its ingress is Substrate's own, so this policy lists no Ingress type.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koinon.fullname" $ }}-substrate-bucket-init
  namespace: {{ $ns | quote }}
  labels:
    {{- include "koinon.commonLabels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: In
        values:
          {{- toYaml . | nindent 10 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app: {{ $osApp | quote }}
      ports:
        - {port: {{ $osPort }}, protocol: TCP}
{{- end }}
{{- $img := $np.imageSource | default dict }}
{{- $imgPods := dict }}
{{- if or (dig "podSelector" "matchLabels" dict $img) (dig "podSelector" "matchExpressions" list $img) }}{{- $imgPods = $img.podSelector }}{{- end }}
{{- $imgCIDRs := $img.cidrs | default list }}
{{- if include "koinon.imageCache" . }}
{{- /* The chart runs the one image source (issue #1170): the cache pod, in Koinon's namespace. */ -}}
{{- if or $imgPods $imgCIDRs }}{{- fail "execution.substrate.imageCache.enabled is the one image source of the node agent: do not set workerNetworkPolicy.imageSource.podSelector or .cidrs with it. For an operator mirror set imageCache.enabled=false" }}{{- end }}
{{- $imgPods = dict "matchLabels" (include "koinon.selectorLabels" (list . "imagecache") | fromYaml) }}
{{- $img = dict "apps" $img.apps "port" $s.imageCache.port "podSelector" $imgPods "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .Release.Namespace)) }}
{{- end }}
{{- range $imgCIDRs }}{{- include "koinon.narrowCIDR" . }}{{- end }}
{{- if and $imgPods $imgCIDRs }}{{- fail "execution.substrate.workerNetworkPolicy.imageSource names one image source: set podSelector (an in-cluster cache) or cidrs, not both" }}{{- end }}
{{- if or $imgPods $imgCIDRs }}
---
# The node agent pulls actor images from ONE source: a pull-through cache of the operator. Nothing else of the
# control plane reaches an image registry. Set imageSource to an in-cluster cache (podSelector, with a namespaceSelector
# when the cache is in another namespace) or to an operator CIDR; the port is imageSource.port. Actor image references
# are rewritten to this source with global.registryMirrors or global.imageRegistry (the digest is kept), so a pull
# through the cache still verifies the digest. The policy lists no Ingress type: NetworkPolicies add up. Egress rules add up too:
# extraEgress applies to every control-plane app, atelet included, so a route opened there is open to atelet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koinon.fullname" $ }}-substrate-image-source
  namespace: {{ $ns | quote }}
  labels:
    {{- include "koinon.commonLabels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          {{- toYaml ($img.apps | default (list "atelet")) | nindent 10 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- if $imgPods }}
        - podSelector:
            {{- toYaml $img.podSelector | nindent 12 }}
          {{- with $img.namespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- else }}
        {{- range $imgCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- end }}
      ports:
        - {port: {{ required "execution.substrate.workerNetworkPolicy.imageSource.port is required with an image source" $img.port }}, protocol: TCP}
{{- end }}
{{- end }}
