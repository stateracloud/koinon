# SPDX-License-Identifier: Apache-2.0
#
# charts/koinon values shared by every Tilt profile (see Tiltfile and docs/dev/loop.md).
# The registry, OpenShell and harness values come from values-kind.yaml or
# the local profile (hack/dev/local.yaml); the Tiltfile adds the image tags. No secret goes here: the ensure-secrets hook
# Job (an ordinary Job under Tilt) creates the database and bootstrap-admin passwords once.

# Every Koinon image has this tag besides the unique one Tilt injects into the pod specs; the
# preflight Job's probe pods name the chart's tag, so it must exist on the node.
image:
  tag: dev
  pullPolicy: IfNotPresent

# Reached with the Tilt port-forward on http://localhost:8080, so the session cookie must not be
# Secure-only over plain HTTP.
publicUrl: http://localhost:8080

postgres:
  mode: cnpg
  cnpg:
    storage:
      size: 2Gi

gateway:
  mode: standalone
