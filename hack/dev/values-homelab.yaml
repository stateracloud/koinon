# SPDX-License-Identifier: Apache-2.0
#
# Tilt profile "homelab" (ADR 0039): the Talos cluster with Kata, the platform's CloudNativePG
# operator, Zot as the dev registry (docs/dev/registry.md) and the existing OpenShell gateway.
# Override single values with `tilt up -- --helm-set key=value`.
image:
  registry: zot.apps.lab.example.invalid/koinon

# Created once by hand, see docs/dev/registry.md.
imagePullSecrets:
  - name: dev-registry

# The home-lab Ollama (docs/spikes/openshell.md) is declared by hack/dev/model-provider-homelab.yaml,
# which the Tiltfile applies. Real model, no cost, no key.

# Ollama sits on the lab network: allowed as a provider host, and open on its port in the gateway's
# egress policy (private ranges are otherwise denied).
providers:
  allowedInternalHosts: ["ollama.lab.example.invalid:11434"]

networkPolicy:
  gatewayEgressTo:
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
      ports:
        - port: 11434

openshell:
  address: openshell.openshell.svc:8080
  runtimeClassName: kata
