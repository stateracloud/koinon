# Dev-only Postgres (ADR 0047). Not for production: the Helm chart expects an
# external or operator-managed Postgres.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
stringData:
  POSTGRES_USER: koinon
  POSTGRES_PASSWORD: koinon-dev
  POSTGRES_DB: koinon
  DATABASE_URL: postgres://koinon:koinon-dev@postgres:5432/koinon?sslmode=disable
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:18-alpine
          envFrom:
            - secretRef: {name: postgres}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, koinon, -d, koinon]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
