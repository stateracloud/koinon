# SPDX-License-Identifier: Apache-2.0
# Dev-only Postgres (ADR 0047), managed by the home lab's CloudNativePG operator.
# CNPG creates the secret koinon-pg-app; its uri key is the DATABASE_URL.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: koinon-pg
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  bootstrap:
    initdb:
      database: koinon
      owner: koinon
  storage:
    size: 5Gi
