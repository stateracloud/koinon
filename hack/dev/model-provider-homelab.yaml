# SPDX-License-Identifier: Apache-2.0
#
# Tilt profile "homelab": the lab's Ollama as the default org's provider (docs/spikes/openshell.md),
# declared with a labelled Secret (ADR 0056). Ollama needs no key, so this file holds no secret and
# is safe in git; a provider that needs one takes it from a file outside git (add apiKey to a copy).
# The Tiltfile applies this file.
apiVersion: v1
kind: Secret
metadata:
  name: lab-ollama
  namespace: koinon
  labels:
    koinon.dev/secret-type: model-provider
    koinon.dev/org: default
stringData:
  name: ollama
  provider: ollama
  url: http://ollama.lab.example.invalid:11434/v1
  models: |
    # Local Ollama costs nothing per token, but a model without a price is not served.
    - name: "qwen3.5:4b"
