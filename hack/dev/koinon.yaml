apiVersion: apps/v1
kind: Deployment
metadata:
  name: koinon-api
  labels: {app.kubernetes.io/name: koinon-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: koinon-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: koinon-api}
    spec:
      imagePullSecrets:
        - name: dev-registry
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: koinon-api
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: postgres, key: DATABASE_URL}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: koinon-reconciler
  labels: {app.kubernetes.io/name: koinon-reconciler}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: koinon-reconciler}
  template:
    metadata:
      labels: {app.kubernetes.io/name: koinon-reconciler}
    spec:
      imagePullSecrets:
        - name: dev-registry
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: reconciler
          image: koinon-reconciler
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: postgres, key: DATABASE_URL}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
