#
# The maintainer's home lab as a remote-profile local.yaml (docs/dev/maintainer-homelab.md): Zot as
# the dev registry, Kata, the cluster's own OpenShell and Ollama, and the secret store's namespace
# label. The Tiltfile uses this file when the context is homelab or homelab-koinon and there is no
# hack/dev/local.yaml. Other contributors copy hack/dev/local.example.yaml instead.
contexts: [homelab, homelab-koinon]
registry: zot.apps.lab.example.invalid/koinon
platform: linux/amd64
imagePullSecret: dev-registry
openshell:
  address: openshell.openshell.svc:8080
  runtimeClassName: kata
  namespace: openshell
  clientTLSSecret: openshell-client-tls
sandboxPolicy: false
modelProvider: hack/dev/model-provider-homelab.yaml
values:
  - hack/dev/values-homelab.yaml
namespaceLabels:
  # Lets the OpenBao ClusterSecretStore deliver the agentgateway management key (Secret
  # agentgateway-mgmt) into this namespace.
  lab.example.invalid/openbao: "true"
