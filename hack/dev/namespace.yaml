# The Koinon namespace. The Tiltfile adds the labels in `namespaceLabels` of hack/dev/local.yaml on a
# remote cluster (the maintainer's home lab uses that for its secret store).
apiVersion: v1
kind: Namespace
metadata:
  name: koinon
  labels:
    app.kubernetes.io/part-of: koinon
