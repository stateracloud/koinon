# SPDX-License-Identifier: Apache-2.0
#
# Tilt profile "kind": a laptop without the home lab. Same shape as test/e2e/kind/koinon-values.yaml
# (runc instead of Kata, the fake model server instead of a real upstream), with images loaded
# straight into the kind node. Prerequisites: make dev-kind-up.
image:
  registry: kind.local

model:
  baseUrl: http://fakemodel.koinon-e2e-fakes.svc:8080/v1
  provider: openai
  models:
    # The fake model script test/fakemodel/scripts/repo-helper.yaml.
    - name: repo-helper
      rates: {input: "0.30", output: "1.20"}

github:
  apiUrl: http://fakegithub.koinon-e2e-fakes.svc:8080

openshell:
  address: openshell.openshell.svc:8080
  runtimeClassName: runc

sandboxPolicy:
  runtimeClasses: [runc]
