# SPDX-License-Identifier: Apache-2.0
#
# Tilt profile "kind": a laptop with kind. Same shape as test/e2e/kind/koinon-values.yaml
# (runc instead of Kata, the fake model server instead of a real upstream), with images loaded
# straight into the kind node. The fake model is declared by test/e2e/kind/model-provider.yaml, which the
# Tiltfile applies. Prerequisites: make dev-kind-up.
image:
  registry: kind.local

egress:
  allowedInternalHosts: ["fakemodel.koinon-e2e-fakes.svc:8080"]

networkPolicy:
  gatewayEgressTo:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: koinon-e2e-fakes
      ports:
        - port: 8080

github:
  apiUrl: http://fakegithub.koinon-e2e-fakes.svc:8080

openshell:
  address: openshell.openshell.svc:8080
  runtimeClassName: runc

sandboxPolicy:
  runtimeClasses: [runc]
