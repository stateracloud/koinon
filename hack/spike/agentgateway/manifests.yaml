# Spike step 5: agentgateway standalone, one replica, SQLite on a PVC.
apiVersion: v1
kind: Namespace
metadata:
  name: agentgateway-system
  labels: {app.kubernetes.io/part-of: koinon-spike}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: agentgateway-data, namespace: agentgateway-system}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agentgateway, namespace: agentgateway-system}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: agentgateway}}
  template:
    metadata: {labels: {app: agentgateway}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agentgateway
          image: ghcr.io/agentgateway/agentgateway:v1.6.0@sha256:482921556876a503ad3675b29223b1897b63a316983e46797ff99ebf83a2a6a2
          args: ["-f", "/config/config.yaml"]
          ports:
            - {name: llm, containerPort: 8080}
            - {name: mcp, containerPort: 3000}
            - {name: stats, containerPort: 15020}
          readinessProbe:
            httpGet: {path: /healthz/ready, port: 15021}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: agentgateway-config}
        - name: data
          persistentVolumeClaim: {claimName: agentgateway-data}
---
apiVersion: v1
kind: Service
metadata: {name: agentgateway, namespace: agentgateway-system}
spec:
  selector: {app: agentgateway}
  ports:
    - {name: llm, port: 8080, targetPort: llm}
    - {name: mcp, port: 3000, targetPort: mcp}
    - {name: stats, port: 15020, targetPort: stats}
