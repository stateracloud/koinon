# Spike step 2.5: allow an echo service (whoami) so a misdirected placeholder
# can be observed. The Gitea credential binding comes from the provider profile.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  echo:
    name: echo
    endpoints:
      - host: whoami.example.invalid
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
