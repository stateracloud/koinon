# Spike step 7: harness sandboxes. Network comes only from the agentgateway provider profile
# (chat completions and the approval MCP tools); /opt is readable for Hermes's install.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /lib64, /opt, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies: {}
