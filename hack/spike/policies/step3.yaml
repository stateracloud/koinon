# Spike step 3: "Gitea read allowed, PR creation needs approval". Reads come from the
# gitea-spike provider profile (read-only); this policy adds an explicit deny for
# PR creation and nothing else, so every other host stays denied by default.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies:
  gitea_no_pr:
    name: gitea_no_pr
    endpoints:
      - host: git.example.invalid
        port: 443
        path: /api/v1/**
        protocol: rest
        enforcement: enforce
        access: read-only
        deny_rules:
          - method: POST
            path: /api/v1/repos/*/*/pulls
    binaries:
      - path: /usr/bin/curl
      - path: /usr/bin/git
      - path: /usr/bin/python3.12
