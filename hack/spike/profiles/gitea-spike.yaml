# Spike provider profile: the koinon-spike-bot Gitea token, usable only against
# a local Gitea API (read-only) and git clone/fetch of the spike org. Modelled on upstream providers/github.yaml.
id: gitea-spike
display_name: Gitea (spike)
description: koinon-spike-bot token for git.example.invalid
category: source_control
credentials:
  - name: api_token
    description: Gitea personal access token
    env_vars: [SPIKE_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    # Koinon pushes rotated values (ADR 0043); running processes keep one placeholder.
    stable_placeholder: true
endpoints:
  - host: git.example.invalid
    port: 443
    path: /api/v1/**
    protocol: rest
    access: read-only
    enforcement: enforce
  # Git smart HTTP for the spike org: clone and fetch only, push stays denied.
  - host: git.example.invalid
    port: 443
    path: /koinon-spike/**
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET, path: "/koinon-spike/*.git/info/refs" }
      - allow: { method: POST, path: "/koinon-spike/*.git/git-upload-pack" }
binaries: [/usr/bin/curl, /usr/bin/git, /usr/bin/python3.12]
