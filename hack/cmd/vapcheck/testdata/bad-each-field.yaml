# SPDX-License-Identifier: Apache-2.0
#
# One bad expression in each place the check reads: matchConditions, validations, messageExpression,
# auditAnnotations and a variable that uses a name no variable defines. A non-bool validation and
# a non-string messageExpression fail on the return type, as at the API server.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bad-each-field
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [secrets]
  variables:
    - name: ok
      expression: "'fine'"
  matchConditions:
    - name: bad-match
      expression: "request.operation =="
  validations:
    - expression: "variables.missing == 'x'"
    - expression: "'not a bool'"
      messageExpression: "42"
  auditAnnotations:
    - key: bad
      valueExpression: "request.nope"
---
# Not a policy: skipped.
apiVersion: v1
kind: ConfigMap
metadata:
  name: not-a-policy
data:
  expression: "this is not CEL"
