#
# Uses CEL libraries that a Kubernetes 1.30 server does not have (isSemver from 1.33, sortBy from
# 1.34). The chart supports 1.30 and later, so this must fail.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: newer-library
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [secrets]
  validations:
    - expression: "isSemver('1.0.0') && [3, 1].sortBy(x, x) == [1, 3]"
